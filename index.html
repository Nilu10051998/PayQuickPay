<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAYQUICKPAY Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-sm rounded-2xl p-7">
<h1 class="text-xl font-extrabold text-center">PAYQUICKPAY</h1>
<p class="text-xs text-center text-slate-500 font-bold mt-1">LOGIN</p>
<input id="uid" placeholder="User ID" class="w-full border rounded-xl p-3.5 mt-6 text-sm font-bold">
<input id="pass" type="password" placeholder="Password" class="w-full border rounded-xl p-3.5 mt-3 text-sm font-bold">
<button onclick="login()" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold mt-4">LOGIN</button>
<p id="msg" class="text-xs font-bold text-center mt-3 text-red-600"></p>
</div>

<script>
const URL="https://hiyjowfyszctvhljsdgx.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.[STRIPPED 127 bytes].0cuMZjNAQQSnLIlnuxlsr4yRTgsekLliD1Qxu_3awWw";
const H={apikey:KEY,Authorization:"Bearer "+KEY};

async function login(){
  let id=document.getElementById("uid").value.trim();
  let pw=document.getElementById("pass").value.trim();
  if(!id||!pw){ document.getElementById("msg").innerText="ID Pass darkar"; return; }
  
  let r=await fetch(`${URL}/rest/v1/distributors?user_id=eq.${id}&password=eq.${pw}&select=user_id`,{headers:H});
  let d=await r.json();
  if(d.length>0){
    // FIX - 3 jaga save karuchi
    localStorage.setItem("distributor", d[0].user_id);
    sessionStorage.setItem("distributor", d[0].user_id);
    localStorage.setItem("distributor_id", d[0].user_id);
    location.href="distributor.html";
  }else{
    document.getElementById("msg").innerText="ID Password bhul";
  }
}
</script>
</body>
</html>
