<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAYQUICKPAY</title>
<style>
body{background:#0F172A; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px;}
.box{background:white; width:100%; max-width:850px; border-radius:20px; padding:30px;}
.btn{border:2px solid #ddd; padding:18px; border-radius:14px; width:140px; cursor:pointer; text-align:center; background:white; display:inline-block; margin:5px;}
.btn.active{background:#0F172A; color:white;}
.login{max-width:350px; margin:20px auto; background:#f5f5f5; padding:20px; border-radius:14px;}
input{width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #ddd; box-sizing:border-box;}
.loginBtn{width:100%; background:#0F172A; color:white; padding:12px; border:none; border-radius:10px; cursor:pointer;}
</style>
</head>
<body>
<div class="box">
<h1 style="text-align:center;">PAYQUICKPAY</h1>
<p style="text-align:center; font-size:12px; color:gray;">RECHARGE PLATFORM</p>
<div style="text-align:center;">
<div onclick="setRole('admin')" id="b1" class="btn"><b>ADMIN</b></div>
<div onclick="setRole('distributor')" id="b2" class="btn active"><b>DISTRIBUTOR</b></div>
<div onclick="setRole('retailer')" id="b3" class="btn"><b>RETAILER</b></div>
</div>
<div class="login">
<p style="text-align:center; font-size:12px;"><b id="roleName">DISTRIBUTOR</b> LOGIN</p>
<input id="userId" placeholder="User ID">
<input id="password" type="password" placeholder="Password">
<button class="loginBtn" onclick="login()">Login</button>
<p id="msg" style="text-align:center; font-size:12px;"></p>
</div>
</div>
<script>
let role='distributor';
function setRole(r){role=r; document.getElementById('roleName').innerText=r.toUpperCase(); document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active')); document.getElementById(r=='admin'?'b1':r=='distributor'?'b2':'b3').classList.add('active');}
function login(){
 let id=document.getElementById('userId').value.trim(); let pw=document.getElementById('password').value.trim();
 if(!id||!pw){document.getElementById('msg').innerText='Enter ID Password'; return;}
 let key=role+'s'; let data=JSON.parse(localStorage.getItem(key)||'[]');
 if(data.length==0){
  if(role=='admin') data=[{user_id:'admin',password:'admin123'}];
  if(role=='distributor') data=[{user_id:'dist01',password:'123',name:'Nilu',mobile:'9999999999',wallet:10000}];
  if(role=='retailer') data=[{user_id:'retail01',password:'123',name:'My Shop',mobile:'8888888888',wallet:5000,distributor_id:'dist01'}];
 }
 let found=data.find(d=>d.user_id==id&&d.password==pw);
 if(found){localStorage.setItem(role,id); localStorage.setItem('distributor',id); localStorage.setItem('admin',id); localStorage.setItem('retailer',id); location.href=role+'.html';}
 else{document.getElementById('msg').innerText='Invalid ID Password';}
}
</script>
</body>
</html>
