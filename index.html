<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuickPay - Login</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,#EAF2FA,#D6E6F5)}
.card{width:100%;max-width:380px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 40px rgba(11,61,145,.14)}
.header{background:linear-gradient(135deg,#0B5ED7,#2E8BFF);padding:26px 24px;display:flex;align-items:center;gap:14px;color:#fff}
.logo{width:48px;height:48px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.header h1{font-size:21px;margin:0;letter-spacing:.5px;font-weight:800}
.header p{margin:3px 0 0;font-size:12px;opacity:.85;letter-spacing:.4px}
.box{padding:24px}
label{font-size:12px;font-weight:700;color:#334155;display:block;margin:16px 0 7px;letter-spacing:.3px;text-transform:uppercase}
input,select{width:100%;padding:13px 14px;border:1.5px solid #E2E8F0;border-radius:12px;font-size:14px;outline:none;background:#F8FAFC;color:#0F172A}
input:focus,select:focus{border-color:#0B5ED7;background:#fff;box-shadow:0 0 0 3px rgba(11,94,215,.12)}
.btn{width:100%;padding:14px;background:#0B5ED7;color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:700;margin-top:22px;cursor:pointer}
.btn:disabled{opacity:.6}
.btn2{width:100%;padding:12px;background:#F1F5F9;color:#0B3D91;border:1px solid #E2E8F0;border-radius:11px;font-size:14px;font-weight:700;margin-top:10px;cursor:pointer}
.forgot{text-align:right;font-size:13px;color:#0B5ED7;margin-top:10px;cursor:pointer;font-weight:600}
.care{text-align:center;font-size:12px;color:#64748B;padding:0 0 20px;line-height:1.7}
.care b{color:#0F172A}
.small{font-size:12px;color:#DC2626;text-align:center;margin-top:10px;min-height:16px}
.green{color:#16A34A !important}
</style>
</head>
<body>
<div class="card">
<div class="header">
<div class="logo">P</div>
<div><h1>PAYQUICKPAY</h1><p>Recharge • DTH • Bill Payment</p></div>
</div>
<div class="box" id="loginBox">
<label>Role</label>
<select id="role">
<option value="retailer">Retailer</option>
<option value="distributor">Distributor</option>
<option value="admin">Admin</option>
</select>
<label>Username / Mobile</label>
<input id="username" type="text" placeholder="Username">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<div class="forgot" onclick="showForgot()">Forgot Password?</div>
<button class="btn" id="loginBtn" onclick="doLogin()">Login</button>
<div id="msg" class="small"></div>
</div>
<div class="box" id="forgotBox" style="display:none">
<label>Username / Mobile / Email</label>
<input id="fpMobile" type="text" placeholder="Username / Mobile / Email">
<button class="btn2" onclick="sendRequest()">Send Request</button>
<div id="codeArea" style="display:none">
<label>Admin Code</label>
<input id="adminCode" type="tel" maxlength="4" placeholder="4 Digit Code">
<button class="btn2" onclick="verifyCode()">Verify Code</button>
<div class="small green">Admin ku Call kara - Code Magiba</div>
</div>
<div id="newPassArea" style="display:none">
<label>New Password</label>
<input id="fpNewPass" type="password" placeholder="New Password">
<button class="btn" onclick="resetPass()">Update</button>
</div>
<div id="fpMsg" class="small"></div>
<button class="btn2" onclick="backLogin()">Back</button>
</div>
<div class="care">Helpline • <b>8847889824</b><br>Email • <b>Payquickpayofficial@gmail.com</b></div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",
  authDomain: "payquickpay-487ef.firebaseapp.com",
  projectId: "payquickpay-487ef",
  storageBucket: "payquickpay-487ef.firebasestorage.app",
  messagingSenderId: "368108778411",
  appId: "1:368108778411:web:03dcbc47e46568d51b58ee"
};
var db = null; var fpUserDocId = null; var fpRole = 'retailer'; var fpReqId = null; var fpCol = 'retailers';
try{ if(typeof firebase!=='undefined' && firebase.initializeApp){ firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } }catch(e){ db=null; }
function showForgot(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('forgotBox').style.display='block';
  fpRole = document.getElementById('role').value;
}
function backLogin(){
  document.getElementById('forgotBox').style.display='none';
  document.getElementById('loginBox').style.display='block';
}
async function sha256(str){ const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function findInCol(col, val){
  var v = String(val).trim().toLowerCase();
  try{
    var d = await db.collection(col).doc(val).get();
    if(d.exists) return {doc: d, col: col};
  }catch(e){}
  try{
    var snap = await db.collection(col).get();
    for(var i=0;i<snap.docs.length;i++){
      var doc = snap.docs[i];
      var data = doc.data();
      if(doc.id.toLowerCase()===v) return {doc: doc, col: col};
      for(var k in data){
        var fv = String(data[k] == null ? '' : data[k]).trim().toLowerCase();
        if(fv===v) return {doc: doc, col: col};
        var digits = fv.replace(/[^0-9]/g,'');
        var vdigits = v.replace(/[^0-9]/g,'');
        if(vdigits.length>=10 && digits.slice(-10)===vdigits.slice(-10) && vdigits.length>0) return {doc: doc, col: col};
      }
    }
  }catch(e){}
  return null;
}
async function findUserForRole(role, val){
  var cols = role==='admin' ? ['admins','admin'] : (role==='distributor' ? ['distributors','distributor'] : ['retailers','retailer']);
  for(var i=0;i<cols.length;i++){
    var r = await findInCol(cols[i], val);
    if(r) return r;
  }
  return null;
}
async function sendRequest(){
  var input=document.getElementById('fpMobile').value.trim();
  var msg=document.getElementById('fpMsg');
  if(!input){ msg.innerText='Enter Username / Mobile / Email'; return; }
  try{
    var res = await findUserForRole(fpRole, input);
    if(!res){ msg.innerText='Not Found - '+input; return; }
    fpUserDocId = res.doc.id; fpCol = res.col;
    var data = res.doc.data();
    var code = String(Math.floor(1000 + Math.random()*9000));
    var req = await db.collection('passwordRequests').add({
      role: fpRole, userId: res.doc.id, name: data.name || data.username || input,
      mobile: data.mobile || data.phone || '', email: data.email || '',
      code: code, status: 'pending', time: new Date().toISOString()
    });
    fpReqId = req.id;
    msg.innerText='';
    document.getElementById('codeArea').style.display='block';
  }catch(e){ msg.innerText=e.message; }
}
async function verifyCode(){
  var code=document.getElementById('adminCode').value.trim();
  var msg=document.getElementById('fpMsg');
  if(code.length!==4){ msg.innerText='Enter 4 Digit Code'; return; }
  var d = await db.collection('passwordRequests').doc(fpReqId).get();
  if(d.exists && d.data().code===code){
    msg.innerText='Verified';
    document.getElementById('newPassArea').style.display='block';
  } else {
    msg.innerText='Wrong Code';
  }
}
async function resetPass(){
  var np=document.getElementById('fpNewPass').value;
  var msg=document.getElementById('fpMsg');
  if(np.length<4){ msg.innerText='Min 4'; return; }
  var hp = await sha256(np);
  await db.collection(fpCol).doc(fpUserDocId).update({ password: hp, passwordHash: hp });
  if(fpReqId) await db.collection('passwordRequests').doc(fpReqId).update({ status: 'done' });
  msg.innerText='Updated';
  setTimeout(backLogin, 1500);
}
async function doLogin(){
  var role=document.getElementById('role').value;
  var username=document.getElementById('username').value.trim();
  var password=document.getElementById('password').value;
  var msg=document.getElementById('msg');
  var btn=document.getElementById('loginBtn');
  if(!username || !password){ msg.innerText='Fill All'; return; }
  btn.disabled=true; btn.innerText='Login...'; msg.innerText='';
  try{
    var res = await findUserForRole(role, username);
    if(!res){ msg.innerText='User not found - '+username; btn.disabled=false; btn.innerText='Login'; return; }
    var data = res.doc.data();
    var savedPass = data.passwordHash || data.password || '';
    var inputHash = await sha256(password);
    // Old plain password bi allow - pore hash heijiba
    var ok = (savedPass === inputHash || savedPass === password);
    if(!ok){ msg.innerText='Wrong Password'; btn.disabled=false; btn.innerText='Login'; return; }
    // Old plain password thile - hash re convert karideba - Secure
    if(savedPass === password && savedPass !== inputHash){
      await db.collection(res.col).doc(res.doc.id).update({ password: inputHash, passwordHash: inputHash }).catch(()=>{});
    }
    if(data.status==='blocked' || data.blocked===true){ msg.innerText='Blocked'; btn.disabled=false; btn.innerText='Login'; return; }
    localStorage.setItem('userId', res.doc.id);
    localStorage.setItem('userRole', role);
    localStorage.setItem('userName', data.name || data.username || username);
    localStorage.setItem('adminAuth', role==='admin' ? 'true' : '');
    if(role==='retailer') window.location.href='/retailer/';
    else if(role==='distributor') window.location.href='/distributor/';
    else window.location.href='/admin/';
  }catch(e){ msg.innerText=e.message; btn.disabled=false; btn.innerText='Login'; }
}
</script>
</body>
</html>
