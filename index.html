<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PayQuickPay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://mojdysebckbodadjctj.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function loginPermanent(){const id=document.getElementById('userId').value;const pass=document.getElementById('password').value;if(id==='admin'&&pass==='admin123'){localStorage.setItem('user',JSON.stringify({id,role:'admin'}));window.location.href='/admin/index.html';return;}let{data:dist}=await supabaseClient.from('distributors').select('').eq('id',id).eq('password',pass).single();if(dist){localStorage.setItem('user',JSON.stringify({...dist,role:'distributor'}));window.location.href='/distributor/index.html';return;}let{data:ret}=await supabaseClient.from('retailers').select('').eq('id',id).eq('password',pass).single();if(ret){localStorage.setItem('user',JSON.stringify({...ret,role:'retailer'}));window.location.href='/retailer/index.html';return;}alert('❌ ID/Password Bhul!');}function setRole(role){window.currentRole=role;document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('active'));document.getElementById(role+'Tab').classList.add('active');}</script><style>body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#1e293b;padding:25px;border-radius:12px;width:320px}input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;box-sizing:border-box}button{width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}.role-tab{padding:8px 12px;cursor:pointer;border-radius:6px;display:inline-block;margin:2px;background:#334155}.role-tab.active{background:#3b82f6}</style></head><body><div class="box"><h2 style="text-align:center">PayQuickPay Login</h2><div style="text-align:center;margin:10px 0"><span class="role-tab active" id="adminTab" onclick="setRole('admin')">Admin</span><span class="role-tab" id="distributorTab" onclick="setRole('distributor')">Distributor</span><span class="role-tab" id="retailerTab" onclick="setRole('retailer')">Retailer</span></div><input id="userId" placeholder="User ID (admin / D1 / R1)"><input id="password" type="password" placeholder="Password"><button onclick="loginPermanent()">LOGIN</button><p style="font-size:12px;text-align:center;margin-top:15px;opacity:0.6">Supabase Connected ✅ Permanent Storage</p></div></body></html>
