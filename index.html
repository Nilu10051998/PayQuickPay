<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayQuickPay Login</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 flex items-center justify-center min-h-screen p-4"><div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl"><h1 class="font-black text-xl text-center">⚡ PAYQUICKPAY</h1><p class="text-xs text-center text-slate-500 mb-4">MUMBAI SERVER - PERMANENT LOGIN</p><input id="uid" placeholder="User ID - puja / D2" class="w-full border p-3 rounded-xl mb-2"><input id="pwd" type="password" placeholder="Password - 12345" class="w-full border p-3 rounded-xl mb-3"><button onclick="login()" class="w-full bg-black text-white py-3 rounded-xl font-bold">LOGIN - MUMBAI</button><div id="msg" class="text-sm font-bold mt-3 text-center"></div><p class="text-[11px] text-center mt-3 text-slate-500">Admin? <a href="/admin/index.html" class="text-blue-600">Admin Panel</a></p><p class="text-[10px] text-center mt-2 text-green-600">● Permanent DB - D2, puja live</p></div><script>var URL="https://hiyjowfyszctvhljsdgx.supabase.co";var KEY="sb_publishable_Qn7F0hoIeGD-q6nzO1HvzA_SFrFuNE2";async function login(){let u=document.getElementById("uid").value.trim(),p=document.getElementById("pwd").value.trim(),m=document.getElementById("msg");if(!u||!p){m.innerHTML="ID Pass de";return;}m.innerHTML="Checking Mumbai Permanent...";if(u=="admin"&&p=="admin123"){localStorage.setItem("adminLogged","yes");location.href="/admin/index.html";return;}try{let r=await fetch(URL+"/rest/v1/distributors?user_id=eq."+u+"&password=eq."+p+"&select=*",{headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}});let d=await r.json();if(d.length>0){localStorage.setItem("distributor",JSON.stringify(d[0]));m.innerHTML="✅ Login Success!";location.href="/distributor/index.html";}else{m.innerHTML="❌ Wrong ID Pass - D2 / 12345 try kara";}}catch(e){m.innerHTML="Error: "+e.message;}}</script></body></html>
