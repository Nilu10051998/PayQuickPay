<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAYQUICKPAY</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F172A] min-h-screen flex items-center justify-center p-4">
<div class="bg-white p-8 rounded-2xl max-w-md w-full">
<h1 class="text-2xl font-extrabold text-center">PAYQUICKPAY</h1>
<p class="text-xs text-center font-bold text-slate-500">PROFESSIONAL RECHARGE</p>

<div class="grid grid-cols-3 gap-2 my-6">
<button onclick="setRole('admin')" id="b1" class="border-2 p-3 rounded-xl font-bold text-sm">ADMIN</button>
<button onclick="setRole('distributor')" id="b2" class="bg-black text-white border-2 border-black p-3 rounded-xl font-bold text-sm">DISTRIBUTOR</button>
<button onclick="setRole('retailer')" id="b3" class="border-2 p-3 rounded-xl font-bold text-sm">RETAILER</button>
</div>

<input id="uid" placeholder="User ID" class="border-2 p-4 w-full rounded-xl font-bold text-sm">
<input id="pass" type="password" placeholder="Password" class="border-2 p-4 w-full rounded-xl font-bold text-sm mt-3">

<button onclick="doLogin()" class="bg-black text-white w-full py-4 rounded-xl font-bold mt-4">SECURE LOGIN - <span id="roleName">DISTRIBUTOR</span></button>
<p id="msg" class="text-center font-bold text-sm mt-3"></p>

<div class="bg-yellow-50 border p-3 rounded-xl mt-4 text- font-bold">
Test Login:<br>
Admin: admin / admin123<br>
Dist: dist01 / 123<br>
Retail: retail01 / 123
</div>
</div>

<script>
let role='distributor';
function setRole(r){
  role=r;
  document.getElementById('roleName').innerText=r.toUpperCase();
  document.getElementById('b1').className='border-2 p-3 rounded-xl font-bold text-sm';
  document.getElementById('b2').className='border-2 p-3 rounded-xl font-bold text-sm';
  document.getElementById('b3').className='border-2 p-3 rounded-xl font-bold text-sm';
  if(r==='admin') document.getElementById('b1').className='bg-black text-white border-2 border-black p-3 rounded-xl font-bold text-sm';
  if(r==='distributor') document.getElementById('b2').className='bg-black text-white border-2 border-black p-3 rounded-xl font-bold text-sm';
  if(r==='retailer') document.getElementById('b3').className='bg-black text-white border-2 border-black p-3 rounded-xl font-bold text-sm';
}

async function doLogin(){
  let id=document.getElementById('uid').value.trim();
  let pw=document.getElementById('pass').value.trim();
  let msg=document.getElementById('msg');
  msg.innerText='Checking...';

  // HARDCODED - 100% WORKING (Supabase bina bi)
  if(role==='admin' && id==='admin' && pw==='admin123'){
    localStorage.setItem('admin','admin');
    localStorage.setItem('role','admin');
    msg.innerText='✅ Admin Login Success - Redirecting';
    setTimeout(()=>{ location.href='admin.html'; }, 500);
    return;
  }
  if(role==='distributor' && id==='dist01' && pw==='123'){
    localStorage.setItem('distributor','dist01');
    localStorage.setItem('role','distributor');
    msg.innerText='✅ Distributor Login Success';
    setTimeout(()=>{ location.href='distributor.html'; }, 500);
    return;
  }
  if(role==='retailer' && id==='retail01' && pw==='123'){
    localStorage.setItem('retailer','retail01');
    localStorage.setItem('role','retailer');
    msg.innerText='✅ Retailer Login Success';
    setTimeout(()=>{ location.href='retailer.html'; }, 500);
    return;
  }

  // SUPABASE CHECK (Permanent)
  try{
    const URL="https://hiyjowfyszctvhljsdgx.supabase.co";
    const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.[STRIPPED 127 bytes].0cuMZjNAQQSnLIlnuxlsr4yRTgsekLliD1Qxu_3awWw";
    let table=role==='admin'?'admins':role==='distributor'?'distributors':'retailers';
    let res=await fetch(`${URL}/rest/v1/${table}?user_id=eq.${id}&password=eq.${pw}`,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
    let data=await res.json();
    if(data.length>0){
      localStorage.setItem(role, data[0].user_id);
      localStorage.setItem('distributor', data[0].user_id);
      msg.innerText='✅ Success - Redirecting';
      setTimeout(()=>{ location.href=role+'.html'; }, 500);
    }else{
      msg.innerText='❌ Invalid ID/Pass - Use Test Login';
      msg.className='text-center font-bold text-sm mt-3 text-red-600';
    }
  }catch(e){
    msg.innerText='Error: '+e.message;
  }
}
</script>
</body>
</html>
