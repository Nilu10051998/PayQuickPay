<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAYQUICKPAY - REAL</title>
<style>
body{background:#0F172A; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px;}
.box{background:white; width:100%; max-width:900px; border-radius:20px; padding:30px;}
h1{text-align:center;}
.buttons{display:flex; gap:15px; justify-content:center; margin:20px 0;}
.btn{border:2px solid #ddd; padding:20px; border-radius:15px; width:150px; cursor:pointer; text-align:center; background:white;}
.btn.active{background:#0F172A; color:white; border-color:#0F172A;}
.login{max-width:350px; margin:0 auto; background:#f5f5f5; padding:20px; border-radius:15px;}
input{width:100%; padding:12px; margin:8px 0; border-radius:10px; border:2px solid #ddd; box-sizing:border-box;}
.loginBtn{width:100%; background:#0F172A; color:white; padding:12px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:10px;}
</style>
</head>
<body>
<div class="box">
<h1>PAYQUICKPAY</h1>
<p style="text-align:center; font-size:12px; color:gray; font-weight:bold;">REAL APP • SECURE • PERMANENT • Supabase Connected</p>

<div class="buttons">
<div onclick="setRole('admin')" id="b1" class="btn"><b>ADMIN</b><br><small>Full Control</small></div>
<div onclick="setRole('distributor')" id="b2" class="btn active"><b>DISTRIBUTOR</b><br><small>Manage Retailers</small></div>
<div onclick="setRole('retailer')" id="b3" class="btn"><b>RETAILER</b><br><small>All Recharge</small></div>
</div>

<div class="login">
<p style="text-align:center; font-size:12px; font-weight:bold;">LOGIN TO <span id="roleName">DISTRIBUTOR</span></p>
<input id="userId" placeholder="User ID ex: admin / dist01 / retail01">
<input id="password" type="password" placeholder="Password">
<button class="loginBtn" onclick="login()">SECURE REAL LOGIN</button>
<p id="msg" style="text-align:center; font-size:12px; font-weight:bold; margin-top:10px;"></p>
</div>

</div>

<script>
let role = 'distributor';
function setRole(r){
 role = r;
 document.getElementById('roleName').innerText = r.toUpperCase();
 document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
 document.getElementById(r=='admin'?'b1':r=='distributor'?'b2':'b3').classList.add('active');
}

const SUPA_URL = "https://mojdysebckbodadjctj.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic";
const HEAD = {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json"};

async function login(){
 let id = document.getElementById('userId').value.trim();
 let pw = document.getElementById('password').value.trim();
 if(!id || !pw){ document.getElementById('msg').innerText='ID Pass lekha'; return; }
 document.getElementById('msg').innerText='Checking Real Supabase...';
 try{
  let table = role=='admin'?'admins':role=='distributor'?'distributors':'retailers';
  let res = await fetch(`${SUPA_URL}/rest/v1/${table}?user_id=eq.${id}&password=eq.${pw}&select=user_id`, {headers:HEAD});
  let data = await res.json();
  if(data.length>0){
   localStorage.setItem(role, data[0].user_id);
   localStorage.setItem('distributor', data[0].user_id);
   localStorage.setItem('admin', data[0].user_id);
   localStorage.setItem('retailer', data[0].user_id);
   document.getElementById('msg').innerText='Success - Redirecting...';
   document.getElementById('msg').style.color='green';
   setTimeout(()=>{ location.href = role+'.html'; }, 500);
  }else{
   document.getElementById('msg').innerText='Invalid ID Pass';
   document.getElementById('msg').style.color='red';
  }
 }catch(e){
  document.getElementById('msg').innerText='Error: '+e.message;
  document.getElementById('msg').style.color='red';
 }
}
</script>
</body>
</html>
