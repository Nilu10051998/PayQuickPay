<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAYQUICKPAY - Login</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0F172A;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;padding:25px;border-radius:12px;width:90%;max-width:380px}
h2{text-align:center;margin:0 0 15px}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:12px;background:#0F172A;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-top:10px}
p{text-align:center;font-size:12px;margin-top:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:03dcbc47e46568d51b58ee"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
</script>
</head>
<body>
<div class="card">
<h2>PAYQUICKPAY</h2>
<select id="role">
<option value="ADMIN">ADMIN</option>
<option value="DISTRIBUTOR">DISTRIBUTOR</option>
<option value="RETAILER">RETAILER</option>
</select>
<input id="userId" placeholder="User ID">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script>
async function login(){
  let id=document.getElementById('userId').value.trim();
  let pass=document.getElementById('pass').value.trim();
  let role=document.getElementById('role').value;
  let msg=document.getElementById('msg');
  if(!id||!pass){msg.innerText='Enter ID Password';return;}
  msg.innerText='Checking...';
  
  if(role=='ADMIN'){
    if(id=='admin' && pass=='admin123'){
      localStorage.setItem('admin',id);
      location.href='admin.html';
    } else {
      msg.innerText='Invalid Admin ID Password';
    }
    return;
  }
  
  if(role=='DISTRIBUTOR'){
    try{
      let snap=await db.collection('distributors').where('user_id','==',id).where('password','==',pass).get();
      if(!snap.empty){
        localStorage.setItem('distributor',id);
        msg.innerText='Login Success';
        location.href='distributor.html';
      } else {
        msg.innerText='Invalid Distributor ID Password - Firebase Check';
      }
    }catch(e){msg.innerText=e.message;}
    return;
  }
  
  if(role=='RETAILER'){
    try{
      let snap=await db.collection('retailers').where('user_id','==',id).where('password','==',pass).get();
      if(!snap.empty){
        localStorage.setItem('retailer',id);
        msg.innerText='Login Success';
        location.href='retailer.html';
      } else {
        msg.innerText='Invalid Retailer ID Password';
      }
    }catch(e){msg.innerText=e.message;}
  }
}
</script>
</body>
</html>
