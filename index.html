<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayQuickPay - Login</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.box{background:#fff;width:100%;max-width:380px;padding:28px;border-radius:16px;text-align:center}
.box h1{font-size:24px;letter-spacing:1px}.box p{color:#64748b;font-size:13px;margin:6px 0 20px}
input,select{width:100%;padding:13px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;outline:none;font-size:14px}
.btn{width:100%;padding:13px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.err{color:red;font-size:13px;margin-top:10px;display:none}
</style></head><body>
<div class="box"><h1>PAYQUICKPAY</h1><p>Recharge & Wallet System</p>
<select id="role"><option value="admin">Admin</option><option value="distributor">Distributor</option><option value="retailer">Retailer</option></select>
<input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button><div class="err" id="err">Wrong Username / Password</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:03dcbc47e46568d51b58ee"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
async function login(){
 let r=role.value,u=user.value.trim(),p=pass.value.trim();
 if(!u||!p) return alert('Fill all');
 if(r==='admin'){
   if(u==='admin'&&p==='admin123'){ localStorage.setItem('adminAuth','true'); location.href='admin/index.html'; }
   else{ document.getElementById('err').style.display='block'; }
   return;
 }
 let col = r==='distributor' ? 'distributors' : 'retailers';
 let snap=await db.collection(col).where('username','==',u).where('password','==',p).get();
 if(snap.empty){ document.getElementById('err').style.display='block'; return; }
 let doc=snap.docs[0]; let d=doc.data();
 localStorage.setItem('userRole',r); localStorage.setItem('userId',doc.id); localStorage.setItem('userName',d.name); localStorage.setItem('userWallet',d.wallet||0);
 location.href = r==='distributor' ? 'distributor/index.html' : 'retailer/index.html';
}
</script></body></html>
