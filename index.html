<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayQuickPay - Mumbai LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>body{margin:0;background:#020617;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{background:#0f172a;padding:24px;border-radius:16px;width:90%;max-width:360px;border:1px solid #1e293b;text-align:center}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;padding:8px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:#fff;cursor:pointer}.tab.active{background:#3b82f6;border-color:#3b82f6}input{width:100%;padding:12px;margin:8px 0;background:#1e293b;border:1px solid #334155;color:#fff;border-radius:10px;box-sizing:border-box}button.login{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:10px;font-weight:900;cursor:pointer}</style>
</head><body>
<div class="box"><h2 style="margin:0">PayQuickPay Login</h2>
<div class="tabs"><button id="tabAdmin" class="tab" onclick="setRole('admin')">Admin</button><button id="tabDist" class="tab active" onclick="setRole('distributor')">Distributor</button><button id="tabRet" class="tab" onclick="setRole('retailer')">Retailer</button></div>
<input id="uid" placeholder="User ID"><input id="pwd" type="password" placeholder="Password"><button class="login" onclick="doLogin()">LOGIN</button><div id="msg" style="margin-top:10px;font-weight:bold;min-height:20px"></div><div style="margin-top:10px;font-size:11px;color:#22c55e">Mumbai Server - Permanent Storage ✅</div>
</div>
<script>
var role='distributor';
var _supabase = supabase.createClient("https://hiyjowfyszctvhljsdgx.supabase.co","sb_publishable_Qn7F0hoIeGD-q6nzO1HvzA_SFrFuNE2");
function setRole(r){role=r; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); if(r=='admin')document.getElementById('tabAdmin').classList.add('active'); if(r=='distributor')document.getElementById('tabDist').classList.add('active'); if(r=='retailer')document.getElementById('tabRet').classList.add('active');}
async function doLogin(){
 var u=document.getElementById('uid').value.trim(), p=document.getElementById('pwd').value.trim(), m=document.getElementById('msg');
 if(!u||!p){m.innerHTML="ID Pass de"; return;} m.innerHTML="Checking Mumbai...";
 try{
  if(role=='admin'){ if(u=='admin'&&p=='admin123'){localStorage.setItem('adminLogged','true'); location.href='/admin/index.html'; return;} else {m.innerHTML="❌ Admin Wrong"; return;}}
  if(role=='distributor'){
   const {data,error}=await _supabase.from("distributors").select("*").eq("user_id",u).eq("password",p).single();
   if(error||!data){m.innerHTML="❌ ID/Password Bhul - Mumbai re puja check kara"; alert("ID/Password Bhul - puja / 12345 try kara"); return;}
   localStorage.setItem("distributorId",u); m.innerHTML="✅ Success!"; location.href='/distributor/index.html'; return;
  }
  m.innerHTML="Retailer coming soon";
 }catch(e){m.innerHTML="❌ "+e.message;}
}
setRole('distributor');
</script></body></html>
