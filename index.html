<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYQUICKPAY</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body class="bg-[#0F172A] min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-4xl rounded- p-8 shadow-2xl">
<div class="text-center mb-8"><h1 class="text-3xl font-extrabold">PAYQUICKPAY</h1><p class="text-xs font-bold text-slate-500">PROFESSIONAL RECHARGE - SECURE</p></div>
<div class="grid grid-cols-3 gap-4 mb-8">
<button onclick="selectPanel('admin')" id="btn-admin" class="border-2 border-slate-100 rounded-2xl p-6 text-center">ADMIN</button>
<button onclick="selectPanel('distributor')" id="btn-distributor" class="border-2 border-slate-900 bg-slate-900 text-white rounded-2xl p-6">DISTRIBUTOR</button>
<button onclick="selectPanel('retailer')" id="btn-retailer" class="border-2 border-slate-100 rounded-2xl p-6">RETAILER</button>
</div>
<div class="max-w-sm mx-auto bg-slate-50 rounded-2xl p-6 border">
<input id="uid" placeholder="User ID" class="w-full bg-white border rounded-xl p-4 text-sm font-bold">
<input id="pass" type="password" placeholder="Password" class="w-full bg-white border rounded-xl p-4 text-sm font-bold mt-3">
<button onclick="login()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold mt-4">LOGIN</button>
<p id="msg" class="text-xs font-bold text-center mt-3 text-red-600"></p>
</div>
</div>
<script>
const SUPA_URL="https://hiyjowfyszctvhljsdgx.supabase.co";const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpeWpvd2Z5c3pjdHZobGpzZGd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NTIwMTgsImV4cCI6MjEwODQyODAxOH0.0cuMZjNAQQSnLIlnuxlsr4yRTgsekLliD1Qxu_3awWw";const H={apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"};
let selected="distributor";function selectPanel(t){selected=t;document.querySelectorAll('[id^="btn-"]').forEach(b=>b.className="border-2 border-slate-100 rounded-2xl p-6");document.getElementById("btn-"+t).className="border-2 border-slate-900 bg-slate-900 text-white rounded-2xl p-6";}
async function login(){let id=document.getElementById("uid").value.trim(),pw=document.getElementById("pass").value.trim();if(selected==="admin"&&id==="admin"&&pw==="admin123"){localStorage.setItem("admin",id);location.href="admin/";return;}let table=selected==="admin"?"admins":selected==="distributor"?"distributors":"retailers";let r=await fetch(`${SUPA_URL}/rest/v1/${table}?user_id=eq.${id}&password=eq.${pw}`,{headers:H});let d=await r.json();if(d.length>0){localStorage.setItem(selected,d[0].user_id);localStorage.setItem("distributor",d[0].user_id);location.href=selected+"/";}else{document.getElementById("msg").innerText="Invalid";}}
</script>
</body>
</html>
