<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayQuickPay - Login</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.box{background:#fff;width:100%;max-width:480px;border-radius:16px;padding:30px 26px}
.box h1{text-align:center;font-size:30px}.box p{text-align:center;color:#64748b;font-size:11px;letter-spacing:1px;margin:6px 0 20px;font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.tab{padding:14px 5px;border:1.5px solid #e2e8f0;border-radius:12px;text-align:center;cursor:pointer;font-size:13px;font-weight:700}.tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.form input{width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px;outline:none;font-size:15px}
.form button{width:100%;padding:14px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.err{text-align:center;color:#dc2626;font-size:13px;margin-top:10px;display:none;white-space:pre-line}.ok{text-align:center;color:#059669;font-size:13px;margin-top:10px;display:none}
</style></head>
<body>
<div class="box">
<h1>PAYQUICKPAY</h1><p>SECURE LOGIN</p>
<div class="tabs">
<div class="tab active" id="t-admin" onclick="setTab('admin')">ADMIN</div>
<div class="tab" id="t-dist" onclick="setTab('distributor')">DISTRIBUTOR</div>
<div class="tab" id="t-ret" onclick="setTab('retailer')">RETAILER</div>
</div>
<div class="form">
<input id="user" placeholder="Username / Mobile" autocomplete="off">
<input id="pass" type="password" placeholder="Password">
<button id="btn" onclick="doLogin()">LOGIN</button>
<div class="err" id="err"></div><div class="ok" id="ok"></div>
</div>
<p style="margin-top:14px;font-size:12px;color:#94a3b8;text-align:center">Distributor: Admin Banithiba Username Dia</p>
</div>
<script>
const firebaseConfig = { apiKey: "AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI", authDomain: "payquickpay-487ef.firebaseapp.com", projectId: "payquickpay-487ef", storageBucket: "payquickpay-487ef.firebasestorage.app", messagingSenderId: "368108778411", appId: "1:368108778411:web:03dcbc47e46568d51b58ee" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let cur='admin';
function setTab(t){cur=t;
 document.getElementById('t-admin').className='tab'+(t=='admin'?' active':'');
 document.getElementById('t-dist').className='tab'+(t=='distributor'?' active':'');
 document.getElementById('t-ret').className='tab'+(t=='retailer'?' active':'');
 document.getElementById('user').value=t=='admin'?'admin':'';
 document.getElementById('pass').value='';
 document.getElementById('err').style.display='none'; document.getElementById('ok').style.display='none';
}
function showErr(m){let e=document.getElementById('err');e.innerText=m;e.style.display='block';}
function showOk(m){let e=document.getElementById('ok');e.innerText=m;e.style.display='block';}

async function doLogin(){
 let u=document.getElementById('user').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(!u||!p) return showErr('Username au Password dia');
 document.getElementById('btn').innerText='Checking Firebase...'; document.getElementById('btn').disabled=true;
 document.getElementById('err').style.display='none';

 // ADMIN
 if(cur=='admin'){
   if(u.toLowerCase()=='admin' && p=='admin123'){ location.href='/admin/index.html'; return; }
   showErr('Admin password bhul achhi'); document.getElementById('btn').innerText='LOGIN'; document.getElementById('btn').disabled=false; return;
 }

 let col = cur=='distributor' ? 'distributors' : 'retailers';
 let goTo = cur=='distributor' ? '/distributor/index.html' : '/retailer/index.html';
 try{
   let snap = await db.collection(col).get();
   if(snap.empty){ showErr('Firebase re '+col+' khali achhi.\nAdmin re distributor bana nahin.'); document.getElementById('btn').innerText='LOGIN'; document.getElementById('btn').disabled=false; return; }
   let found=null, list=[];
   snap.forEach(doc=>{
     let d=doc.data();
     // Sabu field ku check - user, username, name, phone, mobile
     let allNames=[d.user,d.username,d.userName,d.name,d.distributorName,d.fullName,d.phone,d.mobile].filter(Boolean).map(x=>String(x).trim().toLowerCase());
     let allPass=[d.pass,d.password,d.pwd].filter(Boolean).map(x=>String(x).trim());
     list.push('User:'+(d.user||d.username||'-')+' | Name:'+(d.name||'-')+' | Pass:'+(d.pass||d.password||'-')+' | Phone:'+(d.phone||d.mobile||'-'));
     // Username match + Password match
     if(allNames.includes(u.toLowerCase()) && allPass.includes(p)){ found={id:doc.id,...d}; }
   });
   if(found){
     showOk('Login Successful! Redirect...');
     let uname = found.user||found.username||found.phone||u;
     if(cur=='distributor'){ localStorage.setItem('currentDist',uname); localStorage.setItem('currentDistId',found.id); localStorage.setItem('currentDistName',found.name||uname); }
     else { localStorage.setItem('currentRet',uname); localStorage.setItem('currentRetId',found.id); localStorage.setItem('currentRetName',found.name||uname); }
     setTimeout(()=>{ location.href=goTo; },500);
   } else {
     showErr('Login Failed!\nTume Dela: '+u+' / '+p+'\n\nFirebase Re Achhi:\n'+list.join('\n')+'\n\nEhi Ru Username/Password Copy Kari Dia');
     document.getElementById('btn').innerText='LOGIN'; document.getElementById('btn').disabled=false;
   }
 }catch(e){ showErr('Firebase Error: '+e.message+'\nFirestore Rules check kara'); document.getElementById('btn').innerText='LOGIN'; document.getElementById('btn').disabled=false; }
}
</script></body></html>
