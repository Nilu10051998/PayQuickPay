<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayQuickPay - Professional Recharge</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.box{background:#fff;width:100%;max-width:520px;border-radius:4px;padding:32px 28px}
.box h1{text-align:center;font-size:32px;letter-spacing:1px}.box p{text-align:center;color:#64748b;font-size:12px;letter-spacing:1px;margin:6px 0 22px;font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.tab{padding:16px 5px;border:1.5px solid #e2e8f0;border-radius:14px;text-align:center;cursor:pointer;font-size:14px;color:#334155;background:#fff}
.tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.form{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:22px}
.form input{width:100%;padding:15px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:14px;outline:none;font-size:15px;background:#fff}
.form button{width:100%;padding:15px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:1px}
.note{text-align:center;font-size:12px;color:#94a3b8;margin-top:14px}
</style></head>
<body>
<div class="box">
<h1>PAYQUICKPAY</h1><p>PROFESSIONAL RECHARGE - SECURE</p>
<div class="tabs">
<div class="tab active" id="t-admin" onclick="setTab('admin')">ADMIN</div>
<div class="tab" id="t-dist" onclick="setTab('distributor')">DISTRIBUTOR</div>
<div class="tab" id="t-ret" onclick="setTab('retailer')">RETAILER</div>
</div>
<div class="form">
<input id="user" placeholder="Username" value="admin">
<input id="pass" type="password" placeholder="Password" value="">
<button onclick="doLogin()">LOGIN</button>
</div>
<div class="note" id="hint">Admin Login: admin / admin123</div>
</div>
<script>
let cur='admin';
function setTab(t){cur=t;
 document.getElementById('t-admin').className='tab'+(t=='admin'?' active':'');
 document.getElementById('t-dist').className='tab'+(t=='distributor'?' active':'');
 document.getElementById('t-ret').className='tab'+(t=='retailer'?' active':'');
 document.getElementById('user').value=t=='admin'?'admin':'';
 document.getElementById('pass').value='';
 document.getElementById('hint').innerText=t=='admin'?'Admin Login: admin / admin123':t=='distributor'?'Distributor Login - Admin Re Add Karithiba ID':'Retailer Login - Distributor Re Add Karithiba ID';
}
function doLogin(){
 let u=document.getElementById('user').value, p=document.getElementById('pass').value;
 if(cur=='admin'){ if(u=='admin'&&p=='admin123'){location.href='/admin/index.html';} else alert('Wrong Admin Bhai!'); }
 if(cur=='distributor'){ let d=JSON.parse(localStorage.getItem('distributors')||'[]'); let f=d.find(x=>x.user==u&&x.pass==p); if(f){localStorage.setItem('currentDist',u); location.href='/distributor/index.html';} else alert('Distributor Milila Nahin! Admin Re Add Karithila Ki?'); }
 if(cur=='retailer'){ let r=JSON.parse(localStorage.getItem('retailers')||'[]'); let f=r.find(x=>x.user==u&&x.pass==p); if(f){localStorage.setItem('currentRet',u); location.href='/retailer/index.html';} else alert('Retailer Milila Nahin! Distributor Re Add Karithila Ki?'); }
}
</script></body></html>
