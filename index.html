<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay Quick Pay - Home</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020617;color:#fff;font-family:system-ui;padding:20px;min-height:100vh}
.header{text-align:center;padding:25px 0}
.logo{font-size:40px;font-weight:900;background:linear-gradient(90deg,#22c55e,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.panels{display:grid;grid-template-columns:1fr;gap:16px;max-width:900px;margin:20px auto}
@media(min-width:700px){.panels{grid-template-columns:1fr 1fr 1fr}}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px}
.card h3{margin:0 0 15px;text-align:center}
.card.admin{border-top:4px solid #f59e0b}
.card.dist{border-top:4px solid #22c55e}
.card.ret{border-top:4px solid #38bdf8}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
button{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin-top:10px}
.b-a{background:#f59e0b}.b-d{background:#22c55e;color:#000}.b-r{background:#38bdf8;color:#000}
#msg{text-align:center;color:#f87171;margin-top:15px;font-weight:700}
small{color:#94a3b8;font-size:12px;display:block;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div class="header">
<div class="logo">⚡ PAY QUICK PAY</div>
<small>Distributor & Retailer Recharge Panel</small>
</div>

<div class="panels">

<!-- ADMIN -->
<div class="card admin">
<h3>👑 ADMIN</h3>
<form autocomplete="off" onsubmit="return false">
<input id="am" placeholder="Admin ID" autocomplete="off">
<input id="ap" type="password" placeholder="Password" autocomplete="new-password">
<button class="b-a" onclick="loginAdmin()">Admin Login</button>
</form>
<small>ID: admin / Pass: 1430</small>
</div>

<!-- DISTRIBUTOR -->
<div class="card dist">
<h3>🏢 DISTRIBUTOR</h3>
<form autocomplete="off" onsubmit="return false">
<input id="dm" placeholder="Distributor ID" autocomplete="off">
<input id="dp" type="password" placeholder="Password" autocomplete="new-password">
<button class="b-d" onclick="loginDist()">Distributor Login</button>
</form>
<small>Admin Dwara Created ID</small>
</div>

<!-- RETAILER -->
<div class="card ret">
<h3>🏪 RETAILER</h3>
<form autocomplete="off" onsubmit="return false">
<input id="rm" placeholder="Retailer ID" autocomplete="off">
<input id="rp" type="password" placeholder="Password" autocomplete="new-password">
<button class="b-r" onclick="loginRet()">Retailer Login</button>
</form>
<small>Distributor Dwara Created ID</small>
</div>

</div>

<p id="msg"></p>

<script>
const $ = id => document.getElementById(id);

function loginAdmin(){
 let m=$('am').value.trim(), p=$('ap').value.trim();
 if(!m){ $('msg').innerText="Admin ID Dia Bhai"; return; }
 if(!p){ $('msg').innerText="Password Dia Bhai"; return; }
 if(m==="admin" && p==="1430"){
   localStorage.setItem("currentRole","admin");
   location.href="admin2.html";
 } else {
   $('msg').innerText="Wrong Admin ID / Password";
 }
}

function loginDist(){
 let m=$('dm').value.trim(), p=$('dp').value.trim();
 if(!m){ $('msg').innerText="Distributor ID Dia"; return; }
 if(!p){ $('msg').innerText="Password Dia"; return; }
 let list = ;// RETAILER LOGIN - ALL KEYS CHECK
let retailers = [];
try{
  let allKeys = ["retailers","retailers_backup","pq_retailers_secret","payquick_retailers"];
  // Add all distributor specific keys
  for(let i=0;i<localStorage.length;i++){
    let k = localStorage.key(i);
    if(k && k.startsWith("retailers_")) allKeys.push(k);
  }
  let best = [];
  allKeys.forEach(k=>{
    try{
      let v = JSON.parse(localStorage.getItem(k)||"[]");
      if(v.length>best.length) best=v;
    }catch(e){}
  });
  retailers = best;
  console.log("Login Check Retailers:", retailers);
}catch(e){ retailers = []; }
 let f = list.find(x=> (x.mobile===m || x.id===m) && x.password===p);
 if(f){
   localStorage.setItem("currentRole","distributor");
   localStorage.setItem("distributorLoggedIn",f.mobile);
   localStorage.setItem("currentDist",JSON.stringify(f));
   localStorage.setItem("distributorId",f.mobile);
   location.href="distributor.html";
 } else {
   $('msg').innerText="Distributor ID Not Found - Admin Nku Contact Kara";
 }
}

function loginRet(){
 let m=$('rm').value.trim(), p=$('rp').value.trim();
 if(!m){ $('msg').innerText="Retailer ID Dia"; return; }
 if(!p){ $('msg').innerText="Password Dia"; return; }
 let list = JSON.parse(localStorage.getItem("retailers")||"[]");
 let f = list.find(x=> (x.mobile===m || x.id===m) && x.password===p);
 if(f){
   localStorage.setItem("currentRole","retailer");
   localStorage.setItem("currentRet",JSON.stringify(f));
   location.href="retailer.html";
 } else {
   $('msg').innerText="Retailer ID Not Found - Distributor Nku Contact Kara";
 }
}
</script>
</body>
</html>
