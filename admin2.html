<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Final Working</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f1f5f9}.card{background:#fff;border-radius:12px;padding:16px;margin:10px;box-shadow:0 2px 8px #0001}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px}.btn{padding:12px;background:#4f46e5;color:#fff;border:0;border-radius:10px;width:100%;font-weight:700}.row{border:1px solid #eee;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px}.tbtn{padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;margin:2px;font-size:12px;font-weight:700}.tbtn.active{background:#4f46e5;color:#fff}.tab{display:none}.tab.active{display:block}</style>
</head><body>
<div id="L" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:100%;max-width:380px;text-align:center"><h2 style="color:#4f46e5">PayQuickPay ADMIN</h2><p style="font-size:12px">Secure Login 🔒</p><input id="e" value="admin@payquick.com"><input id="p" value="admin123" type="password"><button onclick="doLogin()" class="btn" style="padding:14px;font-size:16px">LOGIN SECURE</button><p style="font-size:10px;color:#888;margin-top:10px">Email: admin@payquick.com / Pass: admin123</p></div></div>

<div id="D" style="display:none"><div style="background:#4f46e5;color:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0"><b>ADMIN ✅</b><span onclick="doLogout()" style="background:#fff;color:#4f46e5;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer">Logout</span></div>
<div style="max-width:650px;margin:auto;padding:8px">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div class="card" style="text-align:center"><small>Dist.</small><br><b id="cD">0</b></div><div class="card" style="text-align:center"><small>Ret.</small><br><b id="cR">0</b></div><div class="card" style="text-align:center"><small>Wallet</small><br><b id="cW">₹0</b></div></div>
<div style="display:flex;flex-wrap:wrap;margin:6px"><button id="b1" class="tbtn active" onclick="showT('t1','b1')">Dashboard</button><button id="b2" class="tbtn" onclick="showT('t2','b2')">Distributor</button><button id="b3" class="tbtn" onclick="showT('t3','b3')">Retailer</button><button id="b4" class="tbtn" onclick="showT('t4','b4')">Services</button></div>
<div id="t1" class="tab active card"><h3>Dashboard ✅ Login Success</h3><br><p>Distributor: <b id="cd">0</b></p><p>Retailer: <b id="cr">0</b></p><p>Business: <b id="cw">₹0</b></p></div>
<div id="t2" class="tab card"><h3>Add Distributor</h3><br><input id="dN" placeholder="Name"><input id="dE" placeholder="Email"><input id="dP" placeholder="Pass"><input id="dC" placeholder="Commission %"><button onclick="addD()" class="btn" style="background:#16a34a">Add Distributor</button><div id="dL" style="margin-top:12px"></div></div>
<div id="t3" class="tab card"><h3>Add Retailer</h3><br><input id="rN" placeholder="Name"><input id="rE" placeholder="Email"><input id="rP" placeholder="Pass"><select id="rD"></select><button onclick="addR()" class="btn">Add Retailer</button><div id="rL" style="margin-top:12px"></div></div>
<div id="t4" class="tab card"><h3>Services ON/OFF</h3><div id="sL"></div></div>
</div></div>

<script>
function doLogin(){var e=document.getElementById("e").value.trim().toLowerCase();var p=document.getElementById("p").value.trim();if(e=="admin@payquick.com"&&p=="admin123"){localStorage.setItem("pq_auth","yes");document.getElementById("L").style.display="none";document.getElementById("D").style.display="block";loadAll();}else{alert("Wrong Password! admin@payquick.com / admin123")}} 
function doLogout(){localStorage.removeItem("pq_auth");location.reload()}
function showT(t,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById(t).classList.add("active");document.querySelectorAll(".tbtn").forEach(x=>x.classList.remove("active"));document.getElementById(b).classList.add("active")}
if(localStorage.getItem("pq_auth")=="yes"){document.getElementById("L").style.display="none";document.getElementById("D").style.display="block";}
function get(k){return JSON.parse(localStorage.getItem(k)||"[]")}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function loadAll(){let d=get("pq_dist_final"),r=get("pq_ret_final");document.getElementById("cD").innerText=d.length;document.getElementById("cd").innerText=d.length;document.getElementById("cR").innerText=r.length;document.getElementById("cr").innerText=r.length;let tot=0;[...d,...r].forEach(x=>tot+=(x.wallet||0));document.getElementById("cW").innerText="₹"+tot;document.getElementById("cw").innerText="₹"+tot;document.getElementById("dL").innerHTML=d.map(x=><div class="row"><div><b>${x.name}</b><br><span style="font-size:11px">${x.email} | ₹${x.wallet||0}</span></div><div><span onclick="addM('pq_dist_final',${x.id})" style="background:#22c55e;color:#fff;padding:5px 9px;border-radius:6px">+₹</span> <span onclick="delK('pq_dist_final',${x.id})" style="background:#ef4444;color:#fff;padding:5px 8px;border-radius:6px">X</span></div></div>).join("")||"No Data";let o='<option value="">Direct</option>';d.forEach(x=>o+=<option value="${x.name}">${x.name}</option>);document.getElementById("rD").innerHTML=o;document.getElementById("rL").innerHTML=r.map(x=><div class="row"><div><b>${x.name}</b><br><span style="font-size:11px">${x.email}</span></div><div><span onclick="addM('pq_ret_final',${x.id})" style="background:#22c55e;color:#fff;padding:5px 9px;border-radius:6px">+₹</span> <span onclick="delK('pq_ret_final',${x.id})" style="background:#ef4444;color:#fff;padding:5px 8px;border-radius:6px">X</span></div></div>).join("")||"No Data";let s=JSON.parse(localStorage.getItem("pq_services_final")||"null");if(!s){s=[{id:"recharge",name:"📱 Recharge",a:1},{id:"dth",name:"📺 DTH",a:1},{id:"elec",name:"💡 Electricity",a:1},{id:"bbps",name:"🏦 BBPS",a:1},{id:"aeps",name:"💳 AePS",a:1},{id:"dmt",name:"💸 DMT",a:1}];localStorage.setItem("pq_services_final",JSON.stringify(s))}document.getElementById("sL").innerHTML=s.map(x=><div class="row"><span>${x.name} <small style="color:${x.a?'green':'red'}">${x.a?'ON':'OFF'}</small></span><button onclick="togS('${x.id}')" style="padding:4px 14px;border-radius:20px;border:0;background:${x.a?'#22c55e':'#9ca3af'};color:#fff;font-weight:700">${x.a?'ON':'OFF'}</button></div>).join("")}
function addD(){let n=document.getElementById("dN").value,e=document.getElementById("dE").value;if(!n||!e)return alert("Name Email lekha");let a=get("pq_dist_final");a.push({id:Date.now(),name:n,email:e,wallet:1000});set("pq_dist_final",a);loadAll();alert("Added ✅")}function addR(){let n=document.getElementById("rN").value,e=document.getElementById("rE").value;if(!n||!e)return alert("Name Email lekha");let a=get("pq_ret_final");a.push({id:Date.now(),name:n,email:e,wallet:500});set("pq_ret_final",a);loadAll();alert("Added ✅")}function delK(k,id){if(confirm("Delete?")){set(k,get(k).filter(x=>x.id!=id));loadAll()}}function addM(k,id){let am=prompt("Amount?");if(!am)return;let a=get(k);let f=a.find(x=>x.id==id);f.wallet=(f.wallet||0)+parseInt(am);set(k,a);loadAll()}function togS(id){let s=JSON.parse(localStorage.getItem("pq_services_final"));let f=s.find(x=>x.id==id);f.a=f.a?0:1;localStorage.setItem("pq_services_final",JSON.stringify(s));loadAll()}
loadAll();
</script></body></html>
