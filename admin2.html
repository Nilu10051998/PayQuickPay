<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN FINAL - NO DELETE</title>
<style>
body{margin:0;background:#020617;color:#fff;font-family:system-ui;padding:12px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:15px;margin:10px 0}
.h{display:flex;justify-content:space-between;align-items:center;background:#1e293b;padding:12px;border-radius:12px}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px}
.btn{padding:13px;border-radius:8px;border:none;font-weight:800;width:100%;font-size:16px;cursor:pointer}
.b1{background:#22c55e;color:#000}.b4{background:#ef4444;color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #334155}
</style>
</head>
<body>

<div class="h">
<div><b>👑 ADMIN - PERMANENT</b><br><small style="color:#22c55e">Delete Heba Nahi</small></div>
<button onclick="logout()" style="background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:800">Logout</button>
</div>

<div class="card">
<h3 style="margin:0 0 10px">➕ Create Distributor</h3>
<input id="dId" placeholder="ID Lekha - Ex: D1">
<input id="dName" placeholder="Name Lekha - Ex: Nilu">
<input id="dPass" placeholder="Password Lekha - Ex: 12345">
<input id="dBal" placeholder="Balance - Ex: 500" type="number">
<button class="btn b1" onclick="addDist()">✅ CREATE KARA</button>
<p id="msg" style="text-align:center;font-weight:800;margin-top:10px"></p>
</div>

<div class="card">
<h3>📋 Distributor List (<span id="cnt">0</span>)</h3>
<div id="list"></div>
</div>

<script>
// PERMANENT SAVE - KEBE DELETE HEBA NAHI
function getD(){
  try{
    let a = JSON.parse(localStorage.getItem("distributors")||"[]");
    let b = JSON.parse(localStorage.getItem("distributors_backup")||"[]");
    if(a.length>=b.length) return a;
    return b;
  }catch(e){ return [] }
}
function saveD(list){
  localStorage.setItem("distributors", JSON.stringify(list));
  localStorage.setItem("distributors_backup", JSON.stringify(list));
  localStorage.setItem("distributors_v2", JSON.stringify(list));
}

function addDist(){
  let id = document.getElementById('dId').value.trim();
  let name = document.getElementById('dName').value.trim();
  let pass = document.getElementById('dPass').value.trim();
  let bal = document.getElementById('dBal').value.trim()||"500";
  let msg = document.getElementById('msg');
  
  if(!id){ msg.innerText="❌ ID Dia Bhai - D1"; msg.style.color="#ef4444"; return; }
  if(!pass){ msg.innerText="❌ Password Dia"; msg.style.color="#ef4444"; return; }
  
  let list = getD();
  if(list.find(x=>x.id==id)){ msg.innerText="❌ "+id+" Already Achhi"; msg.style.color="#ef4444"; return; }
  
  list.push({id:id, name:name||id, password:pass, mobile:id, balance:parseFloat(bal), commission:2});
  saveD(list);
  
  msg.innerText="✅ "+id+" SAVE HEIGALA! Ebe Delete Heba Nahi!";
  msg.style.color="#22c55e";
  
  document.getElementById('dId').value="";
  document.getElementById('dName').value="";
  document.getElementById('dPass').value="";
  document.getElementById('dBal').value="";
  
  render();
}

function delDist(id){
  if(!confirm(id+" Ku Delete Kariba? Pakka?")) return;
  let list = getD().filter(x=>x.id!=id);
  saveD(list);
  render();
}

function render(){
  let list = getD();
  document.getElementById('cnt').innerText=list.length;
  let h="";
  list.slice().reverse().forEach(x=>{
    h+=`<div class="item"><div><b style="background:#f59e0b;color:#000;padding:3px 8px;border-radius:10px">${x.id}</b> ${x.name} - ₹${x.balance} - ${x.password}</div><button onclick="delDist('${x.id}')" style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-weight:800">X</button></div>`;
  });
  document.getElementById('list').innerHTML = h || "<div style='text-align:center;color:#94a3b8;padding:20px'>No Data - Upara Create Kara</div>";
}

function logout(){
  // FIX: clear() NAHI - Kebala Role Delete
  localStorage.removeItem("currentRole");
  localStorage.removeItem("distributorLoggedIn");
  location.href="index.html";
}

render();
</script>
</body>
</html>
