<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuickPay - REAL ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-lg">
<h1 class="text-3xl font-bold mb-2">PayQuickPay ADMIN</h1>
<p class="text-gray-500 mb-6">Project: payquickpay-73fb3 | REAL WORKING</p>

<div class="bg-blue-50 p-4 rounded mb-6 grid grid-cols-1 md:grid-cols-4 gap-2">
<input id="dName" placeholder="Distributor Name" class="border p-2 rounded">
<input id="dPhone" placeholder="Phone 10 digit" class="border p-2 rounded">
<input id="dEmail" placeholder="Email" class="border p-2 rounded">
<button onclick="addDist()" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded font-bold">+ ADD</button>
</div>

<div id="distList" class="space-y-3"></div>

<h2 class="text-xl font-bold mt-10 mb-3">Recent Transactions</h2>
<div id="transList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9RW1EER-zuCsZqXadbBi3W4RNJRFqaJY",
  authDomain: "payquickpay-73fb3.firebaseapp.com",
  projectId: "payquickpay-73fb3",
  storageBucket: "payquickpay-73fb3.firebasestorage.app",
  messagingSenderId: "290917109615",
  appId: "1:290917109615:web:d88a1db85ba3467824a29a",
  measurementId: "G-R4QVW222RB"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addDist = async () => {
  const name = document.getElementById('dName').value.trim();
  const phone = document.getElementById('dPhone').value.trim();
  const email = document.getElementById('dEmail').value.trim();
  if(!name || !phone) return alert("Name & Phone Lekha");
  await addDoc(collection(db,"distributors"), {name, phone, email, balance:0, wallet:0, createdAt: new Date()});
  document.getElementById('dName').value=""; document.getElementById('dPhone').value=""; document.getElementById('dEmail').value="";
  alert("Distributor LIVE Added!");
  loadDist();
}

window.deleteDist = async (id, name) => {
  if(!confirm(`${name} ku Pakka Delete Kariba? Firebase ru permanent delete heba!`)) return;
  await deleteDoc(doc(db,"distributors",id));
  alert("Permanently Deleted!");
  loadDist();
}

window.addBal = async (id) => {
  let amt = prompt("Kete Taka Add Kariba? Ex: 5000");
  if(!amt) return;
  amt = parseInt(amt);
  if(isNaN(amt)) return alert("Number Lekha");
  const ref = doc(db,"distributors",id);
  const snap = await getDoc(ref);
  if(!snap.exists()) return alert("Not Found");
  const old = snap.data().balance || 0;
  await updateDoc(ref, {balance: old + amt, wallet: old + amt});
  alert(`₹${amt} Added! New Balance: ₹${old+amt}`);
  loadDist();
}

async function loadDist(){
  const snap = await getDocs(collection(db,"distributors"));
  let html="";
  snap.forEach(d=>{
    const x = d.data();
    html+=`<div class="flex justify-between items-center border p-4 rounded-lg hover:shadow">
      <div><p class="font-bold text-lg">${x.name}</p><p class="text-sm text-gray-600">${x.phone} | ${x.email||''}</p><p class="text-green-600 font-bold">Balance: ₹${x.balance||0}</p></div>
      <div class="flex gap-2">
        <button onclick="addBal('${d.id}')" class="bg-green-600 text-white px-4 py-2 rounded">+Balance</button>
        <button onclick="deleteDist('${d.id}','${x.name}')" class="bg-red-600 text-white px-4 py-2 rounded">Delete</button>
      </div>
    </div>`;
  });
  document.getElementById('distList').innerHTML = html || "<p class='text-gray-400'>No Distributors Found - Add Kara</p>";
  loadTrans();
}

async function loadTrans(){
  try{
    const snap = await getDocs(collection(db,"transactions"));
    let html=""; let c=0;
    snap.forEach(t=>{ if(c<10){ const x=t.data(); html+=`<div class="border p-2 rounded text-sm flex justify-between"><span>${x.type||'Payment'} - ₹${x.amount||0}</span><span class="${x.status=='success'?'text-green-600':'text-orange-500'}">${x.status||'pending'}</span></div>`; c++; } });
    document.getElementById('transList').innerHTML = html || "No Transactions";
  }catch(e){ document.getElementById('transList').innerHTML = "Transaction collection nahi";}
}
loadDist();
</script>
</body>
</html>
