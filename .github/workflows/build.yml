name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Create project files
        run: |
          rm -rf android ios web windows macos linux test
          flutter create . --project-name pay_quick_pay --org com.payquickpay.app --platforms android
      - name: Write main.dart
        run: |
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main() { runApp(const PayQuickPayApp()); }
          class PayQuickPayApp extends StatelessWidget {
            const PayQuickPayApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PayQuickPay',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.blue, useMaterial3: true),
                home: Scaffold(
                  appBar: AppBar(title: const Text('PayQuickPay'), centerTitle: true, backgroundColor: Colors.blue, foregroundColor: Colors.white),
                  body: const Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.payments, size: 80, color: Colors.blue),
                        SizedBox(height: 20),
                        Text('PayQuickPay', style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
                        SizedBox(height: 10),
                        Text('Fast & Secure Payments', style: TextStyle(color: Colors.grey)),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART
      - name: Fix name
        run: sed -i 's/android:label="[^"]*"/android:label="PayQuickPay"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PayQuickPay-APK
          path: build/app/outputs/flutter-apk/app-release.apk
