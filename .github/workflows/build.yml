name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Create project
        run: |
          rm -rf android
          flutter create . --project-name pay_quick_pay --org com.payquickpay.app --platforms android
      - name: Write app
        run: |
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main() { runApp(const PayQuickPayApp()); }
          class PayQuickPayApp extends StatelessWidget {
            const PayQuickPayApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'PayQuickPay',
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  appBar: AppBar(title: const Text('PayQuickPay')),
                  body: const Center(child: Text('Welcome to PayQuickPay!', style: TextStyle(fontSize: 24))),
                ),
              );
            }
          }
          DART
      - run: sed -i 's/android:label="[^"]*"/android:label="PayQuickPay"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PayQuickPay-APK
          path: build/app/outputs/flutter-apk/app-release.apk
