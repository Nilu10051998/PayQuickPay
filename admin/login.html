<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title>
<style>body{background:#020617;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:system-ui}
.box{background:#1e293b;padding:24px;border-radius:16px;width:320px;border:1px solid #334155}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;background:#0f172a;color:#fff}
.btn{width:100%;padding:12px;background:#f59e0b;color:#000;font-weight:900;border:none;border-radius:10px;margin-top:8px;cursor:pointer}
</style></head><body>
<div class="box">
<h2 style="text-align:center;margin-bottom:12px">🔐 ADMIN LOGIN</h2>
<input id="a_id" placeholder="Admin ID" value="admin">
<input id="a_pass" type="password" placeholder="Password" value="admin123">
<button class="btn" onclick="adminLogin()">LOGIN</button>
<p id="err" style="color:#ef4444;font-size:12px;text-align:center;margin-top:8px"></p>
</div>
<script>
function adminLogin(){
let id=document.getElementById('a_id').value;
let pass=document.getElementById('a_pass').value;
if(id=='admin' && pass=='admin123'){
localStorage.setItem('admin_login','true');
location.href='./index.html';
}else{
document.getElementById('err').innerText='Wrong ID / Password!';
}
}
</script>
</body></html>
