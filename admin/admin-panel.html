<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayQuickPay - PRO Admin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white">
<div class="flex"><div class="w-64 bg-slate-800 h-screen fixed p-5">
<h1 class="text-xl font-bold text-emerald-400">PayQuickPay</h1><p class="text-xs text-slate-400 mb-6">PRO ADMIN</p>
<button class="w-full bg-slate-700 p-3 rounded mb-2">📊 Dashboard</button>
<button onclick="exportCSV()" class="w-full bg-blue-600 p-3 rounded">Export CSV</button>
<button onclick="logout()" class="w-full text-red-400 mt-10">Logout</button></div>
<div class="ml-64 p-8 w-full">
<div class="grid grid-cols-3 gap-5">
<div class="bg-slate-800 p-5 rounded-xl border-l-4 border-emerald-400"><p class="text-sm text-slate-400">TOTAL</p><h2 id="total" class="text-2xl font-bold">₹0</h2></div>
<div class="bg-slate-800 p-5 rounded-xl border-l-4 border-blue-500"><p class="text-sm text-slate-400">TRANS</p><h2 id="count" class="text-2xl font-bold">0</h2></div>
<div class="bg-slate-800 p-5 rounded-xl border-l-4 border-yellow-500"><p class="text-sm text-slate-400">UPI</p><h2 id="upiShow" class="text-lg">Not Set</h2></div>
</div>
<div class="bg-slate-800 p-5 rounded-xl mt-6"><h3 class="font-bold">Add Transaction</h3><div class="flex gap-2 mt-3"><input id="n" placeholder="Name" class="bg-slate-900 p-2 rounded w-1/3"><input id="a" type="number" placeholder="Amount" class="bg-slate-900 p-2 rounded w-1/3"><button onclick="add()" class="bg-emerald-500 px-6 rounded font-bold">ADD</button></div></div>
<div class="bg-slate-800 p-5 rounded-xl mt-6"><table class="w-full"><thead class="text-slate-400 text-sm"><tr><th class="text-left p-2">NAME</th><th>AMOUNT</th><th>DATE</th><th>ACTION</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="bg-slate-800 p-5 rounded-xl mt-6"><h3 class="font-bold">UPI Settings</h3><input id="upi" placeholder="upi@okicici" class="w-full bg-slate-900 p-3 rounded mt-2"><button onclick="saveUpi()" class="w-full bg-emerald-500 p-2 rounded mt-3 font-bold">SAVE</button></div>
</div></div>
<script>
if(localStorage.getItem('payquickpay_admin')!=='ok') location.href='dashboard.html';
let data=JSON.parse(localStorage.getItem('pq')||'[]');
function add(){let name=document.getElementById('n').value, amt=document.getElementById('a').value; if(!name||!amt) return alert('Fill!'); data.unshift({name,amt, date:new Date().toLocaleDateString()}); localStorage.setItem('pq',JSON.stringify(data)); render();}
function render(){let h=''; let tot=0; data.forEach((t,i)=>{tot+=parseInt(t.amt); h+=<tr class="border-t border-slate-700"><td class="p-3">${t.name}</td><td>₹${t.amt}</td><td>${t.date}</td><td><button onclick="del(${i})" class="text-red-400">Del</button></td></tr>}); document.getElementById('tb').innerHTML=h; document.getElementById('total').innerText='₹'+tot; document.getElementById('count').innerText=data.length; document.getElementById('upiShow').innerText=localStorage.getItem('pq_upi')||'Not Set';}
function del(i){data.splice(i,1); localStorage.setItem('pq',JSON.stringify(data)); render();}
function saveUpi(){localStorage.setItem('pq_upi',document.getElementById('upi').value); alert('Saved!'); render();}
function exportCSV(){let csv='Name,Amount,Date\n'+data.map(d=>d.name+','+d.amt+','+d.date).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv])); a.download='payquickpay.csv'; a.click();}
function logout(){localStorage.removeItem('payquickpay_admin'); location.href='dashboard.html';}
document.getElementById('upi').value=localStorage.getItem('pq_upi')||''; render();
</script></body></html>
