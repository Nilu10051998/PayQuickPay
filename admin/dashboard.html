<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuick ADMIN - WORKING</title>
<style>
body{background:#080f25;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#132150;padding:25px;border-radius:15px;width:100%;max-width:350px;border:1px solid #334155;text-align:center}
input{width:100%;background:#080f25;border:1px solid #475569;padding:12px;border-radius:8px;margin-top:10px;color:white;box-sizing:border-box}
button{width:100%;padding:12px;border-radius:8px;margin-top:12px;font-weight:bold;border:none;cursor:pointer}
.btn-green{background:#10b981;color:white}
.btn-blue{background:#2563eb;color:white}
.btn-red{background:#dc2626;color:white;padding:8px 15px;width:auto}
#adminPage{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#080f25;overflow:auto;padding:10px}
.card{background:#132150;padding:15px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>

<div id="loginPage" class="box">
<h2 style="color:#38bdf8">PayQuick ADMIN</h2>
<p style="font-size:11px;color:#10b981">✅ FIXED - Button 100% Work</p>

<input id="mob" type="text" placeholder="Mobile 10 digit - 7908824917">
<input id="pass" type="password" placeholder="Create Password - 1234">
<button class="btn-green" onclick="createAccount()">CREATE & ENTER ADMIN</button>

<hr style="margin:20px 0;border:0;border-top:1px solid #334155">

<input id="loginPass" type="password" placeholder="Login Password">
<button class="btn-blue" onclick="login()">LOGIN</button>
<button style="background:none;color:#10b981;font-size:11px;text-decoration:underline" onclick="resetOtp()">Forgot? Reset OTP</button>
<p id="msg" style="font-size:12px;color:yellow;margin-top:10px"></p>
</div>

<div id="adminPage">
<div style="background:#0d1b3a;padding:10px;display:flex;justify-content:space-between;align-items:center">
<b style="color:#38bdf8">ADMIN LIVE - <span id="showMob"></span></b>
<button class="btn-red" onclick="doLogout()">LOGOUT</button>
</div>

<div class="card" style="border:2px solid #10b981">
<h3 style="color:#10b981;margin:0">ADD MEMBER - 100% FIXED</h3>
<select id="mType" style="width:100%;background:#080f25;color:white;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #475569"><option value="retailer">Retailer</option><option value="distributor">Distributor</option></select>
<input id="aName" placeholder="Name - nilu">
<input id="aMob" placeholder="Mobile - 7908824917">
<input id="aShop" placeholder="Shop - csc">
<button class="btn-green" onclick="addMember()">ADD NOW - WORK 100%</button>
<p id="addMsg" style="color:#10b981;font-size:12px;display:none;margin-top:8px">✅ Added to Pending!</p>
</div>

<div class="card">
<h3>Pending: <span id="c1">0</span> | Approved: <span id="c2">0</span></h3>
<div id="pList" style="margin-top:10px"></div>
</div>
</div>

<script>
// Make functions global - 100% work
window.createAccount = function(){
 var m = document.getElementById('mob').value.trim();
 var p = document.getElementById('pass').value.trim();
 if(m.length!= 10){ alert('Mobile 10 digit lekha!'); return; }
 if(p.length < 3){ alert('Password 3+ lekha!'); return; }
 localStorage.setItem('pqp_m', m);
 localStorage.setItem('pqp_p', p);
 localStorage.setItem('pqp_login', 'yes');
 document.getElementById('msg').innerHTML = '✅ Created! Mobile:'+m;
 alert('Created! Entering Admin...');
 document.getElementById('loginPage').style.display='none';
 document.getElementById('adminPage').style.display='block';
 document.getElementById('showMob').innerText = m;
 loadData();
}

window.login = function(){
 var saved = localStorage.getItem('pqp_p');
 var inp = document.getElementById('loginPass').value.trim();
 if(!saved){ alert('First Create Account!'); return; }
 if(inp === saved){
   localStorage.setItem('pqp_login','yes');
   document.getElementById('loginPage').style.display='none';
   document.getElementById('adminPage').style.display='block';
   document.getElementById('showMob').innerText = localStorage.getItem('pqp_m');
   loadData();
 } else { alert('Wrong! Correct: '+saved); }
}

window.doLogout = function(){ localStorage.removeItem('pqp_login'); location.reload(); }

window.resetOtp = function(){
 var mob = localStorage.getItem('pqp_m');
 if(!mob){ alert('First create account!'); return; }
 var otp = Math.floor(100000+Math.random()*900000);
 localStorage.setItem('pqp_otp', otp);
 var entered = prompt('OTP to '+mob+' is: '+otp+'\nEnter OTP to Reset:');
 if(entered == otp){
   var np = prompt('Enter New Password:');
   if(np){ localStorage.setItem('pqp_p', np); alert('Password Reset to: '+np); }
 } else { alert('Wrong OTP! Correct: '+otp); }
}

window.addMember = function(){
 var t = document.getElementById('mType').value;
 var n = document.getElementById('aName').value.trim();
 var m = document.getElementById('aMob').value.trim();
 var s = document.getElementById('aShop').value.trim();
 if(!n){ alert('Name lekha!'); return; }
 if(!m){ alert('Mobile lekha!'); return; }
 var pending = JSON.parse(localStorage.getItem('pending')||'[]');
 pending.push({type:t,name:n,mobile:m,shop:s});
 localStorage.setItem('pending', JSON.stringify(pending));
 document.getElementById('aName').value=''; document.getElementById('aMob').value=''; document.getElementById('aShop').value='';
 document.getElementById('addMsg').style.display='block';
 setTimeout(()=>{ document.getElementById('addMsg').style.display='none'; }, 2000);
 loadData();
 alert('✅ ADDED! Pending re dekha!');
}

window.loadData = function(){
 var pending = JSON.parse(localStorage.getItem('pending')||'[]');
 var approved = JSON.parse(localStorage.getItem('approved')||'[]');
 document.getElementById('c1').innerText = pending.length;
 document.getElementById('c2').innerText = approved.length;
 var h='';
 for(var i=0;i<pending.length;i++){
   h+='<div style="background:#080f25;padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between"><span>'+pending[i].name+' - '+pending[i].mobile+'</span><button class="btn-green" style="width:auto;padding:5px 10px;margin:0" onclick="approve('+i+')">Approve</button></div>';
 }
 document.getElementById('pList').innerHTML = h || 'No pending - Add kara';
}

window.approve = function(i){
 var pending = JSON.parse(localStorage.getItem('pending')||'[]');
 var approved = JSON.parse(localStorage.getItem('approved')||'[]');
 var item = pending.splice(i,1)[0];
 approved.push(item);
 localStorage.setItem('pending', JSON.stringify(pending));
 localStorage.setItem('approved', JSON.stringify(approved));
 loadData();
}

// Auto login if already
if(localStorage.getItem('pqp_login')==='yes' && localStorage.getItem('pqp_p')){
 document.getElementById('loginPage').style.display='none';
 document.getElementById('adminPage').style.display='block';
 document.getElementById('showMob').innerText = localStorage.getItem('pqp_m')||'';
 loadData();
}
console.log('Admin Loaded OK');
</script>
</body>
</html>
