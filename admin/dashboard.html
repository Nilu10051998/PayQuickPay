<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayQuick Admin FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{font-family:sans-serif;background:#f1f5f9;padding:15px} .box{background:white;padding:20px;border-radius:10px} .btn{padding:8px 15px;border:0;border-radius:5px;color:white;cursor:pointer} .g{background:#22c55e} .r{background:#ef4444}</style>
</head>
<body>
<h2 style="background:#4f46e5;color:white;padding:12px;border-radius:8px">PayQuick SUPER ADMIN FINAL ✅</h2>
<div class="box" id="main">Checking Firebase... Wait 5 sec</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC2CNTl1jpj-IIxDUCEHoAQPJFR2Zd7OOI",
  authDomain: "payquickpay-487ef.firebaseapp.com",
  projectId: "payquickpay-487ef",
  storageBucket: "payquickpay-487ef.firebasestorage.app",
  messagingSenderId: "368108778411",
  appId: "1:368108778411:web:03dcbc47e46568d51b58ee",
  measurementId: "G-9SLWLCMK8P"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
async function load(){
  let div = document.getElementById('main');
  try{
    let snap = await db.collection('retailers').get();
    if(snap.empty){
      div.innerHTML = "<h3>✅ Firebase Connected!</h3><p>No Retailers Yet - Database Khali Achi. Eta Success!</p><p><b>9 Features Ready!</b></p><p>Total: 0</p>";
    } else {
      let html = "<h3>Retailers Found: "+snap.size+"</h3>";
      snap.forEach(d=>{
        let x=d.data();
        html+= `<p>${x.shopName||'Shop'} - ${x.mobile||''} - ${x.status||'pending'} 
        <button class='btn g' onclick="db.collection('retailers').doc('${d.id}').update({status:'approved'}).then(()=>location.reload())">Approve</button>
        <button class='btn r' onclick="db.collection('retailers').doc('${d.id}').update({status:'rejected'}).then(()=>location.reload())">Reject</button></p>`;
      });
      div.innerHTML=html;
    }
  }catch(e){
    div.innerHTML = "<h3 style='color:red'>Error:</h3><p>"+e.message+"</p><p>Firestore Rule Check Kara</p>";
  }
}
load();
</script>
</body>
</html>
