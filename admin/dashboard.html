<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuick ADMIN</title>
<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.box{background:#0f172a;border:1px solid #334155;padding:24px;border-radius:16px;width:100%;max-width:360px}
.inputWrap{position:relative;margin-top:18px}
.inputWrap input{width:100%;padding:13px 40px 13px 13px;border-radius:10px;border:1px solid #475569;background:#020617;color:#fff}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;background:none;border:0;font-size:18px}
button{width:100%;padding:13px;border-radius:10px;border:0;font-weight:800;cursor:pointer;margin-top:14px}
.b{background:#3b82f6;color:#fff}
.g{background:#22c55e;color:#fff}
#admin{display:none;position:fixed;inset:0;background:#020617;padding:12px;overflow:auto}
.top{background:#0f172a;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #334155}
.card{background:#0f172a;padding:15px;border-radius:12px;margin-top:12px;border:1px solid #334155}
</style>
</head>
<body>

<div id="loginBox" class="box">
<h2 style="color:#38bdf8;text-align:center;margin:0">PayQuick SUPER ADMIN</h2>
<p style="text-align:center;color:#22c55e;font-size:11px;margin-top:4px">🔒 SECURE - ALL FEATURES</p>

<div class="inputWrap">
<input id="pass" type="password" placeholder="Enter Password">
<button class="eye" onclick="toggle()" type="button">👁️</button>
</div>

<button class="b" onclick="doLogin()">LOGIN</button>
<p id="msg" style="color:#f87171;font-size:12px;text-align:center;margin-top:10px;display:none"></p>
</div>

<div id="admin">
<div class="top"><b style="color:#38bdf8">PayQuick ADMIN LIVE</b><button onclick="logout()" style="width:auto;background:#dc2626;color:#fff;padding:8px 14px;border-radius:6px;border:0">LOGOUT</button></div>

<div class="card" style="border:2px solid #22c55e">
<b style="color:#22c55e">➕ ADD MEMBER</b><br>
<select id="type" style="width:100%;padding:11px;border-radius:8px;border:1px solid #475569;background:#020617;color:#fff;margin-top:10px"><option value="retailer">Retailer</option><option value="distributor">Distributor</option></select>
<input id="name" placeholder="Name" style="width:100%;padding:11px;border-radius:8px;border:1px solid #475569;background:#020617;color:#fff;margin-top:8px">
<input id="mob" placeholder="Mobile" style="width:100%;padding:11px;border-radius:8px;border:1px solid #475569;background:#020617;color:#fff;margin-top:8px">
<input id="shop" placeholder="Shop" style="width:100%;padding:11px;border-radius:8px;border:1px solid #475569;background:#020617;color:#fff;margin-top:8px">
<button class="g" onclick="add()">ADD NOW</button>
</div>

<div class="card">
<b>Pending: <span id="c1">0</span> | Approved: <span id="c2">0</span></b>
<div id="list" style="margin-top:10px"></div>
</div>
</div>

<script>
const REAL_PASS = "PayQuick@123";

function toggle(){
  var p=document.getElementById('pass');
  p.type = p.type==='password'? 'text' : 'password';
}

function doLogin(){
  var v=document.getElementById('pass').value.trim();
  if(v===REAL_PASS){
    sessionStorage.setItem('ok','1');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('admin').style.display='block';
    load();
  } else {
    var m=document.getElementById('msg');
    m.style.display='block';
    m.innerText='Wrong Password! Try: PayQuick@123';
  }
}

function logout(){sessionStorage.removeItem('ok');location.reload()}

var pending=JSON.parse(localStorage.getItem('pen')||'[]');
var approved=JSON.parse(localStorage.getItem('app')||'[]');

function add(){
  var t=document.getElementById('type').value;
  var n=document.getElementById('name').value.trim();
  var mo=document.getElementById('mob').value.trim();
  var s=document.getElementById('shop').value.trim();
  if(!n||!mo){alert('Name Mobile lekha');return}
  pending.push({t,n,m:mo,s});
  localStorage.setItem('pen',JSON.stringify(pending));
  document.getElementById('name').value='';document.getElementById('mob').value='';document.getElementById('shop').value='';
  load(); alert('Added!');
}
function load(){
  document.getElementById('c1').innerText=pending.length;
  document.getElementById('c2').innerText=approved.length;
  var h=''; pending.forEach((x,i)=>{h+=<div style="background:#020617;padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between"><span>${x.n} - ${x.m} (${x.t})</span><button onclick="approve(${i})" style="width:auto;background:#22c55e;padding:5px 10px;border-radius:6px;border:0;color:#fff">Approve</button></div>});
  document.getElementById('list').innerHTML=h||'No pending';
}
function approve(i){approved.push(pending[i]);pending.splice(i,1);localStorage.setItem('pen',JSON.stringify(pending));localStorage.setItem('app',JSON.stringify(approved));load()}

if(sessionStorage.getItem('ok')==='1'){document.getElementById('loginBox').style.display='none';document.getElementById('admin').style.display='block';load()}

// Enter key login
document.getElementById('pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
