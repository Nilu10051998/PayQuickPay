<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayQuick Admin Pro</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#060a19;color:#fff;font-family:Arial}
.login{max-width:380px;margin:80px auto;background:#151c33;padding:30px;border-radius:20px;text-align:center;border:1px solid #00ff88}
.admin{display:none;padding:15px}
.card{background:#151c33;padding:15px;border-radius:14px;margin:12px 0;border:1px solid #222}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff}
.btn{padding:12px 18px;border:0;border-radius:10px;font-weight:800;cursor:pointer}
.btn-green{background:#00ff88;color:#000;width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:linear-gradient(135deg,#151c33,#0f1429);padding:15px;border-radius:12px;text-align:center;border:1px solid #00ff8820}
.stat h2{margin:5px;color:#00ff88}
.user{display:flex;justify-content:space-between;align-items:center;background:#0a0f1f;padding:12px;border-radius:10px;margin:8px 0;border-left:3px solid #00ff88}
.badge{padding:3px 8px;border-radius:20px;font-size:11px}.active{background:#00ff8820;color:#00ff88}.blocked{background:#ff444420;color:#ff4444}
.act button{margin:2px;padding:6px 10px;border:0;border-radius:6px;cursor:pointer;font-size:12px}
</style>
</head><body>

<div id="loginBox" class="login">
<h2>🔐 PayQuick Admin</h2>
<input id="pass" type="password" placeholder="Password">
<button class="btn btn-green" onclick="login()">LOGIN</button>
<p id="lerr" style="color:#ff4444"></p>
<small style="color:#888">Pass: PayQuick@123</small>
</div>

<div id="adminBox" class="admin">
<h2 style="color:#00ff88">PayQuick Admin Pro ● <span id="sts">...</span></h2>

<div class="stats">
<div class="stat"><small>Total Users</small><h2 id="tUsers">0</h2></div>
<div class="stat"><small>Total Balance</small><h2 id="tBal">₹0</h2></div>
<div class="stat"><small>Active</small><h2 id="tAct">0</h2></div>
</div>

<div class="card">
<h3>➕ Add Member</h3>
<input id="n" placeholder="Name - ex: nilu">
<input id="m" placeholder="Mobile - ex: 7908824917">
<input id="b" placeholder="Balance - ex: 1000" type="number">
<button class="btn btn-green" onclick="add()">ADD NOW</button>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3>👥 All Users</h3>
<button onclick="exportExcel()" style="background:#fff;color:#000" class="btn">📥 Excel</button>
</div>
<input id="s" placeholder="🔍 Search Name / Mobile" onkeyup="load()">
<div id="list">Loading...</div>
</div>

<button onclick="logout()" style="background:#ff4444;color:#fff;width:100%" class="btn">Logout</button>
</div>

<script>
const ADMIN_PASS="PayQuick@123";
function login(){if(pass.value===ADMIN_PASS){localStorage.setItem('pq_admin','1');show()}else{lerr.innerText='Wrong Password'}}
function logout(){localStorage.removeItem('pq_admin');location.reload()}
function show(){loginBox.style.display='none';adminBox.style.display='block';init()}
if(localStorage.getItem('pq_admin')==='1')show();

var cfg={apiKey:"AIzaSyCZNT1ljpj-IIxDUCEH6AQPJFR22d7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef"};
var db=null, allUsers=[];
function init(){try{firebase.initializeApp(cfg);db=firebase.firestore();sts.innerText='LIVE ✅';load()}catch(e){sts.innerText=e.message}}

async function add(){
 var name=n.value.trim(),mob=m.value.trim(),bal=parseInt(b.value||0);
 if(!name||!mob)return alert('Name Mobile darkar');
 try{await db.collection('users').doc(mob).set({name,mobile:mob,balance:bal,status:'active',createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('✅ Added '+name);n.value='';m.value='';b.value='';load()}catch(e){alert(e.message)}
}

async function load(){
 try{
  var snap=await db.collection('users').get();allUsers=[];snap.forEach(d=>allUsers.push(d.data()));
  var q=s.value.toLowerCase();
  var filtered=allUsers.filter(u=>u.name.toLowerCase().includes(q)||u.mobile.includes(q));
  var totalBal=0,act=0;allUsers.forEach(u=>{totalBal+=(u.balance||0);if(u.status!=='blocked')act++});
  tUsers.innerText=allUsers.length;tBal.innerText='₹'+totalBal;tAct.innerText=act;
  var h='';filtered.forEach(u=>{
   h+=<div class=user><div><b>✅ ${u.name}</b> <span class="badge ${u.status==='blocked'?'blocked':'active'}">${u.status||'active'}</span><br><small>${u.mobile} - ₹${u.balance||0}</small></div><div class=act><button onclick="editBal('${u.mobile}',${u.balance||0})" style="background:#00ff88">✏️</button><button onclick="toggle('${u.mobile}','${u.status}')" style="background:#ffaa00;color:#000">${u.status==='blocked'?'Unblock':'Block'}</button><button onclick="del('${u.mobile}')" style="background:#ff4444;color:#fff">X</button></div></div>;
  });
  list.innerHTML=h||'No Users';
 }catch(e){list.innerText=e.message}
}
async function editBal(mob,cur){var nb=prompt('New Balance for '+mob,cur);if(nb===null)return;try{await db.collection('users').doc(mob).update({balance:parseInt(nb)});load()}catch(e){alert(e.message)}}
async function toggle(mob,st){try{await db.collection('users').doc(mob).update({status:st==='blocked'?'active':'blocked'});load()}catch(e){alert(e.message)}}
async function del(mob){if(!confirm('Delete '+mob+'?'))return;try{await db.collection('users').doc(mob).delete();load()}catch(e){alert(e.message)}}
function exportExcel(){var csv="Name,Mobile,Balance,Status\n";allUsers.forEach(u=>{csv+=${u.name},${u.mobile},${u.balance||0},${u.status||'active'}\n});var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURI(csv);a.download='payquick_users.csv';a.click()}
</script>
</body></html>
