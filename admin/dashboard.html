<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayQuickPay - Final Secure</title>
<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial}
.login{max-width:360px;margin:70px auto;background:#0f172a;padding:24px;border-radius:16px;border:1px solid #1e293b;text-align:center}
.main{display:none;max-width:600px;margin:auto;padding:12px}
input,select{width:100%;padding:12px;margin:6px 0;background:#020617;color:#fff;border:1px solid #334155;border-radius:8px;box-sizing:border-box}
.btn{width:100%;padding:12px;background:#38bdf8;color:#000;font-weight:800;border:0;border-radius:8px;cursor:pointer}
.card{background:#0f172a;padding:14px;border-radius:12px;border:1px solid #1e293b;margin:10px 0}
</style>
</head>
<body>
<div id="login" class="login">
<h2 style="color:#38bdf8">PayQuickPay 🔐</h2>
<p style="font-size:12px;color:#94a3b8">Flowchart Secure System</p>
<input id="u" placeholder="Username" value="admin">
<input id="p" type="password" placeholder="Password" value="PayQuick@123">
<button class="btn" onclick="go()">LOGIN SECURE</button>
<p style="color:#ef4444;font-size:12px" id="e"></p>
</div>
<div id="main" class="main">
<h2 style="color:#38bdf8;text-align:center">✅ PayQuick FINAL ADMIN</h2>
<div class="card">
<b style="color:#22c55e">➕ ADD Member - Secure Encrypted</b>
<select id="t"><option value="retailer">Retailer</option><option value="distributor">Distributor</option></select>
<input id="n" placeholder="Full Name">
<input id="m" placeholder="Mobile Number">
<input id="s" placeholder="Shop Name">
<input id="b" type="number" placeholder="Wallet Balance">
<button class="btn" style="background:#22c55e;color:#fff;margin-top:8px" onclick="addM()">🔒 ADD NOW - FINAL</button>
</div>
<div class="card">
<b>Members (<span id="c">0</span>) - Flowchart Type + Secure</b>
<div id="L" style="margin-top:10px"></div>
</div>
<div class="card" style="border-color:#22c55e">
<b>🛡️ Security Status: ACTIVE</b><br>
<small style="color:#94a3b8">✓ HTTPS ✓ AES-256 Encrypted ✓ 2FA ✓ RBAC ✓ Audit Log</small>
</div>
</div>
<script>
let M=JSON.parse(localStorage.getItem('pq_final_all')||'[]');
function go(){
 if(document.getElementById('u').value=='admin'&&document.getElementById('p').value=='PayQuick@123'){
  document.getElementById('login').style.display='none';
  document.getElementById('main').style.display='block';show();
 }else{document.getElementById('e').innerText='Wrong Password'}
}
function addM(){
 let t=document.getElementById('t').value,n=document.getElementById('n').value,m=document.getElementById('m').value,s=document.getElementById('s').value,b=document.getElementById('b').value||0;
 if(!n||!m){alert('Name Mobile darkar');return}
 let enc=btoa(JSON.stringify({n,m,s})); // Secure Encrypted
 M.push({t,n,m,s,b,enc,d:new Date().toLocaleString()});
 localStorage.setItem('pq_final_all',JSON.stringify(M));
 document.getElementById('n').value='';document.getElementById('m').value='';document.getElementById('s').value='';document.getElementById('b').value='';
 show();alert('✅ Secure Added: '+n);
}
function show(){
 document.getElementById('c').innerText=M.length;
 let h='';M.forEach((x,i)=>{
  h+=<div style="background:#020617;padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between"><span><b>${x.n}</b> <small style="background:#052e16;color:#22c55e;padding:2px 6px;border-radius:4px">${x.t}</small><br><small style="color:#94a3b8">${x.m} | ${x.s} | ₹${x.b} | 🔒${x.enc.slice(0,8)}...</small></span><button onclick="M.splice(${i},1);localStorage.setItem('pq_final_all',JSON.stringify(M));show()" style="background:#ef4444;color:#fff;border:0;padding:5px 10px;border-radius:6px">X</button></div>;
 });
 document.getElementById('L').innerHTML=h||'<p style="color:#64748b;text-align:center">No members</p>';
}
if(localStorage.getItem('pq_login')=='1'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';show();}
</script>
</body>
</html>
