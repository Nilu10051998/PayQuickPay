<!DOCTYPE html>
<html>
<head>
<title>PayQulek Admin</title>
<style>
body{background:#0a0e27; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh;}
.box{background:#1a1f3d; padding:40px; border-radius:15px; width:300px; text-align:center; border:1px solid #2a3a6b;}
input{width:90%; padding:12px; margin:15px 0; border-radius:8px; border:none;}
button{width:100%; padding:12px; background:#00ff88; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
button:hover{background:#00cc6a;}
</style>
</head>
<body>
<div class="box">
<h2>PayQulek Admin</h2>
<input type="password" id="password" placeholder="Enter Password">
<button onclick="login()">LOGIN</button>
<p id="msg" style="color:red; margin-top:10px;"></p>
</div>

<script>
function login(){
  var pass = document.getElementById('password').value;
  if(pass === 'PayQulek@123'){
    window.location.href = 'admin-panel.html';
  } else {
    document.getElementById('msg').innerText = 'Wrong Password!';
  }
}
document.getElementById('password').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){ login(); }
});
</script>
</body>
</html>
