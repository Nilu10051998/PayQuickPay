<!DOCTYPE html><html><body style="background:#020617;color:#fff;font-family:Arial;padding:20px;text-align:center">
<h2 style="color:#38bdf8">PayQuick Final - Direct Entry</h2>
<input id="u" value="admin" style="padding:12px;width:80%"><br><br>
<input id="p" value="PayQuick@123" style="padding:12px;width:80%"><br><br>
<button onclick="check()" style="padding:12px 30px;background:#38bdf8;font-weight:bold;border:0;border-radius:8px">LOGIN</button>
<div id="main" style="display:none;text-align:left;max-width:500px;margin:auto;margin-top:20px;background:#0f172a;padding:15px;border-radius:12px">
<h3>✅ LOGIN SUCCESS - Admin Panel</h3>
<input id="n" placeholder="Name" style="width:100%;padding:10px;margin-top:8px"><input id="m" placeholder="Mobile" style="width:100%;padding:10px;margin-top:8px">
<button onclick="let a=JSON.parse(localStorage.getItem('pq')||'[]');a.push({n:document.getElementById('n').value,m:document.getElementById('m').value});localStorage.setItem('pq',JSON.stringify(a));alert('Added '+document.getElementById('n').value);location.reload()" style="width:100%;padding:12px;background:#22c55e;border:0;border-radius:8px;margin-top:10px;font-weight:bold">ADD MEMBER</button>
<div id="list"></div>
</div>
<script>
function check(){
let u=document.getElementById('u').value.trim();
let p=document.getElementById('p').value.trim();
alert('Trying: '+u+' / '+p);
if(u=='admin' && p=='PayQuick@123'){
document.getElementById('main').style.display='block';
let a=JSON.parse(localStorage.getItem('pq')||'[]');
let h='';a.forEach(x=>{h+='<div style=background:#020617;padding:8px;margin-top:6px;border-radius:6px>'+x.n+' - '+x.m+'</div>'});
document.getElementById('list').innerHTML=h;
}else{alert('Wrong: '+u+' / '+p)}
}
// Auto login if url has ?login
if(location.href.includes('login')){document.getElementById('main').style.display='block'}
</script>
</body></html>
