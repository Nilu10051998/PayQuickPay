<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuick ADMIN - NO LOADING</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#080f25] text-white flex items-center justify-center min-h-screen p-4">

<div id="loginBox" class="bg-[#132150] p-7 rounded-2xl w-full max-w-sm border border-slate-700 text-center">
<h1 class="text-xl font-bold text-sky-400">PayQuick ADMIN</h1>
<p class="text-xs text-emerald-400 mt-2">✅ No Loading - Direct Open</p>

<input id="regMob" type="tel" placeholder="Mobile 10 digit - 7908824917" class="w-full bg-[#080f25] border border-slate-700 p-3 rounded-lg mt-6 outline-none">
<input id="regPass" type="password" placeholder="Create Password" class="w-full bg-[#080f25] border border-slate-700 p-3 rounded-lg mt-3 outline-none">
<button onclick="createAndGo()" class="w-full bg-emerald-500 p-3 rounded-lg mt-4 font-bold">CREATE & ENTER ADMIN</button>

<div class="mt-4 border-t border-slate-700 pt-4">
<p class="text-[11px] text-slate-400">Already Created? Login</p>
<input id="loginPass" type="password" placeholder="Enter Password" class="w-full bg-[#080f25] border border-slate-700 p-3 rounded-lg mt-2 outline-none">
<button onclick="loginGo()" class="w-full bg-blue-600 p-3 rounded-lg mt-2 font-bold">LOGIN</button>
<button onclick="sendOtp()" class="w-full text-emerald-400 text-xs mt-3 underline">Forgot? Send OTP to Mobile</button>
</div>

<p id="msg" class="text-xs mt-3"></p>
</div>

<div id="adminBox" class="hidden fixed inset-0 bg-[#080f25] overflow-auto">
<div class="bg-[#0d1b3a] p-3 flex justify-between sticky top-0"><h1 class="font-bold text-sky-400">ADMIN LIVE</h1><button onclick="logout()" class="bg-red-600 px-4 py-1 rounded text-xs">LOGOUT</button></div>
<div class="p-3 grid grid-cols-2 gap-3">
<div class="bg-[#132150] p-5 rounded-xl text-center"><h2 id="c1" class="text-3xl font-black">0</h2><p class="text-xs">Pending</p></div>
<div class="bg-[#132150] p-5 rounded-xl text-center"><h2 id="c2" class="text-3xl font-black">0</h2><p class="text-xs">Approved</p></div>
</div>
<div class="p-3"><div class="bg-[#132150] p-4 rounded-xl border-2 border-emerald-500/50">
<h3 class="text-emerald-400 font-bold text-sm">ADD MEMBER - FIXED 100%</h3>
<select id="mType" class="w-full bg-[#080f25] border p-3 rounded mt-3"><option value="retailer">Retailer</option><option value="distributor">Distributor</option></select>
<input id="aName" placeholder="Name" class="w-full bg-[#080f25] border p-3 rounded mt-2">
<input id="aMob" placeholder="Mobile" class="w-full bg-[#080f25] border p-3 rounded mt-2">
<input id="aShop" placeholder="Shop" class="w-full bg-[#080f25] border p-3 rounded mt-2">
<button onclick="addNow()" class="w-full bg-emerald-500 p-3 rounded mt-3 font-bold">ADD NOW</button>
</div></div>
<div class="m-3 bg-[#132150] p-4 rounded-xl"><h3 class="font-bold">Pending</h3><div id="pList" class="mt-3"></div></div>
</div>

<script>
function createAndGo(){
 let m=document.getElementById('regMob').value.trim();
 let p=document.getElementById('regPass').value.trim();
 if(m.length!=10){ alert('10 digit mobile'); return; }
 if(p.length<4){ alert('4+ char password'); return; }
 localStorage.setItem('pqp_admin_mob', m);
 localStorage.setItem('pqp_admin_pass', p);
 localStorage.setItem('pqp_admin_login','yes');
 document.getElementById('loginBox').style.display='none';
 document.getElementById('adminBox').classList.remove('hidden');
 refresh();
}
function loginGo(){
 let saved = localStorage.getItem('pqp_admin_pass');
 let inp = document.getElementById('loginPass').value.trim();
 if(inp===saved && saved){
   localStorage.setItem('pqp_admin_login','yes');
   document.getElementById('loginBox').style.display='none';
   document.getElementById('adminBox').classList.remove('hidden');
   refresh();
 } else { alert('Wrong Password! Saved: '+saved); }
}
function logout(){ localStorage.removeItem('pqp_admin_login'); location.reload(); }
async function sendOtp(){
 let mob=localStorage.getItem('pqp_admin_mob');
 if(!mob){ alert('First create!'); return; }
 let otp=Math.floor(100000+Math.random()*900000);
 localStorage.setItem('pqp_otp', otp);
 alert('OTP: '+otp+' for '+mob);
 try{ await fetch(/api/send-otp?mobile=${mob}&otp=${otp}); alert('Real SMS sent to '+mob); } catch(e){}
 let np=prompt('Enter OTP: '+otp+'\nAnd New Password:','');
 if(np){ localStorage.setItem('pqp_admin_pass', np); alert('Reset Done: '+np); }
}
let retailers=JSON.parse(localStorage.getItem('pqp_r')||'[]');
let pending=JSON.parse(localStorage.getItem('pqp_p')||'[]');
function refresh(){
 document.getElementById('c1').innerText=pending.length;
 document.getElementById('c2').innerText=retailers.length;
 let h=''; pending.forEach((p,i)=>{ h+=<div class="flex justify-between bg-[#080f25] p-2 rounded mt-2 text-sm"><span>${p.name} - ${p.mobile}</span><button onclick="approve(${i})" class="bg-emerald-500 px-2 rounded text-xs">Approve</button></div>; });
 document.getElementById('pList').innerHTML=h||'No pending';
}
function addNow(){
 let t=document.getElementById('mType').value, n=document.getElementById('aName').value, m=document.getElementById('aMob').value, s=document.getElementById('aShop').value;
 if(!n||!m){ alert('Name Mobile!'); return; }
 pending.push({type:t,name:n,mobile:m,shop:s});
 localStorage.setItem('pqp_p',JSON.stringify(pending));
 document.getElementById('aName').value=''; document.getElementById('aMob').value=''; document.getElementById('aShop').value='';
 refresh(); alert('Added!');
}
function approve(i){ let p=pending.splice(i,1)[0]; retailers.push(p); localStorage.setItem('pqp_p',JSON.stringify(pending)); localStorage.setItem('pqp_r',JSON.stringify(retailers)); refresh(); }
if(localStorage.getItem('pqp_admin_login')==='yes'){ document.getElementById('loginBox').style.display='none'; document.getElementById('adminBox').classList.remove('hidden'); refresh(); }
</script>
</body>
</html>
