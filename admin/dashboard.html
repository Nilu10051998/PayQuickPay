<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - PayQuickPay</title>
<script>
// ===== ADMIN LOGIN CHECK =====
if(localStorage.getItem("payquick_admin") !== "logged_in"){
  let p = prompt("🔐 ADMIN PASSWORD:");
  if(p !== "Admin@123"){
    alert("❌ Wrong Password! Redirecting...");
    window.location.href = "/";
  } else {
    localStorage.setItem("payquick_admin","logged_in");
  }
}
</script>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;margin:0;padding:15px}
.header{background:#1e293b;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h2{margin:0;color:#38bdf8}
.logout{background:#ef4444;color:white;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
.card{background:#1e293b;padding:20px;border-radius:12px;margin:10px 0}
.btn{padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
.blue{background:#38bdf8}.yellow{background:#fbbf24}.green{background:#34d399}
input{padding:10px;border-radius:8px;border:none;width:100%;margin:5px 0;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #334155}
th{color:#38bdf8}
</style>
</head>
<body>

<div class="header">
<h2>🔐 ADMIN PANEL</h2>
<button class="logout" onclick="localStorage.removeItem('payquick_admin');location.href='/'">Logout</button>
</div>

<div class="card">
<h3>📊 Dashboard Overview</h3>
<p>Total Distributors: <b id="distCount">0</b> | Total Retailers: <b id="retCount">0</b></p>
<button class="btn blue" onclick="location.href='/'">🏠 Home</button>
<button class="btn yellow" onclick="location.href='/distributor/'">Distributor View</button>
<button class="btn green" onclick="location.href='/retailer/'">Retailer View</button>
</div>

<div class="card">
<h3>➕ Add Distributor / Retailer</h3>
<input id="name" placeholder="Name">
<input id="mobile" placeholder="Mobile Number">
<input id="type" placeholder="Type: distributor / retailer">
<button class="btn blue" onclick="addUser()">Add User</button>
</div>

<div class="card">
<h3>👥 All Users</h3>
<table>
<thead><tr><th>Name</th><th>Mobile</th><th>Type</th><th>Action</th></tr></thead>
<tbody id="userTable"></tbody>
</table>
</div>

<script>
function loadUsers(){
  let users = JSON.parse(localStorage.getItem("payquick_users") || "[]");
  document.getElementById("distCount").innerText = users.filter(u=>u.type=="distributor").length;
  document.getElementById("retCount").innerText = users.filter(u=>u.type=="retailer").length;
  let html="";
  users.forEach((u,i)=>{
    html+=<tr><td>${u.name}</td><td>${u.mobile}</td><td>${u.type}</td><td><button onclick="delUser(${i})" style="background:red;color:white;border:none;padding:5px 10px;border-radius:5px">Delete</button></td></tr>;
  });
  document.getElementById("userTable").innerHTML = html || "<tr><td colspan=4>No users yet</td></tr>";
}
function addUser(){
  let n=document.getElementById("name").value;
  let m=document.getElementById("mobile").value;
  let t=document.getElementById("type").value.toLowerCase();
  if(!n||!m||!t){alert("Fill all fields");return;}
  let users = JSON.parse(localStorage.getItem("payquick_users") || "[]");
  users.push({name:n,mobile:m,type:t});
  localStorage.setItem("payquick_users",JSON.stringify(users));
  alert("Added!");loadUsers();
}
function delUser(i){
  let users = JSON.parse(localStorage.getItem("payquick_users") || "[]");
  users.splice(i,1);
  localStorage.setItem("payquick_users",JSON.stringify(users));
  loadUsers();
}
loadUsers();
</script>

</body>
</html>
