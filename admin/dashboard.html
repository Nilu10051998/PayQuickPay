<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayQuick FINAL</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><style>body{background:#060a19;color:#fff;font-family:Arial;padding:20px}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#111;color:#fff}.btn{width:100%;padding:12px;background:#00ff88;color:#000;font-weight:800;border:none;border-radius:10px}</style></head><body><h2 style="color:#00ff88">PayQuick REAL ADMIN ● LIVE</h2><div id="sts" style="color:#fbbf24">Connecting...</div><div id="err" style="color:red;font-size:12px;margin:10px 0"></div><input id="aName" placeholder="Name"><input id="aMobile" placeholder="Mobile"><input id="aBal" placeholder="Balance" type="number"><button class="btn" onclick="add()">ADD TO FIREBASE</button><div id="list"></div><script>
var cfg={apiKey:"AIzaSyCZNT1ljpj-IIxDUCEH6AQPJFR22d7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef"};
window.onerror=function(m){document.getElementById('err').innerText=m;document.getElementById('sts').innerText='❌ '+m}
try{if(typeof firebase=='undefined')throw new Error('Firebase script NOT loaded - Check Internet/AdBlock');firebase.initializeApp(cfg);var db=firebase.firestore();document.getElementById('sts').innerText='✅ LIVE Connected - Ready!';}catch(e){document.getElementById('err').innerText=e.message;document.getElementById('sts').innerText='❌ '+e.message}
async function add(){var n=document.getElementById('aName').value,m=document.getElementById('aMobile').value,b=parseInt(document.getElementById('aBal').value||0);if(!n||!m){alert('Name Mobile darkar');return}try{await db.collection('users').doc(m).set({name:n,mobile:m,balance:b,status:'active',createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('✅ ADDED '+n);document.getElementById('list').innerHTML+='<div>✅ '+n+'-'+m+'-₹'+b+'</div>'}catch(e){alert(e.message);document.getElementById('err').innerText=e.message}}
</script></body></html>
