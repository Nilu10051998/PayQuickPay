<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayQuick Admin</title></head>
<body style="margin:0;background:#020617;color:#fff;font-family:Arial;padding:12px">
<div style="max-width:400px;margin:auto">
<h2 style="color:#38bdf8;text-align:center">PayQuick SUPER ADMIN ✅ FIXED</h2>
<div style="background:#0f172a;padding:14px;border-radius:12px;border:1px solid #334155;margin-top:12px">
<b style="color:#22c55e">➕ ADD Retailer / Distributor</b><br>
<select id="t" style="width:100%;padding:12px;margin-top:10px;background:#020617;color:#fff;border:1px solid #444;border-radius:8px"><option value="retailer">Retailer</option><option value="distributor">Distributor</option></select>
<input id="n" placeholder="Name" style="width:100%;padding:12px;margin-top:8px;background:#020617;color:#fff;border:1px solid #444;border-radius:8px">
<input id="m" placeholder="Mobile" style="width:100%;padding:12px;margin-top:8px;background:#020617;color:#fff;border:1px solid #444;border-radius:8px">
<input id="s" placeholder="Shop" style="width:100%;padding:12px;margin-top:8px;background:#020617;color:#fff;border:1px solid #444;border-radius:8px">
<button onclick="add()" style="width:100%;padding:13px;margin-top:12px;background:#22c55e;color:#fff;border:0;border-radius:8px;font-weight:bold">ADD NOW</button>
</div>
<div style="background:#0f172a;padding:14px;border-radius:12px;margin-top:12px">
<b>All Members: <span id="c">0</span></b><div id="L" style="margin-top:10px"></div>
</div>
</div>
<script>
var a=JSON.parse(localStorage.getItem('pq')||'[]');
function add(){
var t=document.getElementById('t').value,n=document.getElementById('n').value,m=document.getElementById('m').value,s=document.getElementById('s').value;
if(!n||!m){alert('Name Mobile darkar');return}
a.push({t:t,n:n,m:m,s:s});localStorage.setItem('pq',JSON.stringify(a));
document.getElementById('n').value='';document.getElementById('m').value='';document.getElementById('s').value='';
show();alert('Added '+n)
}
function show(){
document.getElementById('c').innerText=a.length;
var h='';for(var i=0;i<a.length;i++){h+='<div style="background:#020617;padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between"><span><b>'+a[i].n+'</b> - '+a[i].m+'<br><small style="color:#94a3b8">'+a[i].t+' | '+a[i].s+'</small></span><button onclick="a.splice('+i+',1);localStorage.setItem(\'pq\',JSON.stringify(a));show()" style="background:red;color:#fff;border:0;padding:6px 10px;border-radius:6px">X</button></div>'}
document.getElementById('L').innerHTML=h||'<p style="color:#64748b;text-align:center">No data</p>';
}
show();
</script>
</body></html>
