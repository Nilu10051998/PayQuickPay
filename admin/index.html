<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - PayQuickPay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#020617;color:#fff;padding:12px}
.header{background:#0f172a;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border:1px solid #1e293b}
.box{background:#1e293b;padding:16px;border-radius:16px;margin-bottom:12px;border:1px solid #334155}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#0f172a;color:#fff}
.btn{width:100%;padding:12px;background:#f59e0b;color:#000;font-weight:900;border:none;border-radius:10px;margin-top:8px;cursor:pointer}
.list-item{background:#0f172a;padding:12px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#0f172a;padding:12px;border-radius:12px;border:1px solid #1e293b;text-align:center}
.stat b{font-size:22px;color:#f59e0b;display:block}
</style>
</head>
<body>
<script>
// LOGIN CHECK - Jodi login heini ta login page ku pathaiba
if(localStorage.getItem('admin_login')!='true'){
location.href='/PayQuickPay/admin/login.html';
}
function adminLogout(){
if(confirm('Logout kariba?')){
localStorage.removeItem('admin_login');
location.href='/PayQuickPay/admin/login.html';
}
}
</script>

<div class="header">
<div><b>PayQuickPay</b> <small style="color:#f59e0b">ADMIN</small></div>
<button onclick="adminLogout()" style="background:#ef4444;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-weight:700;cursor:pointer">LOGOUT</button>
</div>

<div class="stat-grid">
<div class="stat"><small>Distributors</small><b id="s_dist">0</b></div>
<div class="stat"><small>Retailers</small><b id="s_ret">0</b></div>
<div class="stat"><small>Today Business</small><b style="color:#22c55e">₹<span id="s_biz">0</span></b></div>
<div class="stat"><small>Today Profit</small><b style="color:#22c55e">₹<span id="s_profit">0</span></b></div>
</div>

<div class="box" style="border-color:#f59e0b">
<h3>💰 COMMISSION SETTINGS</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<div><small>Mobile Recharge %</small><input id="c_mobile" type="number" value="2"></div>
<div><small>DTH Recharge %</small><input id="c_dth" type="number" value="3"></div>
<div><small>Electricity %</small><input id="c_elec" type="number" value="1.5"></div>
<div><small>AePS %</small><input id="c_aeps" type="number" value="5"></div>
</div>
<button class="btn" onclick="saveComm()">SAVE COMMISSION</button>
</div>

<div class="box" style="border-color:#22c55e">
<h3>👥 ADD DISTRIBUTOR</h3>
<input id="d_name" placeholder="Distributor Name - Ex: Ramesh">
<input id="d_mobile" placeholder="Mobile No (Login ID) - Ex: 8018146505">
<input id="d_pass" placeholder="Password - Ex: 1234">
<button class="btn" style="background:#22c55e" onclick="addDist()">+ ADD DISTRIBUTOR</button>
</div>

<div class="box">
<h3>📋 ALL DISTRIBUTORS (<span id="count">0</span>)</h3>
<div id="distList" style="margin-top:10px"></div>
</div>

<script>
function saveComm(){
localStorage.setItem('comm_mobile', document.getElementById('c_mobile').value);
localStorage.setItem('comm_dth', document.getElementById('c_dth').value);
localStorage.setItem('comm_elec', document.getElementById('c_elec').value);
localStorage.setItem('comm_aeps', document.getElementById('c_aeps').value);
alert('Commission Saved! ✅');
}
function addDist(){
let name=document.getElementById('d_name').value.trim();
let mob=document.getElementById('d_mobile').value.trim();
let pass=document.getElementById('d_pass').value.trim();
if(!mob||!pass){alert('Mobile & Password darkar');return;}
let list=JSON.parse(localStorage.getItem('distributors')||'[]');
if(list.find(x=>x.mobile==mob)){alert('Already achi!');return;}
list.push({id:mob,mobile:mob,password:pass,name:name||'Distributor',wallet:0,created:new Date().toLocaleDateString()});
localStorage.setItem('distributors',JSON.stringify(list));
alert('Distributor '+mob+' Added ✅');
document.getElementById('d_name').value='';document.getElementById('d_mobile').value='';document.getElementById('d_pass').value='';
showList();
}
function showList(){
let list=JSON.parse(localStorage.getItem('distributors')||'[]');
let retailers=JSON.parse(localStorage.getItem('retailers')||'[]');
document.getElementById('count').innerText=list.length;
document.getElementById('s_dist').innerText=list.length;
document.getElementById('s_ret').innerText=retailers.length;
let html='';
list.forEach((d,i)=>{
html+=<div class="list-item"><div><b>${d.name}</b><br><small style="color:#94a3b8">${d.mobile} | Pass: ${d.password} | Wallet: ₹${d.wallet||0}</small></div><button onclick="delDist(${i})" style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer">Delete</button></div>;
});
document.getElementById('distList').innerHTML= html || '<small style=color:#64748b>No Distributor Added Yet</small>';
}
function delDist(i){
if(confirm('Delete kariba?')){
let list=JSON.parse(localStorage.getItem('distributors')||'[]');
list.splice(i,1);
localStorage.setItem('distributors',JSON.stringify(list));
showList();
}
}
// Load comm
document.getElementById('c_mobile').value=localStorage.getItem('comm_mobile')||2;
document.getElementById('c_dth').value=localStorage.getItem('comm_dth')||3;
document.getElementById('c_elec').value=localStorage.getItem('comm_elec')||1.5;
document.getElementById('c_aeps').value=localStorage.getItem('comm_aeps')||5;
showList();
</script>
</body>
</html>
