<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - PayQuickPay</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}body{background:#f0f2f5}
.top{background:#111827;color:#fff;padding:16px 20px;display:flex;justify-content:space-between}.top b{font-size:20px}.top button{background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer}
.wrap{max-width:1000px;margin:20px auto;padding:0 15px}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}@media(max-width:700px){.cards{grid-template-columns:1fr}}
.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.06)}.card small{color:#888}.card h2{margin-top:5px}
.box{background:#fff;padding:18px;border-radius:14px;margin-top:16px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.box h3{margin-bottom:12px}.box input{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin-bottom:10px;outline:none}
.box button{background:#4f46e5;color:#fff;border:none;padding:12px;border-radius:9px;width:100%;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:11px;text-align:left;border-bottom:1px solid #eee;font-size:14px}th{background:#f9fafb}
.del{background:#fee2e2;color:#dc2626;border:none;padding:6px 10px;border-radius:7px;cursor:pointer}.add{background:#dcfce7;color:#059669;border:none;padding:6px 10px;border-radius:7px;cursor:pointer}
</style></head>
<body>
<div class="top"><b>👑 PayQuickPay - Admin</b><button onclick="location.href='/'">Logout</button></div>
<div class="wrap">
<div class="cards">
<div class="card"><small>Total Distributor</small><h2 id="c1">0</h2></div>
<div class="card"><small>Total Retailer</small><h2 id="c2">0</h2></div>
<div class="card"><small>Wallet Balance</small><h2>₹ 962.30</h2></div>
</div>

<div class="box"><h3>➕ New Distributor Add Kara</h3>
<input id="d-name" placeholder="Distributor Name - Ex: D2">
<input id="d-user" placeholder="Username - Ex: d2">
<input id="d-pass" placeholder="Password - Ex: 12345">
<input id="d-bal" type="number" placeholder="Opening Balance - Ex: 1000">
<button onclick="addD()">Distributor Add Kara →</button></div>

<div class="box"><h3>📋 Distributor List</h3>
<table><thead><tr><th>Name</th><th>Username</th><th>Password</th><th>Balance</th><th>Action</th></tr></thead><tbody id="list"></tbody></table>
<div id="empty" style="text-align:center;color:#999;padding:15px">No Distributor Yet</div>
</div>
</div>

<script>
let dist = JSON.parse(localStorage.getItem('distributors')||'[]');
let rets = JSON.parse(localStorage.getItem('retailers')||'[]');
function save(){localStorage.setItem('distributors',JSON.stringify(dist)); render();}
function addD(){
 let n=document.getElementById('d-name').value, u=document.getElementById('d-user').value, p=document.getElementById('d-pass').value, b=document.getElementById('d-bal').value||0;
 if(!n||!u||!p) return alert('Sabu Bhara Bhai');
 dist.push({name:n,user:u,pass:p,balance:Number(b)});
 save(); document.getElementById('d-name').value='';document.getElementById('d-user').value='';document.getElementById('d-pass').value='';document.getElementById('d-bal').value='';
 alert('Distributor Add Heigala Bhai!');
}
function render(){
 document.getElementById('c1').innerText=dist.length;
 document.getElementById('c2').innerText=rets.length;
 let h=''; dist.forEach((d,i)=>{ h+=`<tr><td><b>${d.name}</b></td><td>${d.user}</td><td>${d.pass}</td><td>₹ ${d.balance}</td><td><button class="add" onclick="addBal(${i})">+ Balance</button> <button class="del" onclick="delD(${i})">Delete</button></td></tr>`});
 document.getElementById('list').innerHTML=h;
 document.getElementById('empty').style.display=dist.length?'none':'block';
}
function delD(i){ if(confirm('Delete Kariba?')){dist.splice(i,1); save();} }
function addBal(i){ let a=prompt('Kete Balance Deba?'); if(a){dist[i].balance+=Number(a); save();} }
render();
</script></body></html>
