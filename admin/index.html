<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - PayQuickPay</title>
<style>*{font-family:sans-serif;box-sizing:border-box}body{margin:0;background:#020617;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:#0f172a;border:2px solid #22c55e;padding:30px;border-radius:20px;width:92%;max-width:380px;text-align:center;box-shadow:0 0 30px #22c55e33}
input{width:100%;padding:13px;margin:9px 0;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff}
button{width:100%;padding:13px;background:#22c55e;color:#000;border:0;border-radius:10px;font-weight:900;cursor:pointer;font-size:16px}
</style></head><body><div class="box">
<h2 style="color:#22c55e">🔐 Admin Panel</h2>
<p style="color:#86efac;font-size:13px">Full Control - PayQuickPay</p>
<input id="m" placeholder="Admin ID">
<input id="p" type="password" placeholder="Admin Password">
<button onclick="login()">ADMIN LOGIN</button>
<a href="/" style="display:block;margin-top:16px;color:#94a3b8;font-size:12px;text-decoration:none">← Back to Home</a>
</div>
<script>
function login(){
let u=document.getElementById('m').value;
let p=document.getElementById('p').value;
if(!u||!p){alert('Admin ID Password dia');return;}
document.body.innerHTML='<div style="display:flex;justify-content:center;align-items:center;min-height:100vh;background:#020617;color:#fff;flex-direction:column;text-align:center;padding:20px"><h1 style="color:#22c55e">Welcome Admin '+u+'! 👑</h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;width:100%;max-width:400px"><div style="background:#0f172a;padding:16px;border-radius:12px;border:1px solid #334155">Total Retailer<br><b style="font-size:24px">1,248</b></div><div style="background:#0f172a;padding:16px;border-radius:12px;border:1px solid #334155">Today Business<br><b style="font-size:24px">₹2.4L</b></div><div style="background:#0f172a;padding:16px;border-radius:12px;border:1px solid #334155">Total Distributor<br><b style="font-size:24px">86</b></div><div style="background:#0f172a;padding:16px;border-radius:12px;border:1px solid #334155">Commission<br><b style="font-size:24px">₹18k</b></div></div><a href="/" style="color:#22c55e">← Home</a></div>';
}
</script></body></html>
