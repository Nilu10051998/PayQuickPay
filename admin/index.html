rying: '+uv+' / '+pv);if(uv==='admin'&&pv==='admin123'){localStorage.setItem('k','yes');showAdmin();}else{EB.innerText='❌ Wrong! You typed: '+uv+' / '+pv+' - Need admin / admin123';}}BTN.onclick=doLogin;UB.onkeydown=function(e){if(e.key==='Enter')doLogin();};PB.onkeydown=function(e){if(e.key==='Enter')doLogin();};if(localStorage.getItem('k')==='yes'){showAdmin();}</script></body></html>
