<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PayQuickPay Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,Arial}body{background:#f8fafc;color:#0f172a}.top{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.top b{font-size:18px;letter-spacing:.5px}.top button{background:#0f172a;color:#fff;border:none;padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer}.wrap{max-width:1024px;margin:0 auto;padding:20px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:18px}.stat small{color:#64748b;font-size:11px;letter-spacing:.8px;font-weight:700}.stat b{font-size:22px;display:block;margin-top:6px}.tabs{display:flex;gap:8px;margin:20px 0}.tab{background:#fff;border:1px solid #e2e8f0;padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}.tab.active{background:#0f172a;color:#fff;border-color:#0f172a}.card{background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:20px;margin-bottom:14px}.card h3{font-size:16px;margin-bottom:14px}.card input,.card select{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;outline:none;font-size:14px}.card input:focus{border-color:#0f172a}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#0f172a;color:#fff;border:none;padding:13px;border-radius:12px;width:100%;font-weight:700;cursor:pointer}.btn2{background:#f1f5f9;border:none;padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px}table{width:100%;border-collapse:collapse}th{color:#64748b;font-size:11px;letter-spacing:.6px;text-align:left;padding:10px}td{padding:12px 10px;border-top:1px solid #f8fafc;font-size:14px}.hide{display:none}.empty{padding:20px;text-align:center;color:#94a3b8;font-size:14px}.badge{background:#ecfdf5;color:#059669;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}.badgeP{background:#fef3c7;color:#92400e;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}table{font-size:13px}}</style></head>
<body><div class="top"><div><b>PayQuickPay</b> <span style="color:#64748b;font-size:13px">Admin Console</span></div><button onclick="location.href='/'">Logout</button></div>
<div class="wrap"><div class="stats"><div class="stat"><small>DISTRIBUTORS</small><b id="dCount">0</b></div><div class="stat"><small>RETAILERS</small><b id="rCount">0</b></div><div class="stat"><small>TOTAL SALE</small><b id="tSale">₹0</b></div><div class="stat"><small>COMMISSION</small><b id="tComm">₹0</b></div></div>
<div class="tabs"><div class="tab active" onclick="showTab('dist',this)">Distributors</div><div class="tab" onclick="showTab('ret',this)">Retailers</div><div class="tab" onclick="showTab('req',this)">Requests</div><div class="tab" onclick="showTab('his',this)">Transactions</div></div>
<div id="distTab"><div class="card"><h3>Add Distributor</h3><div class="grid2"><input id="d-name" placeholder="Full Name"><input id="d-user" placeholder="Username"><input id="d-pass" type="password" placeholder="Password"><input id="d-phone" placeholder="Mobile Number"></div><input id="d-bal" type="number" placeholder="Opening Balance ₹"><button class="btn" onclick="addDist()">Create Distributor</button></div><div class="card"><h3>Distributors</h3><div id="distList"><div class="empty">No distributors yet</div></div></div></div>
<div id="retTab" class="hide"><div class="card"><h3>Add Retailer</h3><div class="grid2"><input id="r-name" placeholder="Full Name"><input id="r-user" placeholder="Username"><input id="r-pass" type="password" placeholder="Password"><input id="r-phone" placeholder="Mobile Number"></div><select id="r-dist"><option value="">Direct - Under Admin</option></select><input id="r-bal" type="number" placeholder="Opening Balance ₹"><button class="btn" onclick="addRet()">Create Retailer</button></div><div class="card"><h3>Retailers</h3><div id="retList"><div class="empty">No retailers yet</div></div></div></div>
<div id="reqTab" class="hide"><div class="card"><h3>Balance Requests</h3><div id="reqList"><div class="empty">No requests</div></div></div></div>
<div id="hisTab" class="hide"><div class="card"><h3>Transactions</h3><div id="hist"><div class="empty">No transactions yet</div></div></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:03dcbc47e46568d51b58ee"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let dists=[],rets=[];
const safe=v=>{if(v===undefined||v===null||v==='undefined'||v==='')return '—';return v};
const money=v=>'₹'+(Number(v||0)).toFixed(2);
function showTab(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['dist','ret','req','his'].forEach(x=>document.getElementById(x+'Tab').classList.add('hide'));document.getElementById(id+'Tab').classList.remove('hide');}
db.collection('distributors').onSnapshot(s=>{dists=[];s.forEach(d=>{let o=d.data();o._id=d.id;dists.push(o)});document.getElementById('dCount').innerText=dists.length;document.getElementById('distList').innerHTML=dists.length?dists.map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #f8fafc"><div><b>${safe(d.name)}</b><div style="color:#64748b;font-size:13px">${safe(d.phone)} • @${safe(d.user)}</div></div><div style="text-align:right"><b>${money(d.balance)}</b><div style="color:#059669;font-size:12px">Comm ${money(d.earnedCommission)}</div></div><button class="btn2" onclick="addBalDist('${d._id}',${Number(d.balance||0)})">+ Add Balance</button></div>`).join(''):'<div class="empty">No distributors yet</div>';document.getElementById('r-dist').innerHTML='<option value="">Direct - Under Admin</option>'+dists.map(d=>`<option value="${d._id}|${d.user||''}|${d.name||''}">${safe(d.name)} (@${safe(d.user)})</option>`).join('');});
db.collection('retailers').onSnapshot(s=>{rets=[];s.forEach(d=>{let o=d.data();o._id=d.id;rets.push(o)});document.getElementById('rCount').innerText=rets.length;document.getElementById('retList').innerHTML=rets.length?rets.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #f8fafc"><div><b>${safe(r.name)}</b><div style="color:#64748b;font-size:13px">${safe(r.phone)} • @${safe(r.user)} • ${r.distributorName?safe(r.distributorName):'Admin'}</div></div><div style="text-align:right"><b>${money(r.balance)}</b><div style="color:#059669;font-size:12px">Comm ${money(r.earnedCommission)}</div></div><button class="btn2" onclick="addBalRet('${r._id}',${Number(r.balance||0)})">+ Add Balance</button></div>`).join(''):'<div class="empty">No retailers yet</div>';});
db.collection('transactions').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{let tot=0,comm=0,h='';s.forEach(d=>{let t=d.data();tot+=Number(t.amount||0);comm+=Number(t.distributorCommission||0)+Number(t.retailerCommission||0);h+=`<div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #f8fafc;font-size:14px"><div><b>${safe(t.type)}</b><div style="color:#64748b;font-size:12px">${safe(t.retailerName)||safe(t.distributorName)} ${t.number? '• '+t.number:''}</div></div><b>${money(t.amount)}</b></div>`});document.getElementById('tSale').innerText=money(tot);document.getElementById('tComm').innerText=money(comm);if(h)document.getElementById('hist').innerHTML=h;});
db.collection('balanceRequests').orderBy('createdAt','desc').limit(50).onSnapshot(s=>{let h='';s.forEach(d=>{let t=d.data();h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #f8fafc"><div><b>${money(t.amount)}</b><div style="color:#64748b;font-size:12px">${safe(t.distributorName)||safe(t.retailerName)||safe(t.distributorUser)} • ${safe(t.from)}</div></div><span>${t.status=='Pending'?`<span class="badgeP">Pending</span> <button class="btn2" onclick="approveReq('${d.id}','${t.from}','${t.distributorId||''}','${t.retailerId||''}',${Number(t.amount||0)})">Approve</button>`:`<span class="badge">${safe(t.status)}</span>`}</span></div>`});if(h)document.getElementById('reqList').innerHTML=h;});
async function addDist(){let n=document.getElementById('d-name').value.trim(),u=document.getElementById('d-user').value.trim(),p=document.getElementById('d-pass').value.trim(),ph=document.getElementById('d-phone').value.trim(),b=Number(document.getElementById('d-bal').value||0);if(!n||!u||!p)return alert('Please fill name, username and password');await db.collection('distributors').add({name:n,user:u,username:u,pass:p,password:p,phone:ph,mobile:ph,balance:b,wallet:b,earnedCommission:0,totalSale:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Distributor created');document.querySelectorAll('#distTab input').forEach(i=>i.value='');}
async function addRet(){let n=document.getElementById('r-name').value.trim(),u=document.getElementById('r-user').value.trim(),p=document.getElementById('r-pass').value.trim(),ph=document.getElementById('r-phone').value.trim(),b=Number(document.getElementById('r-bal').value||0);if(!n||!u||!p)return alert('Please fill name, username and password');let sel=document.getElementById('r-dist').value;let dId='',dUser='',dName='';if(sel){let a=sel.split('|');dId=a[0];dUser=a[1];dName=a[2];}await db.collection('retailers').add({name:n,user:u,username:u,pass:p,password:p,phone:ph,mobile:ph,balance:b,wallet:b,earnedCommission:0,totalSale:0,distributorId:dId,distributorUser:dUser,distributorName:dName,createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Retailer created');document.querySelectorAll('#retTab input').forEach(i=>i.value='');}
async function addBalDist(id,old){let amt=Number(prompt('Add balance amount','1000'));if(!amt)return;await db.collection('distributors').doc(id).update({balance:old+amt,wallet:old+amt});await db.collection('transactions').add({type:'Admin To Distributor',amount:amt,distributorId:id,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
async function addBalRet(id,old){let amt=Number(prompt('Add balance amount','500'));if(!amt)return;await db.collection('retailers').doc(id).update({balance:old+amt,wallet:old+amt});await db.collection('transactions').add({type:'Admin To Retailer',amount:amt,retailerId:id,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
async function approveReq(id,from,distId,retId,amt){await db.collection('balanceRequests').doc(id).update({status:'Approved'});if(from=='distributor'&&distId)await db.collection('distributors').doc(distId).update({balance:firebase.firestore.FieldValue.increment(amt),wallet:firebase.firestore.FieldValue.increment(amt)});if(from=='retailer'&&retId)await db.collection('retailers').doc(retId).update({balance:firebase.firestore.FieldValue.increment(amt),wallet:firebase.firestore.FieldValue.increment(amt)});alert('Approved');}
window.showTab=showTab;window.addDist=addDist;window.addRet=addRet;window.addBalDist=addBalDist;window.addBalRet=addBalRet;window.approveReq=approveReq;
</script></body></html>
