<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ADMIN FIXED</title>
<style>body{background:#020617;color:#fff;padding:20px;font-family:Arial}input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;box-sizing:border-box}button{background:#22c55e;font-weight:900}</style>
</head><body>
<h3>CREATE PUJA</h3>
<input id="uid" value="puja">
<input id="pwd" value="12345">
<input id="nm" value="puja">
<button onclick="createUser()">CREATE</button>
<div id="msg"></div>
<div id="list" style="margin-top:20px;background:#1e293b;padding:10px;border-radius:10px"></div>
<button onclick="load()" style="background:#334155;color:#fff">Refresh</button>
<script>
var API="https://mojdysebckbodadjctj.supabase.co/rest/v1/distributors";
var KEY="sb_publishable_D35DfvBe5XtgITTnKLWSwg_R0Qqsday";
function load(){
 document.getElementById("list").innerHTML="Loading...";
 fetch(API+"?select=*",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}})
 .then(function(r){return r.text();})
 .then(function(t){document.getElementById("list").innerText=t;})
 .catch(function(e){document.getElementById("list").innerText="Error: "+e.message;});
}
function createUser(){
 var u=document.getElementById("uid").value;
 var p=document.getElementById("pwd").value;
 var n=document.getElementById("nm").value;
 document.getElementById("msg").innerText="Creating...";
 fetch(API,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({user_id:u,password:p,name:n,wallet_balance:500})})
 .then(function(r){return r.text().then(function(t){return r.status+" "+t;});})
 .then(function(x){document.getElementById("msg").innerText=x;load();})
 .catch(function(e){document.getElementById("msg").innerText=e.message;});
}
load();
</script></body></html>
