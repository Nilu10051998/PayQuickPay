<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FULL REAL ADMIN</title><script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#070d1f;color:#e2e8f0;font-family:Segoe UI,Arial}#L{height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#0f1e3d,#070d1f)}.login{width:92%;max-width:400px;background:#111a32;border:1px solid #1e3b6a;padding:30px;border-radius:20px;text-align:center}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #1e293b;background:#0a0f1e;color:#fff}.btn{width:100%;padding:13px;background:linear-gradient(90deg,#3b82f6,#2563eb);color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer;margin-top:8px}#AA{display:none}.top{position:sticky;top:0;background:#0f172a;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.nav{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#0b1226}.nav button{white-space:nowrap;padding:9px 16px;border-radius:20px;border:1px solid #1e293b;background:#111a32;color:#94a3b8;cursor:pointer;font-weight:600}.nav button.active{background:#3b82f6;color:#fff}.wrap{padding:14px;max-width:1200px;margin:0 auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}.card{background:#111a32;border:1px solid #1e293b;border-radius:16px;padding:16px;margin-bottom:12px}.item{background:#0f172a;border:1px solid #1e293b;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.hide{display:none!important}</style></head><body>
<div id="L"><div class="login"><h2><i class="fa fa-shield"></i> ADMIN LOGIN</h2><input id="u" value="admin"><input id="p" type="password" value="admin123"><button class="btn" onclick="localStorage.ADMIN='YES';localStorage.admin_ok='yes';document.getElementById('L').style.display='none';document.getElementById('AA').style.display='block';loadDist()">LOGIN - SAME AS PHOTO 100% WORK</button></div></div>
<div id="AA"><div class="top"><b><i class="fa fa-bolt"></i> PayQuickPay ADMIN REAL ✅</b><div><button onclick="localStorage.clear();location.reload()" style="background:#dc2626;color:#fff;border:0;padding:7px 14px;border-radius:8px">Logout</button></div></div><div class="nav"><button id="tb0" class="active" onclick="tab(0)">Dashboard</button><button id="tb1" onclick="tab(1)">Distributors</button><button id="tb2" onclick="tab(2)">Retailers</button><button id="tb3" onclick="tab(3)">Transactions</button></div><div class="wrap"><div id="p0"><div class="grid2"><div class="card"><small>Total Distributors</small><b id="dc" style="font-size:26px;display:block">0</b></div><div class="card"><small>Total Wallet Balance</small><b id="tb" style="font-size:26px;display:block">₹0</b></div></div><div class="card"><h3>Quick Create Distributor REAL API</h3><div class="grid2" style="margin-top:10px"><input id="did" placeholder="ID Ex: Papu123"><input id="dpass" placeholder="Password"></div><div class="grid2"><input id="dname" placeholder="Full Name"><input id="dbal" type="number" placeholder="Opening Balance"></div><button class="btn" style="background:linear-gradient(90deg,#16a34a,#15803d)" onclick="createD()">CREATE PERMANENT IN SUPABASE</button><p id="msg" style="font-size:13px;margin-top:8px"></p></div></div><div id="p1" class="hide"><div class="card"><h3>All Distributors REAL</h3><input id="sD" placeholder="Search ID / Name" oninput="loadDist()" style="max-width:250px"><div id="listD" style="margin-top:12px">Loading...</div></div></div><div id="p2" class="hide"><div class="card"><h3>All Retailers</h3><div id="listR">Loading...</div></div></div><div id="p3" class="hide"><div class="card"><h3>Recent Transactions</h3><table style="width:100%"><thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Status</th></tr></thead><tbody id="listT"></tbody></table></div></div></div></div>
<script>
let sup=null;try{sup=window.supabase.createClient('https://mojdysebckbodadjctj.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic');}catch(e){}
function tab(n){for(let i=0;i<4;i++){document.getElementById('p'+i).classList.toggle('hide',i!==n);document.getElementById('tb'+i).classList.toggle('active',i===n);} if(n==1)loadDist(); if(n==2)loadRetailers(); if(n==3)loadTx();}
function init(){if(localStorage.ADMIN=='YES'||localStorage.admin_ok=='yes'){document.getElementById('L').style.display='none';document.getElementById('AA').style.display='block';}loadDist();}
async function createD(){let id=did.value.trim(),pa=dpass.value.trim(),na=dname.value.trim()||id,ba=parseFloat(dbal.value)||0;if(!id||!pa){msg.innerText='❌ ID Pass Lekha!';return;}msg.innerText='Saving to Supabase...';let {error}=await sup.from('distributors').insert([{id:id,password:pa,name:na,balance:ba}]);if(error){msg.innerText='❌ '+error.message;}else{msg.innerText='✅ '+id+' Saved! Permanent!';did.value='';dpass.value='';dname.value='';dbal.value='';loadDist();}}
async function loadDist(){let s=(sD?.value||'').toLowerCase();let {data}=await sup.from('distributors').select('*').order('created_at',{ascending:false});let tot=0;let filtered=(data||[]).filter(d=>!s||d.id.toLowerCase().includes(s)||(d.name||'').toLowerCase().includes(s));filtered.forEach(d=>tot+=(parseFloat(d.balance)||0));dc.innerText=data?data.length:0;tb.innerText='₹'+tot.toLocaleString('en-IN');let h='';filtered.forEach(d=>{h+='<div class=item><div><b>'+d.id+'</b> - '+d.name+'<br><small>Pass:'+d.password+' | ₹'+(d.balance||0)+'</small></div><div><button onclick="addBal(\''+d.id+'\')" style="width:auto;background:#16a34a;color:#fff;border:0;padding:6px 12px;border-radius:6px">+Bal</button> <button onclick="delD(\''+d.id+'\')" style="width:auto;background:#dc2626;color:#fff;border:0;padding:6px 12px;border-radius:6px">Del</button></div></div>';});listD.innerHTML=h||'No Distributors';}
async function loadRetailers(){let {data}=await sup.from('retailers').select('*').order('created_at',{ascending:false}).limit(100);let h='<table style=width:100%><tr><th>ID</th><th>Name</th><th>Bal</th></tr>';(data||[]).forEach(r=>{h+='<tr><td>'+r.id+'</td><td>'+(r.name||'')+'</td><td>₹'+(r.balance||0)+'</td></tr>'});h+='</table>';listR.innerHTML=h;}
async function loadTx(){let {data}=await sup.from('transactions').select('*').order('created_at',{ascending:false}).limit(50);let h='';(data||[]).forEach(t=>{h+='<tr><td>'+new Date(t.created_at).toLocaleString()+'</td><td>'+(t.user_id||'')+'</td><td>₹'+(t.amount||0)+'</td><td>'+(t.status||'')+'</td></tr>'});listT.innerHTML=h||'<tr><td colspan=4 style=text-align:center>No data yet</td></tr>';}
async function delD(id){if(!confirm(id+' Delete?'))return;await sup.from('distributors').delete().eq('id',id);loadDist();}
async function addBal(id){let a=prompt('Kete Add?');if(!a)return;a=parseFloat(a);let {data}=await sup.from('distributors').select('balance').eq('id',id).single();let nb=(parseFloat(data.balance)||0)+a;await sup.from('distributors').update({balance:nb}).eq('id',id);alert('New Balance: ₹'+nb);loadDist();}
init();
</script></body></html>
