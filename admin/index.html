<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - LIVE</title>
<style>
body{margin:0;background:#020617;color:#fff;font-family:system-ui}
.top{background:#0f172a;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.stat{background:#1e293b;padding:16px;border-radius:12px;text-align:center}
.b{font-size:22px;font-weight:900;color:#22c55e}
.row{background:#1e293b;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 12px;font-weight:700}
.danger{background:#ef4444;color:#fff}
.success{background:#22c55e;color:#000}
</style></head><body>

<div class="top"><b>ADMIN LIVE</b><button onclick="location.href='/'">Home</button></div>

<div class="stat-grid">
<div class="stat"><div id="tAll">0</div><div>Total Tx</div></div>
<div class="stat"><div id="tDist">0</div><div>Distributors</div></div>
</div>

<div style="padding:12px">
<h4>ALL LIVE TRANSACTIONS <button onclick="loadAll()" style="background:#22c55e">Refresh</button></h4>
<div id="list">Loading...</div>

<h4 style="margin-top:20px">ALL DISTRIBUTORS <button onclick="loadDistributors()" style="background:#38bdf8">Refresh Dist</button></h4>
<div id="distList">Loading...</div>
</div>

<script type="module">
import { db } from '../public/firebase.js';
import { collection, getDocs, query, orderBy, limit, deleteDoc, doc, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

async function loadAll(){
 const box=document.getElementById('list');
 try{
   const q=query(collection(db,"transactions"),orderBy("createdAt","desc"),limit(50));
   const snap=await getDocs(q);
   document.getElementById('tAll').innerText=snap.size+" Tx";
   if(snap.empty){box.innerHTML="No transactions";return;}
   let html="";
   snap.forEach(d=>{
     const t=d.data();
     html+=`<div class="row"><span>${t.order_id || d.id} - ₹${t.amount || 0}</span><span>${t.status || 'pending'}</span></div>`;
   });
   box.innerHTML=html;
 }catch(e){box.innerHTML="Error: "+e.message}
}

async function loadDistributors(){
 const box=document.getElementById('distList');
 try{
   const snap=await getDocs(collection(db,"distributors"));
   document.getElementById('tDist').innerText=snap.size;
   if(snap.empty){box.innerHTML="No distributors";return;}
   let html="";
   snap.forEach(d=>{
     const data=d.data();
     html+=`<div class="row">
       <span><b>${data.name || data.email || d.id}</b><br><small>${data.phone || ''} | Bal: ₹${data.wallet || data.balance || 0}</small></span>
       <span>
         <button class="danger" onclick="deleteDistributor('${d.id}')">Delete</button>
       </span>
     </div>`;
   });
   box.innerHTML=html;
 }catch(e){box.innerHTML="Error: "+e.message}
}

// PERMANENT DELETE - Eita main fix
window.deleteDistributor = async function(id){
 if(!confirm("Pakka Delete kariba? Eta permanent heba!")) return;
 try{
   await deleteDoc(doc(db, "distributors", id));
   alert("Deleted Successfully from Firebase");
   loadDistributors();
 }catch(e){
   alert("Delete Fail: "+e.message);
 }
}

window.loadAll=loadAll;
loadAll();
loadDistributors();
</script></body></html>
