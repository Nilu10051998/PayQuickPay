<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Full - PayQuickPay</title><style>body{margin:0;background:#020617;color:#fff;font-family:system-ui;padding:10px}.top{background:#1e293b;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.gbox{background:#1e293b;padding:12px;border-radius:12px;text-align:center}.gbox b{font-size:20px;color:#22c55e;display:block}.tab{display:flex;gap:5px;overflow:auto;margin:8px 0}.tab button{padding:8px 12px;border-radius:8px;border:none;background:#334155;color:#fff;font-size:13px;white-space:nowrap}.tab button.active{background:#22c55e;color:#000;font-weight:900}.card{background:#1e293b;padding:12px;border-radius:12px;margin:8px 0;display:none}.card.active{display:block}input,select{width:100%;padding:11px;border-radius:8px;margin:4px 0;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box}button.b{width:100%;padding:11px;border-radius:8px;border:none;background:#22c55e;color:#000;font-weight:900}.it{background:#0f172a;padding:9px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;font-size:13px}</style></head><body>
<div class="top"><span>👑 ADMIN FULL</span><button onclick="location.href='login.html'" style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px">Logout</button></div>
<div class="grid"><div class="gbox"><small>Total Retailer</small><b id="tr">0</b></div><div class="gbox"><small>Total Distributor</small><b id="td">0</b></div><div class="gbox"><small>Today Sale</small><b id="ts">Rs 0</b></div><div class="gbox"><small>Wallet Left</small><b id="tw">Rs 0</b></div></div>
<div class="tab"><button class="active" onclick="sh(1)" id="b1">Balance Add</button><button onclick="sh(2)" id="b2">Create ID</button><button onclick="sh(3)" id="b3">Services</button><button onclick="sh(4)" id="b4">Password</button><button onclick="sh(5)" id="b5">History</button><button onclick="sh(6)" id="b6">Report</button></div>

<div id="c1" class="card active"><h3 style="margin:0 0 6px">Add Balance - Retailer/Distributor</h3><select id="balType"><option value="retailers">Retailer</option><option value="distributors">Distributor</option></select><input id="balMob" placeholder="Mobile ex: 8018146505"><input id="balAmt" type="number" placeholder="Amount ex: 1000"><button class="b" onclick="addBal()">ADD NOW</button><div id="balList"></div></div>
<div id="c2" class="card"><h3>Create New ID</h3><select id="crType"><option value="retailers">Retailer</option><option value="distributors">Distributor</option></select><input id="crName" placeholder="Name"><input id="crMob" placeholder="Mobile"><input id="crPass" placeholder="Password"><input id="crBal" type="number" placeholder="Opening Balance ex: 0"><button class="b" onclick="createID()">CREATE ID</button><div id="crMsg"></div></div>
<div id="c3" class="card"><h3>Service Setup - ON/OFF + Commission</h3><div id="sList"></div><hr><input id="sName" placeholder="New Service Name ex: Airtel"><input id="sCRet" type="number" placeholder="Retailer Commission % ex: 2"><input id="sCDis" type="number" placeholder="Distributor Commission % ex: 1"><button class="b" onclick="addService()">Add New Service</button></div>
<div id="c4" class="card"><h3>Password Change + Block</h3><select id="pType"><option value="retailers">Retailer</option><option value="distributors">Distributor</option></select><input id="pMob" placeholder="Mobile"><input id="pNew" placeholder="New Password"><button class="b" onclick="changePass()">Change Password</button><button class="b" style="background:#ef4444;color:#fff;margin-top:6px" onclick="blockID()">Block / Unblock ID</button><div id="pMsg"></div></div>
<div id="c5" class="card"><h3>All Recharge History</h3><div id="hList"></div><button class="b" style="background:#334155;color:#fff" onclick="loadHist()">Refresh History</button></div>
<div id="c6" class="card"><h3>Commission Report</h3><div id="rep"></div></div>

<script>
var SURL="https://mojdysebckbodadjdctj.supabase.co";var SKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic";
function sh(n){for(var i=1;i<=6;i++){document.getElementById("c"+i).className=i==n?"card active":"card";document.getElementById("b"+i).className=i==n?"active":"";} if(n==3)loadServices(); if(n==5)loadHist(); if(n==6)loadRep(); if(n==1)loadBalList();}
async function addBal(){var tbl=document.getElementById("balType").value;var mob=document.getElementById("balMob").value;var amt=parseInt(document.getElementById("balAmt").value);if(!mob||!amt){alert("Mobile + Amount");return}var r=await fetch(SURL+"/rest/v1/"+tbl+"?mobile=eq."+mob+"&select=wallet_balance",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d=await r.json();if(!d.length){alert("ID miluni");return}var nb=d[0].wallet_balance+amt;await fetch(SURL+"/rest/v1/"+tbl+"?mobile=eq."+mob,{method:"PATCH",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({wallet_balance:nb})});alert("Done New Bal Rs "+nb);loadBalList();}
async function loadBalList(){var r1=await fetch(SURL+"/rest/v1/retailers?select=mobile,wallet_balance&order=wallet_balance.desc&limit=5",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d1=await r1.json();var h="";for(var i=0;i<d1.length;i++)h+="<div class=it><span>"+d1[i].mobile+"</span><span>Rs "+d1[i].wallet_balance+"</span></div>";document.getElementById("balList").innerHTML=h;}
async function createID(){var tbl=document.getElementById("crType").value;var name=document.getElementById("crName").value;var mob=document.getElementById("crMob").value;var pass=document.getElementById("crPass").value;var bal=parseInt(document.getElementById("crBal").value)||0;if(!mob||!pass){alert("Mobile Pass darkar");return}var res=await fetch(SURL+"/rest/v1/"+tbl,{method:"POST",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({name:name,mobile:mob,password:pass,wallet_balance:bal,status:"ACTIVE"})});document.getElementById("crMsg").innerText=res.ok?"ID Created "+mob:"Fail - Mobile already ache";loadStats();}
async function loadServices(){var r=await fetch(SURL+"/rest/v1/services?select=*",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d=await r.json();var h="";for(var i=0;i<d.length;i++){h+="<div class=it><span><b>"+d[i].name+"</b> R:"+d[i].commission_retailer+"% D:"+d[i].commission_distributor+"% ["+d[i].status+"]</span><button onclick=\"toggleS('"+d[i].id+"','"+d[i].status+"')\" style=\"width:auto;padding:5px 10px;border:none;border-radius:6px;background:"+(d[i].status=='ACTIVE'?'#22c55e':'#ef4444')+"\">"+d[i].status+"</button></div>"}document.getElementById("sList").innerHTML=h;}
async function toggleS(id,st){var ns=st=='ACTIVE'?'INACTIVE':'ACTIVE';await fetch(SURL+"/rest/v1/services?id=eq."+id,{method:"PATCH",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({status:ns})});loadServices();}
async function addService(){var n=document.getElementById("sName").value;var cr=parseInt(document.getElementById("sCRet").value)||2;var cd=parseInt(document.getElementById("sCDis").value)||1;if(!n){alert("Name dia");return}await fetch(SURL+"/rest/v1/services",{method:"POST",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({name:n,commission_retailer:cr,commission_distributor:cd,status:"ACTIVE"})});loadServices();}
async function changePass(){var tbl=document.getElementById("pType").value;var mob=document.getElementById("pMob").value;var np=document.getElementById("pNew").value;if(!mob||!np){alert("Mobile + New Pass");return}await fetch(SURL+"/rest/v1/"+tbl+"?mobile=eq."+mob,{method:"PATCH",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({password:np})});document.getElementById("pMsg").innerText="Pass Changed "+mob+" -> "+np;}
async function blockID(){var tbl=document.getElementById("pType").value;var mob=document.getElementById("pMob").value;var st=prompt("Type ACTIVE or BLOCKED");if(!st)return;await fetch(SURL+"/rest/v1/"+tbl+"?mobile=eq."+mob,{method:"PATCH",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({status:st})});document.getElementById("pMsg").innerText=mob+" Status "+st;}
async function loadHist(){var r=await fetch(SURL+"/rest/v1/recharge_history?select=*&order=created_at.desc&limit=20",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d=await r.json();var h="";for(var i=0;i<d.length;i++){h+="<div class=it><span>Rs"+d[i].amount+" "+d[i].mobile_number+" "+d[i].operator+"</span><span>"+d[i].status+"</span></div>"}document.getElementById("hList").innerHTML=h;}
async function loadStats(){var r1=await fetch(SURL+"/rest/v1/retailers?select=id",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d1=await r1.json();document.getElementById("tr").innerText=d1.length;var r2=await fetch(SURL+"/rest/v1/distributors?select=id",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d2=await r2.json();document.getElementById("td").innerText=d2.length;var r3=await fetch(SURL+"/rest/v1/recharge_history?select=amount&order=created_at.desc&limit=50",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d3=await r3.json();var sum=0;for(var i=0;i<d3.length;i++)sum+=d3[i].amount;document.getElementById("ts").innerText="Rs "+sum;var r4=await fetch(SURL+"/rest/v1/retailers?select=wallet_balance",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d4=await r4.json();var tw=0;for(var j=0;j<d4.length;j++)tw+=d4[j].wallet_balance;document.getElementById("tw").innerText="Rs "+tw;}
async function loadRep(){document.getElementById("rep").innerHTML="<div class=it><span>Today Total Sale</span><span id=repSale>Loading</span></div><div class=it><span>Retailer Commission 2%</span><span>Auto</span></div><div class=it><span>Your Profit</span><span style=color:#22c55e>Sale - Commission</span></div>";loadHist();}
loadStats();loadBalList();
</script></body></html>
