<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayQuickPay - Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#f1f5f9;color:#0f172a}
.header{background:#0f172a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logout{background:#fff;color:#0f172a;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:#fff;padding:16px;border-radius:12px;border:1px solid #e2e8f0}.stat span{font-size:12px;color:#64748b}
.balance{background:#0f172a;color:#fff;padding:16px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{background:#fff;border:1px solid #e2e8f0;padding:10px 16px;border-radius:20px;cursor:pointer;font-size:13px}.tab.active{background:#0f172a;color:#fff}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;display:none}.card.active{display:block}
input,select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;outline:none}
.btn{width:100%;padding:13px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}th{color:#64748b;text-align:left}th,td{padding:10px;border-bottom:1px solid #f1f5f9}
.del{background:#fee2e2;color:#dc2626;border:none;padding:6px 12px;border-radius:8px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<div class="header"><div><b>PAYQUICKPAY</b><br><small style="color:#94a3b8;font-size:11px">ADMIN CONSOLE</small></div><button class="logout" onclick="logout()">Logout</button></div>
<div class="wrap">
<div class="balance"><span>Available Balance</span><b id="a1bal">Loading...</b></div>
<div class="stats"><div class="stat"><span>Total Distributors</span><h2 id="cDist">0</h2></div><div class="stat"><span>Total Retailers</span><h2 id="cRet">0</h2></div><div class="stat"><span>Today Recharges</span><h2 id="cToday">0</h2></div><div class="stat"><span>Total Recharges</span><h2 id="cTotal">0</h2></div></div>
<div class="tabs"><div class="tab active" onclick="showTab('dist',this)">Distributors</div><div class="tab" onclick="showTab('ret',this)">Retailers</div><div class="tab" onclick="showTab('wallet',this)">Wallet</div><div class="tab" onclick="showTab('history',this)">History</div><div class="tab" onclick="showTab('comm',this)">Commission</div></div>
<div class="card active" id="tab-dist"><div class="grid2"><input id="dName" placeholder="Full Name"><input id="dMobile" placeholder="Mobile Number"></div><div class="grid2"><input id="dUser" placeholder="Username"><input id="dPass" type="password" placeholder="Password"></div><button class="btn" onclick="addDist()">Add Distributor</button><table><thead><tr><th>Name</th><th>Mobile</th><th>Wallet</th><th></th></tr></thead><tbody id="distList"></tbody></table></div>
<div class="card" id="tab-ret"><select id="rParent"><option value="">Select Distributor</option></select><div class="grid2"><input id="rName" placeholder="Full Name"><input id="rMobile" placeholder="Mobile Number"></div><div class="grid2"><input id="rUser" placeholder="Username"><input id="rPass" type="password" placeholder="Password"></div><button class="btn" onclick="addRet()">Add Retailer</button><table><thead><tr><th>Name</th><th>Distributor</th><th>Wallet</th><th></th></tr></thead><tbody id="retList"></tbody></table></div>
<div class="card" id="tab-wallet"><select id="wUser"><option value="">Select User</option></select><input id="wAmt" type="number" placeholder="Amount"><button class="btn" onclick="sendWallet()">Transfer Wallet</button><table><thead><tr><th>To</th><th>Amount</th><th>Date</th></tr></thead><tbody id="walletList"></tbody></table></div>
<div class="card" id="tab-history"><table><thead><tr><th>Number</th><th>Operator</th><th>Amount</th><th>Status</th></tr></thead><tbody id="histList"></tbody></table></div>
<div class="card" id="tab-comm"><input id="cJioD" value="1.5" placeholder="Jio Distributor %"><input id="cJioR" value="2.5" placeholder="Jio Retailer %"><input id="cAirD" value="1.5" placeholder="Airtel Distributor %"><input id="cAirR" value="2.5" placeholder="Airtel Retailer %"><button class="btn" onclick="saveComm()">Save Commission</button></div>
</div>
<script>
const API="https://payquickpay-api.vercel.app";
const firebaseConfig={apiKey:"AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:03dcbc47e46568d51b58ee"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
if(localStorage.getItem('adminAuth')!=='true'){ location.href='../index.html'; }
function logout(){ localStorage.removeItem('adminAuth'); location.href='../index.html'; }
function showTab(id,el){document.querySelectorAll('.card').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');el.classList.add('active');}
async function loadBal(){ try{let r=await fetch(API+'/api/balance');let j=await r.json();document.getElementById('a1bal').innerText='₹ '+(j.balance||'0');}catch(e){document.getElementById('a1bal').innerText='Unavailable';} }
async function addDist(){let n=dName.value.trim(),m=dMobile.value.trim(),u=dUser.value.trim(),p=dPass.value.trim(); if(!n||!u||!p) return alert('Fill all fields'); await db.collection('distributors').add({name:n,mobile:m,user:u,username:u,pass:p,password:p,wallet:0,createdAt:new Date()}); location.reload();}
async function addRet(){let par=rParent.value,n=rName.value.trim(),m=rMobile.value.trim(),u=rUser.value.trim(),p=rPass.value.trim(); if(!par||!n||!u||!p) return alert('Fill all fields'); await db.collection('retailers').add({name:n,mobile:m,user:u,username:u,pass:p,password:p,distributorName:par,wallet:0,createdAt:new Date()}); location.reload();}
async function loadAll(){
 let dSnap=await db.collection('distributors').get(); document.getElementById('cDist').innerText=dSnap.size;
 let h=''; let opts='<option value="">Select Distributor</option>';
 dSnap.forEach(doc=>{let d=doc.data(); h+=`<tr><td>${d.name}</td><td>${d.mobile||''}</td><td>₹ ${d.wallet||0}</td><td><button class="del" onclick="delUser('distributors','${doc.id}')">Delete</button></td></tr>`; opts+=`<option value="${d.name}">${d.name}</option>`;});
 document.getElementById('distList').innerHTML=h; document.getElementById('rParent').innerHTML=opts;
 let rSnap=await db.collection('retailers').get(); document.getElementById('cRet').innerText=rSnap.size;
 let rh=''; rSnap.forEach(doc=>{let d=doc.data(); rh+=`<tr><td>${d.name}</td><td>${d.distributorName||''}</td><td>₹ ${d.wallet||0}</td><td><button class="del" onclick="delUser('retailers','${doc.id}')">Delete</button></td></tr>`;});
 document.getElementById('retList').innerHTML=rh;
 let wSel=document.getElementById('wUser'); wSel.innerHTML='<option value="">Select User</option>';
 dSnap.forEach(doc=>{wSel.innerHTML+=`<option value="distributors|${doc.id}|${doc.data().name}">Distributor - ${doc.data().name}</option>`;});
 rSnap.forEach(doc=>{wSel.innerHTML+=`<option value="retailers|${doc.id}|${doc.data().name}">Retailer - ${doc.data().name}</option>`;});
 let s=await db.collection('recharges').orderBy('createdAt','desc').limit(50).get(); document.getElementById('cTotal').innerText=s.size;
 let hh=''; let today=0; let ts=new Date().toDateString();
 s.forEach(doc=>{let d=doc.data(); if(d.createdAt?.toDate().toDateString()===ts) today++; hh+=`<tr><td>${d.number||''}</td><td>${d.operator||''}</td><td>₹ ${d.amount||''}</td><td>${d.status||'Success'}</td></tr>`;});
 document.getElementById('histList').innerHTML=hh||'<tr><td colspan=4>No records</td></tr>'; document.getElementById('cToday').innerText=today;
 let ws=await db.collection('wallet_transactions').orderBy('createdAt','desc').limit(20).get(); let wh='';
 ws.forEach(doc=>{let d=doc.data(); wh+=`<tr><td>${d.to}</td><td>₹ ${d.amount}</td><td>${d.createdAt?.toDate().toLocaleDateString()||''}</td></tr>`;});
 document.getElementById('walletList').innerHTML=wh;
}
async function delUser(c,id){ if(confirm('Delete this user?')){ await db.collection(c).doc(id).delete(); location.reload(); } }
async function sendWallet(){ let sel=wUser.value, amt=parseInt(wAmt.value); if(!sel||!amt) return alert('Select user and amount'); let [col,id,name]=sel.split('|'); let ref=db.collection(col).doc(id); let doc=await ref.get(); await ref.update({wallet:(doc.data().wallet||0)+amt}); await db.collection('wallet_transactions').add({to:name,toId:id,amount:amt,from:'Admin',createdAt:new Date()}); location.reload(); }
async function saveComm(){ await db.collection('settings').doc('commission').set({jioD:cJioD.value,jioR:cJioR.value,airD:cAirD.value,airR:cAirR.value}); alert('Saved'); }
loadBal(); loadAll();
</script></body></html>
