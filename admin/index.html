<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><style>body{margin:0;font-family:sans-serif;background:#f4f6fb}.log{height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;padding:20px;border-radius:12px;width:360px}input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}.btn{width:100%;padding:11px;background:#4f46e5;color:#fff;border:0;border-radius:6px;cursor:pointer}.cap{display:flex;gap:6px;background:#f1f5f9;padding:8px;border-radius:6px}.cap b{flex:1;text-align:center;font-size:22px;letter-spacing:4px;background:#fff;padding:6px;border:1px dashed #999}#main{display:none}.side{width:220px;background:#111827;color:#fff;min-height:100vh;padding:15px;float:left}.side div{padding:10px;cursor:pointer;border-radius:6px}.side div:hover{background:#1f2937}.con{margin-left:220px;padding:15px}.box{background:#fff;padding:15px;border-radius:10px;margin-bottom:12px}.tab{display:none}.tab.a{display:block}table{width:100%;font-size:13px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee}</style></head><body><div id="L" class="log"><div class="card"><h3 style="text-align:center">Admin Login</h3><input id="u" placeholder="admin"><input id="p" type="password" placeholder="admin123"><div class="cap"><b id="cT"></b><button onclick="gC()">↻</button></div><input id="cI" placeholder="Captcha"><button class="btn" onclick="login()">Login</button><p id="msg" style="color:red"></p></div></div><div id="main"><div class="side"><b>PayQuickPay</b><div onclick="sh('d')">Dashboard</div><div onclick="sh('r')">Retailers</div><div onclick="sh('w')">Wallet</div><div onclick="sh('rh')">History</div><div onclick="sh('co')">Commission</div><div onclick="sh('op')">Operators</div><div onclick="sh('cm')">Complaints</div><div onclick="sh('no')">Broadcast</div><div onclick="sh('se')">Settings</div><div onclick="localStorage.clear();location.reload()" style="margin-top:20px;background:#222">Logout</div></div><div class="con"><div id="d" class="tab a"><div class="box">Retailers: <b id="tR">0</b> | Recharges: <b id="tC">0</b> | Sale: ₹<b id="tA">0</b></div><div class="box" id="dT"></div></div><div id="r" class="tab"><div class="box"><h4>Add Retailer</h4><input id="rn" placeholder="Name"><input id="rm" placeholder="Mobile"><input id="rmb" type="number" placeholder="Balance"><input id="rp" placeholder="Password"><button class="btn" onclick="addR()">Add</button></div><div class="box"><input id="sR" placeholder="Search" onkeyup="loadR()"><div id="rL"></div></div></div><div id="w" class="tab"><div class="box"><h4>Wallet</h4><input id="wM" placeholder="Mobile"><input id="wA" type="number" placeholder="Amt"><button class="btn" onclick="upW()">Update</button></div><div class="box" id="lB"></div></div><div id="rh" class="tab"><div class="box" id="rhL"></div></div><div id="co" class="tab"><div class="box"><input id="cO" placeholder="Operator"><input id="cP" type="number" placeholder="%"><button class="btn" onclick="saveC()">Save</button><div id="cL"></div></div></div><div id="op" class="tab"><div class="box"><input id="oN" placeholder="Operator Name"><button class="btn" onclick="addO()">Add</button><div id="oL"></div></div></div><div id="cm" class="tab"><div class="box" id="cmL"></div></div><div id="no" class="tab"><div class="box"><textarea id="nM" placeholder="Notice"></textarea><button class="btn" onclick="sendN()">Send</button><div id="nL"></div></div></div><div id="se" class="tab"><div class="box">admin / admin123</div></div></div></div><script>let cc='';function gC(){let s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',c='';for(let i=0;i<5;i++)c+=s[Math.floor(Math.random()*s.length)];cc=c;document.getElementById('cT').innerText=c}gC();const firebaseConfig={apiKey:"AIzaSyC2CNTlljpj-IIxDUCEHoAQPJfR22d700I",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:83dcbc47e46568d51b58ee"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();function sh(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('a'));document.getElementById(id).classList.add('a')}function login(){if(document.getElementById('cI').value.toUpperCase()!=cc){msg.innerText='Wrong Captcha';gC();return}if(u.value=='admin'&&p.value=='admin123'){localStorage.setItem('ad','1');show()}else msg.innerText='Wrong'}function show(){L.style.display='none';main.style.display='block';loadR();loadDash();loadC();loadO();loadCm();loadNo();loadRh()}if(localStorage.getItem('ad')=='1')show();function addR(){let n=rn.value,m=rm.value,pa=rp.value,b=Number(rmb.value)||0;if(!n||!m||!pa)return alert('fill');db.collection('retailers').doc(m).set({name:n,mobile:m,password:pa,walletBalance:b,status:'active',createdAt:new Date()})}function loadR(){let q=(sR.value||'').toLowerCase();db.collection('retailers').onSnapshot(s=>{let h='<table><tr><th>Name</th><th>Mob</th><th>Bal</th><th>Act</th></tr>',c=0,l='';s.forEach(d=>{let r=d.data();if(q&&!${r.name} ${r.mobile}.toLowerCase().includes(q))return;c++;h+=<tr><td>${r.name}</td><td>${r.mobile}</td><td>${r.walletBalance}</td><td><button onclick="db.collection('retailers').doc('${r.mobile}').delete()">Del</button></td></tr>;if(r.walletBalance<100)l+=r.name+'<br>'});h+='</table>';rL.innerHTML=h;tR.innerText=c;lB.innerHTML=l}) }function upW(){db.collection('retailers').doc(wM.value).get().then(d=>{let nb=(d.data().walletBalance||0)+Number(wA.value);db.collection('retailers').doc(wM.value).update({walletBalance:nb})})}function loadDash(){db.collection('recharges').onSnapshot(s=>{let t=0,c=0;s.forEach(d=>{t+=Number(d.data().amount||0);c++});tA.innerText=t;tC.innerText=c});db.collection('recharges').orderBy('date','desc').limit(10).onSnapshot(s=>{let h='';s.forEach(d=>{let x=d.data();h+=${x.type} ${x.amount} - ${x.retailerMobile}<br>});dT.innerHTML=h})}function loadRh(){db.collection('recharges').orderBy('date','desc').limit(50).onSnapshot(s=>{let h='<table>';s.forEach(d=>{let x=d.data();h+=<tr><td>${x.type}</td><td>${x.customer}</td><td>${x.amount}</td><td>${x.retailerMobile}</td></tr>});rhL.innerHTML=h+'</table>'})}function saveC(){db.collection('commissions').doc(cO.value).set({operator:cO.value,percent:Number(cP.value)})}function loadC(){db.collection('commissions').onSnapshot(s=>{let h='';s.forEach(d=>{h+=${d.data().operator}-${d.data().percent}% `});cL.innerHTML=h})}function addO(){db.collection('operators').doc(oN.value).set({name:oN.value,active:true})}function loadO(){db.collection('operators').onSnapshot(s=>{let h='';s.forEach(d=>{h+=${d.data().name} });oL.innerHTML=h})}function loadCm(){db.collection('complaints').onSnapshot(s=>{let h='';s.forEach(d=>{h+=${d.data().retailerMobile}: ${d.data().message}<br>});cmL.innerHTML=h})}function sendN(){db.collection('notices').add({message:nM.value,date:new Date()})}function loadNo(){db.collection('notices').onSnapshot(s=>{let h='';s.forEach(d=>{h+=${d.data().message}<br>`});nL.innerHTML=h})}</script></body></html>
