<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - LIVE</title><style>body{margin:0;background:#020617;color:#fff;font-family:system-ui}
.top{background:#0f172a;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px}
.stat{background:#1e293b;padding:16px;border-radius:12px;text-align:center}
.b{font-size:22px;font-weight:900;color:#22c55e}
.row{background:#1e293b;padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;font-size:13px}</style></head><body>
<div class="top"><b>ADMIN LIVE</b><button onclick="location.href='/'" style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:20px">Logout</button></div>
<div class="stat-grid"><div class="stat"><div class="b" id="tAll">0</div>Total Tx</div><div class="stat"><div class="b" id="tVol">Rs 0</div>Volume</div><div class="stat"><div class="b" id="tRet">1</div>Retailers</div></div>
<div style="padding:12px"><h4>ALL LIVE TRANSACTIONS <button onclick="loadAll()" style="background:#22c55e;border:none;padding:6px 12px;border-radius:20px">Refresh</button></h4><div id="list">Loading...</div><div id="wallets" style="margin-top:20px"></div></div>
<script type="module">
import { db } from '../public/firebase.js';
import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
async function loadAll(){const box=document.getElementById('list');try{const q=query(collection(db,"transactions"),orderBy("time","desc"),limit(50));const snap=await getDocs(q);let html='',vol=0,count=0;snap.forEach(d=>{const t=d.data();count++;vol+=Number(t.amount||0);html+=`<div class="row"><div><b>${t.service}</b> - ${t.number}<br><small>${t.retailer}</small></div><div style="color:#22c55e">Rs ${t.amount}</div></div>`;});box.innerHTML=html||'No data';document.getElementById('tAll').innerText=count;document.getElementById('tVol').innerText='Rs '+vol;const wSnap=await getDocs(collection(db,"wallets"));let wH='';wSnap.forEach(w=>{wH+=`<div class="row"><div>${w.id}</div><div>Rs ${w.data().balance}</div></div>`;});document.getElementById('wallets').innerHTML=wH;}catch(e){box.innerHTML=e.message;}}
window.loadAll=loadAll;loadAll();
</script></body></html>
