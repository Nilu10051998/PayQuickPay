<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN PRO - PayQuickPay</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><div class="flex min-h-screen"><div class="w-64 bg-slate-900 text-white p-5"><h2 class="font-black text-lg">⚡ PAYQUICKPAY</h2><p class="text-xs text-green-400 mt-2">● MUMBAI LIVE<br>● RLS OFF<br>● PERMANENT</p><div class="mt-8 bg-blue-600 p-3 rounded-lg text-sm font-bold">Dashboard</div></div><div class="flex-1"><div class="bg-white p-4 border-b flex justify-between"><h1 class="font-bold">Admin Panel - Professional <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full">2 Users Live</span></h1><button onclick="load()" class="bg-black text-white text-xs px-4 py-2 rounded-lg">Reload</button></div><div class="p-4 grid grid-cols-3 gap-4"><div class="bg-white p-4 rounded-xl border shadow"><p class="text-xs text-slate-500">Total Distributors</p><h2 class="text-3xl font-black" id="cnt">2</h2></div><div class="bg-white p-4 rounded-xl border shadow"><p class="text-xs text-slate-500">Total Wallet</p><h2 class="text-2xl font-black" id="tw">Rs 1000</h2></div><div class="bg-white p-4 rounded-xl border shadow"><p class="text-xs">Server</p><h2 class="text-sm font-bold text-green-600">MUMBAI PERMANENT ✅</h2></div></div><div class="p-4 grid lg:grid-cols-3 gap-4"><div class="bg-white p-5 rounded-xl border"><h3 class="font-bold mb-3">+ Create</h3><input id="uid" placeholder="User ID" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><input id="pwd" placeholder="Password" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><input id="nm" placeholder="Name" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><input id="wal" type="number" value="500" class="w-full border p-2.5 rounded-lg mb-3 text-sm"><button onclick="createUser()" class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold">CREATE PERMANENT</button><div id="msg" class="text-xs font-bold mt-2 text-center"></div></div><div class="bg-white p-5 rounded-xl border lg:col-span-2"><h3 class="font-bold mb-3">All Distributors - Live from Supabase (D2, puja)</h3><div id="list">Loading...</div></div></div></div></div><script>var URL="https://hiyjowfyszctvhljsdgx.supabase.co";var KEY="sb_publishable_Qn7F0hoIeGD-q6nzO1HvzA_SFrFuNE2";var all=[];async function load(){let el=document.getElementById("list");try{let r=await fetch(URL+"/rest/v1/distributors?select=*",{headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}});let d=await r.json();all=d;document.getElementById("cnt").innerText=d.length;let t=0;d.forEach(x=>t+=x.wallet_balance);document.getElementById("tw").innerText="Rs "+t;let h="";for(let x of d){h+=<div class="flex justify-between p-3 border rounded-lg mb-2"><div><b>${x.user_id}</b> - ${x.name} - <span class="text-green-600 font-bold">Rs ${x.wallet_balance}</span><br><small class="text-slate-500">Pass: ${x.password}</small></div><div><button onclick="qa('${x.user_id}')" class="bg-blue-600 text-white text-xs px-3 py-1 rounded">+500</button> <button onclick="del('${x.user_id}')" class="bg-red-100 text-red-600 text-xs px-3 py-1 rounded">Del</button></div></div>;}el.innerHTML=h;}catch(e){el.innerHTML=e.message;}}async function createUser(){let u=uid.value.trim(),p=pwd.value.trim(),n=nm.value.trim()||u,w=parseInt(wal.value)||500;let m=document.getElementById("msg");if(!u||!p){m.innerHTML="ID Pass de";return;}m.innerHTML="Creating...";let r=await fetch(URL+"/rest/v1/distributors",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({user_id:u,password:p,name:n,wallet_balance:w})});if(r.ok){m.innerHTML="✅ Created!";uid.value="";pwd.value="";load();}else{m.innerHTML="❌ "+await r.text();}}async function del(id){if(!confirm(id+" Delete?"))return;await fetch(URL+"/rest/v1/distributors?user_id=eq."+id,{method:"DELETE",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}});load();}async function qa(id){let c=all.find(x=>x.user_id==id);let nw=c.wallet_balance+500;await fetch(URL+"/rest/v1/distributors?user_id=eq."+id,{method:"PATCH",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({wallet_balance:nw})});load();}load();</script></body></html>
