<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ADMIN FINAL</title><script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>body{margin:0;background:#0a0f1e;color:#fff;font-family:Arial}.c{height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}.b{background:#111a32;border:2px solid #3b82f6;padding:28px;border-radius:16px;width:100%;max-width:380px;text-align:center}input{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #334155;background:#0a0f1e;color:#fff}button{padding:11px 16px;background:#3b82f6;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.h{background:#111a32;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.card{background:#111a32;border:1px solid #1e293b;padding:15px;border-radius:12px;margin:12px}.item{background:#0f172a;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}.hide{display:none!important}</style></head><body>
<div id="LP" class="c"><div class="b"><h2>🔐 ADMIN LOGIN</h2><input id="u" value="admin"><input id="p" value="admin123"><button onclick="let a=u.value.trim(),b=p.value.trim();if(a==='admin'&&b==='admin123'){localStorage.setItem('ADMIN','YES');localStorage.setItem('admin_ok','yes');LP.classList.add('hide');AP.classList.remove('hide');loadDist();}else alert('Wrong')}" style="width:100%">LOGIN - CLICK</button></div></div>
<div id="AP" class="hide"><div class="h"><b>💰 ADMIN PANEL - API OK ✅</b><button onclick="localStorage.removeItem('ADMIN');localStorage.removeItem('admin_ok');location.reload()" style="width:auto;background:#dc2626;padding:6px 15px">Logout</button></div><div class="card" style="border:2px solid #3b82f6"><h3>Create Distributor Permanent</h3><input id="did" placeholder="ID Ex: Papu"><input id="dpass" placeholder="Password"><input id="dname" placeholder="Name"><input id="dbal" type="number" placeholder="Balance"><button onclick="createD()" style="width:100%;margin-top:8px;background:#16a34a">CREATE SAVE</button><p id="msg" style="font-size:12px"></p></div><div class="card"><h3>All Distributors <button onclick="loadDist()" style="width:auto;background:#16a34a">Refresh</button></h3><div id="list">Loading...</div></div></div>
<script>let sup=null;try{sup=window.supabase.createClient('https://mojdysebckbodadjctj.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic');}catch(e){}function check(){let k=localStorage.getItem('ADMIN')||localStorage.getItem('admin_ok');if(k==='YES'||k==='yes'){LP.classList.add('hide');AP.classList.remove('hide');loadDist();}}async function createD(){let id=did.value.trim(),pa=dpass.value.trim(),na=dname.value.trim()||id,ba=parseFloat(dbal.value)||0;if(!id||!pa){msg.innerText='ID Pass Lekha!';return;}msg.innerText='Saving...';let {error}=await sup.from('distributors').insert([{id,password:pa,name:na,balance:ba}]);if(error){msg.innerText='Error: '+error.message;}else{msg.innerText='✅ '+id+' Saved!';did.value='';dpass.value='';dname.value='';dbal.value='';loadDist();}}async function loadDist(){let {data}=await sup.from('distributors').select('*').order('created_at',{ascending:false});let h='';(data||[]).forEach(d=>{h+='<div class=item><div><b>'+d.id+'</b> - '+d.name+'<br><small>Pass:'+d.password+' | ₹'+d.balance+'</small></div><div><button onclick="delD(\''+d.id+'\')" style="width:auto;background:#dc2626;padding:5px 10px">Del</button></div></div>';});list.innerHTML=h||'No Data';}async function delD(id){if(!confirm(id+' Delete?'))return;await sup.from('distributors').delete().eq('id',id);loadDist();}check();</script></body></html>
