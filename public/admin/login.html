<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><style>body{margin:0;background:#020617;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh}.box{background:#1e293b;padding:20px;border-radius:12px;width:90%;max-width:320px} input{width:100%;padding:12px;border-radius:8px;margin:6px 0;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box} button{width:100%;padding:12px;border-radius:8px;background:#22c55e;color:#000;font-weight:900;border:none;margin-top:10px;cursor:pointer}</style></head><body><div class="box"><h2>Admin Login</h2><input id="mob" placeholder="admin"><input id="pass" type="password" placeholder="admin123"><button onclick="login()">LOGIN</button><p id="msg"></p></div><script>var SURL="https://mojdysebckbodadjdctj.supabase.co";var SKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic";async function login(){var m=document.getElementById("mob").value;var p=document.getElementById("pass").value;if(m=="admin"&&p=="admin123"){localStorage.setItem("admin",JSON.stringify({mobile:m}));location.href="index.html";return}var r=await fetch(SURL+"/rest/v1/admins?mobile=eq."+m+"&password=eq."+p+"&select=*",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d=await r.json();if(d.length){localStorage.setItem("admin",JSON.stringify(d[0]));location.href="index.html";}else{document.getElementById("msg").innerText="Wrong Login";}}</script></body></html>
