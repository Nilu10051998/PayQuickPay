<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Distributor - PayQuickPay</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}body{background:#f1f5f9}.top{background:#0f172a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.top button{background:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}.wrap{max-width:900px;margin:14px auto;padding:0 12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border-radius:14px;padding:18px;text-align:center}.stat b{font-size:24px;display:block}.card{background:#fff;border-radius:14px;padding:18px;margin-top:14px}.card input,.card select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#0f172a;color:#fff;border:none;padding:13px;border-radius:10px;width:100%;font-weight:700;cursor:pointer}.btnG{background:#dcfce7;color:#059669;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}.btnB{background:#dbeafe;color:#1d4ed8;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #f1f5f9;font-size:13px}.tabs{display:flex;gap:8px;margin-top:14px}.tab{background:#fff;padding:11px 16px;border-radius:10px;border:1px solid #e2e8f0;cursor:pointer;font-weight:600}.tab.active{background:#0f172a;color:#fff}.hide{display:none}.ok{color:#059669;text-align:center;margin-top:8px;font-size:13px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}</style></head>
<body>
<div class="top"><div><b>PAYQUICKPAY • DISTRIBUTOR</b><br><span id="distName" style="font-size:12px;opacity:.8">Loading... Please Wait</span></div><button onclick="logout()">Logout</button></div>
<div class="wrap">
<div class="stats"><div class="stat"><small>MY BALANCE</small><b id="bal">₹ 0</b></div><div class="stat"><small>MY RETAILERS</small><b id="retCount">0</b></div></div>
<div class="tabs"><div class="tab active" onclick="showTab('ret',this)">👥 Retailers</div><div class="tab" onclick="showTab('req',this)">💰 Balance Request</div><div class="tab" onclick="showTab('his',this)">📜 History</div></div>
<div id="retTab"><div class="card"><h3>➕ Nua Retailer Banaiba</h3><div class="grid2"><input id="r-name" placeholder="Retailer Full Name"><input id="r-user" placeholder="Username"><input id="r-pass" placeholder="Password"><input id="r-phone" placeholder="Mobile Number"></div><input id="r-bal" type="number" placeholder="Opening Balance ₹"><button class="btn" onclick="addRetailer()">Create Retailer</button></div>
<div class="card"><h3>👥 Mora Retailers</h3><table><tr><th>Retailer</th><th>Login</th><th>Balance</th><th>Action</th></tr><tbody id="retList"></tbody></table></div>
<div class="card"><h3>💸 Retailer Ku Balance Deba</h3><select id="tr-ret"><option value="">Select Retailer</option></select><input id="tr-amt" type="number" placeholder="Amount ₹"><button class="btn" onclick="transferBal()">TRANSFER</button><div class="ok" id="trOk"></div></div></div>
<div id="reqTab" class="hide"><div class="card"><h3>💰 Admin Tharu Balance Magiba</h3><input id="req-amt" type="number" placeholder="Kete Balance Darkar? ₹"><button class="btn" onclick="requestBal()">Send Request To Admin</button><div class="ok" id="reqOk"></div></div><div class="card"><h3>📩 Mora Requests</h3><div id="myReq">Loading...</div></div></div>
<div id="hisTab" class="hide"><div class="card"><h3>📜 History</h3><div id="hist">Loading...</div></div></div>
</div>
<script>
const firebaseConfig = { apiKey: "AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI", authDomain: "payquickpay-487ef.firebaseapp.com", projectId: "payquickpay-487ef", storageBucket: "payquickpay-487ef.firebasestorage.app", messagingSenderId: "368108778411", appId: "1:368108778411:web:03dcbc47e46568d51b58ee" };
firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
function getVal(k){
  let u=new URLSearchParams(location.search); if(u.get(k)) return decodeURIComponent(u.get(k));
  try{let v=sessionStorage.getItem('pq_'+k); if(v) return v;}catch(e){}
  try{let v=localStorage.getItem('pq_'+k); if(v) return v;}catch(e){}
  try{ if(k=='id'){let v=sessionStorage.getItem('currentDistId')||localStorage.getItem('currentDistId'); if(v) return v;} if(k=='user'){let v=sessionStorage.getItem('currentDist')||localStorage.getItem('currentDist'); if(v) return v;} }catch(e){}
  let m=document.cookie.match(new RegExp('pq_'+k+'=([^;]+)')); if(m) return decodeURIComponent(m[1]);
  return null;
}
let distId=getVal('id'), distUser=getVal('user'), distName=getVal('name');
let myBal=0, myRets=[];
function showTab(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['ret','req','his'].forEach(x=>document.getElementById(x+'Tab').classList.add('hide'));document.getElementById(id+'Tab').classList.remove('hide');}
function logout(){try{sessionStorage.clear();localStorage.clear();}catch(e){}location.href='/';}
async function init(){
  // *** JADI ID NAHIN, USERNAME RU FIREBASE RU KHOJIBA - SESSION EXPIRED AU ASIBANI ***
  if(!distId && distUser){
    document.getElementById('distName').innerText='Finding '+distUser+'...';
    let snap=await db.collection('distributors').get();
    snap.forEach(d=>{let o=d.data();let names=[o.user,o.username,o.name,o.phone].filter(Boolean).map(x=>String(x).toLowerCase()); if(names.includes(distUser.toLowerCase())){distId=d.id; distName=o.name||distUser;}});
  }
  if(!distId && !distUser){
    document.getElementById('distName').innerText='Login Karantu - Username Dia';
    let u=prompt('Distributor Username Dia (Ex: NILU)');
    if(!u){location.href='/';return;}
    distUser=u;
    let snap=await db.collection('distributors').get();
    snap.forEach(d=>{let o=d.data();let names=[o.user,o.username,o.name,o.phone].filter(Boolean).map(x=>String(x).toLowerCase()); if(names.includes(u.toLowerCase())){distId=d.id; distName=o.name||u;}});
    if(!distId){alert('Distributor Mililani: '+u); location.href='/'; return;}
  }
  document.getElementById('distName').innerText=(distName||distUser)+' ('+distUser+')';
  startListeners();
}
function startListeners(){
  db.collection('distributors').doc(distId).onSnapshot(d=>{if(!d.exists)return;let o=d.data();myBal=Number(o.balance??o.wallet??0)||0;document.getElementById('bal').innerText='₹ '+myBal.toFixed(2); if(o.name) document.getElementById('distName').innerText=o.name+' ('+(o.user||distUser)+')';});
  db.collection('retailers').where('distributorId','==',distId).onSnapshot(s=>{myRets=[];s.forEach(d=>{let o=d.data();o.id=d.id;myRets.push(o)});renderRets();});
  db.collection('transactions').where('distributorId','==',distId).orderBy('createdAt','desc').limit(50).onSnapshot(s=>{let h='';s.forEach(d=>{let t=d.data();h+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px"><span><b>${t.type||'Transfer'}</b><br><small>${t.retailerName||''}</small></span><b>₹ ${Number(t.amount||0)}</b></div>`});document.getElementById('hist').innerHTML=h||'No history yet';});
  db.collection('balanceRequests').where('distributorId','==',distId).orderBy('createdAt','desc').limit(20).onSnapshot(s=>{let h='';s.forEach(d=>{let t=d.data();h+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px"><span><b>₹ ${Number(t.amount||0)}</b> - ${t.status||'Pending'}</span></div>`});document.getElementById('myReq').innerHTML=h||'No request yet';});
}
function renderRets(){document.getElementById('retCount').innerText=myRets.length;document.getElementById('retList').innerHTML=myRets.map(r=>`<tr><td><b>${r.name||'-'}</b><br><small>${r.phone||''}</small></td><td>${r.user||r.username||'-'}<br><small>Pass: ${r.pass||r.password||'-'}</small></td><td><b>₹ ${(Number(r.balance??r.wallet??0)||0).toFixed(2)}</b></td><td><button class="btnG" onclick="quickAdd('${r.id}',${Number(r.balance??r.wallet??0)||0},'${r.name||''}')">+ Add</button> <button class="btnB" onclick="copyLogin('${r.user||r.username}','${r.pass||r.password}')">Copy</button></td></tr>`).join('')||'<tr><td colspan=4 style="text-align:center">No Retailer Yet</td></tr>';document.getElementById('tr-ret').innerHTML='<option value="">Select Retailer</option>'+myRets.map(r=>`<option value="${r.id}|${Number(r.balance??r.wallet??0)||0}|${r.name||''}">${r.name} (${r.user}) - ₹${Number(r.balance??r.wallet??0)||0}</option>`).join('');}
async function addRetailer(){let n=document.getElementById('r-name').value.trim(),u=document.getElementById('r-user').value.trim(),p=document.getElementById('r-pass').value.trim(),ph=document.getElementById('r-phone').value.trim(),b=Number(document.getElementById('r-bal').value||0);if(!n||!u||!p) return alert('Fill all');if(b>myBal) return alert('Balance Kam: ₹'+myBal);await db.collection('retailers').add({name:n,user:u,username:u,pass:p,password:p,phone:ph,mobile:ph,balance:b,wallet:b,distributorId:distId,distributorUser:distUser,distributorName:distName,createdAt:firebase.firestore.FieldValue.serverTimestamp()});if(b>0){await db.collection('distributors').doc(distId).update({balance:myBal-b,wallet:myBal-b});await db.collection('transactions').add({type:'Retailer Created',amount:b,distributorId:distId,retailerName:n,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}document.querySelectorAll('#retTab input').forEach(i=>i.value='');alert('Retailer Created: '+u+' / '+p);}
async function quickAdd(id,oldBal,rName){let amt=Number(prompt('Kete Deba?','100'));if(!amt) return;if(amt>myBal) return alert('Balance Kam');await db.collection('distributors').doc(distId).update({balance:myBal-amt,wallet:myBal-amt});await db.collection('retailers').doc(id).update({balance:oldBal+amt,wallet:oldBal+amt});await db.collection('transactions').add({type:'Balance Transfer',amount:amt,distributorId:distId,retailerName:rName,createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Done!');}
async function transferBal(){let sel=document.getElementById('tr-ret').value;if(!sel) return alert('Retailer select kara');let [rid,oldBal,rName]=sel.split('|');oldBal=Number(oldBal);let amt=Number(document.getElementById('tr-amt').value||0);if(!amt) return alert('Amount dia');if(amt>myBal) return alert('Balance Kam');await db.collection('distributors').doc(distId).update({balance:myBal-amt,wallet:myBal-amt});await db.collection('retailers').doc(rid).update({balance:oldBal+amt,wallet:oldBal+amt});await db.collection('transactions').add({type:'Balance Transfer',amount:amt,distributorId:distId,retailerName:rName,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('trOk').innerText='₹'+amt+' Transfer Done!';document.getElementById('tr-amt').value='';}
async function requestBal(){let amt=Number(document.getElementById('req-amt').value||0);if(!amt) return alert('Amount dia');await db.collection('balanceRequests').add({amount:amt,distributorId:distId,distributorUser:distUser,distributorName:distName,status:'Pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('reqOk').innerText='Request Gala!';document.getElementById('req-amt').value='';}
function copyLogin(u,p){let t=u+' / '+p; if(navigator.clipboard) navigator.clipboard.writeText(t); alert('Copied: '+t);}
window.showTab=showTab;window.logout=logout;window.addRetailer=addRetailer;window.quickAdd=quickAdd;window.transferBal=transferBal;window.requestBal=requestBal;window.copyLogin=copyLogin;
init();
</script></body></html>
