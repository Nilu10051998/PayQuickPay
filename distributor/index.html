<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0f172a;color:#fff;padding:10px}.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.top{display:flex;gap:6px;margin-bottom:10px}.top button{flex:1;padding:10px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #334155}.head{background:#581c87;padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px;border-radius:8px;background:#1e293b;color:#fff;border:1px solid #334155}.tabs button.on{background:#a855f7}.card{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:12px;margin-bottom:8px}.sw{width:36px;height:20px;background:#334155;border-radius:20px;position:relative}.sw.on{background:#22c55e}.box{background:#1e293b;padding:15px;border-radius:14px;border:1px solid #334155;width:100%;max-width:360px}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center;padding:15px}.modal.on{display:flex}input{width:100%;padding:10px;margin:5px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155}#loginPage{min-height:90vh;display:flex;justify-content:center;align-items:center}#dash{display:none}</style></head><body>
<div id="loginPage"><div class="box" style="text-align:center"><h2 style="color:#e879f9">💼 Distributor</h2><p style="color:#aaa;font-size:12px">ID: 8018146505 / Pass: 1234</p><input id="lid" value="8018146505"><input id="lpw" type="password" value="1234"><button class="btn" style="background:#a855f7;color:#fff;width:100%;margin-top:8px" onclick="doLogin()">LOGIN</button><button class="btn" style="background:#334155;color:#fff;width:100%;margin-top:6px" onclick="location.href='/'">HOME</button></div></div>
<div id="dash"><div class="top"><button onclick="location.href='/'">🏠 Home</button><button onclick="doLogout()">🚪 Logout</button><button onclick="document.getElementById('m').classList.add('on')" style="background:#a855f7">➕ Add Retailer</button></div><div class="head"><div><b>Distributor</b><br><small id="rc">0 Retailers</small></div><div style="text-align:right"><b id="b">₹12540</b><br><small>Balance</small></div></div><div class="tabs"><button id="t1" class="on" onclick="showTab(1)">👥 Retailers</button><button id="t2" onclick="showTab(2)">💸 Comm</button><button id="t3" onclick="showTab(3)">⚙️ On/Off</button></div><div id="p1"></div><div id="p2" style="display:none"></div><div id="p3" style="display:none"></div></div>
<div class="modal" id="m"><div class="box"><h3 style="text-align:center;color:#e879f9">Add Retailer</h3><input id="rn" placeholder="Name"><input id="rm" placeholder="Mobile 10 digit"><input id="rb" type="number" placeholder="Balance ₹"><input id="rcm" type="number" value="4" placeholder="Comm %"><button class="btn" style="background:#a855f7;width:100%;margin-top:8px;color:#fff" onclick="saveR()">Save Retailer</button><button class="btn" style="background:#334155;width:100%;margin-top:6px;color:#fff" onclick="document.getElementById('m').classList.remove('on')">Cancel</button></div></div>
<script>
let bal=parseInt(localStorage.getItem('db')||'12540');
function getR(){return JSON.parse(localStorage.getItem('dr')||'[]')}
function setR(a){localStorage.setItem('dr',JSON.stringify(a))}
function getC(){return JSON.parse(localStorage.getItem('dc')||'{"mobile":"4","dth":"4","electricity":"3","water":"3","gas":"3","pan":"20","dmt":"20"}')}
function getS(){return JSON.parse(localStorage.getItem('ds')||'{"mobile":true,"dth":true,"electricity":true,"water":true,"gas":true,"pan":true,"dmt":true}')}
function checkLogin(){let l=localStorage.getItem('dl');if(l==='1'){document.getElementById('loginPage').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('b').innerText='₹'+bal;renderAll();}else{document.getElementById('loginPage').style.display='flex';document.getElementById('dash').style.display='none';}}checkLogin();
function doLogin(){let i=document.getElementById('lid').value;let p=document.getElementById('lpw').value;console.log(i,p);if(i==='8018146505'&&p==='1234'){localStorage.setItem('dl','1');localStorage.setItem('db','12540');bal=12540;checkLogin();alert('Login Success Bhai!');}else{alert('ID 8018146505 Pass 1234 deo!');}}
function doLogout(){localStorage.removeItem('dl');location.reload();}
function showTab(n){document.getElementById('p1').style.display=n===1?'block':'none';document.getElementById('p2').style.display=n===2?'block':'none';document.getElementById('p3').style.display=n===3?'block':'none';document.getElementById('t1').className=n===1?'on':'';document.getElementById('t2').className=n===2?'on':'';document.getElementById('t3').className=n===3?'on':'';}
function renderAll(){let rs=getR();document.getElementById('rc').innerText=rs.length+' Retailers';let h1='';if(rs.length===0)h1='<div class="card" style="text-align:center;color:#888">No Retailer - Add kara</div>';rs.forEach((r,i)=>{h1+=<div class="card"><b>${r.name}</b> - ${r.mobile}<br><small>Bal ₹${r.bal} | Comm ${r.comm}% | ${r.status}</small><br><div style="margin-top:6px;display:flex;gap:4px"><button class="btn" style="background:#a855f7;color:#fff" onclick="editComm(${i})">Comm ${r.comm}%</button><button class="btn" style="background:#334155;color:#fff" onclick="toggleBlock(${i})">${r.status}</button><button class="btn" style="background:#ef4444;color:#fff" onclick="delR(${i})">Del</button></div></div>});document.getElementById('p1').innerHTML=h1;
let gc=getC();let h2='';for(let k in gc){h2+=<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${k}</b><div><input id="c_${k}" value="${gc[k]}" style="width:50px;display:inline;padding:5px">% <button class="btn" style="background:#a855f7;color:#fff" onclick="saveComm('${k}')">Save</button></div></div></div>}document.getElementById('p2').innerHTML=h2;
let ss=getS();let h3='';for(let k in ss){let on=ss[k];h3+=<div class="card"><div style="display:flex;justify-content:space-between"><b>${k}</b><button class="btn" style="background:${on?'#22c55e':'#ef4444'};color:#fff" onclick="tog('${k}')">${on?'ON':'OFF'}</button></div></div>}document.getElementById('p3').innerHTML=h3;}
function saveR(){let n=document.getElementById('rn').value,m=document.getElementById('rm').value,b=parseInt(document.getElementById('rb').value||'0'),c=document.getElementById('rcm').value;if(!n||m.length!==10){alert('Name + 10 digit');return}if(b>bal){alert('Balance kam');return}let rs=getR();rs.push({name:n,mobile:m,bal:b,comm:c,status:'Active'});setR(rs);bal-=b;localStorage.setItem('db',bal);document.getElementById('b').innerText='₹'+bal;document.getElementById('m').classList.remove('on');renderAll();alert('Added!');}
function editComm(i){let v=prompt('New Commission % deo');if(v){let rs=getR();rs[i].comm=v;setR(rs);renderAll();}}
function toggleBlock(i){let rs=getR();rs[i].status=rs[i].status==='Active'?'Blocked':'Active';setR(rs);renderAll();}
function delR(i){if(confirm('Delete?')){let rs=getR();rs.splice(i,1);setR(rs);renderAll();}}
function saveComm(k){let v=document.getElementById('c_'+k).value;let gc=getC();gc[k]=v;localStorage.setItem('dc',JSON.stringify(gc));alert(k+' = '+v+'% Saved');}
function tog(k){let ss=getS();ss[k]=!ss[k];localStorage.setItem('ds',JSON.stringify(ss));renderAll();}
</script></body></html>
