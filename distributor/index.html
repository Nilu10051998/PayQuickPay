<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor - LIVE MUMBAI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>body{margin:0;background:#020617;color:#fff;font-family:system-ui}.top{background:#0f172a;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0;border-bottom:1px solid #1e293b}.card{background:#1e293b;padding:14px;border-radius:12px;text-align:center;border:1px solid #334155;margin:10px 12px}.stat{background:#1e293b;padding:16px;border-radius:12px;border-left:4px solid #22c55e;margin:10px 12px}.login{max-width:360px;margin:80px auto;padding:20px;background:#0f172a;border-radius:15px;border:1px solid #1e293b}input{width:100%;padding:13px;margin:8px 0;background:#1e293b;border:1px solid #334155;color:#fff;border-radius:10px;box-sizing:border-box}button{width:100%;padding:13px;background:#22c55e;color:#000;border:none;border-radius:10px;font-weight:900;cursor:pointer}</style>
</head><body>
<div id="loginBox" class="login"><h3 style="margin-top:0;text-align:center">DISTRIBUTOR LOGIN - MUMBAI</h3><input id="uid" placeholder="User ID - ex: puja"><input id="pwd" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><div id="msg" style="margin-top:10px;text-align:center;font-weight:bold"></div><div style="margin-top:12px;font-size:12px;color:#94a3b8;text-align:center">Mumbai Server - No Block ✅</div></div>
<div id="mainBox" style="display:none"><div class="top"><b>DISTRIBUTOR LIVE</b><span><span id="bal" style="color:#22c55e;font-weight:900">Loading...</span> <button onclick="logout()" style="background:#ef4444;color:#fff;border:none;padding:7px 12px;border-radius:20px;margin-left:10px">Logout</button></span></div><div class="stat"><b id="total">0</b> Tx | Commission: Rs <span id="comm">0</span></div><div style="padding:12px"><h4>LIVE TRANSACTIONS</h4><div id="list">Loading...</div><button onclick="loadTx()" style="background:#334155;color:#fff;margin-top:10px">🔄 Refresh</button></div></div>
<script>
var _supabase = supabase.createClient("https://hiyjowfyszctvhljsdgx.supabase.co","sb_publishable_Qn7F0hoIeGD-q6nzO1HvzA_SFrFuNE2");
var currentUser=null;
function checkLogin(){var id=localStorage.getItem("distributorId"); if(id){currentUser=id; showMain();}}
async function login(){
 var u=document.getElementById("uid").value.trim(), p=document.getElementById("pwd").value.trim(), m=document.getElementById("msg");
 if(!u||!p){m.innerHTML="ID Pass de"; return;} m.innerHTML="Checking Mumbai...";
 try{
  const {data,error}=await _supabase.from("distributors").select("*").eq("user_id",u).eq("password",p).single();
  if(error||!data){m.innerHTML="❌ Wrong ID/Password - Table re puja achi ki check kara"; return;}
  localStorage.setItem("distributorId",u); currentUser=u; m.innerHTML="✅ Login Success!"; showMain();
 }catch(e){m.innerHTML="❌ "+e.message;}
}
function showMain(){document.getElementById("loginBox").style.display="none"; document.getElementById("mainBox").style.display="block"; loadBalance(); loadTx();}
async function loadBalance(){
 try{const {data}=await _supabase.from("distributors").select("*").eq("user_id",currentUser).single(); if(data){document.getElementById("bal").innerText="Rs "+data.wallet_balance;}}catch(e){}
}
async function loadTx(){
 var l=document.getElementById("list"); l.innerHTML="Loading...";
 try{const {data}=await _supabase.from("transactions").select("*").eq("user_id",currentUser).order("created_at",{ascending:false}).limit(20);
  if(!data||data.length==0){l.innerHTML="No transactions yet"; document.getElementById("total").innerText="0"; return;}
  document.getElementById("total").innerText=data.length; let h=""; for(let i=0;i<data.length;i++){h+="<div style='background:#1e293b;padding:10px;border-radius:8px;margin-top:8px'><b>"+data[i].type+"</b> - Rs "+data[i].amount+"<br><small>"+new Date(data[i].created_at).toLocaleString()+"</small></div>";}
  l.innerHTML=h;
 }catch(e){l.innerHTML="Error: "+e.message;}
}
function logout(){localStorage.removeItem("distributorId"); location.reload();}
checkLogin();
</script></body></html>
