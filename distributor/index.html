<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor Panel</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0f172a;color:#fff;padding:10px}.box{background:#1e293b;padding:18px;border-radius:14px;border:1px solid #334155;width:100%;max-width:360px}input{width:100%;padding:11px;margin:6px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155}#L{min-height:100vh;display:flex;justify-content:center;align-items:center}#D{display:none}.card{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:12px;margin-bottom:8px}.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.top{display:flex;gap:6px;margin-bottom:10px}.top button{flex:1;padding:10px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #334155}.head{background:linear-gradient(135deg,#581c87,#0f172a);padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between}.tabs{display:flex;gap:5px;margin-bottom:10px}.tabs button{flex:1;padding:9px;border-radius:8px;background:#1e293b;color:#fff;border:1px solid #334155;font-size:13px}.tabs button.on{background:#a855f7}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center;padding:15px;z-index:99}.modal.on{display:flex}</style></head><body>
<div id="L"><div class="box" style="text-align:center"><h2 style="color:#e879f9">💼 Distributor Panel</h2><input id="lid" placeholder="Distributor ID" style="margin-top:12px"><input id="lpw" type="password" placeholder="Password"><button style="background:#a855f7;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px;font-weight:bold" onclick="doLogin()">LOGIN</button><button style="background:#22c55e;color:#fff;width:100%;padding:11px;border:none;border-radius:8px;margin-top:8px;font-weight:bold" onclick="emLogin()">⚡ EMERGENCY LOGIN</button><button style="background:#334155;color:#fff;width:100%;padding:8px;border:none;border-radius:8px;margin-top:6px" onclick="location.href='/'">HOME</button><p id="er" style="color:#ef4444;font-size:11px;margin-top:6px"></p></div></div>
<div id="D"><div class="top"><button onclick="location.href='/'">🏠 Home</button><button onclick="doLogout()" style="background:#ef4444">🚪 Logout</button><button onclick="openAdd()" style="background:#a855f7">➕ Retailer</button></div><div class="head"><div><b>Distributor Panel</b><br><small id="rc">0 Retailers</small></div><div style="text-align:right"><b id="bal" style="color:#e879f9;font-size:18px">₹12540</b><br><small>Balance</small></div></div><div class="tabs"><button id="t1" class="on" onclick="tab(1)">👥 Retailers</button><button id="t2" onclick="tab(2)">💸 Comm</button><button id="t3" onclick="tab(3)">⚙️ On/Off</button></div><div id="p1"></div><div id="p2" style="display:none"></div><div id="p3" style="display:none"></div></div>
<div class="modal" id="m"><div class="box"><h3 style="color:#e879f9;text-align:center;margin-bottom:8px">Add Retailer With Password</h3><input id="rn" placeholder="Retailer Name ex: Janu"><input id="rm" placeholder="Mobile 10 digit ex: 9040889090"><input id="rp" placeholder="Set Password ex: 1234" style="border:1px solid #a855f7"><input id="rb" type="number" placeholder="Balance ₹ ex: 500"><input id="rcm" type="number" placeholder="Commission % ex: 4"><button class="btn" style="background:#a855f7;width:100%;color:#fff;padding:11px;margin-top:8px" onclick="saveR()">Save Retailer</button><button class="btn" style="background:#334155;width:100%;color:#fff;margin-top:6px" onclick="closeAdd()">Cancel</button></div></div>
<script>
var bal=12540;function init(){var d=localStorage.getItem('db');if(d)bal=parseInt(d);if(localStorage.getItem('dl')=='1'){document.getElementById('L').style.display='none';document.getElementById('D').style.display='block';document.getElementById('bal').innerText='₹'+bal;render();}else{document.getElementById('L').style.display='flex';document.getElementById('D').style.display='none';}}init();
function doLogin(){var a=document.getElementById('lid').value.trim();var b=document.getElementById('lpw').value.trim();if(a=='8018146505'&&b=='1234'){localStorage.setItem('dl','1');init();}else{document.getElementById('er').innerText='Wrong!';}}function emLogin(){localStorage.setItem('dl','1');localStorage.setItem('db','12540');init();}
function doLogout(){localStorage.removeItem('dl');location.reload();}function openAdd(){document.getElementById('m').classList.add('on');}function closeAdd(){document.getElementById('m').classList.remove('on');}function tab(n){document.getElementById('p1').style.display=n==1?'block':'none';document.getElementById('p2').style.display=n==2?'block':'none';document.getElementById('p3').style.display=n==3?'block':'none';document.getElementById('t1').className=n==1?'on':'';document.getElementById('t2').className=n==2?'on':'';document.getElementById('t3').className=n==3?'on':'';}
function getR(){try{var r=localStorage.getItem('dr');if(!r)return [];return JSON.parse(r);}catch(e){return [];}}function setR(a){localStorage.setItem('dr',JSON.stringify(a));}
function render(){try{var rs=getR();document.getElementById('rc').innerText=rs.length+' Retailers';var h1='';if(rs.length==0)h1='<div class="card" style="text-align:center;color:#888;padding:20px">No Retailer Yet</div>';else{for(var i=0;i<rs.length;i++){h1+='<div class="card"><b>'+rs[i].name+'</b> - '+rs[i].mobile+'<br><small style="color:#94a3b8">Pass: '+rs[i].pass+' | Bal ₹'+rs[i].bal+' | Comm '+rs[i].comm+'% | '+rs[i].status+'</small><br><div style="margin-top:8px;display:flex;gap:5px"><button class="btn" style="background:#a855f7;color:#fff;font-size:11px" onclick="editC('+i+')">Comm</button><button class="btn" style="background:#334155;color:#fff;font-size:11px" onclick="blk('+i+')">'+rs[i].status+'</button><button class="btn" style="background:#ef4444;color:#fff;font-size:11px" onclick="delR('+i+')">Del</button></div></div>';}}document.getElementById('p1').innerHTML=h1;
document.getElementById('p2').innerHTML='<div class="card"><b>Mobile Recharge</b> <span style="float:right">4% <button class="btn" style="background:#a855f7;color:#fff">Save</button></span></div>';document.getElementById('p3').innerHTML='<div class="card"><div style="display:flex;justify-content:space-between"><b>All Services</b><button class="btn" style="background:#22c55e;color:#fff">ON</button></div></div>';}catch(e){}}
function saveR(){var n=document.getElementById('rn').value;var m=document.getElementById('rm').value;var p=document.getElementById('rp').value||'1234';var b=parseInt(document.getElementById('rb').value||'0');var c=document.getElementById('rcm').value||'4';if(!n||m.length!=10){alert('Name + 10 digit');return}if(!p){alert('Password deia');return}var rs=getR();rs.push({name:n,mobile:m,pass:p,bal:b,comm:c,status:'Active'});setR(rs);bal-=b;localStorage.setItem('db',bal);document.getElementById('bal').innerText='₹'+bal;closeAdd();render();alert('Retailer Added! ID:'+m+' Pass:'+p);document.getElementById('rn').value='';document.getElementById('rm').value='';document.getElementById('rp').value='';document.getElementById('rb').value='';}
function editC(i){var v=prompt('New Comm %');if(v){var rs=getR();rs[i].comm=v;setR(rs);render();}}function blk(i){var rs=getR();rs[i].status=rs[i].status=='Active'?'Blocked':'Active';setR(rs);render();}function delR(i){if(confirm('Delete?')){var rs=getR();rs.splice(i,1);setR(rs);render();}}
</script></body></html>
