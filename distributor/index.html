<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distributor - PAYQUICKPAY</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#F5F7FB] min-h-screen">

<div class="bg-white p-4 flex justify-between items-center shadow sticky top-0 z-10">
<h1 class="font-bold text-sm">Distributor: <span id="dId" class="text-blue-600"></span></h1>
<button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold">Logout → Main</button>
</div>

<div class="p-4 grid grid-cols-1 md:grid-cols-3 gap-3">
<div class="bg-white p-4 rounded-xl border"><p class="text-[10px] text-slate-500 font-bold">MY WALLET</p><h2 id="wBal" class="text-2xl font-extrabold">Rs 0</h2></div>
<div class="bg-white p-4 rounded-xl border"><p class="text-[10px] text-slate-500 font-bold">COMMISSION EARNED</p><h2 id="cBal" class="text-2xl font-extrabold text-green-600">Rs 0</h2></div>
<div class="bg-white p-4 rounded-xl border"><p class="text-[10px] text-slate-500 font-bold">MY RETAILERS</p><h2 id="rCount" class="text-2xl font-extrabold">0</h2></div>
</div>

<div class="p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
<div class="bg-white p-6 rounded-xl border h-fit">
<h3 class="font-bold text-sm">Create Retailer</h3>
<input id="retId" placeholder="Retailer ID ex: retail01" class="w-full border rounded-lg p-3 text-sm mt-3">
<input id="retPass" placeholder="Password" class="w-full border rounded-lg p-3 text-sm mt-3">
<button onclick="createRet()" class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold text-sm mt-4">Create Retailer</button>
<p id="msg" class="text-xs text-center mt-2 font-bold"></p>
</div>

<div class="lg:col-span-2 bg-white p-6 rounded-xl border">
<h3 class="font-bold text-sm">My Retailers</h3>
<table class="w-full text-sm mt-4">
<thead><tr class="text-[10px] text-slate-500 border-b"><th class="text-left py-2">RETAILER</th><th>WALLET</th><th class="text-right">ACTION</th></tr></thead>
<tbody id="retList"><tr><td colspan="3" class="py-8 text-center text-slate-400">Loading...</td></tr></tbody>
</table>
</div>
</div>

<script>
const SUPA_URL="https://hiyjowfyszctvhljsdgx.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpeWpvd2Z5c3pjdHZobGpzZGd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NTIwMTgsImV4cCI6MjEwODQyODAxOH0.0cuMZjNAQQSnLIlnuxlsr4yRTgsekLliD1Qxu_3awWw";
const H={apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"};

// FIX: Distributor check - NOT admin
if(!localStorage.getItem("distributor")){location.href="/";}
document.getElementById("dId").innerText=localStorage.getItem("distributor");

function logout(){localStorage.removeItem("distributor");location.href="/";}

async function load(){
 let did=localStorage.getItem("distributor");
 let res=await fetch(SUPA_URL+"/rest/v1/distributors?user_id=eq."+did,{headers:H});
 let data=await res.json();
 if(data[0]){document.getElementById("wBal").innerText="Rs "+Number(data[0].wallet||0).toLocaleString();}
 
 let r2=await fetch(SUPA_URL+"/rest/v1/retailers?distributor_id=eq."+did+"&select=*&order=user_id.asc",{headers:H});
 let rets=await r2.json();
 document.getElementById("rCount").innerText=rets.length;
 let html=""; rets.forEach(r=>{
  html+=`<tr class="border-t"><td class="py-3"><b>${r.user_id}</b></td><td>Rs ${Number(r.wallet||0).toLocaleString()}</td><td class="text-right"><button onclick="transferRet('${r.user_id}')" class="bg-green-50 hover:bg-green-100 text-green-700 px-3 py-1.5 rounded-lg text-xs font-bold">+ Balance</button></td></tr>`;
 });
 document.getElementById("retList").innerHTML=html||"<tr><td colspan=3 class='py-8 text-center text-slate-400 text-xs'>No Retailers</td></tr>";

 let r3=await fetch(SUPA_URL+"/rest/v1/commission_earned?user_id=eq."+did,{headers:H});
 let comms=await r3.json(); let tot=0; comms.forEach(c=>tot+=Number(c.commission_amount||0));
 document.getElementById("cBal").innerText="Rs "+tot.toLocaleString();
}

async function createRet(){
 let id=document.getElementById("retId").value.trim(), pw=document.getElementById("retPass").value.trim();
 let did=localStorage.getItem("distributor");
 if(!id||!pw){document.getElementById("msg").innerText="❌ ID Pass darkar"; return;}
 let res=await fetch(SUPA_URL+"/rest/v1/retailers",{method:"POST",headers:H,body:JSON.stringify({user_id:id,password:pw,distributor_id:did,wallet:0})});
 if(res.ok){document.getElementById("msg").innerText="✅ Created!"; document.getElementById("retId").value=""; document.getElementById("retPass").value=""; load();}
 else{let t=await res.text(); document.getElementById("msg").innerText="❌ "+t.slice(0,80);}
}

async function transferRet(rid){
 let amt=prompt("Kitte Rs transfer kariba "+rid+" ku?");
 if(!amt) return; amt=Number(amt);
 let did=localStorage.getItem("distributor");
 let r1=await fetch(SUPA_URL+"/rest/v1/distributors?user_id=eq."+did,{headers:H});
 let d=await r1.json(); let cur=Number(d[0].wallet||0);
 if(cur<amt){alert("Wallet kam achi! Current: Rs "+cur); return;}
 await fetch(SUPA_URL+"/rest/v1/distributors?user_id=eq."+did,{method:"PATCH",headers:H,body:JSON.stringify({wallet:cur-amt})});
 let r2=await fetch(SUPA_URL+"/rest/v1/retailers?user_id=eq."+rid,{headers:H});
 let ret=await r2.json(); let rcur=Number(ret[0].wallet||0);
 await fetch(SUPA_URL+"/rest/v1/retailers?user_id=eq."+rid,{method:"PATCH",headers:H,body:JSON.stringify({wallet:rcur+amt})});
 await fetch(SUPA_URL+"/rest/v1/balance_transfers",{method:"POST",headers:H,body:JSON.stringify({from_id:did,to_id:rid,amount:amt})});
 alert("✅ Rs "+amt+" Transferred to "+rid);
 load();
}
load();
</script>
</body>
</html>
