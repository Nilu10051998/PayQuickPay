<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0f172a;color:#fff;padding:10px}.card{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:12px;margin-bottom:8px}.box{background:#1e293b;padding:18px;border-radius:14px;border:1px solid #334155;width:100%;max-width:360px}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155}#L{min-height:95vh;display:flex;justify-content:center;align-items:center}#D{display:none}.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.top{display:flex;gap:6px;margin-bottom:10px}.top button{flex:1;padding:10px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #334155}.head{background:linear-gradient(135deg,#581c87,#0f172a);padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between}</style></head><body>
<div id="L"><div class="box" style="text-align:center"><h2 style="color:#e879f9">💼 Distributor Panel</h2><p style="color:#666;font-size:11px;margin:8px 0">Login</p><input id="lid" placeholder="ID"><input id="lpw" type="password" placeholder="Password"><button style="background:#a855f7;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px;font-weight:bold" onclick="login1()">LOGIN</button><button style="background:#22c55e;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;margin-top:8px;font-weight:bold" onclick="login2()">⚡ EMERGENCY LOGIN (Click Here)</button><button style="background:#334155;color:#fff;width:100%;padding:8px;border:none;border-radius:8px;margin-top:6px" onclick="location.href='/'">HOME</button><p id="err" style="color:#ef4444;font-size:11px;margin-top:6px"></p></div></div>

<div id="D"><div class="top"><button onclick="location.href='/'">Home</button><button onclick="logout()" style="background:#ef4444">Logout</button><button onclick="document.getElementById('m').style.display='flex'" style="background:#a855f7">+ Retailer</button></div><div class="head"><div><b>Distributor</b><br><small id="rc">0 Retailers</small></div><div style="text-align:right"><b id="bal" style="color:#e879f9">₹12540</b></div></div><div id="list"></div></div>

<div id="m" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center;padding:15px"><div class="box"><h3 style="color:#e879f9;text-align:center">Add Retailer</h3><input id="rn" placeholder="Name"><input id="rm" placeholder="Mobile"><input id="rb" type="number" placeholder="Balance"><input id="rcm" type="number" placeholder="Commission %"><button class="btn" style="background:#a855f7;width:100%;color:#fff;padding:11px;margin-top:8px" onclick="addR()">Save</button><button class="btn" style="background:#334155;width:100%;color:#fff;margin-top:6px" onclick="document.getElementById('m').style.display='none'">Cancel</button></div></div>

<script>
// CHECK LOGIN - SIMPLEST
if(localStorage.getItem('dl')==='1'){showDash();}function showDash(){document.getElementById('L').style.display='none';document.getElementById('D').style.display='block';showList();}
function login1(){var a=document.getElementById('lid').value.trim();var b=document.getElementById('lpw').value.trim();if(a=='8018146505'&&b=='1234'){localStorage.setItem('dl','1');showDash();}else{document.getElementById('err').innerText='Wrong! You typed: '+a+' | Correct: 8018146505 / 1234';}}
function login2(){localStorage.setItem('dl','1');showDash();alert('Emergency Login Success!');}
function logout(){localStorage.removeItem('dl');location.reload();}
function getR(){try{return JSON.parse(localStorage.getItem('dr')||'[]')}catch(e){return []}}
function showList(){var rs=getR();document.getElementById('rc').innerText=rs.length+' Retailers';var h='';if(rs.length==0)h='<div class="card" style="text-align:center;color:#666">No Retailer - Add kara</div>';for(var i=0;i<rs.length;i++){h+='<div class="card"><b>'+rs[i].name+'</b> - '+rs[i].mobile+'<br>Bal ₹'+rs[i].bal+' | '+rs[i].comm+'%</div>'}document.getElementById('list').innerHTML=h;}
function addR(){var n=document.getElementById('rn').value;var m=document.getElementById('rm').value;var b=document.getElementById('rb').value||0;var c=document.getElementById('rcm').value||4;if(!n||m.length!=10){alert('Name + 10 digit');return}var rs=getR();rs.push({name:n,mobile:m,bal:b,comm:c});localStorage.setItem('dr',JSON.stringify(rs));document.getElementById('m').style.display='none';showList();}
</script></body></html>
