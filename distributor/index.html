<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0f172a;color:#fff;padding:10px}.box{background:#1e293b;padding:20px;border-radius:14px;border:1px solid #334155;max-width:360px;width:100%}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155}#L{min-height:95vh;display:flex;justify-content:center;align-items:center}#D{display:none}</style></head><body>
<div id="L"><div class="box" style="text-align:center"><h2 style="color:#e879f9">💼 Distributor Panel</h2><p style="color:#666;font-size:12px;margin:8px 0">Secure Login</p><input id="i" placeholder="Distributor ID"><input id="p" type="password" placeholder="Password"><button style="background:#a855f7;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px;font-weight:bold" onclick="login()">LOGIN</button><button style="background:#334155;color:#fff;width:100%;padding:10px;border:none;border-radius:8px;margin-top:6px" onclick="location.href='/'">HOME</button><p id="msg" style="color:#ef4444;font-size:11px;margin-top:8px"></p></div></div>
<div id="D"><div style="background:#581c87;padding:14px;border-radius:14px;display:flex;justify-content:space-between"><b>Distributor - OK</b><button style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px" onclick="localStorage.removeItem('dl');location.reload()">Logout</button></div><div id="list" style="margin-top:10px"></div></div>
<script>
if(localStorage.getItem('dl')=='1'){document.getElementById('L').style.display='none';document.getElementById('D').style.display='block';}
function login(){var a=document.getElementById('i').value.trim();var b=document.getElementById('p').value.trim();document.getElementById('msg').innerText='Trying: '+a+' / '+b;if(a=='8018146505'&&b=='1234'){localStorage.setItem('dl','1');document.getElementById('L').style.display='none';document.getElementById('D').style.display='block';alert('Login Success!');}else{document.getElementById('msg').innerText='Wrong! You typed '+a+' / '+b+' | Correct is 8018146505 / 1234';}}
</script></body></html>
