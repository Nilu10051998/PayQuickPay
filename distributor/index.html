<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor Panel</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0f172a;color:#fff;padding:10px}.top{display:flex;gap:8px;margin-bottom:10px}.top button{flex:1;padding:10px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:12px}.head{background:linear-gradient(135deg,#581c87,#0f172a);padding:14px;border-radius:14px;border:1px solid #334155;margin-bottom:10px;display:flex;justify-content:space-between}.bal{color:#e879f9;font-weight:bold;font-size:18px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:9px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:11px}.tabs button.on{background:#a855f7}.card{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:12px;margin-bottom:8px}.card b{font-size:13px}.card small{color:#94a3b8;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.sw{width:38px;height:22px;background:#334155;border-radius:20px;position:relative;cursor:pointer}.sw.on{background:#22c55e}.sw:after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}.sw.on:after{left:18px}.inp{width:60px;padding:5px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff;text-align:center}.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:11px}.btn-p{background:#a855f7;color:#fff}.btn-g{background:#334155;color:#fff}.box{background:#1e293b;border:1px solid #334155;padding:15px;border-radius:14px;width:100%;max-width:360px}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center;z-index:20;padding:15px}.modal.on{display:flex}input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}#loginPage{min-height:90vh;display:flex;justify-content:center;align-items:center}#dash{display:none}.list{max-height:60vh;overflow:auto}</style></head><body>
<div id="loginPage"><div class="box" style="text-align:center"><h2 style="color:#e879f9">💼 Distributor Login</h2><p style="color:#94a3b8;font-size:11px;margin:8px 0">ID: 8018146505 / Pass: 1234</p><input id="lid" value="8018146505" placeholder="ID"><input id="lpw" type="password" value="1234" placeholder="Pass"><button class="btn btn-p" style="width:100%;margin-top:8px" onclick="doLogin()">Login</button><button class="btn btn-g" style="width:100%;margin-top:6px" onclick="location.href='/'">🏠 Home</button></div></div>
<div id="dash"><div class="top"><button onclick="location.href='/'">🏠 Home</button><button onclick="doLogout()">🚪 Logout</button><button onclick="openAdd()">➕ Add Retailer</button></div><div class="head"><div><h3>Distributor Panel</h3><small id="rc">Retailers: 0</small></div><div style="text-align:right"><div class="bal" id="b">₹12540</div><small>Balance</small></div></div><div class="tabs"><button id="t1" class="on" onclick="tab(1)">👥 Retailers</button><button id="t2" onclick="tab(2)">💸 Commission</button><button id="t3" onclick="tab(3)">⚙️ Services</button></div><div id="p1"></div><div id="p2" style="display:none"></div><div id="p3" style="display:none"></div></div>
<div class="modal" id="m"><div class="box"><h3 id="mt" style="color:#e879f9;text-align:center">Add Retailer</h3><input id="rn" placeholder="Retailer Name"><input id="rm" placeholder="Mobile No - 10 digit"><input id="rb" placeholder="Opening Balance ₹" type="number"><input id="rcm" placeholder="Commission % - ex 4" type="number" value="4"><div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-p" style="flex:1" onclick="saveR()">Save</button><button class="btn btn-g" style="flex:1" onclick="closeM()">Cancel</button></div></div></div>
<div class="modal" id="m2"><div class="box"><h3 style="color:#e879f9;text-align:center">Edit Commission</h3><p id="en" style="text-align:center;color:#94a3b8;font-size:12px;margin:6px 0"></p><input id="ecm" type="number" placeholder="Commission %"><div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-p" style="flex:1" onclick="saveComm()">Update</button><button class="btn btn-g" style="flex:1" onclick="closeM2()">Cancel</button></div></div></div>
<script>
let bal=parseInt(localStorage.getItem('db')||'12540');let curEdit=null;
let services=['mobile','dth','electricity','water','gas','fastag','broadband','pan','aeps','dmt','upi'];
let names={mobile:'📱 Mobile',dth:'📺 DTH',electricity:'💡 Electricity',water:'💧 Water',gas:'🔥 Gas',fastag:'🚗 FASTag',broadband:'🌐 Broadband',pan:'🪪 PAN',aeps:'🏧 AEPS',dmt:'💸 DMT',upi:'💳 UPI'};
let defComm={mobile:4,dth:4,electricity:3,water:3,gas:3,fastag:3,broadband:3,pan:20,dmt:20,aeps:20,upi:1};
function getR(){return JSON.parse(localStorage.getItem('d_retailers')||'[]')}function setR(a){localStorage.setItem('d_retailers',JSON.stringify(a))}
function getGC(){return JSON.parse(localStorage.getItem('d_gcomm')||JSON.stringify(defComm))}function setGC(o){localStorage.setItem('d_gcomm',JSON.stringify(o))}
function getSS(){return JSON.parse(localStorage.getItem('d_sstatus')||'{}')}function setSS(o){localStorage.setItem('d_sstatus',JSON.stringify(o))}
function check(){if(localStorage.getItem('dl')==='1'){document.getElementById('loginPage').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('b').innerText='₹'+bal;render();}else{document.getElementById('loginPage').style.display='flex';document.getElementById('dash').style.display='none';}}check();
function doLogin(){if(document.getElementById('lid').value==='8018146505'&&document.getElementById('lpw').value==='1234'){localStorage.setItem('dl','1');check();}else alert('ID/Pass bhul');}
function doLogout(){localStorage.removeItem('dl');location.reload();}
function tab(n){document.getElementById('p1').style.display=n===1?'block':'none';document.getElementById('p2').style.display=n===2?'block':'none';document.getElementById('p3').style.display=n===3?'block':'none';document.getElementById('t1').className=n===1?'on':'';document.getElementById('t2').className=n===2?'on':'';document.getElementById('t3').className=n===3?'on':'';render();}
function render(){let rs=getR();document.getElementById('rc').innerText='Retailers: '+rs.length+' | Bal: ₹'+bal; // P1 Retailers
let h1='';if(rs.length===0)h1='<div class="card" style="text-align:center;color:#94a3b8">No Retailer Yet - Add kara</div>';else rs.forEach((r,i)=>{h1+=<div class="card"><div class="row"><div><b>${r.name}</b><br><small>${r.mobile} | Bal ₹${r.bal} | Comm ${r.comm}% | ${r.status}</small></div><div style="display:flex;gap:4px"><button class="btn btn-p" onclick="editComm(${i})">Comm</button><button class="btn btn-g" onclick="toggleR(${i})">${r.status==='Active'?'Block':'Active'}</button></div></div><div class="row"><small>Admin: 8018146505</small><button class="btn btn-g" onclick="delR(${i})">🗑️ Delete</button></div></div>});document.getElementById('p1').innerHTML=h1;
let gc=getGC();let h2='<div class="card"><b>Global Commission Set (Retailer ku etiki miliba)</b><br><small>Distributor Commission 6% ru etiki deba</small></div>';services.forEach(s=>{h2+=<div class="card"><div class="row"><b>${names[s]}</b><div style="display:flex;gap:6px;align-items:center"><input class="inp" id="gc_${s}" value="${gc[s]||0}"><span style="font-size:11px">%</span><button class="btn btn-p" onclick="saveGC('${s}')">Save</button></div></div></div>});document.getElementById('p2').innerHTML=h2;
let ss=getSS();let h3='<div class="card"><b>Services On / Off</b><br><small>Off kale Retailer dekhi pariba nahi</small></div>';services.forEach(s=>{let on=ss[s]!==false;h3+=<div class="card"><div class="row"><b>${names[s]}</b><div class="sw ${on?'on':''}" onclick="togS('${s}')"></div></div></div>});document.getElementById('p3').innerHTML=h3;}
function openAdd(){document.getElementById('m').classList.add('on')}function closeM(){document.getElementById('m').classList.remove('on')}function closeM2(){document.getElementById('m2').classList.remove('on')}
function saveR(){let n=document.getElementById('rn').value,m=document.getElementById('rm').value,b=parseInt(document.getElementById('rb').value||'0'),c=document.getElementById('rcm').value;if(!n||m.length!==10){alert('Name + 10 digit mobile bhara');return}if(b>bal){alert('Balance kam!');return}let rs=getR();rs.push({name:n,mobile:m,bal:b,comm:c,status:'Active'});setR(rs);bal-=b;localStorage.setItem('db',bal);document.getElementById('b').innerText='₹'+bal;closeM();render();alert('Retailer Added!');}
function editComm(i){curEdit=i;let rs=getR();document.getElementById('en').innerText=rs[i].name+' ('+rs[i].mobile+')';document.getElementById('ecm').value=rs[i].comm;document.getElementById('m2').classList.add('on')}
function saveComm(){let v=document.getElementById('ecm').value;let rs=getR();rs[curEdit].comm=v;setR(rs);closeM2();render();}
function toggleR(i){let rs=getR();rs[i].status=rs[i].status==='Active'?'Blocked':'Active';setR(rs);render();}
function delR(i){if(confirm('Delete?')){let rs=getR();rs.splice(i,1);setR(rs);render();}}
function saveGC(s){let v=document.getElementById('gc_'+s).value;let gc=getGC();gc[s]=v;setGC(gc);alert(names[s]+' Commission '+v+'% Saved!');}
function togS(s){let ss=getSS();ss[s]=ss[s]===false?true:false;if(ss[s]===true)delete ss[s];else if(ss[s]===false){}else ss[s]=false; // toggle logic
if(getSS()[s]===false)ss[s]=true;else ss[s]=false; // simple toggle
let cur=getSS();cur[s]=!(cur[s]!==false);setSS(cur);render();}
</script></body></html>
