<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayQuickPay - Distributor</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#f1f5f9} .header{background:#0f172a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center} .wrap{max-width:600px;margin:0 auto;padding:16px} .card{background:#fff;padding:18px;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:14px} input,select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;outline:none} .btn{width:100%;padding:13px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer} .logout{background:#fff;color:#0f172a;border:none;padding:8px 14px;border-radius:8px;font-weight:600} table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:10px;border-bottom:1px solid #f1f5f9;text-align:left} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body>
<div class="header"><div><b id="uName">DISTRIBUTOR</b><br><small style="color:#94a3b8">Wallet: ₹ <span id="uWallet">0</span></small></div><button class="logout" onclick="logout()">Logout</button></div>
<div class="wrap">
<div class="card"><h3 style="margin-bottom:12px">Add Retailer</h3><div class="grid2"><input id="rName" placeholder="Full Name"><input id="rMobile" placeholder="Mobile"></div><div class="grid2"><input id="rUser" placeholder="Username"><input id="rPass" type="password" placeholder="Password"></div><button class="btn" onclick="addRet()">Add Retailer</button></div>
<div class="card"><h3 style="margin-bottom:10px">My Retailers</h3><table><thead><tr><th>Name</th><th>Mobile</th><th>Wallet</th></tr></thead><tbody id="retList"></tbody></table></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:03dcbc47e46568d51b58ee"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let userId=localStorage.getItem('userId'); let userName=localStorage.getItem('userName');
if(!userId){ location.href='../index.html'; }
document.getElementById('uName').innerText=userName||'DISTRIBUTOR';
function logout(){ localStorage.clear(); location.href='../index.html'; }
async function loadAll(){
 let d=await db.collection('distributors').doc(userId).get(); if(d.exists){ document.getElementById('uWallet').innerText=d.data().wallet||0; }
 let s=await db.collection('retailers').where('distributorName','==',userName).get(); let h='';
 s.forEach(doc=>{let x=doc.data(); h+=`<tr><td>${x.name}</td><td>${x.mobile||''}</td><td>₹ ${x.wallet||0}</td></tr>`;});
 document.getElementById('retList').innerHTML=h||'<tr><td colspan=3>No Retailers</td></tr>';
}
async function addRet(){ let n=rName.value.trim(),m=rMobile.value.trim(),u=rUser.value.trim(),p=rPass.value.trim(); if(!n||!u||!p) return alert('Fill all'); await db.collection('retailers').add({name:n,mobile:m,username:u,password:u,pass:p,user:u,distributorName:userName,wallet:0,createdAt:new Date()}); location.reload(); }
loadAll();
</script></body></html>
