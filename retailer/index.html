<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuickPay Retailer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:white;padding:10px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#1e293b;border-radius:10px;margin-bottom:15px}
.logo{color:#38bdf8;font-size:22px;font-weight:bold}
.balance{background:#3b82f6;padding:10px 20px;border-radius:12px;font-weight:bold}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px;padding-bottom:5px}
.tab{padding:10px 20px;background:#1e293b;border-radius:20px;border:none;color:white;cursor:pointer;white-space:nowrap}
.tab.active{background:#0ea5e9}
.card{background:#1e293b;padding:20px;border-radius:15px}
label{color:#94a3b8;font-size:14px;margin:10px 0 5px;display:block}
select,input{width:100%;padding:14px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:white;font-size:16px;margin-bottom:10px}
.btn{width:100%;padding:15px;background:linear-gradient(90deg,#0ea5e9,#6366f1);border:none;border-radius:12px;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:0.6}
.history{margin-top:20px}
.h-item{background:#1e293b;padding:12px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between}
.success{color:#22c55e} .failed{color:#ef4444}
</style>
</head>
<body>
<div class="header">
<div class="logo">PayQuickPay</div>
<div style="display:flex;gap:10px;align-items:center">
<span id="user">Nilu</span>
<div class="balance">Rs <span id="bal">4792</span></div>
</div>
</div>

<div class="tabs">
<button class="tab active" data-s="MOBILE">MOBILE</button>
<button class="tab" data-s="DTH">DTH</button>
<button class="tab" data-s="ELECTRICITY">ELECTRICITY</button>
<button class="tab" data-s="GAS">GAS</button>
<button class="tab" data-s="WATER">WATER</button>
</div>

<div class="card">
<label>Operator</label>
<select id="op"><option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option></select>
<label>Mobile Number</label>
<input id="num" type="tel" placeholder="10 digit number" maxlength="10">
<label>Amount</label>
<input id="amt" type="number" placeholder="Amount">
<button id="payBtn" class="btn">Recharge Now</button>
<div id="msg" style="text-align:center;margin-top:10px;color:#38bdf8"></div>
</div>

<div class="history">
<h3>Recent Transactions</h3>
<div id="list"><div style="text-align:center;color:#64748b;margin-top:20px">No history</div></div>
</div>

<script>
let service = 'MOBILE';
let balance = 4792;
let history = JSON.parse(localStorage.getItem('pqp_history')||'[]');

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    service=t.dataset.s;
  }
});

function renderHistory(){
  const list=document.getElementById('list');
  if(history.length==0){list.innerHTML='<div style="text-align:center;color:#64748b;margin-top:20px">No history</div>';return}
  list.innerHTML=history.map(h=>`
    <div class="h-item">
      <div><b>${h.num}</b><br><small>${h.service} - Rs ${h.amt}</small></div>
      <div class="${h.status=='SUCCESS'?'success':'failed'}"><b>${h.status}</b><br><small>${h.txn}</small></div>
    </div>
  `).join('');
}
renderHistory();

document.getElementById('payBtn').onclick=async()=>{
  const num=document.getElementById('num').value.trim();
  const amt=parseInt(document.getElementById('amt').value);
  const btn=document.getElementById('payBtn');
  const msg=document.getElementById('msg');

  if(num.length!=10){alert('10 digit number dia');return}
  if(!amt || amt<10){alert('Amount 10+ dia');return}
  if(amt>balance){alert('Balance kam achi');return}

  btn.disabled=true;
  btn.innerHTML='⏳ Processing...';
  msg.innerHTML='⏳ Processing...';

  try{
    // Call our API
    const res=await fetch('/api/kwik',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({number:num,amount:amt,service:service})
    });
    
    const data=await res.json();
    console.log('API Response:',data);

    if(data.success){
      balance-=amt;
      document.getElementById('bal').innerText=balance;
      const tx={num:num,amt:amt,service:service,status:'SUCCESS',txn:data.txnid,time:new Date().toLocaleString()};
      history.unshift(tx);
      localStorage.setItem('pqp_history',JSON.stringify(history));
      renderHistory();
      msg.innerHTML='✅ SUCCESS - '+data.txnid;
      btn.innerHTML='✅ Success!';
      document.getElementById('num').value='';
      document.getElementById('amt').value='';
      setTimeout(()=>{btn.innerHTML='Recharge Now';msg.innerHTML=''},2000);
    }else{
      msg.innerHTML='❌ FAILED: '+(data.message||'Error');
      btn.innerHTML='Failed - Retry';
    }
  }catch(e){
    console.error(e);
    msg.innerHTML='❌ Error: '+e.message;
    btn.innerHTML='Failed - Retry';
  }
  btn.disabled=false;
};
</script>
</body>
</html>
