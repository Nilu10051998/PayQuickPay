<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live</title>
<style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:16px}.card{background:#1e293b;width:100%;max-width:420px;border-radius:20px;padding:20px}.top{background:#22c55e;color:#000;text-align:center;padding:20px;border-radius:16px}#bal{font-size:44px;font-weight:900}#log{background:#000;color:#0f0;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all;margin:10px 0}input,select,button{width:100%;padding:14px;border-radius:12px;border:none;margin:6px 0}button{background:#22c55e;font-weight:900}</style></head><body><div class="card"><div class="top"><div id="bal">Loading...</div><div id="shop">Connecting...</div></div><div id="log">Init...</div><select id="opr"><option>Jio</option><option>Airtel</option></select><input id="mob" value="8018146505"><input id="amt" type="number" value="10"><button onclick="recharge()">RECHARGE</button><div id="hist"></div></div>
<script>
var SURL="https://mojdysebckbodadjdctj.supabase.co";
var SKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic";
var RET=null;
function L(t){document.getElementById("log").innerText=t}
async function init(){
 L("STEP1 OK");
 try{
  var url=SURL+"/rest/v1/retailers?select=*&limit=1";
  L("STEP2 fetching "+url);
  var r=await fetch(url,{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});
  var txt=await r.text();
  L("STEP3 status "+r.status+" body "+txt.substring(0,200));
  var d=JSON.parse(txt);
  RET=d[0];
  document.getElementById("bal").innerText="Rs "+RET.wallet_balance;
  document.getElementById("shop").innerText="LIVE OK "+RET.mobile;
  L("SUCCESS Rs "+RET.wallet_balance);
  loadHist();
 }catch(e){L("ERR "+e.message)}
}
async function recharge(){
 var m=document.getElementById("mob").value;
 var a=parseInt(document.getElementById("amt").value);
 var nb=RET.wallet_balance-a;
 await fetch(SURL+"/rest/v1/retailers?id=eq."+RET.id,{method:"PATCH",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({wallet_balance:nb})});
 RET.wallet_balance=nb;
 document.getElementById("bal").innerText="Rs "+nb;
 L("DONE Rs "+nb);
}
async function loadHist(){
 var r=await fetch(SURL+"/rest/v1/recharge_history?select=*&order=created_at.desc&limit=5",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});
 var d=await r.json();
 var h="History: ";
 for(var i=0;i<d.length;i++){h=h+" Rs"+d[i].amount+" ";}
 document.getElementById("hist").innerText=h;
}
init();
</script></body></html>
