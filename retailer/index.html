<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayQuickPay REAL</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:12px}
.box{background:#1e293b;width:100%;max-width:400px;border-radius:18px;padding:20px}
.bal{background:#22c55e;padding:18px;border-radius:14px;color:#000;text-align:center}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;box-sizing:border-box}
button{background:#22c55e;font-weight:900}
#log{background:#000;color:#0f0;padding:8px;border-radius:6px;font-size:11px;word-break:break-all}
.it{background:#0f172a;padding:8px;margin:4px 0;border-radius:6px}
</style>
</head>
<body>
<div class="box">
<div class="bal">
<h1 id="bal">Loading...</h1>
<small id="inf">Connecting...</small>
</div>
<div id="log">Init...</div>
<input id="mob" placeholder="Mobile" value="8018146505">
<input id="amt" type="number" placeholder="Amount" value="10">
<button onclick="doRecharge()">RECHARGE NOW</button>
<div id="hist"></div>
</div>

<script>
const SURL = "https://mojdysebckbodadjdctj.supabase.co";
const SKEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic";
let RET = null;

async function init() {
  document.getElementById("log").innerText = "Step 1: Connecting to Supabase...";
  try {
    const res = await fetch(SURL + "/rest/v1/retailers?select=*&limit=1", {
      headers: { "apikey": SKEY, "Authorization": "Bearer " + SKEY }
    });
    document.getElementById("log").innerText = "Step 2: Status " + res.status;
    const txt = await res.text();
    document.getElementById("log").innerText = "Step 3: " + txt.substring(0,200);
    if (!res.ok) throw new Error(txt);
    let data = JSON.parse(txt);
    if (data.length === 0) {
      const r2 = await fetch(SURL + "/rest/v1/retailers", {
        method: "POST",
        headers: { "apikey": SKEY, "Authorization": "Bearer " + SKEY, "Content-Type": "application/json", "Prefer": "return=representation" },
        body: JSON.stringify({ mobile: "8018146505", name: "My Shop", wallet_balance: 1000 })
      });
      data = await r2.json();
    }
    RET = data[0];
    document.getElementById("bal").innerText = "₹ " + RET.wallet_balance;
    document.getElementById("inf").innerText = "REAL DB OK - " + RET.mobile;
    document.getElementById("log").innerText = "SUCCESS! Balance ₹" + RET.wallet_balance;
    loadHistory();
  } catch (e) {
    document.getElementById("log").innerText = "ERROR: " + e.message;
  }
}

async function doRecharge() {
  const num = document.getElementById("mob").value;
  const amt = parseInt(document.getElementById("amt").value);
  if (RET.wallet_balance < amt) { alert("Low Balance"); return; }
  const nb = RET.wallet_balance - amt;
  await fetch(SURL + "/rest/v1/retailers?id=eq." + RET.id, {
    method: "PATCH",
    headers: { "apikey": SKEY, "Authorization": "Bearer " + SKEY, "Content-Type": "application/json" },
    body: JSON.stringify({ wallet_balance: nb })
  });
  await fetch(SURL + "/rest/v1/recharge_history", {
    method: "POST",
    headers: { "apikey": SKEY, "Authorization": "Bearer " + SKEY, "Content-Type": "application/json" },
    body: JSON.stringify({ retailer_id: RET.id, mobile_number: num, amount: amt, operator: "Jio", status: "SUCCESS" })
  });
  RET.wallet_balance = nb;
  document.getElementById("bal").innerText = "₹ " + nb;
  loadHistory();
}

async function loadHistory() {
  const r = await fetch(SURL + "/rest/v1/recharge_history?select=*&order=created_at.desc&limit=10", {
    headers: { "apikey": SKEY, "Authorization": "Bearer " + SKEY }
  });
  const d = await r.json();
  let h = "<b>History</b>";
  d.forEach(x => { h += <div class=it>✅ ₹${x.amount} - ${x.mobile_number}</div>; });
  document.getElementById("hist").innerHTML = h;
}

init();
</script>
</body>
</html>
