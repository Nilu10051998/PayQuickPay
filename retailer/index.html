<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayQuick REAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#020617;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:15px}
.box{background:#1e293b;width:100%;max-width:380px;border-radius:16px;padding:20px}
input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;box-sizing:border-box}
.btn{width:100%;padding:14px;background:#22c55e;color:#000;font-weight:bold;border:none;border-radius:10px;cursor:pointer}
.bal{background:#22c55e;padding:18px;border-radius:12px;color:#000;margin:12px 0}
</style>
</head><body>
<div class="box">
<h2 style="text-align:center">PayQuickPay</h2>
<p id="debug" style="background:#000;color:#fbbf24;padding:8px;font-size:11px;border-radius:6px;word-break:break-all">Debug: Starting...</p>
<div class="bal"><small>Wallet</small><h1 id="bal" style="margin:5px 0">₹ Loading...</h1></div>
<input id="mobile" placeholder="Mobile 10 digit"><input id="amount" type="number" placeholder="Amount">
<button class="btn" onclick="doRecharge()">RECHARGE NOW</button>
<p id="status"></p>
</div>
<script>
const SUPA_URL = "https://mojdysebckbodadjdctj.supabase.co";
// TUMA PUBLISHABLE KEY - Ethe Paste Kara
const SUPA_KEY = "sb_publishable_D35DfvBe5XtgITTnKLWSwg_R0Qqsday";

document.getElementById("debug").innerText = "URL: " + SUPA_URL + "\nKey: " + SUPA_KEY.substring(0,30) + "...";

const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
let me=null;
async function init(){
 try{
  let {data,error} = await supa.from("retailers").select("*").limit(1);
  if(error){ document.getElementById("debug").innerText = "ERROR: " + JSON.stringify(error); document.getElementById("bal").innerText = "ERROR"; return; }
  if(!data || data.length==0){
    let {data:d2,error:e2} = await supa.from("retailers").insert({mobile:"8018146505",name:"Retailer",wallet_balance:1000}).select().single();
    if(e2){ document.getElementById("debug").innerText = "INSERT ERROR: " + JSON.stringify(e2); return; }
    data=[d2];
  }
  me=data[0];
  document.getElementById("bal").innerText = "₹ " + me.wallet_balance;
  document.getElementById("debug").innerText = "SUCCESS Connected! ID: " + me.id;
 }catch(e){ document.getElementById("debug").innerText = "CATCH ERROR: " + e.message; }
}
async function doRecharge(){ alert("Balance: "+ (me?me.wallet_balance:"No connection")); }
init();
</script></body></html>
