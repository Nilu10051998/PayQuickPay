<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PayQuickPay Retailer</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,Arial}body{background:#f8fafc;color:#0f172a}.top{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.top button{background:#0f172a;color:#fff;border:none;padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer}.wrap{max-width:900px;margin:0 auto;padding:20px 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:18px}.stat small{color:#64748b;font-size:11px;letter-spacing:.8px;font-weight:700}.stat b{font-size:22px;display:block;margin-top:6px}.tabs{display:flex;gap:8px;margin:20px 0}.tab{background:#fff;border:1px solid #e2e8f0;padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}.tab.active{background:#059669;color:#fff;border-color:#059669}.card{background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:20px;margin-bottom:14px}.card h3{font-size:16px;margin-bottom:14px}.card input,.card select{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;outline:none;font-size:14px}.btn{background:#059669;color:#fff;border:none;padding:13px;border-radius:12px;width:100%;font-weight:700;cursor:pointer}.services{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.svc{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:600}.svc.active{background:#059669;color:#fff;border-color:#059669}.hide{display:none}.empty{padding:20px;text-align:center;color:#94a3b8}.ok{color:#059669;text-align:center;margin-top:8px}.err{color:#dc2626;text-align:center;margin-top:8px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.services{grid-template-columns:repeat(3,1fr)}}</style></head>
<body><div class="top"><div><b>PayQuickPay</b> <span style="color:#64748b;font-size:13px">Retailer</span><div id="retName" style="font-size:13px;font-weight:600"></div><div id="myDist" style="font-size:12px;color:#64748b"></div></div><button onclick="logout()">Logout</button></div>
<div class="wrap"><div class="stats"><div class="stat"><small>WALLET BALANCE</small><b id="bal">₹0</b></div><div class="stat"><small>EARNED COMMISSION</small><b id="myComm" style="color:#059669">₹0</b></div><div class="stat"><small>TODAY SALE</small><b id="todaySale">₹0</b></div></div>
<div class="tabs"><div class="tab active" onclick="showTab('rech',this)">Recharge</div><div class="tab" onclick="showTab('req',this)">Balance Request</div><div class="tab" onclick="showTab('his',this)">Transactions</div></div>
<div id="rechTab"><div class="card"><h3>Recharge</h3><div class="services"><div class="svc active" id="svc-Prepaid" onclick="setSvc('Prepaid')">📱<br>Prepaid</div><div class="svc" id="svc-DTH" onclick="setSvc('DTH')">📺<br>DTH</div><div class="svc" id="svc-Postpaid" onclick="setSvc('Postpaid')">📞<br>Postpaid</div><div class="svc" id="svc-Broadband" onclick="setSvc('Broadband')">🌐<br>Broadband</div></div><br><select id="op"><option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option><option>Tata Play</option><option>Dish TV</option></select><input id="rch-num" placeholder="Mobile Number / Customer ID"><input id="rch-amt" type="number" placeholder="Amount ₹"><button class="btn" onclick="doRecharge()">Recharge Now • Earn 2% Commission</button><div class="ok" id="rchOk"></div><div class="err" id="rchErr"></div></div></div>
<div id="reqTab" class="hide"><div class="card"><h3>Request Balance</h3><input id="req-amt" type="number" placeholder="Amount ₹"><button class="btn" onclick="requestBal()">Send Request</button><div class="ok" id="reqOk"></div></div></div>
<div id="hisTab" class="hide"><div class="card"><h3>Transactions</h3><div id="hist"><div class="empty">No transactions yet</div></div></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:03dcbc47e46568d51b58ee"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const safe=v=>{if(v===undefined||v===null||v==='undefined'||v==='')return '—';return v};
const money=v=>'₹'+(Number(v||0)).toFixed(2);
function getVal(k){let u=new URLSearchParams(location.search);if(u.get(k))return decodeURIComponent(u.get(k));try{let v=sessionStorage.getItem('pq_'+k);if(v)return v;}catch(e){}try{let v=localStorage.getItem('pq_'+k);if(v)return v;}catch(e){}return null;}
let retId=getVal('id'),retUser=getVal('user'),retName=getVal('name'),myBal=0,myDistId='',myDistUser='',curSvc='Prepaid';
function setSvc(s){curSvc=s;document.querySelectorAll('.svc').forEach(e=>e.classList.remove('active'));document.getElementById('svc-'+s).classList.add('active');}
function showTab(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['rech','req','his'].forEach(x=>document.getElementById(x+'Tab').classList.add('hide'));document.getElementById(id+'Tab').classList.remove('hide');}
function logout(){try{sessionStorage.clear();localStorage.clear();}catch(e){}location.href='/';}
async function init(){
  if(!retId&&retUser){let snap=await db.collection('retailers').get();snap.forEach(d=>{let o=d.data();let names=[o.user,o.username,o.name,o.phone].filter(Boolean).map(x=>String(x).toLowerCase());if(names.includes(retUser.toLowerCase())){retId=d.id;retName=o.name||retUser;}});}
  if(!retId){location.href='/';return;}
  db.collection('retailers').doc(retId).onSnapshot(d=>{if(!d.exists)return;let o=d.data();myBal=Number(o.balance||0)||0;myDistId=o.distributorId||'';myDistUser=o.distributorUser||'';document.getElementById('bal').innerText=money(myBal);document.getElementById('myComm').innerText=money(o.earnedCommission);document.getElementById('retName').innerText=safe(o.name)+' • @'+safe(o.user||retUser);document.getElementById('myDist').innerText='Distributor: '+(o.distributorName||'Admin');});
  db.collection('transactions').where('retailerId','==',retId).orderBy('createdAt','desc').limit(50).onSnapshot(s=>{let h='',today=0;let now=new Date();now.setHours(0,0,0,0);s.forEach(d=>{let t=d.data();if(t.createdAt&&t.createdAt.toDate&&t.createdAt.toDate()>=now)today+=Number(t.amount||0);h+=`<div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #f8fafc"><div><b>${safe(t.type)} - ${safe(t.operator)}</b><div style="color:#64748b;font-size:12px">${safe(t.number)} • Commission ${money(t.retailerCommission)}</div></div><b>${money(t.amount)}</b></div>`});if(h)document.getElementById('hist').innerHTML=h;document.getElementById('todaySale').innerText=money(today);});
}
async function doRecharge(){let num=document.getElementById('rch-num').value.trim(),amt=Number(document.getElementById('rch-amt').value||0),op=document.getElementById('op').value;document.getElementById('rchErr').innerText='';document.getElementById('rchOk').innerText='';if(!num||!amt)return document.getElementById('rchErr').innerText='Enter number and amount';if(amt>myBal)return document.getElementById('rchErr').innerText='Insufficient balance';let retComm=amt*0.02,distComm=amt*0.01;let newBal=myBal-amt+retComm;await db.collection('retailers').doc(retId).update({balance:newBal,wallet:newBal,earnedCommission:firebase.firestore.FieldValue.increment(retComm),totalSale:firebase.firestore.FieldValue.increment(amt)});if(myDistId){await db.collection('distributors').doc(myDistId).update({balance:firebase.firestore.FieldValue.increment(distComm),wallet:firebase.firestore.FieldValue.increment(distComm),earnedCommission:firebase.firestore.FieldValue.increment(distComm)});}await db.collection('transactions').add({type:'Recharge',service:curSvc,operator:op,number:num,amount:amt,retailerId:retId,retailerUser:retUser,retailerName:retName,distributorId:myDistId||'',distributorUser:myDistUser||'',retailerCommission:retComm,distributorCommission:distComm,status:'Success',createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('rchOk').innerText='Recharge successful • Commission '+money(retComm)+' earned';document.getElementById('rch-num').value='';document.getElementById('rch-amt').value='';}
async function requestBal(){let amt=Number(document.getElementById('req-amt').value||0);if(!amt)return alert('Enter amount');await db.collection('balanceRequests').add({amount:amt,from:'retailer',retailerId:retId,retailerUser:retUser,retailerName:retName,distributorId:myDistId||'',distributorUser:myDistUser||'',status:'Pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('reqOk').innerText='Request sent';}
window.setSvc=setSvc;window.showTab=showTab;window.logout=logout;window.doRecharge=doRecharge;window.requestBal=requestBal;
init();
</script></body></html>
