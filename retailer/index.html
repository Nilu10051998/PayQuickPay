<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Retailer - PayQuickPay</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}body{background:#f1f5f9}.top{background:#059669;color:#fff;padding:14px 16px;display:flex;justify-content:space-between}.top button{background:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}.wrap{max-width:900px;margin:14px auto;padding:0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border-radius:12px;padding:16px;text-align:center}.stat b{font-size:20px;display:block}.card{background:#fff;border-radius:12px;padding:16px;margin-top:12px}.card input,.card select{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;outline:none}.btn{background:#059669;color:#fff;border:none;padding:13px;border-radius:10px;width:100%;font-weight:700;cursor:pointer}.services{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.svc{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:600}.svc.active{background:#059669;color:#fff}.tabs{display:flex;gap:8px;margin-top:12px}.tab{background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}.tab.active{background:#059669;color:#fff}.hide{display:none}.ok{color:#059669;text-align:center;margin-top:8px}.err{color:#dc2626;text-align:center;margin-top:8px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.services{grid-template-columns:repeat(3,1fr)}}</style></head>
<body><div class="top"><div><b>PAYQUICKPAY • RETAILER</b><br><span id="retName" style="font-size:12px">Loading...</span><br><span id="myDist" style="font-size:11px;opacity:.9"></span></div><button onclick="logout()">Logout</button></div>
<div class="wrap"><div class="stats"><div class="stat"><small>MY BALANCE</small><b id="bal">₹ 0</b></div><div class="stat"><small>EARNED COMMISSION</small><b id="myComm" style="color:#059669">₹ 0</b></div><div class="stat"><small>TODAY SALE</small><b id="todaySale">₹ 0</b></div></div>
<div class="tabs"><div class="tab active" onclick="showTab('rech',this)">⚡ Recharge</div><div class="tab" onclick="showTab('req',this)">💰 Request</div><div class="tab" onclick="showTab('his',this)">📜 History</div></div>
<div id="rechTab"><div class="card"><h3>⚡ Recharge - Commission Miliba!</h3><div class="services"><div class="svc active" id="svc-Prepaid" onclick="setSvc('Prepaid')">📱<br>Prepaid</div><div class="svc" id="svc-DTH" onclick="setSvc('DTH')">📺<br>DTH</div><div class="svc" id="svc-Postpaid" onclick="setSvc('Postpaid')">📞<br>Postpaid</div><div class="svc" id="svc-Broadband" onclick="setSvc('Broadband')">🌐<br>Broadband</div></div><br><select id="op"><option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option><option>Tata Play</option><option>Dish TV</option></select><input id="rch-num" placeholder="Mobile / Customer ID"><input id="rch-amt" type="number" placeholder="Amount ₹"><button class="btn" onclick="doRecharge()">RECHARGE NOW - 2% Commission</button><div class="ok" id="rchOk"></div><div class="err" id="rchErr"></div></div></div>
<div id="reqTab" class="hide"><div class="card"><h3>💰 Distributor / Admin Ku Balance Magiba</h3><input id="req-amt" type="number" placeholder="Amount"><button class="btn" onclick="requestBal()">Send Request</button><div class="ok" id="reqOk"></div></div></div>
<div id="hisTab" class="hide"><div class="card"><h3>📜 My History</h3><div id="hist">Loading...</div></div></div></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI", authDomain: "payquickpay-487ef.firebaseapp.com", projectId: "payquickpay-487ef", storageBucket: "payquickpay-487ef.firebasestorage.app", messagingSenderId: "368108778411", appId: "1:368108778411:web:03dcbc47e46568d51b58ee" };
firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
function getVal(k){let u=new URLSearchParams(location.search);if(u.get(k))return decodeURIComponent(u.get(k));try{let v=sessionStorage.getItem('pq_'+k);if(v)return v;}catch(e){}try{let v=localStorage.getItem('pq_'+k);if(v)return v;}catch(e){}return null;}
let retId=getVal('id'),retUser=getVal('user'),retName=getVal('name'),myBal=0,myDistId='',myDistUser='',curSvc='Prepaid';
function setSvc(s){curSvc=s;document.querySelectorAll('.svc').forEach(e=>e.classList.remove('active'));document.getElementById('svc-'+s).classList.add('active');}
function showTab(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['rech','req','his'].forEach(x=>document.getElementById(x+'Tab').classList.add('hide'));document.getElementById(id+'Tab').classList.remove('hide');}
function logout(){try{sessionStorage.clear();localStorage.clear();}catch(e){}location.href='/';}
async function init(){
  if(!retId&&retUser){let snap=await db.collection('retailers').get();snap.forEach(d=>{let o=d.data();let names=[o.user,o.username,o.name,o.phone].filter(Boolean).map(x=>String(x).toLowerCase());if(names.includes(retUser.toLowerCase())){retId=d.id;retName=o.name||retUser;}});}
  if(!retId){let u=prompt('Retailer Username Dia');if(!u){location.href='/';return;}retUser=u;let snap=await db.collection('retailers').get();snap.forEach(d=>{let o=d.data();let names=[o.user,o.username,o.name,o.phone].filter(Boolean).map(x=>String(x).toLowerCase());if(names.includes(u.toLowerCase())){retId=d.id;retName=o.name||u;}});if(!retId){alert('Not Found');location.href='/';return;}}
  document.getElementById('retName').innerText=(retName||retUser)+' ('+retUser+')';
  db.collection('retailers').doc(retId).onSnapshot(d=>{let o=d.data();myBal=Number(o.balance||0)||0;myDistId=o.distributorId||'';myDistUser=o.distributorUser||'';document.getElementById('bal').innerText='₹ '+myBal.toFixed(2);document.getElementById('myComm').innerText='₹ '+(Number(o.earnedCommission||0)).toFixed(2);document.getElementById('myDist').innerText='Distributor: '+(o.distributorName||'Admin Direct');});
  db.collection('transactions').where('retailerId','==',retId).orderBy('createdAt','desc').limit(50).onSnapshot(s=>{let h='',today=0;let now=new Date();now.setHours(0,0,0,0);s.forEach(d=>{let t=d.data();if(t.createdAt&&t.createdAt.toDate&&t.createdAt.toDate()>=now)today+=Number(t.amount||0);h+=`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13px"><span><b>${t.type} - ${t.operator||''}</b><br><small>${t.number||''} • Comm ₹${Number(t.retailerCommission||0).toFixed(2)}</small></span><b>₹ ${t.amount}</b></div>`});document.getElementById('hist').innerHTML=h||'No history';document.getElementById('todaySale').innerText='₹ '+today.toFixed(2);});
}
async function doRecharge(){let num=document.getElementById('rch-num').value.trim(),amt=Number(document.getElementById('rch-amt').value||0),op=document.getElementById('op').value;if(!num||!amt)return document.getElementById('rchErr').innerText='Number au Amount dia';if(amt>myBal)return document.getElementById('rchErr').innerText='Balance Kam: ₹'+myBal;let retComm=amt*0.02,distComm=amt*0.01;let newBal=myBal-amt+retComm;await db.collection('retailers').doc(retId).update({balance:newBal,wallet:newBal,earnedCommission:firebase.firestore.FieldValue.increment(retComm),totalSale:firebase.firestore.FieldValue.increment(amt)});if(myDistId){await db.collection('distributors').doc(myDistId).update({balance:firebase.firestore.FieldValue.increment(distComm),wallet:firebase.firestore.FieldValue.increment(distComm),earnedCommission:firebase.firestore.FieldValue.increment(distComm)});}await db.collection('transactions').add({type:'Recharge',service:curSvc,operator:op,number:num,amount:amt,retailerId:retId,retailerUser:retUser,retailerName:retName,distributorId:myDistId||'',distributorUser:myDistUser||'',retailerCommission:retComm,distributorCommission:distComm,status:'Success',createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('rchOk').innerText='✅ Success! Commission ₹'+retComm.toFixed(2)+' Milila!';document.getElementById('rch-num').value='';document.getElementById('rch-amt').value='';}
async function requestBal(){let amt=Number(document.getElementById('req-amt').value||0);if(!amt)return alert('Amount dia');await db.collection('balanceRequests').add({amount:amt,from:'retailer',retailerId:retId,retailerUser:retUser,retailerName:retName,distributorId:myDistId||'',distributorUser:myDistUser||'',status:'Pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('reqOk').innerText='Request Gala!';}
window.setSvc=setSvc;window.showTab=showTab;window.logout=logout;window.doRecharge=doRecharge;window.requestBal=requestBal;
init();
</script></body></html>
