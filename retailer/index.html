<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayQuickPay - Retailer</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#f1f5f9} .header{background:#0f172a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center} .wrap{max-width:500px;margin:0 auto;padding:16px} .card{background:#fff;padding:18px;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:14px} input,select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;outline:none} .btn{width:100%;padding:13px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer} .logout{background:#fff;color:#0f172a;border:none;padding:8px 14px;border-radius:8px;font-weight:600} table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:10px;border-bottom:1px solid #f1f5f9;text-align:left}
</style></head><body>
<div class="header"><div><b id="uName">RETAILER</b><br><small style="color:#94a3b8">Wallet: ₹ <span id="uWallet">0</span></small></div><button class="logout" onclick="logout()">Logout</button></div>
<div class="wrap">
<div class="card"><h3 style="margin-bottom:12px">Mobile Recharge</h3><input id="num" placeholder="Mobile Number" maxlength="10"><select id="op"><option value="1">Jio Prepaid</option><option value="2">Airtel Prepaid</option><option value="3">Vi Prepaid</option><option value="4">BSNL Prepaid</option></select><input id="amt" type="number" placeholder="Amount"><button class="btn" onclick="doRecharge()">Recharge Now</button><p id="msg" style="font-size:13px;margin-top:10px"></p></div>
<div class="card"><h3 style="margin-bottom:10px">My History</h3><table><thead><tr><th>Number</th><th>Amount</th><th>Status</th></tr></thead><tbody id="hist"></tbody></table></div>
</div>
<script>
const API="https://payquickpay-api.vercel.app";
const firebaseConfig={apiKey:"AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:03dcbc47e46568d51b58ee"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let userId=localStorage.getItem('userId'); let userName=localStorage.getItem('userName');
if(!userId){ location.href='../index.html'; }
document.getElementById('uName').innerText=userName||'RETAILER';
function logout(){ localStorage.clear(); location.href='../index.html'; }
async function loadWallet(){ let d=await db.collection('retailers').doc(userId).get(); if(d.exists){ document.getElementById('uWallet').innerText=d.data().wallet||0; } }
async function loadHist(){ let s=await db.collection('recharges').where('userId','==',userId).orderBy('createdAt','desc').limit(20).get(); let h=''; s.forEach(doc=>{let d=doc.data(); h+=`<tr><td>${d.number}</td><td>₹ ${d.amount}</td><td>${d.status||'Success'}</td></tr>`;}); document.getElementById('hist').innerHTML=h||'<tr><td colspan=3>No records</td></tr>'; }
async function doRecharge(){
 let number=num.value.trim(), amount=amt.value.trim(), opCode=op.value, opName=op.options[op.selectedIndex].text;
 if(number.length!==10||!amount) return alert('Fill correct number & amount');
 document.getElementById('msg').innerText='Processing...';
 let orderid='PQ'+Date.now();
 try{
  let r=await fetch(`${API}/api/recharge?number=${number}&amount=${amount}&operatorcode=${opCode}&circlecode=23&orderid=${orderid}`);
  let j=await r.json();
  await db.collection('recharges').add({number,amount,operator:opName,userId,userName,orderid,status:'Success',createdAt:new Date()});
  document.getElementById('msg').innerText='Recharge Success - '+orderid;
  location.reload();
 }catch(e){ document.getElementById('msg').innerText='Failed, try again'; }
}
loadWallet(); loadHist();
</script></body></html>
