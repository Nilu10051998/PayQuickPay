<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayQuickPay</title><style>body{margin:0;background:#020617;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding:14px}.card{background:#1e293b;width:100%;max-width:430px;border-radius:22px;padding:18px}.top{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;text-align:center;padding:22px;border-radius:18px}#bal{font-size:48px;font-weight:900}#shop{font-weight:700;margin-top:4px}#log{background:#000;color:#22c55e;padding:10px;border-radius:10px;font-size:12px;margin:12px 0}input,select,button{width:100%;padding:15px;border-radius:14px;border:none;margin:6px 0;font-size:15px}input,select{background:#0f172a;color:#fff;border:1px solid #334155}button{background:#22c55e;color:#000;font-weight:900;font-size:17px}.it{background:#0f172a;padding:12px;border-radius:12px;margin:7px 0;display:flex;justify-content:space-between}</style></head><body><div class="card"><div class="top"><div id="bal">Rs Loading</div><div id="shop">PayQuickPay LIVE</div></div><div id="log">Init...</div><select id="opr"><option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option></select><input id="mob" placeholder="Customer Mobile"><input id="amt" type="number" placeholder="Amount"><button onclick="recharge()">RECHARGE NOW</button><div id="hist" style="margin-top:14px"></div></div><script>
var SURL="https://mojdysebckbodadjdctj.supabase.co";
var SKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic";
var RET=null;
function L(t){document.getElementById("log").innerText=t}
async function init(){
 try{
  var r=await fetch(SURL+"/rest/v1/retailers?select=*&limit=1",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});
  var d=await r.json(); RET=d[0];
  document.getElementById("bal").innerText="Rs "+RET.wallet_balance;
  document.getElementById("shop").innerText=RET.name+" | LIVE OK "+RET.mobile;
  L("SUCCESS Rs "+RET.wallet_balance+" | Ready for recharge");
  loadHist();
 }catch(e){L("ERR "+e.message)}
}
async function recharge(){
 var m=document.getElementById("mob").value; var a=parseInt(document.getElementById("amt").value); var o=document.getElementById("opr").value;
 if(m.length!=10){alert("10 digit mobile");return}
 if(RET.wallet_balance<a){alert("Low balance");return}
 var nb=RET.wallet_balance-a;
 L("Processing Rs "+a+" to "+m+"...");
 await fetch(SURL+"/rest/v1/retailers?id=eq."+RET.id,{method:"PATCH",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({wallet_balance:nb})});
 await fetch(SURL+"/rest/v1/recharge_history",{method:"POST",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({retailer_id:RET.id,mobile_number:m,amount:a,operator:o,status:"SUCCESS"})});
 RET.wallet_balance=nb; document.getElementById("bal").innerText="Rs "+nb; L("DONE Rs "+nb+" | Rs "+a+" to "+m+" Success");
 loadHist();
}
async function loadHist(){
 var r=await fetch(SURL+"/rest/v1/recharge_history?select=*&order=created_at.desc&limit=10",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});
 var d=await r.json(); var h="<b>Live History (REAL DB)</b>";
 for(var i=0;i<d.length;i++){h=h+"<div class=it><span>Rs"+d[i].amount+" - "+d[i].mobile_number+" - "+d[i].operator+"</span><span style=color:#22c55e>"+d[i].status+"</span></div>"}
 document.getElementById("hist").innerHTML=h;
}
init();
</script></body></html>
