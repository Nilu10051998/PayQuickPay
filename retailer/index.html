<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retailer Panel</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f1f4f8}
.top{background:#0b3d91;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:18px}
.card{background:#fff;margin:12px;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
label{font-size:13px;color:#555;display:block;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
input:focus,select:focus{border-color:#0b3d91}
.btn{width:100%;padding:12px;background:#0b3d91;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer}
.btn:disabled{opacity:.6}
.comm{background:#eef6ff;border:1px solid #cfe3ff;padding:10px;border-radius:8px;font-size:14px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}
th{color:#666;font-size:12px}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.success{background:#e6f9ec;color:#0a7a2e}
.failed{background:#fdecea;color:#c00}
.pending{background:#fff3cd;color:#856404}
.wallet{font-size:22px;font-weight:800}
.small{font-size:12px;color:#777}
</style>
</head>
<body>

<div class="top"><b>PayQuickPay</b><span id="userEmail" class="small" style="color:#fff"></span></div>

<div class="card">
<div class="small">Wallet Balance</div>
<div class="wallet">₹ <span id="wallet">0.00</span></div>
</div>

<div class="card">
<h3 style="margin:0">Mobile Recharge</h3>

<label>Mobile Number</label>
<input id="num" type="tel" maxlength="10" placeholder="10 Digit Mobile Number" oninput="this.value=this.value.replace(/[^0-9]/g,'')">

<label>Operator</label>
<select id="op" onchange="showComm()">
<option value="RC">Jio Prepaid</option>
<option value="A">Airtel Prepaid</option>
<option value="V">Vi Prepaid</option>
<option value="BR">BSNL Prepaid - STV</option>
<option value="BT">BSNL Prepaid - Topup</option>
<option value="RC">Jio Postpaid</option>
<option value="A">Airtel Postpaid</option>
</select>

<label>Amount</label>
<input id="amt" type="number" placeholder="Enter Amount" oninput="showComm()">

<div id="commBox" class="comm" style="display:none"></div>

<button class="btn" id="rechargeBtn" onclick="doRecharge()">Recharge Now</button>
<div id="msg" class="small" style="margin-top:10px"></div>
</div>

<div class="card">
<h3 style="margin:0 0 10px">Recent History</h3>
<table>
<thead><tr><th>Number</th><th>Amount</th><th>Commission</th><th>Status</th></tr></thead>
<tbody id="hist"><tr><td colspan="4">Loading...</td></tr></tbody>
</table>
</div>

<script>
// ---------- FIREBASE CONFIG - Replace with your config ----------
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---------- RETAILER COMMISSION RATES - A1 Topup ----------
function getRetailerRate(opCode){
  if(opCode === 'RC') return 0.008;   // Jio 0.80%
  if(opCode === 'A') return 0.013;    // Airtel 1.30%
  if(opCode === 'V') return 0.03;     // Vi 3.00%
  if(opCode === 'BR' || opCode === 'BT') return 0.034; // BSNL 3.40%
  return 0;
}

let userId = null;
let walletBalance = 0;

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href='login.html'; return; }
  userId = user.uid;
  document.getElementById('userEmail').innerText = user.email || '';
  await loadWallet();
  await loadHist();
});

async function loadWallet(){
  let doc = await db.collection('users').doc(userId).get();
  if(doc.exists){
    walletBalance = doc.data().wallet || 0;
    document.getElementById('wallet').innerText = walletBalance.toFixed(2);
  }
}

// ---------- COMMISSION DISPLAY - Only Retailer Commission ----------
function showComm(){
  let amount = parseFloat(document.getElementById('amt').value || 0);
  let opCode = document.getElementById('op').value;
  let box = document.getElementById('commBox');
  if(amount > 0){
    let rate = getRetailerRate(opCode);
    let comm = amount * rate;
    let payable = amount - comm;
    box.style.display = 'block';
    box.innerHTML = `Your Commission: <b>₹ ${comm.toFixed(2)}</b> | Payable: <b>₹ ${payable.toFixed(2)}</b>`;
  } else {
    box.style.display = 'none';
  }
}

// ---------- RECHARGE ----------
async function doRecharge(){
  let number = document.getElementById('num').value.trim();
  let opCode = document.getElementById('op').value;
  let opText = document.getElementById('op').options[document.getElementById('op').selectedIndex].text;
  let amount = parseFloat(document.getElementById('amt').value || 0);
  let msg = document.getElementById('msg');
  let btn = document.getElementById('rechargeBtn');

  if(number.length !== 10){ msg.innerText = 'Enter valid 10 digit number'; return; }
  if(amount <= 0){ msg.innerText = 'Enter valid amount'; return; }

  let rate = getRetailerRate(opCode);
  let commission = amount * rate;
  let payable = amount - commission;

  if(walletBalance < payable){ msg.innerText = 'Insufficient wallet balance'; return; }

  btn.disabled = true;
  btn.innerText = 'Processing...';
  msg.innerText = '';

  try{
    // Vercel API - A1 operator code already mapped (RC, A, V, BR, BT)
    let res = await fetch('https://payquickpay-api.vercel.app/api/recharge', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ number, operatorcode: opCode, amount, orderid: 'PQ' + Date.now() })
    });
    let data = await res.json();

    if(data.status === 'Success' || data.status === 'Pending' || data.success === true){
      // Deduct payable only, commission already adjusted
      await db.collection('users').doc(userId).update({
        wallet: firebase.firestore.FieldValue.increment(-payable)
      });
      await db.collection('recharges').add({
        userId, number, operator: opText, operatorcode: opCode,
        amount, commission, payable,
        status: data.status || 'Success',
        orderid: data.orderid || '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      msg.innerText = 'Recharge ' + (data.status || 'Success');
      document.getElementById('amt').value = '';
      showComm();
      await loadWallet();
      await loadHist();
    } else {
      msg.innerText = 'Failed: ' + (data.message || 'Try again');
    }
  }catch(e){
    msg.innerText = 'Network error. Try again.';
  }
  btn.disabled = false;
  btn.innerText = 'Recharge Now';
}

// ---------- HISTORY - No orderBy, No Index Required ----------
async function loadHist(){
  try{
    let s = await db.collection('recharges').where('userId','==',userId).limit(20).get();
    let arr = [];
    s.forEach(doc => arr.push(doc.data()));
    arr.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    let h = '';
    arr.forEach(d => {
      let cls = d.status === 'Success' ? 'success' : (d.status === 'Failed' ? 'failed' : 'pending');
      h += `<tr><td>${d.number}<br><small>${d.operator || ''}</small></td><td>₹ ${d.amount}</td><td>₹ ${(d.commission || 0).toFixed(2)}</td><td><span class="badge ${cls}">${d.status || 'Success'}</span></td></tr>`;
    });
    document.getElementById('hist').innerHTML = h || '<tr><td colspan="4">No records</td></tr>';
  }catch(e){
    document.getElementById('hist').innerHTML = '<tr><td colspan="4">Unable to load history</td></tr>';
  }
}
</script>
</body>
</html>
