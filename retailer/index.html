<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}

.header small{color:#94a3b8}
.wrap{max-width:500px;margin:0 auto;padding:16px}
.card{background:#fff;padding:18px;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:14px}
input,select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;outline:none;font-size:14px}
.btn{width:100%;padding:13px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
.logout{background:#fff;color:#0f172a;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}

<div class="header"><div><b id="uName">RETAILER</b><br><small>Wallet: ₹ <span id="uWallet">0</span></small></div><button class="logout" onclick="logout()">Logout</button></div>

<div class="wrap">
<div class="card">
<h3 style="margin-bottom:12px">Mobile Recharge</h3>

<p id="detectMsg" style="font-size:12px;color:#16a34a;margin:-6px 0 10px;min-height:16px"></p>

</select>

<select id="circle">

<option value="2">Assam</option>
<option value="3">Bihar</option>
<option value="4">Chennai</option>

</select>

<input id="amt" type="number" placeholder="Amount - Ex: 149">
<button class="btn" onclick="doRecharge()">Recharge Now</button>
<p id="msg" style="font-size:13px;margin-top:10px;word-break:break-all"></p>
</div>

<div class="card"><h3 style="margin-bottom:10px">My History</h3><table><thead><tr><th>Number</th><th>Amount</th><th>Status</th></tr></thead><tbody id="hist"></tbody></table></div>
</div>

<script>
const API="https://payquickpay-api.vercel.app";
const firebaseConfig={apiKey:"AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",authDomain:"payquickpay-487ef.firebaseapp.com",projectId:"payquickpay-487ef",storageBucket:"payquickpay-487ef.firebasestorage.app",messagingSenderId:"368108778411",appId:"1:368108778411:web:03dcbc47e46568d51b58ee"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();

let userId=localStorage.getItem('userId'); let userName=localStorage.getItem('userName');
if(!userId){ location.href='../index.html'; }
document.getElementById('uName').innerText=userName||'RETAILER';

function logout(){ localStorage.clear(); location.href='../index.html'; }

async function loadWallet(){ let d=await db.collection('retailers').doc(userId).get(); if(d.exists){ document.getElementById('uWallet').innerText=d.data().wallet||0; } }

async function loadHist(){ let s=await db.collection('recharges').where('userId','==',userId).orderBy('createdAt','desc').limit(20).get(); let h=''; s.forEach(doc=>{let d=doc.data(); h+=`<tr><td>${d.number}<br><small>${d.operator||''}</small></td><td>₹ ${d.amount}</td><td>${d.status||'Success'}</td></tr>`;}); document.getElementById('hist').innerHTML=h||'<tr><td colspan=3>No records</td></tr>'; }

// ============ AUTO DETECT ============

  let n=document.getElementById('num').value.replace(/[^0-9]/g,'');
  document.getElementById('num').value=n;
  if(n.length<4) return;

  let opSel=document.getElementById('op');
  let cirSel=document.getElementById('circle');
  let msg=document.getElementById('detectMsg');

  // Odisha Common Series
  let map={
    '8018':'4','9437':'4','9438':'4','9439':'4','9450':'4','9451':'4','9452':'4','9453':'4','9454':'4','9455':'4','9456':'4','9457':'4','9458':'4','9459':'4',

    '7200':'2','7201':'2','7202':'2','7203':'2','7204':'2','7205':'2','7206':'2','7207':'2','7208':'2','7209':'2','7210':'2','7211':'2','7212':'2','7213':'2','7214':'2','7215':'2','7216':'2','7217':'2','7218':'2','7219':'2','7220':'2','7221':'2','7222':'2','7223':'2','7224':'2','7225':'2','7226':'2','7227':'2','7228':'2','7229':'2','7230':'2','7231':'2','7232':'2','7233':'2','7234':'2','7235':'2','7236':'2','7237':'2','7238':'2','7239':'2','7240':'2','7241':'2','7242':'2','7243':'2','7244':'2','7245':'2','7246':'2','7247':'2','7248':'2','7249':'2','7250':'2','7251':'2','7252':'2','7253':'2','7254':'2','7255':'2','7256':'2','7257':'2','7258':'2','7259':'2','7260':'2','7261':'2','7262':'2','7263':'2','7264':'2','7265':'2','7266':'2','7267':'2','7268':'2','7269':'2','7270':'2','7271':'2','7272':'2','7273':'2','7274':'2','7275':'2','7276':'2','7277':'2','7278':'2','7279':'2','7280':'2','7281':'2','7282':'2','7283':'2','7284':'2','7285':'2','7286':'2','7287':'2','7288':'2','7289':'2','7290':'2','7291':'2','7292':'2','7293':'2','7294':'2','7295':'2','7296':'2','7297':'2','7298':'2','7299':'2',

    let opName=opSel.options[opSel.selectedIndex].text;
    msg.innerText='✅ Detected: '+opName+' - Odisha';
  } else if(n.length===10){
    // Fallback: 1st digit guess
    if(n.startsWith('6')||n.startsWith('7')||n.startsWith('8')||n.startsWith('9')){
      msg.innerText='⚠️ Operator confirm kara - Ported hele alaga heipare';
    }
  } else {
    msg.innerText='';
  }
}

// ============ RECHARGE ============
async function doRecharge(){
 let number=num.value.trim(), amount=parseInt(amt.value), opCode=op.value, circleCode=circle.value, opName=op.options[op.selectedIndex].text;
 if(number.length!==10||!amount) return alert('Fill correct number & amount');
 let wallet=parseInt(document.getElementById('uWallet').innerText||0);
 if(amount>wallet) return alert('Wallet low! Wallet: ₹ '+wallet);
 document.getElementById('msg').innerText='Processing... Please wait';
 let orderid='PQ'+Date.now();
 try{
  let url=`${API}/api/recharge?number=${number}&amount=${amount}&operatorcode=${opCode}&circlecode=${circleCode}&orderid=${orderid}`;
  let r=await fetch(url); let txt=await r.text();
  document.getElementById('msg').innerText='API Reply: '+txt;
  let j={}; try{j=JSON.parse(txt);}catch(e){}
  if(txt.toLowerCase().includes('success') || j.status==1 || j.status=='1' || j.status=='Success'){
    await db.collection('recharges').add({number,amount,operator:opName,userId,userName,orderid,status:'Success',createdAt:new Date()});
    await db.collection('retailers').doc(userId).update({wallet: wallet - amount});
    document.getElementById('msg').innerText='✅ Recharge Success - '+orderid;
    setTimeout(()=>location.reload(),1500);
  } else {
    await db.collection('recharges').add({number,amount,operator:opName,userId,userName,orderid,status:'Failed - '+txt,createdAt:new Date()});
    document.getElementById('msg').innerText='❌ Failed: '+txt+' - Taka kata nahi';
  }
 }catch(e){ document.getElementById('msg').innerText='Failed: '+e.message; }
}

loadWallet(); loadHist();
</script></body></html>
