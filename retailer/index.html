<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuickPay - Retailer Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f6ff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
.card{background:#fff;width:100%;max-width:400px;padding:30px 25px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center}
h2{color:#1a2b6b;font-size:22px}
.sub{color:#666;margin:8px 0 20px;font-size:14px}
input{width:100%;padding:13px 15px;margin:10px 0;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
input:focus{border-color:#1a2b6b}
button{width:100%;padding:13px;background:#1a2b6b;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:15px}
button:hover{background:#12205a}
.links{margin-top:15px;font-size:14px}
.links a{color:#1a2b6b;text-decoration:none}
.support{margin-top:15px;background:#f8f9ff;padding:10px;border-radius:8px;font-size:13px;color:#555}
</style>
</head>
<body>
<div class="card">
<h2>PayQuickPay.in</h2>
<h2>Retailer Login</h2>
<p class="sub">Dina ku ₹1000+ Income</p>

<input type="text" id="mobile" placeholder="Mobile Number - 10 Digit" maxlength="10">
<input type="password" id="password" placeholder="Password">

<button onclick="retailerLogin()">LOGIN NOW</button>

<div class="links">
<a href="/">← Back to Home</a>
</div>
<div class="support">Support: 7908824917</div>
</div>

<script>
function retailerLogin(){
  const mobile = document.getElementById('mobile').value.trim();
  const pass = document.getElementById('password').value.trim();
  if(mobile.length != 10){ alert('10 Digit Mobile Number dia'); return; }
  if(!pass){ alert('Password dia'); return; }

  // API call - tuma puruna API same rakha heichi
  // Jadi local test karucha ta direct dashboard ku jiba
  localStorage.setItem('retailerMobile', mobile);
  localStorage.setItem('retailerLogin', 'true');
  window.location.href = '/retailer/index.html';
}
</script>
</body>
</html>
