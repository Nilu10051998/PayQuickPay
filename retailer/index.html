<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retailer Dashboard - LIVE</title>
<style>
body{margin:0;background:#020617;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding:14px}
.card{background:#1e293b;width:100%;max-width:430px;border-radius:22px;padding:18px}
.top{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;text-align:center;padding:22px;border-radius:18px}
#bal{font-size:48px;font-weight:900}
#shop{font-weight:700}
#log{background:#000;color:#22c55e;padding:10px;border-radius:10px;margin:12px 0}
input,select{width:100%;padding:15px;border-radius:14px;border:none;background:#0f172a;color:#fff;margin:6px 0}
button{background:#22c55e;color:#000;font-weight:900;border:none;padding:12px;border-radius:12px;width:100%;margin:7px 0;font-size:18px}
</style></head><body><div class="card">
<div class="top"><div id="bal">Rs 4792</div><div id="shop">PayQuickPay | LIVE OK</div></div>
<div id="log">SUCCESS Rs 4792 | Ready for recharge</div>
<select id="opr"><option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option></select>
<input id="mob" placeholder="Customer Mobile">
<input id="amt" type="number" placeholder="Amount">
<button onclick="recharge()">RECHARGE NOW</button>
</div>
<script>
let balance=4792;
function recharge(){
let m=document.getElementById('mob').value;
let a=parseInt(document.getElementById('amt').value);
if(m.length!=10){alert('10 digit mobile');return}
if(a>balance){alert('Low balance');return}
balance=balance-a;
document.getElementById('bal').innerText='Rs '+balance;
document.getElementById('log').innerText='SUCCESS Rs '+a+' to '+m+' | Balance Rs '+balance;
alert('Recharge Success Rs '+a);
}
</script></body></html>
