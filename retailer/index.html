<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayQuickPay REAL</title>
<style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:12px}
.box{background:#1e293b;width:100%;max-width:400px;border-radius:18px;padding:20px}
.bal{background:#22c55e;padding:20px;border-radius:14px;color:#000;margin:15px 0}
input{width:100%;padding:14px;margin:8px 0;border-radius:11px;border:none;box-sizing:border-box}
.btn{width:100%;padding:15px;background:#22c55e;color:#000;font-weight:900;border:none;border-radius:11px;cursor:pointer}
#log{background:#000;color:#0f0;padding:10px;border-radius:8px;margin-top:10px;font-size:11px;white-space:pre-wrap}
</style></head><body><div class="box">
<h2 style="text-align:center">PayQuickPay REAL</h2>
<div class="bal"><small>WALLET</small><h1 id="bal">Loading...</h1><small id="msg">Init...</small></div>
<input id="mobile" value="8018146505"><input id="amount" type="number" value="10">
<button class="btn" onclick="doRecharge()">RECHARGE</button>
<p id="status"></p><div id="history"></div><div id="log">Starting...</div>
</div>
<script>
const API_URL = "https://mojdysebckbodadjdctj.supabase.co";
const API_KEY = "sb_publishable_D35DfVbEsXtgIITnKLwSwG_RQqS5day";
let me=null;
function slog(t){document.getElementById("log").innerText=t;}

async function init(){
  slog("Step 2: Fetching retailers with key "+API_KEY.slice(0,15)+"...");
  try{
    let res = await fetch(API_URL+"/rest/v1/retailers?select=*&limit=1", {headers:{"apikey":API_KEY}});
    let txt = await res.text();
    slog("Status: "+res.status+"\nResponse: "+txt.slice(0,500));
    let data = JSON.parse(txt);
    if(!data.length){
      let r2 = await fetch(API_URL+"/rest/v1/retailers",{method:"POST",headers:{"apikey":API_KEY,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({mobile:"8018146505",name:"shop",wallet_balance:1000})});
      let t2 = await r2.text(); data = JSON.parse(t2);
    }
    me=data[0];
    document.getElementById("bal").innerText="₹ "+me.wallet_balance;
    document.getElementById("msg").innerText=me.name+" | "+me.mobile;
    loadHistory();
  }catch(e){slog("ERROR: "+e.message);}
}
async function doRecharge(){
  let num=document.getElementById("mobile").value; let amt=parseInt(document.getElementById("amount").value);
  if(me.wallet_balance<amt){alert("Low Balance");return;}
  let nb=me.wallet_balance-amt;
  await fetch(API_URL+"/rest/v1/retailers?mobile=eq."+me.mobile,{method:"PATCH",headers:{"apikey":API_KEY,"Content-Type":"application/json"},body:JSON.stringify({wallet_balance:nb})});
  await fetch(API_URL+"/rest/v1/recharge_history",{method:"POST",headers:{"apikey":API_KEY,"Content-Type":"application/json"},body:JSON.stringify({retailer_id:me.id,mobile_number:num,amount:amt,operator:"Jio",status:"SUCCESS"})});
  me.wallet_balance=nb; document.getElementById("bal").innerText="₹ "+nb; document.getElementById("status").innerText="✅ ₹"+amt+" to "+num; loadHistory();
}
async function loadHistory(){
  let r=await fetch(API_URL+"/rest/v1/recharge_history?select=*&order=created_at.desc&limit=10",{headers:{"apikey":API_KEY}});
  let d=await r.json(); let h="<b>REAL HISTORY</b><br><br>"; d.forEach(x=>{h+=✅ ₹${x.amount} - ${x.mobile_number}<br>;}); document.getElementById("history").innerHTML=h;
}
init();
</script></body></html>
