<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayQuickPay - Retailer</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{margin:0;background:#EEF2F7;color:#1A2332;padding-bottom:20px}
.top{background:linear-gradient(135deg,#0F2A5C 0%,#1A4A9A 60%,#2563EB 100%);color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 20px 20px;box-shadow:0 6px 20px rgba(15,42,92,.25)}
.top b{font-size:20px;font-weight:800;letter-spacing:.3px}
.card{background:#fff;margin:14px;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card h3{font-size:16px;color:#0F2A5C}
label{font-size:13px;font-weight:600;color:#344054;display:block;margin:14px 0 6px}
input,select{width:100%;padding:12px 13px;border:1.5px solid #D0D9E6;border-radius:10px;font-size:14px;outline:none;background:#F8FAFC}
input:focus,select:focus{border-color:#2563EB;background:#fff}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#FF7A00,#FF3D00);color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer;box-shadow:0 4px 14px rgba(255,61,0,.25)}
.btn:disabled{opacity:.6}
.comm{background:#E8F0FE;border:1px solid #BFDBFE;padding:11px 12px;border-radius:10px;font-size:14px;margin-top:12px;color:#0F2A5C}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;border-bottom:1px solid #EEF2F7;text-align:left}
th{color:#6B7A90;font-size:11px;text-transform:uppercase}
.badge{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700}
.success{background:#D1FAE5;color:#065F46}
.failed{background:#FEE2E2;color:#991B1B}
.pending{background:#FEF3C7;color:#92400E}
.wallet{font-size:26px;font-weight:800;color:#0F2A5C}
.small{font-size:12px;color:#6B7A90}
.logout{font-size:12px;background:#fff;color:#0F2A5C;border:0;padding:7px 12px;border-radius:20px;cursor:pointer;font-weight:700}
.tab-row{display:flex;gap:10px;margin:0 0 14px}
.tab-btn{flex:1;padding:12px;border:1.5px solid #D0D9E6;border-radius:12px;background:#F8FAFC;font-size:14px;font-weight:700;cursor:pointer;text-align:center}
.tab-btn.on{background:#0F2A5C;color:#fff;border-color:#0F2A5C}
</style>
</head>
<body>
<div class="top"><b>PayQuickPay</b><span><span id="userEmail" class="small" style="color:#fff"></span> <button class="logout" onclick="doLogout()">Logout</button></span></div>
<div class="card">
<div class="small">Wallet Balance - <span id="userName"></span></div>
<div class="wallet">₹ <span id="wallet">0.00</span></div>
</div>
<div class="card">
<div class="tab-row">
<button class="tab-btn on" id="tabMobile" onclick="showService('mobile')">📱 Mobile Recharge</button>
<button class="tab-btn" id="tabDTH" onclick="showService('dth')">📺 DTH</button>
</div>
<div id="mobileBox">
<h3 style="margin:0">Mobile Recharge</h3>
<label>Mobile Number</label>
<input id="num" type="tel" maxlength="10" placeholder="10 Digit Mobile Number" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
<label>Operator</label>
<select id="op" onchange="showComm()">
<option value="" disabled selected>Choose Operator</option>
<option value="RC">Jio Prepaid</option>
<option value="A">Airtel Prepaid</option>
<option value="V">Vi Prepaid</option>
<option value="BR">BSNL Prepaid - STV</option>
<option value="BT">BSNL Prepaid - Topup</option>
<option value="RCP">Jio Postpaid</option>
<option value="AP">Airtel Postpaid</option>
</select>
<label>Amount</label>
<input id="amt" type="number" placeholder="Enter Amount" oninput="showComm()">
<div id="commBox" class="comm" style="display:none"></div>
<button class="btn" id="rechargeBtn" onclick="doRecharge()">Recharge Now</button>
<div id="msg" class="small" style="margin-top:10px"></div>
</div>
<div id="dthBox" style="display:none">
<h3 style="margin:0">DTH Recharge</h3>
<label>VC / Subscriber ID</label>
<input id="dthNum" type="tel" placeholder="VC Number / Subscriber ID" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
<label>Operator</label>
<select id="dthOp" onchange="showDTHComm()">
<option value="" disabled selected>Choose DTH Operator</option>
<option value="DTV">Dish TV</option>
<option value="ATV">Airtel DTH</option>
<option value="TTV">Tata Sky</option>
<option value="STV">Sun Direct</option>
<option value="VTV">Videocon D2H</option>
</select>
<label>Amount</label>
<input id="dthAmt" type="number" placeholder="Enter Amount" oninput="showDTHComm()">
<div id="dthCommBox" class="comm" style="display:none"></div>
<button class="btn" id="dthBtn" onclick="doDTHRecharge()">Recharge DTH Now</button>
<div id="dthMsg" class="small" style="margin-top:10px"></div>
</div>
</div>
<div class="card">
<h3 style="margin:0 0 10px">Recent History</h3>
<table>
<thead><tr><th>Number</th><th>Amount</th><th>Commission</th><th>Status</th></tr></thead>
<tbody id="hist"><tr><td colspan="4">Loading...</td></tr></tbody>
</table>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",
  authDomain: "payquickpay-487ef.firebaseapp.com",
  projectId: "payquickpay-487ef",
  storageBucket: "payquickpay-487ef.firebasestorage.app",
  messagingSenderId: "368108778411",
  appId: "1:368108778411:web:03dcbc47e46568d51b58ee"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// *** THIK HEICHHI - API LINK ***
const API_URL = 'https://payquickpay-api.vercel.app/api/recharge';

function getRetailerRate(opCode){
  if(opCode === 'RC' || opCode === 'RCP') return 0.008;
  if(opCode === 'A' || opCode === 'AP') return 0.013;
  if(opCode === 'V') return 0.03;
  if(opCode === 'BR' || opCode === 'BT') return 0.034;
  return 0;
}

let userId = localStorage.getItem('userId');
let userRole = localStorage.getItem('userRole');
let userName = localStorage.getItem('userName');
let walletBalance = 0;

if(!userId || userRole !== 'retailer'){
  window.location.href = '../login.html';
}

document.getElementById('userName').innerText = userName || '';
document.getElementById('userEmail').innerText = userName || '';

async function doLogout(){
  localStorage.clear();
  window.location.href = '../login.html';
}

async function loadWallet(){
  let doc = await db.collection('retailers').doc(userId).get();
  if(doc.exists){
    walletBalance = parseFloat(doc.data().wallet || 0);
    document.getElementById('wallet').innerText = walletBalance.toFixed(2);
  }
}

function showComm(){
  let amount = parseFloat(document.getElementById('amt').value || 0);
  let opCode = document.getElementById('op').value;
  let box = document.getElementById('commBox');
  if(amount > 0){
    let rate = getRetailerRate(opCode);
    let comm = amount * rate;
    let payable = amount - comm;
    box.style.display = 'block';
    box.innerHTML = `Your Commission: <b>₹ ${comm.toFixed(2)}</b> | Payable: <b>₹ ${payable.toFixed(2)}</b>`;
  } else { box.style.display = 'none'; }
}

async function doRecharge(){
  let number = document.getElementById('num').value.trim();
  let opCode = document.getElementById('op').value;
  let opText = document.getElementById('op').options[document.getElementById('op').selectedIndex].text;
  let amount = parseFloat(document.getElementById('amt').value || 0);
  if(!opCode){ msg.innerText = 'Select Operator'; return; }
  let msg = document.getElementById('msg');
  let btn = document.getElementById('rechargeBtn');
  if(number.length !== 10){ msg.innerText = 'Enter valid 10 digit number'; return; }
  if(amount <= 0){ msg.innerText = 'Enter valid amount'; return; }
  let rate = getRetailerRate(opCode);
  let commission = amount * rate;
  let payable = amount - commission;
  if(walletBalance < payable){ msg.innerText = 'Insufficient wallet balance'; return; }
  btn.disabled = true; btn.innerText = 'Processing...'; msg.innerText = '';
  try{
    let res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ number, operatorcode: opCode, amount, orderid: 'PQ' + Date.now() })
    });
    let data = await res.json();
    if(data.status === 'Success' || data.status === 'Pending' || data.success === true){
      await db.collection('retailers').doc(userId).update({ wallet: firebase.firestore.FieldValue.increment(-payable) });
      await db.collection('recharges').add({ userId, userName, number, operator: opText, operatorcode: opCode, amount, commission, payable, status: data.status || 'Success', orderid: data.orderid || '', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      msg.innerText = 'Recharge ' + (data.status || 'Success');
      document.getElementById('amt').value = '';
      showComm(); await 
function showService(type){
  var m=document.getElementById('mobileBox'); var d=document.getElementById('dthBox');
  var tm=document.getElementById('tabMobile'); var td=document.getElementById('tabDTH');
  if(type==='dth'){ if(m) m.style.display='none'; if(d) d.style.display='block'; if(tm) tm.classList.remove('on'); if(td) td.classList.add('on'); }
  else { if(m) m.style.display='block'; if(d) d.style.display='none'; if(tm) tm.classList.add('on'); if(td) td.classList.remove('on'); }
}
function getDTHRate(opCode){
  if(opCode==='DTV') return 0.032;
  if(opCode==='ATV') return 0.031;
  if(opCode==='TTV') return 0.031;
  if(opCode==='STV') return 0.029;
  if(opCode==='VTV') return 0.036;
  return 0;
}
function showDTHComm(){
  var amount=parseFloat(document.getElementById('dthAmt').value||0);
  var opCode=document.getElementById('dthOp').value;
  var box=document.getElementById('dthCommBox');
  if(amount>0 && opCode){
    var rate=getDTHRate(opCode); var comm=amount*rate; var payable=amount-comm;
    box.style.display='block'; box.innerHTML=`Your Commission: <b>₹ ${comm.toFixed(2)}</b> | Payable: <b>₹ ${payable.toFixed(2)}</b>`;
  } else { box.style.display='none'; }
}
async function doDTHRecharge(){
  var number=document.getElementById('dthNum').value.trim();
  var opCode=document.getElementById('dthOp').value;
  var opText=document.getElementById('dthOp').options[document.getElementById('dthOp').selectedIndex].text;
  var amount=parseFloat(document.getElementById('dthAmt').value||0);
  var msg=document.getElementById('dthMsg'); var btn=document.getElementById('dthBtn');
  if(number.length<10){ msg.innerText='Enter valid VC / Subscriber ID'; return; }
  if(!opCode){ msg.innerText='Select DTH Operator'; return; }
  if(amount<=0){ msg.innerText='Enter valid amount'; return; }
  var rate=getDTHRate(opCode); var commission=amount*rate; var payable=amount-commission;
  if(walletBalance<payable){ msg.innerText='Insufficient wallet balance'; return; }
  btn.disabled=true; btn.innerText='Processing...'; msg.innerText='';
  try{
    var res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number,operatorcode:opCode,amount,orderid:'PQ'+Date.now()})});
    var data=await res.json();
    if(data.status==='Success'||data.status==='Pending'||data.success===true){
      await db.collection('retailers').doc(userId).update({wallet: firebase.firestore.FieldValue.increment(-payable)});
      await db.collection('recharges').add({userId,userName,number,operator:opText,operatorcode:opCode,amount,commission,payable,status:data.status||'Success',orderid:data.orderid||'',createdAt: firebase.firestore.FieldValue.serverTimestamp()});
      msg.innerText='DTH Recharge '+(data.status||'Success'); document.getElementById('dthAmt').value=''; showDTHComm(); await loadWallet(); await loadHist();
    } else {
      await db.collection('recharges').add({userId,userName,number,operator:opText,operatorcode:opCode,amount,commission,payable,status:'Failed',orderid:'',raw:data.message||'',createdAt: firebase.firestore.FieldValue.serverTimestamp()});
      msg.innerText='Failed: '+(data.message||'Try again'); await loadHist();
    }
  }catch(e){ msg.innerText='Network error. Try again.'; console.log(e); }
  btn.disabled=false; btn.innerText='Recharge DTH Now';
}

loadWallet(); await loadHist();
    } else {
      await db.collection('recharges').add({ userId, userName, number, operator: opText, operatorcode: opCode, amount, commission, payable, status: 'Failed', orderid: '', raw: data.message || '', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      msg.innerText = 'Failed: ' + (data.message || 'Try again');
      await loadHist();
    }
  }catch(e){ msg.innerText = 'Network error. Try again.'; console.log(e); }
  btn.disabled = false; btn.innerText = 'Recharge Now';
}

async function loadHist(){
  try{
    let s = await db.collection('recharges').where('userId','==',userId).limit(20).get();
    let arr = []; s.forEach(doc => arr.push(doc.data()));
    arr.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    let h = '';
    arr.forEach(d => {
      let cls = d.status === 'Success' ? 'success' : (d.status === 'Failed' ? 'failed' : 'pending');
      h += `<tr><td>${d.number}<br><small>${d.operator || ''}</small></td><td>₹ ${d.amount}</td><td>₹ ${(d.commission || 0).toFixed(2)}</td><td><span class="badge ${cls}">${d.status || 'Success'}</span></td></tr>`;
    });
    document.getElementById('hist').innerHTML = h || '<tr><td colspan="4">No records</td></tr>';
  }catch(e){ document.getElementById('hist').innerHTML = '<tr><td colspan="4">Unable to load history</td></tr>'; }
}

loadWallet();
loadHist();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
