<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retailer Panel</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0f172a;color:#fff;padding:10px}.box{background:#1e293b;padding:20px;border-radius:14px;border:1px solid #334155;max-width:360px;width:100%}input{width:100%;padding:12px;margin:7px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155}#L{min-height:100vh;display:flex;justify-content:center;align-items:center}#D{display:none}.card{background:#1e293b;border:1px solid #334155;padding:14px;border-radius:12px;margin-bottom:10px}</style></head><body>
<div id="L"><div class="box" style="text-align:center"><h2 style="color:#22c55e">🏪 Retailer Login</h2><input id="id" placeholder="Mobile Number ex: 9040889090" style="margin-top:15px"><input id="pw" type="password" placeholder="Password"><button style="background:#22c55e;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px;font-weight:bold" onclick="login()">LOGIN</button><button style="background:#334155;color:#fff;width:100%;padding:10px;border:none;border-radius:8px;margin-top:6px" onclick="location.href='/'">HOME</button><p id="er" style="color:#ef4444;font-size:11px;margin-top:8px"></p><p style="color:#666;font-size:10px;margin-top:10px">ID = Mobile, Pass = Distributor set karithiba password</p></div></div>
<div id="D"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><button onclick="location.href='/'" style="padding:10px;border-radius:8px;background:#1e293b;color:#fff;border:1px solid #334155">Home</button><button onclick="logout()" style="padding:10px;border-radius:8px;background:#ef4444;color:#fff;border:none">Logout</button></div><div class="card" style="background:linear-gradient(135deg,#14532d,#0f172a)"><b id="rn">Retailer</b><br><small id="rm">Mobile</small><div style="margin-top:8px"><b id="rb" style="color:#22c55e;font-size:20px">₹0</b> Balance</div></div><div class="card">Recharge, BBPS, PAN, DMT, AEPS Services Active ✅</div></div>
<script>
function getR(){try{return JSON.parse(localStorage.getItem('dr')||'[]')}catch(e){return []}}
function init(){if(localStorage.getItem('rl')=='1'){var mob=localStorage.getItem('rmob');var rs=getR();var f=rs.find(r=>r.mobile==mob);if(f){document.getElementById('L').style.display='none';document.getElementById('D').style.display='block';document.getElementById('rn').innerText=f.name;document.getElementById('rm').innerText=f.mobile+' | Comm '+f.comm+'%';document.getElementById('rb').innerText='₹'+f.bal;return;}}document.getElementById('L').style.display='flex';document.getElementById('D').style.display='none';}init();
function login(){var id=document.getElementById('id').value.trim();var pw=document.getElementById('pw').value.trim();var rs=getR();var f=rs.find(r=>r.mobile==id);if(!f){document.getElementById('er').innerText='Retailer not found! Distributor Panel re add kara';return}if(f.pass!=pw){document.getElementById('er').innerText='Wrong Password! Correct: '+f.pass;return}if(f.status!='Active'){document.getElementById('er').innerText='Blocked by Distributor!';return}localStorage.setItem('rl','1');localStorage.setItem('rmob',id);init();}
function logout(){localStorage.removeItem('rl');localStorage.removeItem('rmob');location.reload();}
</script></body></html>
