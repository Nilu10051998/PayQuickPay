<script>

function getCommission(serviceName){
var comms=JSON.parse(localStorage.getItem('pq_comm')||'[]');
var f=comms.find(c=>c.s.toLowerCase().includes(serviceName.toLowerCase()));
if(!f) return {r:0.5, d:0.1, a:0.4}; // default %
function parseVal(v){
if(typeof v==='string' && v.includes('%')) return parseFloat(v)/100;
if(typeof v==='string' && v.includes('₹')) return {flat: parseFloat(v.replace('₹',''))};
return parseFloat(v)/100 || 0;
function login(){
let mobile=document.getElementById('m').value;
if(mobile.length<10){alert('Mobile number thik deia Bhai!');return;}
location.href='/retailer/index.html';
}
return f;
}

function addBalanceToMobile(mobile, amount){
var idx=allMembers.findIndex(x=>x.mobile===mobile);
if(idx>=0){ allMembers[idx].balance=(allMembers[idx].balance||0)+amount; }
}

function distributeCommission(serviceType, totalAmount){
var comms=JSON.parse(localStorage.getItem('pq_comm')||'[]');
var rule=comms.find(c=> serviceType.toLowerCase().includes(c.s.toLowerCase()) || c.s.toLowerCase().includes(serviceType.toLowerCase()));
if(!rule){ rule={r:"0.5%",d:"0.1%",a:"0.4%"}; }

function calc(val, amt){
if(val.toString().includes('₹')){ return parseInt(val.toString().replace(/[^0-9]/g,''))||0; }
else { var per=parseFloat(val)||0; return Math.floor(amt*per/100); }
}

var rComm=calc(rule.r, totalAmount);
var dComm=calc(rule.d, totalAmount);
var aComm=calc(rule.a, totalAmount);

// 1. Retailer ku rComm
cur.balance+=rComm;

// 2. Distributor ku dComm - jadi retailer ra distributor achi
var distInfo = JSON.parse(localStorage.getItem('pq_dist_retailers')||'[]').find(x=>x.mobile===cur.mobile);
if(distInfo && distInfo.distId){
addBalanceToMobile(distInfo.distId, dComm);
console.log('Distributor '+distInfo.distId+' ku ₹'+dComm+' gala');
}

// 3. Admin ku aComm - Admin wallet (pq_admin_wallet)
var adminWallet=parseInt(localStorage.getItem('pq_admin_wallet')||'0');
adminWallet+=aComm;
localStorage.setItem('pq_admin_wallet', adminWallet.toString());

allMembers.find(x=>x.mobile===cur.mobile).balance=cur.balance;
localStorage.setItem('pq_full_v3',JSON.stringify(allMembers));

return {rComm, dComm, aComm};
}

function doAEPS(){
var amt=parseInt(document.getElementById('aAmt').value||0); if(amt<100){alert('Amount 100+');return}
if((cur.balance||0)<amt){alert('Wallet low! Admin ku kuha');return}
cur.balance-=amt; // amount debit
var split=distributeCommission('AEPS', amt);
trans.push({type:'AEPS Withdraw',amount:amt,comm:split.rComm,dComm:split.dComm,aComm:split.aComm,status:'Success',time:new Date().toLocaleString()});
localStorage.setItem('pq_ret_trans',JSON.stringify(trans));
updateBalUI();
alert('✅ AEPS Success!\n\nRetailer: +₹'+split.rComm+'\nDistributor: +₹'+split.dComm+'\nAdmin: +₹'+split.aComm);
renderHist();
}

function doDMT(){
var amt=parseInt(document.getElementById('dAmt').value||0); if(amt<10){alert('Amount dala');return}
if((cur.balance||0)<amt){alert('Wallet low');return}
cur.balance-=amt;
var split=distributeCommission('DMT', amt);
trans.push({type:'DMT',amount:amt,comm:split.rComm,dComm:split.dComm,aComm:split.aComm,status:'Success',time:new Date().toLocaleString()});
localStorage.setItem('pq_ret_trans',JSON.stringify(trans));
updateBalUI();
alert('✅ DMT Success!\nRetailer +₹'+split.rComm+' | Distri +₹'+split.dComm+' | Admin +₹'+split.aComm);
renderHist();
}

function doRecharge(){
var amt=parseInt(document.getElementById('rAmt').value||0); if(amt<10){alert('Amount');return}
if((cur.balance||0)<amt){alert('Wallet low');return}
cur.balance-=amt;
var split=distributeCommission('Recharge', amt);
trans.push({type:'Recharge',amount:amt,comm:split.rComm,dComm:split.dComm,aComm:split.aComm,status:'Success',time:new Date().toLocaleString()});
localStorage.setItem('pq_ret_trans',JSON.stringify(trans));
updateBalUI();
alert('✅ Recharge Success!\n\nTuma Commission: ₹'+split.rComm+'\nDistributor ku: ₹'+split.dComm+'\nAdmin ku: ₹'+split.aComm);
renderHist();
}

function updateBalUI(){
document.getElementById('rBal').innerText='₹'+cur.balance;
document.getElementById('bal2').innerText='₹'+cur.balance;
localStorage.setItem('pq_full_v3',JSON.stringify(allMembers));
}

function renderHist(){
var h=''; var tot=0; trans.slice().reverse().forEach(t=>{
tot+=t.comm||0;
h+='<tr><td>'+t.type+'<br><small style=color:#64748b>'+t.time+'</small></td><td>₹'+t.amount+'<br><small style=color:#22c55e>R:₹'+(t.comm||0)+' D:₹'+(t.dComm||0)+' A:₹'+(t.aComm||0)+'</small></td><td><span class=badge>'+t.status+'</span></td></tr>';
});
document.getElementById('hist').innerHTML=h||'<tr><td colspan=3 style=text-align:center;color:#475569>No Transactions</td></tr>';
document.getElementById('earn').innerText='₹'+tot;
}
