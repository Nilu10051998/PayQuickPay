<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - PayQuickPay</title><style>body{margin:0;background:#020617;color:#fff;font-family:system-ui;padding:12px}.top{background:#1e293b;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}.bal{font-size:22px;font-weight:900;color:#22c55e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.box{background:#1e293b;padding:16px;border-radius:14px;text-align:center;font-weight:700}.card{background:#1e293b;padding:16px;border-radius:16px;margin-top:10px}input,select,button{width:100%;padding:13px;border-radius:12px;border:none;margin:6px 0;box-sizing:border-box}input,select{background:#0f172a;color:#fff;border:1px solid #334155}button{background:#22c55e;color:#000;font-weight:900}.it{background:#0f172a;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;font-size:13px}</style></head><body>
<div class="top"><div><b id="name">Loading</b><br><small id="mob"></small></div><div class="bal" id="bal">Rs 0</div><button onclick="logout()" style="width:auto;padding:8px 14px;background:#ef4444;color:#fff;border-radius:10px">Logout</button></div>
<div class="grid"><div class="box">📱 Mobile</div><div class="box">📺 DTH</div><div class="box">💳 AEPS</div><div class="box">📄 BBPS</div></div>
<div class="card"><h3 style="margin:0 0 8px">Quick Recharge (2% Commission)</h3><select id="opr"><option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option></select><input id="cmob" placeholder="Customer Mobile (10 digit)"><input id="amt" type="number" placeholder="Amount like 100"><button onclick="recharge()">RECHARGE NOW</button><div id="log" style="font-size:12px;color:#22c55e;margin-top:8px">Ready...</div></div>
<div class="card"><b>Live History + Commission</b><div id="hist"></div></div>
<script>
var SURL="https://mojdysebckbodadjdctj.supabase.co";var SKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic";
var RET=JSON.parse(localStorage.getItem("retailer"));if(!RET){window.location.href="login.html";}
document.getElementById("name").innerText=RET.name;document.getElementById("mob").innerText=RET.mobile;document.getElementById("bal").innerText="Rs "+RET.wallet_balance;
function L(t){document.getElementById("log").innerText=t}
async function recharge(){
 var m=document.getElementById("cmob").value;var a=parseInt(document.getElementById("amt").value);var o=document.getElementById("opr").value;
 if(m.length!=10){alert("Mobile thik dia");return}
 if(!a){alert("Amount dia");return}
 var r=await fetch(SURL+"/rest/v1/retailers?id=eq."+RET.id+"&select=wallet_balance",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});
 var d=await r.json();var cur=d[0].wallet_balance;
 var commPer=2;var commission=Math.round(a*commPer/100);var deduct=a-commission;var nb=cur-deduct;
 if(cur<deduct){alert("Low Balance Rs "+cur);return}
 L("Processing Rs "+a+" Comm Rs "+commission+" Deduct Rs "+deduct+"...");
 await fetch(SURL+"/rest/v1/retailers?id=eq."+RET.id,{method:"PATCH",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({wallet_balance:nb})});
 await fetch(SURL+"/rest/v1/recharge_history",{method:"POST",headers:{apikey:SKEY,Authorization:"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({retailer_id:RET.id,mobile_number:m,amount:a,operator:o,status:"SUCCESS"})});
 RET.wallet_balance=nb;localStorage.setItem("retailer",JSON.stringify(RET));document.getElementById("bal").innerText="Rs "+nb;L("DONE! Rs"+a+" to "+m+" | Comm Rs"+commission+" | New Bal Rs"+nb);loadHist();
}
async function loadHist(){var r=await fetch(SURL+"/rest/v1/recharge_history?retailer_id=eq."+RET.id+"&order=created_at.desc&limit=10",{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});var d=await r.json();var h="";for(var i=0;i<d.length;i++){h+="<div class=it><span>Rs"+d[i].amount+" - "+d[i].mobile_number+" - "+d[i].operator+"</span><span style=color:#22c55e>SUCCESS</span></div>"}document.getElementById("hist").innerHTML=h;}
function logout(){localStorage.removeItem("retailer");window.location.href="login.html";}
loadHist();
</script></body></html>
