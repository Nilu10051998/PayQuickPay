<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FINAL REAL FIXED</title>
<style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:12px}
.box{background:#1e293b;width:100%;max-width:400px;border-radius:18px;padding:20px}
.bal{background:#22c55e;padding:18px;border-radius:14px;color:#000;text-align:center}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;box-sizing:border-box;font-size:16px}
button{background:#22c55e;font-weight:900;cursor:pointer}
#log{background:#000;color:#0f0;padding:8px;border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all}
.it{background:#0f172a;padding:8px;margin:4px 0;border-radius:6px;font-size:13px}
</style></head><body><div class="box">
<div class="bal"><h1 id="bal">Loading...</h1><small id="inf">Starting...</small></div>
<div id="log">Init...</div>
<input id="mob" placeholder="Mobile" value="8018146505"><input id="amt" type="number" placeholder="Amount" value="10">
<button onclick="doRecharge()">RECHARGE NOW</button>
<div id="hist"></div>
</div>
<script>
const SURL="https://mojdysebckbodadjdctj.supabase.co";
const SKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vamR5c2ViY2tib2RhZGpkY3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjMyNjUsImV4cCI6MjEwNTAzOTI2NX0.aoK0cXDCsKZigLUNHXQV6eFClqf7_i91zpw8zrRu0ic";
let RET=null;
function log(t){document.getElementById("log").innerText=t;}
async function init(){
 log("Step 1: Fetching...");
 try{
  let url=SURL+"/rest/v1/retailers?select=*&limit=1";
  log("Step 2: Calling API...");
  let res=await fetch(url,{headers:{"apikey":SKEY,"Authorization":"Bearer "+SKEY}});
  log("Step 3: Status "+res.status);
  let txt=await res.text();
  log("Step 4: "+txt.slice(0,400));
  if(!res.ok) throw new Error(txt);
  let data=JSON.parse(txt);
  if(!data.length){
   log("Step 5: Creating shop...");
   let r2=await fetch(SURL+"/rest/v1/retailers",{method:"POST",headers:{"apikey":SKEY,"Authorization":"Bearer "+SKEY,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({mobile:"8018146505",name:"My Shop",wallet_balance:1000})});
   let t2=await r2.text(); data=JSON.parse(t2);
  }
  RET=data[0];
  document.getElementById("bal").innerText="₹ "+RET.wallet_balance;
  document.getElementById("inf").innerText="REAL DB OK | "+RET.mobile;
  log("Step 6: SUCCESS ₹"+RET.wallet_balance);
  loadHistory();
 }catch(e){ log("ERROR: "+e.message); }
}
async function doRecharge(){
 let num=document.getElementById("mob").value; let amt=parseInt(document.getElementById("amt").value);
 if(RET.wallet_balance<amt){alert("Low Balance");return;}
 let nb=RET.wallet_balance-amt;
 await fetch(SURL+"/rest/v1/retailers?id=eq."+RET.id,{method:"PATCH",headers:{"apikey":SKEY,"Authorization":"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({wallet_balance:nb})});
 await fetch(SURL+"/rest/v1/recharge_history",{method:"POST",headers:{"apikey":SKEY,"Authorization":"Bearer "+SKEY,"Content-Type":"application/json"},body:JSON.stringify({retailer_id:RET.id,mobile_number:num,amount:amt,operator:"Jio",status:"SUCCESS"})});
 RET.wallet_balance=nb; document.getElementById("bal").innerText="₹ "+nb; loadHistory();
}
async function loadHistory(){
 let r=await fetch(SURL+"/rest/v1/recharge_history?select=*&order=created_at.desc&limit=10",{headers:{"apikey":SKEY,"Authorization":"Bearer "+SKEY}});
 let d=await r.json(); let h="<b>History (REAL)</b>"; d.forEach(x=>h+=<div class=it>✅ ₹${x.amount} - ${x.mobile_number}</div>); document.getElementById("hist").innerHTML=h;
}
init();
</script></body></html>
