<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEBUG MODE</title>
<style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:12px}
.box{background:#1e293b;width:100%;max-width:400px;border-radius:18px;padding:20px}
.bal{background:#22c55e;padding:18px;border-radius:14px;color:#000}
#log{background:#000;color:#ff0;padding:10px;border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;min-height:80px}
button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;background:#22c55e;font-weight:900}
</style></head><body><div class="box">
<h2 style="text-align:center">DEBUG MODE</h2>
<div class="bal"><h1 id="bal">Testing...</h1><small id="inf">Wait</small></div>
<div id="log">Starting...</div>
<button onclick="location.reload(true)">RELOAD</button>
</div>
<script>
const SURL="https://mojdysebckbodadjdctj.supabase.co";
const SKEY="sb_publishable_D35DfVbEsXtgIITnKLwSwG_RQqS5day";
async function run(){
 let L=document.getElementById("log");
 L.innerText="Calling "+SURL+"...";
 try{
  let r=await fetch(SURL+"/rest/v1/retailers?select=*&limit=1",{headers:{apikey:SKEY}});
  let t=await r.text();
  L.innerText="STATUS: "+r.status+"\nBODY: "+t.slice(0,600);
  if(r.ok){
   let d=JSON.parse(t);
   document.getElementById("bal").innerText="₹ "+(d[0]?.wallet_balance||0);
   document.getElementById("inf").innerText="CONNECTED! "+d[0]?.mobile;
  }
 }catch(e){ L.innerText="FETCH ERROR: "+e.message; }
}
run();
</script></body></html>
