<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayQuickPay - All in One</title><style>body{background:#020617;color:#fff;font-family:sans-serif;padding:10px}input{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none;background:#1e293b;color:#fff}button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:800;cursor:pointer;margin:4px 0}.tab{padding:10px 15px;background:#1e293b;border-radius:20px;cursor:pointer;display:inline-block;margin:3px}.on{background:#f59e0b;color:#000}.box{background:#1e293b;padding:15px;border-radius:12px;margin-top:10px}.it{background:#0f172a;padding:8px;border-radius:8px;margin:5px 0}</style></head><body>
<h2 style="text-align:center">PayQuickPay - ALL CONNECTED</h2>
<div style="text-align:center"><span class="tab on" onclick="openT('admin',this)">👑 Admin</span><span class="tab" onclick="openT('dist',this)">👥 Distributor</span><span class="tab" onclick="openT('ret',this)">🏪 Retailer</span></div>

<div id="admin" class="box"><h3>👑 ADMIN - Distributor Banao</h3><input id="dn" placeholder="Name"><input id="dm" value="7008024917"><input id="dp" value="123456"><input id="db" value="5000" type="number"><button style="background:#f59e0b" onclick="addD()">ADD DISTRIBUTOR</button><div id="dl"></div></div>

<div id="dist" class="box" style="display:none"><h3>👥 DISTRIBUTOR LOGIN</h3><input id="d_m" value="7008024917"><input id="d_p" value="123456" type="password"><button style="background:#8b5cf6;color:#fff" onclick="loginD()">LOGIN</button><p id="d_e" style="color:red"></p><div id="d_panel" style="display:none"><h4>Welcome <span id="d_n"></span> | Bal ₹<span id="d_b"></span></h4><input id="rn" placeholder="Retailer Name"><input id="rm" placeholder="Retailer Mobile"><input id="rp" placeholder="Password"><button style="background:#22c55e" onclick="addR()">ADD RETAILER</button><div id="rl"></div></div></div>

<div id="ret" class="box" style="display:none"><h3>🏪 RETAILER LOGIN</h3><input id="r_m" placeholder="Retailer Mobile"><input id="r_p" type="password" placeholder="Password"><button style="background:#22c55e" onclick="loginR()">LOGIN</button><p id="r_e" style="color:red"></p><div id="r_panel" style="display:none"><h3>Hi <span id="r_n"></span></h3><p>Mob: <span id="r_m2"></span></p><p>Distributor: <span id="r_d"></span></p><h2>Balance ₹<span id="r_b"></span></h2></div></div>

<script>
function openT(id,el){document.querySelectorAll('.box').forEach(b=>b.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on'); if(id=='admin')loadD()}
function loadD(){let d=JSON.parse(localStorage.getItem("distributors")||"[]");let r=JSON.parse(localStorage.getItem("retailers")||"[]");dl.innerHTML=d.map((x,i)=><div class=it><div>${x.name} - ${x.mobile} - ₹${x.balance} - Ret:${r.filter(y=>y.distributor==x.mobile).length}</div><button onclick="delD(${i})" style="width:auto;background:#ef4444;padding:4px 8px">X</button></div>).join("")||"Empty"}
function addD(){let d=JSON.parse(localStorage.getItem("distributors")||"[]");if(d.find(x=>x.mobile==dm.value))return alert("Already");d.push({name:dn.value||"Dist",mobile:dm.value,password:dp.value,balance:Number(db.value)});localStorage.setItem("distributors",JSON.stringify(d));loadD();alert("✅ Distributor Added - Ebe Distributor Tab re login kara")}
function delD(i){let d=JSON.parse(localStorage.getItem("distributors")||"[]");d.splice(i,1);localStorage.setItem("distributors",JSON.stringify(d));loadD()}
function loginD(){let d=JSON.parse(localStorage.getItem("distributors")||"[]");let f=d.find(x=>x.mobile==d_m.value && x.password==d_p.value);if(!f){d_e.innerText="Nahi milila, Admin Tab re add kara";return}d_e.innerText="";d_panel.style.display="block";d_n.innerText=f.name;d_b.innerText=f.balance;localStorage.setItem("currentDist",JSON.stringify(f));loadR(f.mobile)}
function loadR(dist){let r=JSON.parse(localStorage.getItem("retailers")||"[]");let my=r.filter(x=>x.distributor==dist);rl.innerHTML=my.map(x=><div class=it>${x.name} - ${x.mobile}</div>).join("")||"No Retailer"}
function addR(){let cur=JSON.parse(localStorage.getItem("currentDist"));let r=JSON.parse(localStorage.getItem("retailers")||"[]");if(r.find(x=>x.mobile==rm.value))return alert("Already");r.push({name:rn.value,mobile:rm.value,password:rp.value,balance:100,distributor:cur.mobile});localStorage.setItem("retailers",JSON.stringify(r));loadR(cur.mobile);alert("Retailer Added - Ebe Retailer Tab re login heba")}
function loginR(){let r=JSON.parse(localStorage.getItem("retailers")||"[]");let f=r.find(x=>x.mobile==r_m.value && x.password==r_p.value);if(!f){r_e.innerText="Retailer nahi, Distributor Tab ru banao";return}r_panel.style.display="block";r_n.innerText=f.name;r_m2.innerText=f.mobile;r_d.innerText=f.distributor;r_b.innerText=f.balance}
loadD();
</script></body></html>
