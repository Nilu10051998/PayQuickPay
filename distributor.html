<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor</title><style>body{background:#020617;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif}.box{background:#1e293b;padding:20px;border-radius:16px;width:360px;border:1px solid #334155}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#0f172a;color:#fff}button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:800;cursor:pointer}.b1{background:#8b5cf6;color:#fff}.b2{background:#22c55e;color:#000}.it{background:#0f172a;padding:8px;border-radius:8px;margin:5px 0}</style></head><body>
<div class="box" id="L"><h3 style="text-align:center">DISTRIBUTOR LOGIN</h3><input id="m" value="7008024917"><input id="p" type="password" value="123456"><button class="b1" id="lb">LOGIN AS DISTRIBUTOR</button><p id="e" style="color:#f87171;font-size:12px;text-align:center"></p><div style="margin-top:10px;text-align:center"><a href="admin-full.html" style="color:#94a3b8">Admin Panel →</a></div></div>
<div class="box" id="D" style="display:none;width:380px"><div style="display:flex;justify-content:space-between"><b id="dn">Dist</b><button style="width:auto;background:#ef4444;color:#fff;padding:5px 10px;border-radius:6px;border:none" onclick="localStorage.removeItem('currentDist');location.reload()">LOGOUT</button></div><h2>₹<span id="db">0</span></h2><small id="dm"></small><hr><h4>Add Retailer</h4><input id="rn" placeholder="Retailer Name"><input id="rm" placeholder="Mobile"><input id="rp" placeholder="Password"><button class="b2" id="ar">ADD RETAILER</button><div id="rl"></div></div>
<script>
function ensure(){var d=JSON.parse(localStorage.getItem("distributors")||"[]");if(!d.find(x=>x.mobile=="7008024917")){d.push({name:"Main Distributor",mobile:"7008024917",password:"123456",balance:5000});localStorage.setItem("distributors",JSON.stringify(d))}} ensure();
var $=id=>document.getElementById(id);
$("lb").onclick=()=>{var m=$("m").value.trim(), p=$("p").value.trim(); var d=JSON.parse(localStorage.getItem("distributors")||"[]"); var f=d.find(x=>x.mobile==m && x.password==p); if(!f){$("e").innerText="❌ ID nahi milila! Admin-full.html re jaiki Distributor add kara. ID:7008024917 Pass:123456"; return;} localStorage.setItem("currentDist",JSON.stringify(f)); show(f);};
function show(f){$("L").style.display="none";$("D").style.display="block";$("dn").innerText=f.name;$("dm").innerText=f.mobile;$("db").innerText=f.balance||0; loadR(f.mobile)}
function loadR(dist){var r=JSON.parse(localStorage.getItem("retailers")||"[]");var my=r.filter(x=>x.distributor==dist);var h="";for(var i=0;i<my.length;i++){h+='<div class=it>'+my[i].name+' - '+my[i].mobile+'</div>'}; $("rl").innerHTML=h||"No Retailer"}
$("ar").onclick=()=>{var cur=JSON.parse(localStorage.getItem("currentDist"));var r=JSON.parse(localStorage.getItem("retailers")||"[]");r.push({name:$("rn").value,mobile:$("rm").value,password:$("rp").value,balance:0,distributor:cur.mobile});localStorage.setItem("retailers",JSON.stringify(r));loadR(cur.mobile);alert("Retailer Added")};
var cur=JSON.parse(localStorage.getItem("currentDist")||"null");if(cur)show(cur);
</script></body></html>
