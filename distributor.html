<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 p-4">
<div class="bg-white max-w-3xl mx-auto p-6 rounded-xl border">
<h1 class="font-bold">DISTRIBUTOR PANEL - Secure</h1>
<p>ID: <span id="did" class="font-bold text-blue-600"></span> | <button onclick="logout()" class="bg-black text-white px-3 py-1 rounded-full text-xs">Logout</button></p>
<div class="mt-4 border p-4 rounded-xl"><input id="rId" placeholder="Retailer ID" class="border p-2 w-full rounded"><input id="rPass" placeholder="Pass" class="border p-2 w-full mt-2 rounded"><button onclick="createR()" class="bg-black text-white w-full py-2 mt-2 rounded">Create Retailer - Permanent</button><p id="msg" class="text-sm font-bold mt-2"></p></div>
<div id="list" class="mt-4"></div>
</div>
<script>
const URL="https://hiyjowfyszctvhljsdgx.supabase.co";const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.[STRIPPED 127 bytes].0cuMZjNAQQSnLIlnuxlsr4yRTgsekLliD1Qxu_3awWw";const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
document.getElementById('did').innerText=localStorage.getItem('distributor')||'dist01';
function logout(){localStorage.clear();location.href='index.html';}
async function createR(){let id=rId.value, pw=rPass.value, did=localStorage.getItem('distributor')||'dist01';let r=await fetch(URL+"/rest/v1/retailers",{method:"POST",headers:H,body:JSON.stringify({user_id:id,password:pw,distributor_id:did,wallet:0})});if(r.ok){msg.innerText='✅ Retailer Saved Permanent';load();}else msg.innerText='Error';}
async function load(){let r=await fetch(URL+"/rest/v1/retailers?select=*",{headers:H});let d=await r.json();list.innerHTML=d.map(x=>x.user_id).join('<br>');}
load();
</script>
</body></html>
