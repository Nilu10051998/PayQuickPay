<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DISTRIBUTOR - RETAILER PERMANENT</title>
<style>body{margin:0;background:#020617;color:#fff;font-family:system-ui;padding:10px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;margin:8px 0}input{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}.btn{padding:12px;border:none;border-radius:8px;font-weight:800;width:100%} .h{display:flex;justify-content:space-between;background:#1e293b;padding:12px;border-radius:12px}</style>
</head><body>
<div class="h"><div><b id="dName">Distributor</b><br><small id="dIdShow"></small> | Balance: ₹<span id="dBal">0</span></div><button onclick="logout()" style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px">Logout</button></div>

<div class="card"><h3>➕ Create Retailer</h3>
<input id="rId" placeholder="Retailer ID - R1"><input id="rName" placeholder="Retailer Name"><input id="rPass" placeholder="Password"><input id="rBal" placeholder="Balance - 100" type="number">
<button onclick="addRetailer()" style="background:#22c55e;color:#000;padding:12px;border:none;border-radius:8px;width:100%;font-weight:800;margin-top:8px">CREATE RETAILER</button><p id="msg"></p></div>

<div class="card"><h3>📋 Retailer List (<span id="cnt">0</span>)</h3><div id="list"></div></div>

<script>
// GET DISTRIBUTOR ID
let distId = localStorage.getItem("distributorLoggedIn") || localStorage.getItem("currentDistId") || "D1";
document.getElementById("dIdShow").innerText = distId;

// Load Distributor Info
let allDist = JSON.parse(localStorage.getItem("distributors")||localStorage.getItem("pq_secret_db")||"[]");
let me = allDist.find(x=>x.id==distId);
if(me){ document.getElementById("dName").innerText=me.name; document.getElementById("dBal").innerText=me.balance; }

// ==== RETAILER SAVE SYSTEM - 5 JAGARE SAVE ====
function getRetailers(){
  try{
    let keys = ["retailers", "retailers_"+distId, "retailers_backup", "pq_retailers_secret", "payquick_retailers"];
    let best = [];
    keys.forEach(k=>{
      try{ let v = JSON.parse(localStorage.getItem(k)||"[]"); if(v.length>best.length) best=v; }catch(e){}
    });
    return best;
  }catch(e){ return [] }
}
function saveRetailers(list){
  let s = JSON.stringify(list);
  localStorage.setItem("retailers", s);
  localStorage.setItem("retailers_"+distId, s);
  localStorage.setItem("retailers_backup", s);
  localStorage.setItem("pq_retailers_secret", s);
  localStorage.setItem("payquick_retailers", s);
  try{ sessionStorage.setItem("pq_retailers_secret", s); }catch(e){}
  console.log("Retailers Saved:", s);
}

function addRetailer(){
  let id=document.getElementById('rId').value.trim(), name=document.getElementById('rName').value.trim(), pass=document.getElementById('rPass').value.trim(), bal=document.getElementById('rBal').value.trim()||"100";
  if(!id||!pass){ document.getElementById('msg').innerText="❌ ID Pass Dia Bhai"; return; }
  let list=getRetailers();
  if(list.find(x=>x.id==id)){ document.getElementById('msg').innerText="❌ "+id+" Already Achhi"; return; }
  list.push({id:id, name:name||id, password:pass, mobile:id, balance:parseFloat(bal), distId:distId, commission:1.5});
  saveRetailers(list);
  document.getElementById('msg').innerText="✅ "+id+" CREATE HEIGALA! Ebe Retailer Login Heijiba!";
  document.getElementById('msg').style.color="#22c55e";
  document.getElementById('rId').value=""; document.getElementById('rName').value=""; document.getElementById('rPass').value=""; 
  render();
}

function delRetailer(id){ if(!confirm(id+" Delete?")) return; let list=getRetailers().filter(x=>x.id!=id); saveRetailers(list); render(); }

function render(){
  let list=getRetailers().filter(x=>!x.distId || x.distId==distId);
  document.getElementById('cnt').innerText=list.length;
  let h=""; list.slice().reverse().forEach(x=>{
    h+=`<div style="display:flex;justify-content:space-between;background:#0f172a;padding:8px;margin:4px 0;border-radius:6px"><span><b style="background:#38bdf8;color:#000;padding:2px 6px;border-radius:8px">${x.id}</b> ${x.name} - ₹${x.balance} - Pass:${x.password}</span><button onclick="delRetailer('${x.id}')" style="background:#ef4444;border:none;padding:3px 8px;border-radius:4px;color:#fff">X</button></div>`;
  });
  document.getElementById('list').innerHTML=h||"No Retailer";
}
function logout(){ localStorage.removeItem("distributorLoggedIn"); localStorage.removeItem("currentRole"); location.href="index.html"; }

render();
</script>
</body></html>
