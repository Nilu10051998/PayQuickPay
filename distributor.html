<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Distributor - PAYQUICKPAY</title>
<style>body{font-family:Arial; background:#f5f7fb; margin:0;} nav{background:white; padding:12px 20px; display:flex; justify-content:space-between; border-bottom:1px solid #ddd;} .box{max-width:1100px; margin:15px auto; display:flex; gap:15px; padding:0 15px;} .left{width:340px; background:white; padding:20px; border-radius:14px; border:1px solid #ddd;} .right{flex:1; background:white; padding:20px; border-radius:14px; border:1px solid #ddd;} input{width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;} button{width:100%; background:#0F172A; color:white; padding:10px; border:none; border-radius:8px; cursor:pointer; margin-top:8px;} table{width:100%; border-collapse:collapse;} th,td{padding:10px; border-bottom:1px solid #eee; text-align:left; font-size:13px;}</style>
</head>
<body>
<nav><div><b>DISTRIBUTOR</b> - ID: <span id="dId">---</span></div><button onclick="logout()" style="width:auto; padding:6px 12px; border-radius:20px;">Logout</button></nav>
<div class="box">
<div class="left"><h3>Create Retailer</h3><input id="retId" placeholder="Retailer ID"><input id="retPass" placeholder="Password"><input id="retName" placeholder="Name"><input id="retMobile" placeholder="Mobile"><button onclick="createRet()">Create Retailer</button><p id="msg" style="text-align:center; font-size:12px;"></p></div>
<div class="right"><h3>My Retailers <button onclick="load()" style="width:auto; float:right;">Refresh</button></h3><table><thead><tr><th>ID / Pass</th><th>Wallet</th><th>Action</th></tr></thead><tbody id="retList"></tbody></table></div>
</div>
<script>
function getDid(){return localStorage.getItem('distributor')||'dist01';}
function logout(){localStorage.clear(); location.href='index.html';}
function load(){let did=getDid(); document.getElementById('dId').innerText=did; let data=JSON.parse(localStorage.getItem('retailers')||'[]').filter(r=>r.distributor_id==did); if(data.length==0 && did=='dist01'){data=[{user_id:'retail01',password:'123',name:'My Shop',mobile:'8888888888',wallet:5000,distributor_id:'dist01'}]; let all=JSON.parse(localStorage.getItem('retailers')||'[]'); if(all.length==0) localStorage.setItem('retailers',JSON.stringify(data));} let html=""; data.forEach(d=>{html+=`<tr><td><b>${d.user_id}</b><br><small>${d.password}</small></td><td>Rs ${d.wallet||0}</td><td><button onclick="transfer('${d.user_id}')" style="width:auto; padding:5px 10px; background:green;">Transfer</button></td></tr>`;}); document.getElementById('retList').innerHTML=html||"<tr><td colspan=3>No retailers</td></tr>";}
function createRet(){let id=document.getElementById('retId').value.trim(), pw=document.getElementById('retPass').value.trim(), name=document.getElementById('retName').value.trim(), mob=document.getElementById('retMobile').value.trim(), did=getDid(); if(!id||!pw){document.getElementById('msg').innerText='ID Pass required'; return;} let data=JSON.parse(localStorage.getItem('retailers')||'[]'); if(data.find(d=>d.user_id==id)){document.getElementById('msg').innerText='ID exists'; return;} data.push({user_id:id,password:pw,name:name,mobile:mob,wallet:0,distributor_id:did}); localStorage.setItem('retailers',JSON.stringify(data)); document.getElementById('msg').innerText='Created: '+id; load();}
function transfer(retId){let amt=prompt("Amount to transfer to "+retId); amt=Number(amt); if(!amt)return; let did=getDid(); let dists=JSON.parse(localStorage.getItem('distributors')||'[]'); let myDist=dists.find(d=>d.user_id==did); let cur=myDist?myDist.wallet:10000; if(cur<amt){alert("Low balance: Rs "+cur); return;} if(myDist){myDist.wallet=cur-amt; localStorage.setItem('distributors',JSON.stringify(dists));} let rets=JSON.parse(localStorage.getItem('retailers')||'[]'); let ret=rets.find(r=>r.user_id==retId); if(ret){ret.wallet=(ret.wallet||0)+amt; localStorage.setItem('retailers',JSON.stringify(rets));} alert("Transferred Rs "+amt+" to "+retId); load();}
load();
</script>
</body>
</html>
