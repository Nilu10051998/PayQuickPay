<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributor Panel - PayQuickPay</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9}.head{background:#0f172a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.card{background:#fff;margin:10px;border-radius:16px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:14px;text-align:center}.input{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;margin:6px 0}.btn{width:100%;padding:13px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:8px}.list{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px}#status{padding:10px;border-radius:10px;font-size:13px;display:none;margin-top:8px}</style>
</head><body>
<div class="head"><div><b>DISTRIBUTOR PANEL</b><br><small style="opacity:.7" id="distName">Distributor</small></div><div><button onclick="location.href='index.html'" style="padding:6px 12px;border-radius:8px;border:none;background:#1e293b;color:#fff">Logout</button></div></div>

<div class="grid2">
<div class="card stat" style="margin:10px 5px 0 10px;background:#0f172a;color:#fff"><small>Total Retailers</small><b id="totalRet" style="font-size:22px;display:block;margin:4px 0">0</b><small>My Network</small></div>
<div class="card stat" style="margin:10px 10px 0 5px;background:#22c55e"><small>My Commission</small><b id="myComm" style="font-size:22px;display:block;margin:4px 0">₹0</b><small>Earned</small></div>
</div>

<div class="card">
<h3>➕ Create Retailer</h3>
<input class="input" id="rId" placeholder="Retailer ID - R1001">
<input class="input" id="rName" placeholder="Retailer Name">
<input class="input" id="rMob" placeholder="Mobile Number - 10 Digit" maxlength="10">
<input class="input" id="rPass" placeholder="Set Password" type="password">
<button class="btn" onclick="addRetailer()">Create Retailer</button>
<div id="status"></div>
</div>

<div class="card"><div style="display:flex;justify-content:space-between"><h3>🏪 My Retailers List</h3><small onclick="render()" style="color:#0f172a;font-weight:700">Refresh</small></div><div id="retList" style="margin-top:10px"></div></div>

<div class="card" style="border:1px solid #f59e0b"><h3 style="color:#f59e0b">💰 Commission History</h3><div id="commList" style="margin-top:8px;max-height:200px;overflow:auto"></div></div>

<script>
let distId = localStorage.getItem("distributor_id") || localStorage.getItem("current_dist") || "D1";
document.getElementById("distName").innerText = "ID: " + distId;

function loadRet(){try{let k=["retailers","retailers_backup","pq_retailers_secret","payquick_retailers"];for(let i=0;i<localStorage.length;i++){let key=localStorage.key(i);if(k.some(s=>key.toLowerCase().includes(s.split("_")[0]))){let v=localStorage.getItem(key);if(v&&v.length>10){try{let arr=JSON.parse(v);if(Array.isArray(arr))return arr}catch{}}}}return JSON.parse(localStorage.getItem("retailers")||"[]")}catch{return []}}
function saveRet(l){let s=JSON.stringify(l);localStorage.setItem("retailers",s);localStorage.setItem("retailers_backup",s)}

function render(){
let all=loadRet();let my = all.filter(x=> (x.distId==distId) || (!x.distId && distId=="D1") ); // show my retailers
document.getElementById("totalRet").innerText=my.length;
let html="";if(my.length==0)html='<div style="text-align:center;padding:20px;color:#94a3b8">No retailers yet<br><small>Create first retailer</small></div>';else my.forEach(x=>{html+=`<div class="list"><div><b>${x.id}</b> - ${x.name||""}<br><small style="color:#64748b">${x.mobile} | Pass: ${x.password||"****"}</small></div><div><button onclick="delRet('${x.id}')" style="background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px">Delete</button></div></div>`});
document.getElementById("retList").innerHTML=html;
let comm=JSON.parse(localStorage.getItem("commission_dist_"+distId)||"[]");let ch="";if(comm.length==0)ch='<small style="color:#94a3b8">No commission yet</small>';else comm.slice(0,20).forEach(t=>{ch+=`<div style="padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px">${t}</div>`});document.getElementById("commList").innerHTML=ch;
let totalComm=localStorage.getItem("dist_comm_"+distId)||"0";document.getElementById("myComm").innerText="₹"+totalComm;
}

function addRetailer(){
let id=document.getElementById("rId").value.trim(),name=document.getElementById("rName").value.trim(),mob=document.getElementById("rMob").value.trim(),pass=document.getElementById("rPass").value.trim();
if(!id||!name||!mob||!pass){show("❌ All fields required","#fee2e2","#991b1b");return}
if(mob.length!=10){show("❌ 10 digit mobile","#fee2e2","#991b1b");return}
let all=loadRet();if(all.find(x=>x.id==id)){show("❌ ID already exists","#fee2e2","#991b1b");return}
all.push({id,name,mobile:mob,password:pass,distId:distId,created:new Date().toLocaleDateString()});saveRet(all);
show(`✅ Retailer ${id} Created!`,"#dcfce7","#166534");document.getElementById("rId").value="";document.getElementById("rName").value="";document.getElementById("rMob").value="";document.getElementById("rPass").value="";render();
}
function delRet(id){if(!confirm("Delete "+id+"?"))return;let all=loadRet();all=all.filter(x=>x.id!=id);saveRet(all);render()}
function show(m,bg,c){let e=document.getElementById("status");e.innerHTML=m;e.style.display="block";e.style.background=bg;e.style.color=c;setTimeout(()=>e.style.display="none",3000)}

render();
</script>
</body></html>
