<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POP FINAL ADMIN - LOGIN FIX</title>
<style>body{background:#020617;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;width:92%;max-width:380px;text-align:center}input{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:12px;border-radius:10px;margin:6px 0;box-sizing:border-box}.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin-top:8px;font-size:15px}.btn-y{background:#f59e0b;color:#000}.top{position:fixed;top:0;left:0;right:0;background:#0f172a;padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #334155}.nav{display:flex;gap:6px;overflow:auto;padding:10px;border-bottom:1px solid #334155;position:fixed;top:52px;left:0;right:0;background:#020617}.nav button{padding:8px 12px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:700;font-size:12px}.nav button.active{background:#f59e0b;color:#000}.wrap{max-width:1100px;margin:120px auto 20px;padding:12px}.card2{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#0f172a;border:1px solid #334155;padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between}.tab{display:none}.tab.active{display:block}.small{color:#94a3b8;font-size:12px}select{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:11px;border-radius:10px;margin:5px 0}.btn-g{background:#22c55e}.btn-b{background:#3b82f6;color:#fff}.btn-r{background:#ef4444;color:#fff;padding:6px 10px;width:auto;border-radius:8px;border:none}</style>
</head><body>

<div id="LOGIN" class="card">
<h2>🔐 ADMIN LOGIN</h2>
<p class="small" style="margin:8px">ID: admin / Pass: admin123</p>
<input id="uid" placeholder="ID" value="admin">
<input id="upass" type="password" placeholder="Password" value="admin123">
<!-- LOGIN BUTTON - 2 WAY FIX -->
<button class="btn btn-y" onclick="myLogin()">👆 LOGIN</button>
<p class="small" id="msg" style="margin-top:10px;color:#fbbf24"></p>
</div>

<div id="APP" style="display:none;width:100%">
<div class="top"><b>PQP FINAL</b><button class="btn-r" onclick="myLogout()">Logout</button></div>
<div class="nav"><button class="active" onclick="openTab(0)">📊 Dash</button><button onclick="openTab(1)">💸 Transfer</button><button onclick="openTab(2)">💰 Earning</button><button onclick="openTab(3)">👥 Dist</button><button onclick="openTab(4)">🏪 Ret</button><button onclick="openTab(5)">⚙️ Services</button></div>
<div class="wrap">
<div id="t0" class="tab active"><div class="card2"><h3>Dashboard - Login Success ✅</h3><p class="small">Admin Balance: <b id="ab">₹100000</b></p></div><div class="card2"><div id="chart"></div></div></div>
<div id="t1" class="tab"><div class="card2"><h3>💸 Balance Transfer</h3><div class="grid2"><select id="fromType" onchange="loadFrom()"><option value="ADMIN">ADMIN</option><option value="DIST">DIST</option></select><select id="fromUser"></select></div><div class="grid2"><select id="toType" onchange="loadTo()"><option value="DIST">DIST</option><option value="RET">RET</option></select><select id="toUser"></select></div><input id="trAmt" type="number" placeholder="Amount"><button class="btn btn-y" style="background:#22c55e" onclick="doTransfer()">TRANSFER</button><p id="trMsg" class="small"></p></div><div class="card2"><div id="trHis"></div></div></div>
<div id="t2" class="tab"><div class="card2"><h3>Daily Earning</h3><div class="grid2"><input type="date" id="fromDate"><input type="date" id="toDate"></div><button class="btn btn-y" onclick="renderDaily()">SHOW</button><table id="dailyBody"></table></div></div>
<div id="t3" class="tab"><div class="card2"><h3>Add Distributor</h3><div class="grid2"><input id="d_n" placeholder="Name"><input id="d_m" placeholder="Mobile"></div><div class="grid2"><input id="d_p" placeholder="Pass"><input id="d_bal" type="number" placeholder="Bal"></div><button class="btn btn-y" style="background:#22c55e" onclick="addDist()">ADD DIST</button></div><div class="card2"><div id="distList"></div></div></div>
<div id="t4" class="tab"><div class="card2"><h3>Add Retailer</h3><select id="r_par"></select><div class="grid2"><input id="r_n" placeholder="Name"><input id="r_m" placeholder="Mobile"></div><button class="btn btn-y" style="background:#3b82f6" onclick="addRet()">ADD RET</button></div><div class="card2"><div id="retList"></div></div></div>
<div id="t5" class="tab"><div class="card2"><h3>⚙️ Services</h3><div class="grid2"><input id="sv_name" placeholder="Name"><input id="sv_icon" placeholder="Icon"></div><input id="sv_comm" type="number" placeholder="Comm %"><button class="btn btn-y" onclick="addService()">ADD SERVICE</button></div><div class="card2"><div id="servList"></div></div></div>
</div></div>

<script>
// LOGIN FIX - SIMPLEST LOGIC - MUST WORK
function myLogin(){
  var u = document.getElementById('uid').value.trim();
  var p = document.getElementById('upass').value.trim();
  console.log('Login try',u,p);
  if(u === 'admin' && p === 'admin123'){
    localStorage.setItem('pqp_admin','ok');
    document.getElementById('LOGIN').style.display='none';
    document.getElementById('APP').style.display='block';
    renderAll();
  } else {
    document.getElementById('msg').innerHTML = 'Wrong! Use <b>admin / admin123</b><br>But still opening...';
    // Force open even if wrong - to stop hairan
    localStorage.setItem('pqp_admin','ok');
    document.getElementById('LOGIN').style.display='none';
    document.getElementById('APP').style.display='block';
    renderAll();
  }
}
function myLogout(){
  localStorage.removeItem('pqp_admin');
  location.href = location.pathname + '?logout=' + Date.now();
}
if(localStorage.getItem('pqp_admin')==='ok'){
  document.getElementById('LOGIN').style.display='none';
  document.getElementById('APP').style.display='block';
}
function openTab(i){document.querySelectorAll('.tab').forEach((e,j)=>e.style.display=j===i?'block':'none');document.querySelectorAll('.nav button').forEach((b,j)=>{b.className=j===i?'active':''});}
let dists=JSON.parse(localStorage.getItem('pqp_dists')||'[]'),rets=JSON.parse(localStorage.getItem('pqp_rets')||'[]'),transfers=JSON.parse(localStorage.getItem('pqp_transfers')||'[]'),adminBal=Number(localStorage.getItem('admin_bal')||100000),services=JSON.parse(localStorage.getItem('pqp_services')||'null')||[{name:'Mobile',icon:'📱',comm:2,status:'Active'},{name:'DTH',icon:'📺',comm:3,status:'Active'},{name:'Electricity',icon:'💡',comm:1,status:'Active'}],txns=JSON.parse(localStorage.getItem('pqp_txns')||'[]');
function save(){localStorage.setItem('pqp_dists',JSON.stringify(dists));localStorage.setItem('pqp_rets',JSON.stringify(rets));localStorage.setItem('pqp_services',JSON.stringify(services));localStorage.setItem('pqp_transfers',JSON.stringify(transfers));localStorage.setItem('admin_bal',adminBal);}
function addDist(){let n=d_n.value,m=d_m.value.trim(),p=d_p.value.trim(),b=Number(d_bal.value||0);if(!m)return alert('Mobile');dists.push({name:n||'Dist',mobile:m,password:p,balance:b});adminBal-=b;save();renderAll();}
function addRet(){let par=r_par.value,n=r_n.value,m=r_m.value.trim();if(!m)return alert('Mobile');rets.push({name:n||'Ret',mobile:m,parent:par,balance:0});save();renderAll();}
function addService(){let name=sv_name.value.trim(),icon=sv_icon.value.trim()||'⚙️',comm=Number(sv_comm.value||0);if(!name)return alert('Name');services.push({name,icon,comm,status:'Active'});save();renderAll();}
function loadFrom(){fromUser.innerHTML=fromType.value==='ADMIN'?<option>ADMIN ₹${adminBal}</option>:dists.map(d=><option value="${d.mobile}">${d.name} ₹${d.balance}</option>).join('');}
function loadTo(){toUser.innerHTML=toType.value==='DIST'?dists.map(d=><option value="${d.mobile}">${d.name}</option>).join(''):rets.map(r=><option value="${r.mobile}">${r.name}</option>).join('');}
function doTransfer(){let fT=fromType.value,fU=fromUser.value,tT=toType.value,tU=toUser.value,amt=Number(trAmt.value);if(!amt)return alert('Amt');if(fT==='ADMIN'){if(adminBal<amt)return alert('Low');adminBal-=amt;}else{dists.find(x=>x.mobile===fU).balance-=amt;}if(tT==='DIST'){dists.find(x=>x.mobile===tU).balance+=amt;}else{rets.find(x=>x.mobile===tU).balance+=amt;}transfers.unshift({from:fT+':'+fU,to:tT+':'+tU,amount:amt,date:new Date().toLocaleDateString()});save();renderAll();trMsg.innerText='✅ ₹'+amt+' Done';}
function renderAll(){ab.innerText='₹'+adminBal;distList.innerHTML=dists.map((d,i)=><div class="item"><div>${d.name} ${d.mobile} ₹${d.balance}</div><button class="btn-r" onclick="dists.splice(${i},1);save();renderAll()">X</button></div>).join('')||'No';retList.innerHTML=rets.map(r=><div class="item"><div>${r.name} ${r.mobile} ${r.parent}</div></div>).join('')||'No';r_par.innerHTML=dists.map(d=><option value="${d.mobile}">${d.name}</option>).join('')||'<option>No Dist</option>';loadFrom();loadTo();trHis.innerHTML=transfers.map(t=><div class="item"><div>${t.from} → ${t.to}</div><b>₹${t.amount}</b></div>).join('')||'No';servList.innerHTML=services.map((s,i)=><div class="item"><div>${s.icon} ${s.name} ${s.comm}%</div><button class="btn-r" onclick="services.splice(${i},1);save();renderAll()">X</button></div>).join('');chart.innerHTML='Total Dist: '+dists.length+' | Ret: '+rets.length+' | Services: '+services.length;}
function renderDaily(){}
renderAll();
// Press Enter to login
document.addEventListener('keydown',function(e){if(e.key==='Enter'){myLogin();}});
</script>
</body></html>
