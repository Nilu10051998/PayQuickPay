<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PQP Admin - Direct</title>
<style>body{background:#020617;color:#fff;font-family:system-ui;padding:10px} .card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin-top:12px} input,select{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:11px;border-radius:10px;margin:5px 0} .btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;margin-top:6px;cursor:pointer} .btn-y{background:#f59e0b}.btn-g{background:#22c55e}.btn-b{background:#3b82f6;color:#fff}.btn-r{background:#ef4444;color:#fff;padding:6px 10px;width:auto;border-radius:8px;border:none} .item{background:#0f172a;border:1px solid #1e293b;padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px} .small{color:#94a3b8;font-size:12px}</style>
</head><body>
<div style="max-width:500px;margin:auto">
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>PQP ADMIN - DIRECT (No Login)</b><span class="small" id="ab">Admin: ₹100000</span></div>

<div class="card"><h3>💸 Balance Transfer</h3>
<label class="small">From</label><select id="fromType"><option value="ADMIN">ADMIN</option><option value="DIST">DISTRIBUTOR</option></select><select id="fromUser"></select>
<label class="small">To</label><select id="toType"><option value="DIST">DISTRIBUTOR</option><option value="RET">RETAILER</option></select><select id="toUser"></select>
<input id="trAmt" type="number" placeholder="Amount">
<button class="btn btn-g" onclick="doTransfer()">TRANSFER NOW</button><p id="msg" class="small"></p>
</div>

<div class="card"><h3>Add Distributor</h3><div class="grid2"><input id="d_n" placeholder="Name"><input id="d_m" placeholder="Mobile ID"></div><input id="d_p" placeholder="Password"><button class="btn btn-y" onclick="addDist()">ADD DISTRIBUTOR</button></div>
<div class="card"><h3>Add Retailer</h3><select id="r_par"></select><div class="grid2"><input id="r_n" placeholder="Name"><input id="r_m" placeholder="Mobile"></div><button class="btn btn-b" onclick="addRet()">ADD RETAILER</button></div>

<div class="card"><h3>Distributors</h3><div id="distList"></div></div>
<div class="card"><h3>Retailers</h3><div id="retList"></div></div>
<div class="card"><h3>Transfer History</h3><div id="trHis"></div></div>
</div>
<script>
let dists=JSON.parse(localStorage.getItem('pqp_dists')||'[]'),rets=JSON.parse(localStorage.getItem('pqp_rets')||'[]'),trans=JSON.parse(localStorage.getItem('pqp_transfers')||'[]'),adminBal=Number(localStorage.getItem('admin_bal')||100000);
function save(){localStorage.setItem('pqp_dists',JSON.stringify(dists));localStorage.setItem('pqp_rets',JSON.stringify(rets));localStorage.setItem('pqp_transfers',JSON.stringify(trans));localStorage.setItem('admin_bal',adminBal);}
function render(){document.getElementById('ab').innerText='Admin: ₹'+adminBal;
distList.innerHTML=dists.map((d,i)=><div class="item"><div><b>${d.name}</b><br><small>${d.mobile} | ₹${d.balance}</small></div><button class="btn-r" onclick="dists.splice(${i},1);save();render()">X</button></div>).join('')||'No';
retList.innerHTML=rets.map(r=><div class="item"><div><b>${r.name}</b><br><small>${r.mobile} | Par:${r.parent} | ₹${r.balance||0}</small></div></div>).join('')||'No';
r_par.innerHTML=dists.map(d=><option value="${d.mobile}">${d.name}</option>).join('')||'<option>No Dist</option>';
let fT=fromType.value; fromUser.innerHTML=fT==='ADMIN'?<option value="ADMIN">ADMIN ₹${adminBal}</option>:dists.map(d=><option value="${d.mobile}">${d.name} ₹${d.balance}</option>).join('');
let tT=toType.value; toUser.innerHTML=tT==='DIST'?dists.map(d=><option value="${d.mobile}">${d.name} ₹${d.balance}</option>).join(''):rets.map(r=><option value="${r.mobile}">${r.name} ₹${r.balance||0}</option>).join('');
trHis.innerHTML=trans.slice(0,20).map(t=><div class="item"><div><small>${t.date}</small><br><b>${t.from}</b> → ${t.to}</div><b>₹${t.amount}</b></div>).join('')||'No';
}
function addDist(){let n=d_n.value,m=d_m.value.trim(),p=d_p.value.trim();if(!m||!p)return alert('Mobile Pass');dists.push({name:n||'Dist',mobile:m,password:p,balance:0});save();render();alert('Added '+m);}
function addRet(){let par=r_par.value,n=r_n.value,m=r_m.value.trim();if(!m)return alert('Mobile');rets.push({name:n||'Ret',mobile:m,parent:par,balance:0});save();render();alert('Retailer Added');}
function doTransfer(){let fT=fromType.value,fU=fromUser.value,tT=toType.value,tU=toUser.value,amt=Number(trAmt.value);if(!amt)return alert('Amount');if(fU===tU)return alert('Same user');
if(fT==='ADMIN'){if(adminBal<amt)return alert('Admin low');adminBal-=amt;}else{let d=dists.find(x=>x.mobile===fU);if(d.balance<amt)return alert('Low');d.balance-=amt;}
if(tT==='DIST'){dists.find(x=>x.mobile===tU).balance+=amt;}else{let r=rets.find(x=>x.mobile===tU);r.balance=(Number(r.balance||0)+amt);}
trans.unshift({date:new Date().toLocaleDateString(),from:fT+':'+fU,to:tT+':'+tU,amount:amt});save();render();msg.innerText='✅ ₹'+amt+' Transferred!';trAmt.value='';}
fromType.onchange=render; toType.onchange=render;
render();
</script>
</body></html>
