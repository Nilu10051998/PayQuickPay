<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Fix</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2ff}.card{background:#fff;border-radius:14px;padding:20px;margin:10px;box-shadow:0 4px 12px #0001}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;margin-bottom:12px;font-size:15px}.btn{width:100%;padding:13px;background:#4f46e5;color:#fff;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}.row{border:1px solid #eee;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between}</style>
</head><body>

<div id="L" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
<div class="card" style="width:100%;max-width:380px;text-align:center">
<h2 style="color:#4f46e5">PayQuickPay ADMIN</h2><p style="font-size:12px;color:#666">Secure Login 🔒</p>
<input id="e" type="text" value="admin@payquick.com">
<input id="p" type="password" value="admin123">
<button class="btn" onclick="loginNow()">LOGIN SECURE</button>
<p id="er" style="color:red;font-size:12px;margin-top:8px;display:none">Wrong Password</p>
<p style="font-size:11px;color:#666;margin-top:10px;background:#f1f5f9;padding:8px;border-radius:8px">Email: admin@payquick.com<br>Pass: admin123</p>
<button onclick="bypass()" style="margin-top:8px;font-size:10px;border:0;background:none;color:#888;text-decoration:underline">Emergency Bypass Click Here</button>
</div>
</div>

<div id="D" style="display:none"><div style="background:#4f46e5;color:#fff;padding:14px;text-align:center;font-weight:700">ADMIN PANEL OPEN ✅</div>
<div style="max-width:600px;margin:auto;padding:10px">
<div class="card"><h3>Dashboard ✅</h3><p style="margin-top:10px">Login Success! Ebe sabu chaliba.</p><br><button onclick="localStorage.removeItem('pq_auth');location.reload()" class="btn" style="background:#ef4444">Logout</button></div>
<div class="card"><h3>Add Distributor</h3><br><input id="dN" placeholder="Name"><button onclick="addD()" class="btn" style="background:#16a34a">Add Distributor</button><div id="dL" style="margin-top:10px"></div></div>
</div></div>

<script>
function loginNow(){
  var em=document.getElementById("e").value.trim().toLowerCase();
  var ps=document.getElementById("p").value.trim();
  alert("Trying: "+em+" / "+ps); // debug - tume dekh pariba click hauchi ki nahi
  if(em==="admin@payquick.com" && ps==="admin123"){
    localStorage.setItem("pq_auth","yes");
    document.getElementById("L").style.display="none";
    document.getElementById("D").style.display="block";
    loadD();
  } else {
    document.getElementById("er").style.display="block";
  }
}
function bypass(){
  localStorage.setItem("pq_auth","yes");
  document.getElementById("L").style.display="none";
  document.getElementById("D").style.display="block";
  loadD();
}
if(localStorage.getItem("pq_auth")==="yes"){document.getElementById("L").style.display="none";document.getElementById("D").style.display="block";loadD();}
function loadD(){var d=JSON.parse(localStorage.getItem("pq_dist_final")||"[]");document.getElementById("dL").innerHTML=d.map(x=>x).join("<br>")||"No data"}
function addD(){var n=document.getElementById("dN").value;if(!n)return alert("Name lekha");var a=JSON.parse(localStorage.getItem("pq_dist_final")||"[]");a.push(n);localStorage.setItem("pq_dist_final",JSON.stringify(a));loadD();alert("Added ✅")}
</script></body></html>
