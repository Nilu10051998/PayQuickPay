<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Final FIXED</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100">

<div id="loginBox" class="min-h-screen flex items-center justify-center p-4">
<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
<h1 class="text-2xl font-bold">Admin Panel</h1><p class="text-xs text-gray-400">PayQuickPay Final</p>
<input id="aEmail" type="text" class="w-full p-3 border rounded-xl mt-6 text-sm" value="admin@payquick.com">
<input id="aPass" type="password" class="w-full p-3 border rounded-xl mt-3 text-sm" value="admin123">
<button onclick="doLogin()" class="w-full bg-indigo-600 text-white p-3 rounded-xl mt-4 font-bold">Login</button>
<p id="err" class="text-xs text-red-500 mt-2 hidden">Wrong Email/Password</p>
</div></div>

<div id="dashBox" class="hidden">
<div class="bg-indigo-600 text-white p-4 flex justify-between items-center"><b>Admin Panel</b><button onclick="doLogout()" class="bg-white text-indigo-600 px-4 py-1 rounded-full text-xs font-bold">Logout</button></div>
<div class="p-4 max-w-2xl mx-auto">
<div class="grid grid-cols-3 gap-2"><div class="bg-white p-3 rounded-xl shadow text-center"><p class="text-[10px] text-gray-500">DISTRIBUTOR</p><p id="sDis" class="font-bold text-lg">0</p></div><div class="bg-white p-3 rounded-xl shadow text-center"><p class="text-[10px] text-gray-500">RETAILER</p><p id="sRet" class="font-bold text-lg">0</p></div><div class="bg-white p-3 rounded-xl shadow text-center"><p class="text-[10px] text-gray-500">WALLET</p><p id="sWal" class="font-bold text-lg">₹0</p></div></div>
<div class="grid grid-cols-4 gap-2 mt-3">
<button onclick="showTab('t1')" id="b1" class="bg-indigo-600 text-white p-2.5 rounded-xl text-xs font-bold">Dashboard</button>
<button onclick="showTab('t2')" id="b2" class="bg-white p-2.5 rounded-xl text-xs font-bold">Distributor</button>
<button onclick="showTab('t3')" id="b3" class="bg-white p-2.5 rounded-xl text-xs font-bold">Retailer</button>
<button onclick="showTab('t4')" id="b4" class="bg-white p-2.5 rounded-xl text-xs font-bold">Services</button>
</div>
<div id="t1" class="bg-white p-5 rounded-xl shadow mt-3"><h2 class="font-bold">Dashboard</h2><p class="text-sm mt-2">Total Distributor: <b id="cDis">0</b></p><p class="text-sm">Total Retailer: <b id="cRet">0</b></p><p class="text-sm">Wallet: <b id="cWal">₹0</b></p><p class="text-sm text-green-600 mt-3">✅ Login Success!</p></div>
<div id="t2" class="hidden bg-white p-5 rounded-xl shadow mt-3"><h2 class="font-bold mb-3">Add Distributor</h2><input id="dName" placeholder="Name" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><input id="dEmail" placeholder="Email" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><input id="dPass" placeholder="Pass" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><button onclick="addDis()" class="w-full bg-indigo-600 text-white p-2.5 rounded-lg font-bold">Add Distributor</button><div id="dList" class="mt-4"></div></div>
<div id="t3" class="hidden bg-white p-5 rounded-xl shadow mt-3"><h2 class="font-bold mb-3">Add Retailer</h2><input id="rName" placeholder="Name" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><input id="rEmail" placeholder="Email" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><input id="rPass" placeholder="Pass" class="w-full border p-2.5 rounded-lg mb-2 text-sm"><button onclick="addRet()" class="w-full bg-indigo-600 text-white p-2.5 rounded-lg font-bold">Add Retailer</button><div id="rList" class="mt-4"></div></div>
<div id="t4" class="hidden bg-white p-5 rounded-xl shadow mt-3"><h2 class="font-bold mb-3">Service ON/OFF</h2><div id="sList"></div></div>
</div></div>

<script>
function doLogin(){
 let e=document.getElementById('aEmail').value.trim();
 let p=document.getElementById('aPass').value.trim();
 console.log(e,p);
 if(e.toLowerCase()=='admin@payquick.com' && p=='admin123'){
  localStorage.setItem('admin_login','yes');
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dashBox').style.display='block';
  loadAll();
 } else {
  document.getElementById('err').classList.remove('hidden');
  alert('ID: admin@payquick.com \nPass: admin123 \nTume lekhi cha: '+e+' / '+p);
 }
}
function doLogout(){localStorage.removeItem('admin_login');location.reload()}
function checkLogin(){
 if(localStorage.getItem('admin_login')=='yes'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dashBox').style.display='block';
  loadAll();
 }
}
function showTab(id){['t1','t2','t3','t4'].forEach(x=>document.getElementById(x).style.display='none');document.getElementById(id).style.display='block';loadAll()}
function get(k){return JSON.parse(localStorage.getItem(k)||'[]')} function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
const defS=[{id:'recharge',name:'📱 Mobile Recharge',active:true},{id:'dth',name:'📺 DTH',active:true},{id:'electricity',name:'💡 Electricity',active:true},{id:'bbps',name:'🏦 BBPS',active:true},{id:'aeps',name:'💳 AePS',active:true},{id:'dmt',name:'💸 DMT',active:true}];
function getS(){let s=localStorage.getItem('pq_services');if(!s){set('pq_services',defS);return defS}return JSON.parse(s)}
function toggleS(id){let s=getS();let f=s.find(x=>x.id==id);f.active=!f.active;set('pq_services',s);loadServices()}
function addDis(){let n=dName.value,e=dEmail.value,p=dPass.value;if(!n||!e||!p)return alert('Fill');let d=get('pq_distributor');d.push({id:Date.now(),name:n,email:e,pass:p,wallet:0});set('pq_distributor',d);alert('Added');loadAll()}
function addRet(){let n=rName.value,e=rEmail.value,p=rPass.value;if(!n||!e||!p)return alert('Fill');let d=get('pq_retailers');d.push({id:Date.now(),name:n,email:e,pass:p,wallet:0});set('pq_retailers',d);alert('Added');loadAll()}
function loadServices(){let s=getS();let h='';s.forEach(x=>h+=<div class="flex justify-between items-center border p-3 rounded-xl mb-2"><span class="text-sm font-bold">${x.name}</span><button onclick="toggleS('${x.id}')" class="${x.active?'bg-green-500':'bg-gray-400'} text-white px-5 py-1 rounded-full text-xs">${x.active?'ON':'OFF'}</button></div>);document.getElementById('sList').innerHTML=h}
function loadAll(){
 let d=get('pq_distributor'),r=get('pq_retailers');document.getElementById('sDis').innerText=d.length;document.getElementById('sRet').innerText=r.length;document.getElementById('cDis').innerText=d.length;document.getElementById('cRet').innerText=r.length;
 let tot=0;[...d,...r].forEach(x=>tot+=x.wallet);document.getElementById('sWal').innerText='₹'+tot;document.getElementById('cWal').innerText='₹'+tot;
 let dh='';d.forEach(x=>dh+=<div class="border p-2 rounded mb-1 text-xs flex justify-between"><span>${x.name} - ${x.email}</span><button onclick="localStorage.setItem('pq_distributor',JSON.stringify(get('pq_distributor').filter(y=>y.id!=${x.id})));loadAll()" class="bg-red-500 text-white px-2 rounded">X</button></div>);document.getElementById('dList').innerHTML=dh;
 let rh='';r.forEach(x=>rh+=<div class="border p-2 rounded mb-1 text-xs flex justify-between"><span>${x.name} - ${x.email}</span><button onclick="localStorage.setItem('pq_retailers',JSON.stringify(get('pq_retailers').filter(y=>y.id!=${x.id})));loadAll()" class="bg-red-500 text-white px-2 rounded">X</button></div>);document.getElementById('rList').innerHTML=rh;
 loadServices();
}
checkLogin();
</script></body></html>
