<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>body{background:#020617;color:#fff;display:flex;justify-content:center;padding:10px;font-family:sans-serif}
.card{background:#1e293b;padding:16px;border-radius:12px;margin-top:12px;border:1px solid #334155;width:100%;max-width:420px}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#0f172a;color:#fff}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;margin-top:8px;cursor:pointer}
.btn-y{background:#f59e0b}.btn-g{background:#22c55e}.btn-r{background:#ef4444;color:#fff;padding:8px 14px;border-radius:6px;border:none}
.item{background:#0f172a;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between}
#panel{display:none}</style></head><body>
<div style="width:100%;max-width:420px">
<div id="loginBox" class="card" style="margin-top:60px;text-align:center">
<h2>🔐 ADMIN LOGIN</h2>
<input id="id" value="admin"><input id="pass" type="password" value="admin123">
<button class="btn btn-y" onclick="forceLogin()">LOGIN - CLICK HERE</button>
<p style="font-size:12px;margin-top:8px;color:#94a3b8">Click kariba matre khulijiba</p>
</div>
<div id="panel">
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>PQP ADMIN</b><button class="btn-r" onclick="logout()">LOGOUT</button></div>
<div class="card"><h3>Commission</h3><input id="c_m" placeholder="Mobile %"><input id="c_d" placeholder="DTH %"><button class="btn btn-y" onclick="saveC()">SAVE</button></div>
<div class="card"><h3>Add Distributor</h3><input id="n" placeholder="Name"><input id="m" placeholder="Mobile ID"><input id="p" placeholder="Password"><button class="btn btn-g" onclick="add()">ADD NOW</button></div>
<div class="card"><h3>List: <span id="cnt">0</span></h3><div id="list"></div></div>
</div>
</div>
<script>
function check(){if(localStorage.getItem('admin_login')==='true'){document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';load();}}
function forceLogin(){localStorage.setItem('admin_login','true');alert('Login Success!');document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';load();}
function logout(){localStorage.removeItem('admin_login');location.reload();}
function saveC(){localStorage.setItem('cm',document.getElementById('c_m').value);localStorage.setItem('cd',document.getElementById('c_d').value);alert('Saved');}
function load(){document.getElementById('c_m').value=localStorage.getItem('cm')||2;document.getElementById('c_d').value=localStorage.getItem('cd')||3;let a=JSON.parse(localStorage.getItem('distributors')||'[]');document.getElementById('cnt').innerText=a.length;let h='';a.forEach((d,i)=>{h+=<div class="item"><div><b>${d.name}</b><br><small>${d.mobile}</small></div><button class="btn-r" onclick="del(${i})">X</button></div>});document.getElementById('list').innerHTML=h||'No Data';}
function add(){let n=document.getElementById('n').value,m=document.getElementById('m').value.trim(),p=document.getElementById('p').value.trim();if(!m||!p){alert('Mobile Pass lekha');return;}let a=JSON.parse(localStorage.getItem('distributors')||'[]');a.push({name:n||'Dist',mobile:m,password:p});localStorage.setItem('distributors',JSON.stringify(a));load();alert('Added '+m);}
function del(i){let a=JSON.parse(localStorage.getItem('distributors')||'[]');a.splice(i,1);localStorage.setItem('distributors',JSON.stringify(a));load();}
check();
</script></body></html>
