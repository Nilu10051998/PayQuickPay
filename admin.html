<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>*{box-sizing:border-box;font-family:sans-serif}body{background:#020617;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#1e293b;padding:20px;border-radius:14px;width:320px;border:1px solid #334155}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#0f172a;color:#fff}button{width:100%;padding:12px;border-radius:8px;border:none;background:#f59e0b;font-weight:800;cursor:pointer}.dash{display:none} .item{background:#0f172a;padding:8px;border-radius:8px;margin:5px 0}</style>
</head>
<body>
<div class="box" id="loginBox">
<h3 style="text-align:center">🔐 ADMIN LOGIN</h3>
<input id="a" value="admin"><input id="b" type="password" value="admin123">
<button onclick="login()">LOGIN</button>
<p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:6px">admin / admin123</p>
</div>

<div class="box dash" id="dashBox" style="width:360px">
<div style="display:flex;justify-content:space-between"><b>PayQuickPay ADMIN</b><button onclick="logout()" style="width:auto;padding:4px 10px;background:#ef4444;color:#fff">Logout</button></div>
<hr style="margin:10px 0;border-color:#334155">
<input id="dn" placeholder="Distributor Name"><input id="dm" placeholder="Mobile (ID)"><input id="dp" placeholder="Password">
<button onclick="addD()" style="background:#22c55e;margin-top:5px">ADD DISTRIBUTOR</button>
<div id="list" style="margin-top:10px"></div>
</div>

<script>
function login(){
 if(document.getElementById('a').value=='admin' && document.getElementById('b').value=='admin123'){
  localStorage.setItem('isAdmin','yes');
  show();
 } else alert('Wrong ID Pass');
}
function show(){
 document.getElementById('loginBox').style.display='none';
 document.getElementById('dashBox').style.display='block';
 load();
}
function logout(){localStorage.removeItem('isAdmin');location.reload();}
function load(){
 let d=JSON.parse(localStorage.getItem('distributors')||'[]');
 let h='';
 d.forEach((x,i)=>{h+=<div class="item"><b>${x.name}</b> - ${x.mobile} <button onclick="del(${i})" style="width:auto;float:right;background:#ef4444;padding:2px 6px">X</button></div>});
 document.getElementById('list').innerHTML=h||'No data';
}
function addD(){
 let n=document.getElementById('dn').value, m=document.getElementById('dm').value, p=document.getElementById('dp').value;
 if(!m||!p){alert('Mobile Pass darkar');return;}
 let d=JSON.parse(localStorage.getItem('distributors')||'[]');
 d.push({name:n,mobile:m,password:p});
 localStorage.setItem('distributors',JSON.stringify(d));
 document.getElementById('dn').value='';document.getElementById('dm').value='';document.getElementById('dp').value='';
 load();
}
function del(i){let d=JSON.parse(localStorage.getItem('distributors')||'[]');d.splice(i,1);localStorage.setItem('distributors',JSON.stringify(d));load();}
if(localStorage.getItem('isAdmin')=='yes') show();
</script>
</body>
</html>
