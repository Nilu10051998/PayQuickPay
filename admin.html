<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - PAYQUICKPAY</title>
<style>
body{font-family:Arial; background:#f2f2f2; margin:0;}
nav{background:#0F172A; color:white; padding:12px 20px; display:flex; justify-content:space-between;}
.box{max-width:1100px; margin:15px auto; padding:0 15px;}
.card{background:white; padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid #ddd;}
input{width:100%; padding:10px; margin:5px 0; border:1px solid #ccc; border-radius:6px;}
button{width:100%; padding:10px; background:#0F172A; color:white; border:none; border-radius:6px; cursor:pointer; margin-top:5px;}
button.small{width:auto; padding:6px 12px; font-size:12px;}
table{width:100%; border-collapse:collapse; margin-top:10px;}
th,td{border:1px solid #ddd; padding:8px; text-align:left; font-size:13px;}
th{background:#f5f5f5;}
.stats{display:flex; gap:10px; flex-wrap:wrap;}
.stat{flex:1; min-width:150px; background:white; padding:12px; border-radius:8px; border:1px solid #ddd; text-align:center;}
.modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;}
.modal-box{background:white; padding:20px; border-radius:10px; width:90%; max-width:400px;}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCZCNT1ljpj-IIxDUCEHoAQPJFR2Zd7OOI",
  authDomain: "payquickpay-487ef.firebaseapp.com",
  projectId: "payquickpay-487ef",
  storageBucket: "payquickpay-487ef.firebasestorage.app",
  messagingSenderId: "368108778411",
  appId: "1:368108778411:web:03dcbc47e46568d51b58ee"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>
</head>
<body>
<nav><div><b>PAYQUICKPAY - ADMIN</b></div><div><span id="adminId"></span> <button onclick="logout()" class="small" style="background:white; color:black; width:auto;">Logout</button></div></nav>

<div class="box">
<div class="stats">
<div class="stat"><b>Total Distributors</b><br><span id="totalDist">0</span></div>
<div class="stat"><b>Total Wallet</b><br><span id="totalWallet">Rs 0</span></div>
<div class="stat"><b>Today Commission</b><br><span id="todayComm">Rs 0</span></div>
<div class="stat"><b>Total Commission</b><br><span id="totalComm">Rs 0</span></div>
</div>

<div class="card">
<h3>Commission Setup</h3>
<div style="display:flex; gap:10px;">
<div style="flex:1;"><label>Mobile %</label><input id="comm_mobile" type="number" step="0.1" value="2"></div>
<div style="flex:1;"><label>DTH %</label><input id="comm_dth" type="number" step="0.1" value="3"></div>
<div style="flex:1;"><label>Bill %</label><input id="comm_bill" type="number" step="0.1" value="1.5"></div>
<div style="flex:1;"><label>AEPS %</label><input id="comm_aeps" type="number" step="0.1" value="0.5"></div>
</div>
<button onclick="saveComm()">Save</button>
<button onclick="resetComm()" style="background:#eee; color:black;">Reset</button>
<p id="commMsg" style="text-align:center; font-size:12px;"></p>
</div>

<div style="display:flex; gap:15px; flex-wrap:wrap;">
<div class="card" style="flex:1; min-width:300px;">
<h3>Create Distributor</h3>
<input id="dId" placeholder="ID">
<input id="dPass" placeholder="Password">
<input id="dName" placeholder="Name">
<input id="dMobile" placeholder="Mobile">
<input id="dWallet" type="number" placeholder="Wallet">
<button onclick="createDist()">Create</button>
<button onclick="clearForm()" style="background:#eee; color:black;">Clear</button>
<p id="msg" style="text-align:center; font-size:12px;"></p>
</div>
<div class="card" style="flex:2; min-width:400px;">
<h3>All Distributors <button onclick="load()" class="small" style="background:#eee; color:black;">Refresh</button></h3>
<table><tr><th>ID</th><th>Name</th><th>Wallet</th><th>Action</th></tr><tbody id="list"></tbody></table>
</div>
</div>

<div class="card">
<h3>Commission Report <button onclick="loadCommissionReport()" class="small" style="background:#eee; color:black;">Refresh</button></h3>
<table><tr><th>Date</th><th>Retailer</th><th>Service</th><th>Amount</th><th>%</th><th>Earned</th><th>Debit</th></tr><tbody id="commissionReport"></tbody></table>
</div>
</div>

<div id="editModal" class="modal">
<div class="modal-box">
<h3>Edit Distributor</h3>
<input id="editId" placeholder="ID">
<input id="editPass" placeholder="Password">
<input id="editName" placeholder="Name">
<input id="editMobile" placeholder="Mobile">
<input id="editWallet" type="number" placeholder="Wallet">
<div style="display:flex; gap:10px;">
<button onclick="closeEditModal()" style="background:#eee; color:black; flex:1;">Cancel</button>
<button onclick="saveEdit()" style="flex:1; background:green;">Save</button>
</div>
</div>
</div>

<script>
let editDocId=null;
function logout(){ localStorage.removeItem('admin'); location.href='index.html'; }
function clearForm(){ ['dId','dPass','dName','dMobile','dWallet'].forEach(id=>document.getElementById(id).value=''); }
async function loadCommissionSetup(){
  try{
    let doc=await db.collection('commission_setup').doc('setup').get();
    if(doc.exists){ let s=doc.data(); document.getElementById('comm_mobile').value=s.mobile; document.getElementById('comm_dth').value=s.dth; document.getElementById('comm_bill').value=s.bill; document.getElementById('comm_aeps').value=s.aeps; localStorage.setItem('commission_setup', JSON.stringify(s)); return s; }
  }catch(e){}
  let s=JSON.parse(localStorage.getItem('commission_setup')||'null');
  if(!s){ s={mobile:2, dth:3, bill:1.5, aeps:0.5}; localStorage.setItem('commission_setup', JSON.stringify(s)); try{ await db.collection('commission_setup').doc('setup').set(s); }catch(e){} }
  document.getElementById('comm_mobile').value=s.mobile; document.getElementById('comm_dth').value=s.dth; document.getElementById('comm_bill').value=s.bill; document.getElementById('comm_aeps').value=s.aeps; return s;
}
async function saveComm(){
  let s={mobile:Number(document.getElementById('comm_mobile').value), dth:Number(document.getElementById('comm_dth').value), bill:Number(document.getElementById('comm_bill').value), aeps:Number(document.getElementById('comm_aeps').value)};
  localStorage.setItem('commission_setup', JSON.stringify(s));
  try{ await db.collection('commission_setup').doc('setup').set(s); document.getElementById('commMsg').innerText='Saved: Mobile '+s.mobile+'% DTH '+s.dth+'% Bill '+s.bill+'% AEPS '+s.aeps+'%'; }catch(e){ document.getElementById('commMsg').innerText='Saved locally'; }
}
async function resetComm(){ if(!confirm('Reset?')) return; let s={mobile:2, dth:3, bill:1.5, aeps:0.5}; localStorage.setItem('commission_setup', JSON.stringify(s)); try{ await db.collection('commission_setup').doc('setup').set(s); }catch(e){} document.getElementById('comm_mobile').value=s.mobile; document.getElementById('comm_dth').value=s.dth; document.getElementById('comm_bill').value=s.bill; document.getElementById('comm_aeps').value=s.aeps; }
async function load(){
  let admin=localStorage.getItem('admin')||'admin'; document.getElementById('adminId').innerText=admin;
  try{
    let snap=await db.collection('distributors').get();
    let data=[]; snap.forEach(doc=>{ data.push({docId:doc.id, ...doc.data()}); });
    let html=''; let total=0;
    data.forEach(d=>{ total+=Number(d.wallet||0); html+=`<tr><td>${d.user_id}<br><small>${d.password}</small></td><td>${d.name||''}<br><small>${d.mobile||''}</small></td><td>Rs ${d.wallet||0}<br><button onclick="addWallet('${d.docId}', ${d.wallet||0})" class="small">+Add</button></td><td><button onclick="deleteDist('${d.docId}')" class="small" style="background:#ffdddd; color:red;">Delete</button> <button onclick="openEditModal('${d.docId}')" class="small" style="background:#ddf;">Edit</button></td></tr>`; });
    document.getElementById('list').innerHTML=html||'<tr><td colspan=4>No distributors</td></tr>';
    document.getElementById('totalDist').innerText=data.length;
    document.getElementById('totalWallet').innerText='Rs '+total;
    localStorage.setItem('distributors', JSON.stringify(data.map(d=>({user_id:d.user_id, password:d.password, name:d.name, mobile:d.mobile, wallet:d.wallet}))));
  }catch(e){ document.getElementById('list').innerHTML='<tr><td colspan=4>Error: '+e.message+'</td></tr>'; }
}
async function createDist(){
  let id=document.getElementById('dId').value.trim(), pw=document.getElementById('dPass').value.trim(), name=document.getElementById('dName').value.trim(), mob=document.getElementById('dMobile').value.trim(), wal=Number(document.getElementById('dWallet').value||0);
  if(!id||!pw){ document.getElementById('msg').innerText='ID Pass required'; return; }
  document.getElementById('msg').innerText='Saving...';
  try{
    let existing=await db.collection('distributors').where('user_id','==',id).get();
    if(!existing.empty){ document.getElementById('msg').innerText='ID exists'; return; }
    await db.collection('distributors').add({user_id:id, password:pw, name:name, mobile:mob, wallet:wal, created:new Date().toISOString()});
    document.getElementById('msg').innerText='Created: '+id;
    let data=JSON.parse(localStorage.getItem('distributors')||'[]'); data.push({user_id:id, password:pw, name:name, mobile:mob, wallet:wal}); localStorage.setItem('distributors', JSON.stringify(data));
    clearForm(); load();
  }catch(e){ document.getElementById('msg').innerText='Error: '+e.message; }
}
async function deleteDist(docId){ if(!confirm('Delete?')) return; try{ await db.collection('distributors').doc(docId).delete(); load(); }catch(e){ alert(e.message); } }
async function addWallet(docId, cur){ let amt=prompt('Amount'); amt=Number(amt); if(!amt) return; try{ await db.collection('distributors').doc(docId).update({wallet: cur+amt}); load(); }catch(e){ alert(e.message); } }
async function openEditModal(docId){ try{ let doc=await db.collection('distributors').doc(docId).get(); let d=doc.data(); editDocId=docId; document.getElementById('editId').value=d.user_id; document.getElementById('editPass').value=d.password; document.getElementById('editName').value=d.name||''; document.getElementById('editMobile').value=d.mobile||''; document.getElementById('editWallet').value=d.wallet||0; document.getElementById('editModal').style.display='flex'; }catch(e){ alert(e.message); } }
function closeEditModal(){ document.getElementById('editModal').style.display='none'; editDocId=null; }
async function saveEdit(){ if(!editDocId) return; try{ await db.collection('distributors').doc(editDocId).update({user_id:document.getElementById('editId').value.trim(), password:document.getElementById('editPass').value.trim(), name:document.getElementById('editName').value.trim(), mobile:document.getElementById('editMobile').value.trim(), wallet:Number(document.getElementById('editWallet').value||0)}); closeEditModal(); load(); }catch(e){ alert(e.message); } }
function loadCommissionReport(){
  let reports=JSON.parse(localStorage.getItem('recharge_history')||'[]');
  let todayStr=new Date().toDateString(); let todayFiltered=reports.filter(r=>{ try{ return new Date(r.date).toDateString()===todayStr; }catch(e){ return false; } });
  if(todayFiltered.length===0 && reports.length>0) todayFiltered=reports.slice(-20);
  let todayComm=0; todayFiltered.forEach(r=>todayComm+=Number(r.commission||0)); let totalComm=0; reports.forEach(r=>totalComm+=Number(r.commission||0));
  document.getElementById('todayComm').innerText='Rs '+todayComm.toFixed(2); document.getElementById('totalComm').innerText='Rs '+totalComm.toFixed(2);
  let html=''; [...reports].reverse().forEach(r=>{ html+=`<tr><td><small>${r.date}</small></td><td>${r.retailer_id}</td><td>${r.service}</td><td>Rs ${r.amount}</td><td>${r.commission_percent}%</td><td>Rs ${r.commission}</td><td>Rs ${r.debit}</td></tr>`; });
  document.getElementById('commissionReport').innerHTML=html||'<tr><td colspan=7>No commission yet</td></tr>';
}
loadCommissionSetup(); load(); loadCommissionReport();
</script>
</body>
</html>
