<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - PayQuickPay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#020617;color:#fff;padding:12px}
.header{background:#0f172a;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border:1px solid #1e293b}
.box{background:#1e293b;padding:16px;border-radius:16px;margin-bottom:12px;border:1px solid #334155}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#0f172a;color:#fff}
.btn{width:100%;padding:12px;background:#f59e0b;color:#000;font-weight:900;border:none;border-radius:10px;margin-top:8px;cursor:pointer}
.btn-green{background:#22c55e}
.list-item{background:#0f172a;padding:12px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid #334155}
#loginBox{height:100vh;display:flex;justify-content:center;align-items:center}
.loginCard{background:#1e293b;padding:24px;border-radius:16px;width:320px;border:1px solid #334155}
</style></head>
<body>

<div id="loginBox">
<div class="loginCard">
<h2 style="text-align:center">🔐 ADMIN LOGIN</h2>
<input id="a_id" placeholder="Admin ID" value="admin">
<input id="a_pass" type="password" placeholder="Password" value="admin123">
<button class="btn" onclick="doLogin()">LOGIN</button>
<p id="err" style="color:#ef4444;text-align:center;margin-top:8px"></p>
</div>
</div>

<div id="mainBox" style="display:none">
<div class="header"><div><b>PayQuickPay</b> <small style="color:#f59e0b">ADMIN</small></div><button onclick="doLogout()" style="background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:800;cursor:pointer">LOGOUT</button></div>

<div class="box" style="border-color:#f59e0b">
<h3>💰 COMMISSION</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div><small>Mobile %</small><input id="c_mobile" type="number"></div>
<div><small>DTH %</small><input id="c_dth" type="number"></div>
<div><small>Elec %</small><input id="c_elec" type="number"></div>
<div><small>AePS %</small><input id="c_aeps" type="number"></div>
</div>
<button class="btn" onclick="saveComm()">SAVE COMMISSION</button>
</div>

<div class="box">
<h3>👥 ADD DISTRIBUTOR</h3>
<input id="d_name" placeholder="Name">
<input id="d_mobile" placeholder="Mobile No (Login ID)">
<input id="d_pass" placeholder="Password">
<button type="button" class="btn btn-green" onclick="addDist()">+ ADD DISTRIBUTOR</button>
</div>

<div class="box">
<h3>📋 DISTRIBUTORS (<span id="count">0</span>)</h3>
<div id="distList" style="margin-top:10px"></div>
</div>
</div>

<script>
function checkLogin(){
if(localStorage.getItem('admin_login')=='true'){
document.getElementById('loginBox').style.display='none';
document.getElementById('mainBox').style.display='block';
loadData();
}else{
document.getElementById('loginBox').style.display='flex';
document.getElementById('mainBox').style.display='none';
}
}
function doLogin(){
let id=document.getElementById('a_id').value;
let pass=document.getElementById('a_pass').value;
if(id=='admin' && pass=='admin123'){
localStorage.setItem('admin_login','true');
checkLogin();
}else{err.innerText='Wrong ID / Password!';}
}
function doLogout(){localStorage.removeItem('admin_login');checkLogin();}
function saveComm(){localStorage.setItem('comm_mobile',c_mobile.value);localStorage.setItem('comm_dth',c_dth.value);localStorage.setItem('comm_elec',c_elec.value);localStorage.setItem('comm_aeps',c_aeps.value);alert('Commission Saved ✅');}
function addDist(){
let n=document.getElementById('d_name').value.trim();
let m=document.getElementById('d_mobile').value.trim();
let p=document.getElementById('d_pass').value.trim();
if(!m||!p){alert('Mobile & Password darkar');return;}
let list=JSON.parse(localStorage.getItem('distributors')||'[]');
if(list.find(x=>x.mobile==m)){alert('Already achi');return;}
list.push({mobile:m,password:p,name:n||'Dist'});
localStorage.setItem('distributors',JSON.stringify(list));
document.getElementById('d_name').value='';document.getElementById('d_mobile').value='';document.getElementById('d_pass').value='';
showList();
alert('Added ✅');
}
function showList(){
let list=JSON.parse(localStorage.getItem('distributors')||'[]');
document.getElementById('count').innerText=list.length;
let h='';
list.forEach((d,i)=>{h+=<div class=list-item><div><b>${d.name}</b><br><small>${d.mobile} | ${d.password}</small></div><button onclick="delDist(${i})" style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px">Delete</button></div>});
document.getElementById('distList').innerHTML=h||'<small>No Data</small>';
}
function delDist(i){if(confirm('Delete?')){let l=JSON.parse(localStorage.getItem('distributors')||'[]');l.splice(i,1);localStorage.setItem('distributors',JSON.stringify(l));showList();}}
function loadData(){
document.getElementById('c_mobile').value=localStorage.getItem('comm_mobile')||2;
document.getElementById('c_dth').value=localStorage.getItem('comm_dth')||3;
document.getElementById('c_elec').value=localStorage.getItem('comm_elec')||1.5;
document.getElementById('c_aeps').value=localStorage.getItem('comm_aeps')||5;
showList();
}
checkLogin();
</script>
</body></html>
