<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PQP FULL ADMIN - ALL WORKING</title>
<style>
:root{--bg:#020617;--c:#1e293b;--c2:#0f172a;--l:#334155;--y:#f59e0b;--g:#22c55e;--r:#ef4444;--b:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:#fff}
#LOGIN{max-width:380px;margin:80px auto;text-align:center;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px}
#APP{display:none}
.top{position:sticky;top:0;z-index:10;background:#0f172a;padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--l)}
.nav{display:flex;gap:6px;overflow:auto;padding:10px;border-bottom:1px solid var(--l);position:sticky;top:52px;background:var(--bg)}
.nav button{white-space:nowrap;padding:8px 13px;border-radius:20px;border:1px solid var(--l);background:var(--c);color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.nav button.active{background:var(--y);color:#000}
.wrap{max-width:1100px;margin:auto;padding:12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.stat{background:var(--c2);border:1px solid var(--l);border-radius:12px;padding:12px}
input,select{width:100%;background:var(--c2);border:1px solid var(--l);color:#fff;padding:11px;border-radius:10px;margin:5px 0}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin-top:6px}
.btn-y{background:var(--y);color:#000}.btn-g{background:var(--g)}.btn-b{background:var(--b);color:#fff}.btn-r{background:var(--r);color:#fff;padding:6px 12px;width:auto;border-radius:8px;border:none}
.item{background:var(--c2);border:1px solid var(--l);padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.tab{display:none}.tab.active{display:block}
.small{color:#94a3b8;font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border-bottom:1px solid var(--l);padding:8px;font-size:13px}
</style>
</head><body>

<div id="LOGIN">
<h2>🔐 ADMIN LOGIN</h2><p class="small">admin / admin123</p>
<input id="uid" value="admin"><input id="upass" value="admin123" type="password">
<button class="btn btn-y" onclick="loginNow()">LOGIN</button><p id="msg" class="small"></p>
</div>

<div id="APP">
<div class="top"><b>⚡ PQP ADMIN - ALL FUNCTIONS</b><div><span id="adminTop" class="small"></span> <button class="btn-r" onclick="logoutNow()">Logout</button></div></div>
<div class="nav">
<button class="active" onclick="openTab(0)">📊 Dash</button>
<button onclick="openTab(1)">💸 Transfer</button>
<button onclick="openTab(2)">💰 Daily</button>
<button onclick="openTab(3)">👥 Dist</button>
<button onclick="openTab(4)">🏪 Ret</button>
<button onclick="openTab(5)">⚙️ Services</button>
<button onclick="openTab(6)">💳 Txn</button>
</div>
<div class="wrap">

<div id="t0" class="tab active"><div class="grid4"><div class="stat"><div class="small">Admin Bal</div><b id="s_admin">₹0</b></div><div class="stat"><div class="small">Today</div><b id="s_today">₹0</b></div><div class="stat"><div class="small">Services</div><b id="s_serv">0</b></div><div class="stat"><div class="small">Txn</div><b id="s_txn">0</b></div></div><div class="card"><h3>Last 7 Days</h3><div id="chart7"></div></div></div>

<div id="t1" class="tab"><div class="card"><h3>💸 Balance Transfer</h3><div class="grid2"><select id="fromType" onchange="loadFrom()"><option value="ADMIN">ADMIN</option><option value="DIST">DIST</option></select><select id="fromUser"></select></div><div class="grid2"><select id="toType" onchange="loadTo()"><option value="DIST">DIST</option><option value="RET">RET</option></select><select id="toUser"></select></div><input id="trAmt" type="number" placeholder="Amount"><button class="btn btn-g" onclick="doTransfer()">TRANSFER NOW</button><p id="trMsg" class="small"></p></div><div class="card"><div id="trHis"></div></div></div>

<div id="t2" class="tab"><div class="card"><h3>💰 Daily Commission</h3><div class="grid2"><input type="date" id="fromDate"><input type="date" id="toDate"></div><button class="btn btn-y" onclick="renderDaily()">SHOW</button><table><tr><th>Date</th><th>Cnt</th><th>Amt</th><th>Comm</th></tr><tbody id="dailyBody"></tbody></table><p>Total: <b id="dailyTotal">₹0</b></p></div></div>

<div id="t3" class="tab"><div class="card"><h3>Add Distributor</h3><div class="grid2"><input id="d_n" placeholder="Name"><input id="d_m" placeholder="Mobile ID"></div><div class="grid2"><input id="d_p" placeholder="Pass"><input id="d_bal" type="number" placeholder="Bal"></div><button class="btn btn-g" onclick="addDist()">ADD DIST</button></div><div class="card"><div id="distList"></div></div></div>

<div id="t4" class="tab"><div class="card"><h3>Add Retailer</h3><select id="r_par"></select><div class="grid2"><input id="r_n" placeholder="Name"><input id="r_m" placeholder="Mobile"></div><button class="btn btn-b" onclick="addRet()">ADD RET</button></div><div class="card"><div id="retList"></div></div></div>

<div id="t5" class="tab"><div class="card"><h3>⚙️ Add Service</h3><div class="grid2"><input id="sv_name" placeholder="Service Name"><input id="sv_icon" placeholder="Icon"></div><div class="grid2"><input id="sv_comm" type="number" placeholder="Comm %"><select id="sv_status"><option>Active</option><option>Inactive</option></select></div><button class="btn btn-y" onclick="addService()">ADD SERVICE</button></div><div class="card"><div id="servList"></div></div></div>

<div id="t6" class="tab"><div class="card"><div id="txnList"></div></div></div>

</div></div>

<script>
// LOGIN LOGOUT - TESTED
function loginNow(){let u=uid.value.trim(),p=upass.value.trim();if(u==='admin'&&p==='admin123'){localStorage.setItem('pqp_admin','ok');LOGIN.style.display='none';APP.style.display='block';renderAll();}else{msg.innerText='Use admin / admin123';}}
function logoutNow(){localStorage.removeItem('pqp_admin');APP.style.display='none';LOGIN.style.display='block';}
if(localStorage.getItem('pqp_admin')==='ok'){LOGIN.style.display='none';APP.style.display='block';}
function openTab(i){document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('active',j===i));document.querySelectorAll('.nav button').forEach((b,j)=>b.classList.toggle('active',j===i));}
// DATA
let dists=JSON.parse(localStorage.getItem('pqp_dists')||'[]'),rets=JSON.parse(localStorage.getItem('pqp_rets')||'[]'),txns=JSON.parse(localStorage.getItem('pqp_txns')||'[]'),transfers=JSON.parse(localStorage.getItem('pqp_transfers')||'[]'),adminBal=Number(localStorage.getItem('admin_bal')||100000),services=JSON.parse(localStorage.getItem('pqp_services')||'null')||[{name:'Mobile',icon:'📱',comm:2,status:'Active'},{name:'DTH',icon:'📺',comm:3,status:'Active'},{name:'Electricity',icon:'💡',comm:1,status:'Active'},{name:'Water',icon:'💧',comm:1,status:'Active'},{name:'Gas',icon:'🔥',comm:1,status:'Active'}];
function save(){localStorage.setItem('pqp_dists',JSON.stringify(dists));localStorage.setItem('pqp_rets',JSON.stringify(rets));localStorage.setItem('pqp_services',JSON.stringify(services));localStorage.setItem('pqp_transfers',JSON.stringify(transfers));localStorage.setItem('admin_bal',adminBal);localStorage.setItem('pqp_txns',JSON.stringify(txns));}
function addDist(){let n=d_n.value,m=d_m.value.trim(),p=d_p.value.trim(),b=Number(d_bal.value||0);if(!m)return alert('Mobile');if(b>adminBal)return alert('Admin low bal');dists.push({name:n||'Dist',mobile:m,password:p,balance:b});adminBal-=b;save();renderAll();d_n.value='';d_m.value='';d_p.value='';d_bal.value='';}
function addRet(){let par=r_par.value,n=r_n.value,m=r_m.value.trim();if(!m)return alert('Mobile');rets.push({name:n||'Ret',mobile:m,parent:par,balance:0});save();renderAll();}
function addService(){let name=sv_name.value.trim(),icon=sv_icon.value.trim()||'⚙️',comm=Number(sv_comm.value||0),status=sv_status.value;if(!name)return alert('Name');services.push({name,icon,comm,status});save();renderAll();sv_name.value='';}
function loadFrom(){fromUser.innerHTML=fromType.value==='ADMIN'?<option value="ADMIN">ADMIN ₹${adminBal}</option>:dists.map(d=><option value="${d.mobile}">${d.name} ₹${d.balance}</option>).join('');}
function loadTo(){toUser.innerHTML=toType.value==='DIST'?dists.map(d=><option value="${d.mobile}">${d.name}</option>).join(''):rets.map(r=><option value="${r.mobile}">${r.name}</option>).join('');}
function doTransfer(){let fT=fromType.value,fU=fromUser.value,tT=toType.value,tU=toUser.value,amt=Number(trAmt.value);if(!amt)return alert('Amt');if(fT==='ADMIN'){if(adminBal<amt)return alert('Low');adminBal-=amt;}else{let d=dists.find(x=>x.mobile===fU);if(d.balance<amt)return alert('Low');d.balance-=amt;}if(tT==='DIST'){dists.find(x=>x.mobile===tU).balance+=amt;}else{rets.find(x=>x.mobile===tU).balance+=amt;}transfers.unshift({date:new Date().toISOString().split('T')[0],time:new Date().toLocaleTimeString(),from:fT+':'+fU,to:tT+':'+tU,amount:amt});save();renderAll();trMsg.innerText='✅ ₹'+amt+' Done';trAmt.value='';}
function renderAll(){adminTop.innerText='₹'+adminBal;s_admin.innerText='₹'+adminBal;s_serv.innerText=services.length;s_txn.innerText=txns.length;s_today.innerText='₹'+txns.filter(t=>t.date===new Date().toISOString().split('T')[0]).reduce((a,b)=>a+Number(b.comm||0),0);distList.innerHTML=dists.map((d,i)=><div class="item"><div><b>${d.name}</b><br><small>${d.mobile} ₹${d.balance}</small></div><button class="btn-r" onclick="dists.splice(${i},1);save();renderAll()">X</button></div>).join('')||'No Dist';retList.innerHTML=rets.map((r,i)=><div class="item"><div><b>${r.name}</b><br><small>${r.mobile} Par:${r.parent}</small></div><button class="btn-r" onclick="rets.splice(${i},1);save();renderAll()">X</button></div>).join('')||'No Ret';r_par.innerHTML=dists.map(d=><option value="${d.mobile}">${d.name}</option>).join('')||'<option>No Dist</option>';loadFrom();loadTo();trHis.innerHTML=transfers.map(t=><div class="item"><div>${t.from} → ${t.to}<br><small>${t.date}</small></div><b>₹${t.amount}</b></div>).join('')||'No';servList.innerHTML=services.map((s,i)=><div class="item"><div><b>${s.icon} ${s.name}</b><br><small>${s.comm}% ${s.status}</small></div><button class="btn-r" onclick="services.splice(${i},1);save();renderAll()">X</button></div>).join('');txnList.innerHTML=txns.slice().reverse().slice(0,30).map(t=><div class="item"><div>${t.type} ${t.mobile}<br><small>${t.date} ₹${t.amount}</small></div>₹${t.comm}</div>).join('')||'No';let map={};for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);map[d.toISOString().split('T')[0]]=0;}txns.forEach(t=>{if(map.hasOwnProperty(t.date))map[t.date]+=Number(t.comm||0);});chart7.innerHTML='<table>'+Object.keys(map).sort().reverse().map(k=><tr><td>${k}</td><td>₹${map[k]}</td></tr>).join('')+'</table>';renderDaily();}
function renderDaily(){let from=fromDate.value,to=toDate.value,f=txns;if(from)f=f.filter(t=>t.date>=from);if(to)f=f.filter(t=>t.date<=to);let g={};f.forEach(t=>{if(!g[t.date])g[t.date]={count:0,amt:0,comm:0};g[t.date].count++;g[t.date].amt+=Number(t.amount||0);g[t.date].comm+=Number(t.comm||0);});let total=0,rows='';Object.keys(g).sort().reverse().forEach(d=>{total+=g[d].comm;rows+=<tr><td>${d}</td><td>${g[d].count}</td><td>₹${g[d].amt}</td><td>₹${g[d].comm}</td></tr>});dailyBody.innerHTML=rows||'<tr><td colspan=4>No</td></tr>';dailyTotal.innerText='₹'+total;}
if(txns.length===0){txns.push({date:new Date().toISOString().split('T')[0],type:'Mobile',mobile:'98765',amount:200,comm:5});save();}
renderAll();
</script>
</body></html>
