<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Logout Test</title>
<style>body{background:#020617;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;width:90%;max-width:350px;text-align:center}input{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:12px;border-radius:10px;margin:6px 0;box-sizing:border-box}.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer}.btn-y{background:#f59e0b;color:#000}.btn-r{background:#ef4444;color:#fff;padding:8px 14px;width:auto;border-radius:8px;border:none}.small{color:#94a3b8;font-size:12px}</style>
</head><body>

<div id="LOGIN" class="card">
<h2>🔐 ADMIN LOGIN</h2>
<p class="small">admin / admin123</p>
<input id="uid" value="admin" placeholder="ID">
<input id="upass" value="admin123" type="password" placeholder="Pass">
<button class="btn btn-y" onclick="loginNow()">LOGIN</button>
<p id="msg" class="small" style="margin-top:8px"></p>
</div>

<div id="APP" class="card" style="display:none">
<h2>✅ LOGIN SUCCESS</h2>
<p class="small" style="margin:10px 0">Ebe Logout test kara</p>
<p style="margin:10px 0">Admin Panel khuligala</p>
<button class="btn btn-r" onclick="logoutNow()">LOGOUT</button>
</div>

<script>
function loginNow(){
  var u = document.getElementById('uid').value.trim();
  var p = document.getElementById('upass').value.trim();
  if(u === 'admin' && p === 'admin123'){
    localStorage.setItem('pqp_admin','ok');
    document.getElementById('LOGIN').style.display='none';
    document.getElementById('APP').style.display='block';
  }else{
    document.getElementById('msg').innerText = 'Wrong! Use admin / admin123';
  }
}
function logoutNow(){
  localStorage.removeItem('pqp_admin');
  document.getElementById('APP').style.display='none';
  document.getElementById('LOGIN').style.display='block';
  document.getElementById('uid').value='admin';
  document.getElementById('upass').value='admin123';
}

if(localStorage.getItem('pqp_admin') === 'ok'){
  document.getElementById('LOGIN').style.display='none';
  document.getElementById('APP').style.display='block';
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ loginNow(); }
});
</script>
</body></html>
