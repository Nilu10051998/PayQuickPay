<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Fixed</title></head><body style="background:#020617;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif"><div id="L" style="background:#1e293b;padding:20px;border-radius:14px;width:300px"><h3>ADMIN LOGIN</h3><input id="u" value="admin" style="width:100%;padding:10px;margin:5px 0"><input id="p" type="password" value="admin123" style="width:100%;padding:10px;margin:5px 0"><button id="btn" style="width:100%;padding:12px;background:#f59e0b;border:none;font-weight:800">LOGIN</button></div><div id="D" style="display:none;background:#1e293b;padding:20px;border-radius:14px;width:340px"><h3>✅ LOGIN SUCCESS</h3><p>Admin Panel Ready</p><input id="dn" placeholder="Distributor Name" style="width:100%;padding:8px;margin:4px 0"><input id="dm" placeholder="Mobile" style="width:100%;padding:8px;margin:4px 0"><input id="dp" placeholder="Password" style="width:100%;padding:8px;margin:4px 0"><button id="add" style="width:100%;padding:10px;background:#22c55e;border:none">ADD</button><div id="list"></div></div><script>document.getElementById('btn').onclick=function(){if(document.getElementById('u').value=='admin'&&document.getElementById('p').value=='admin123'){document.getElementById('L').style.display='none';document.getElementById('D').style.display='block';}else alert('wrong')};document.getElementById('add').onclick=function(){var m=document.getElementById('dm').value;if(!m)return;var d=JSON.parse(localStorage.getItem('distributors')||'[]');d.push({name:document.getElementById('dn').value,mobile:m,password:document.getElementById('dp').value});localStorage.setItem('distributors',JSON.stringify(d));load()};function load(){var d=JSON.parse(localStorage.getItem('distributors')||'[]');var h='';for(var i=0;i<d.length;i++){h+='<div style=background:#0f172a;padding:6px;margin:4px 0;border-radius:6px>'+d[i].mobile+'</div>'}document.getElementById('list').innerHTML=h}load();</script></body></html>
