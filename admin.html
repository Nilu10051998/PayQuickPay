<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#1e293b;padding:24px;border-radius:16px;width:330px;border:1px solid #334155}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#020617;color:#fff}
.btn{width:100%;padding:12px;background:#f59e0b;color:#000;font-weight:900;border:none;border-radius:10px;margin-top:8px;cursor:pointer}
</style></head>
<body>

<div id="loginBox" class="card">
<h2 style="text-align:center">🔐 ADMIN LOGIN</h2>
<input id="aid" placeholder="ID" value="admin">
<input id="apass" type="password" placeholder="Password" value="admin123">
<button class="btn" onclick="doLogin()">LOGIN</button>
<p id="err" style="color:#ef4444;text-align:center;margin-top:8px"></p>
</div>

<div id="adminBox" class="card" style="display:none;width:360px">
<h2 style="text-align:center">✅ ADMIN PANEL</h2>
<input id="dname" placeholder="Distributor Name">
<input id="dmob" placeholder="Mobile">
<input id="dpass" placeholder="Password">
<button class="btn" style="background:#22c55e" onclick="addD()">ADD DISTRIBUTOR</button>
<div id="list" style="margin-top:12px"></div>
<button class="btn" style="background:#ef4444;margin-top:12px" onclick="doLogout()">LOGOUT</button>
</div>

<script>
function doLogin(){
  var id = document.getElementById('aid').value;
  var pass = document.getElementById('apass').value;
  if(id === 'admin' && pass === 'admin123'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
    localStorage.setItem('isAdmin','yes');
    show();
  }else{
    document.getElementById('err').innerText='Wrong ID/Pass';
  }
}
function doLogout(){
  localStorage.removeItem('isAdmin');
  document.getElementById('adminBox').style.display='none';
  document.getElementById('loginBox').style.display='block';
}
function addD(){
  var n = document.getElementById('dname').value;
  var m = document.getElementById('dmob').value;
  var p = document.getElementById('dpass').value;
  if(m === '' || p === ''){alert('Mobile Pass darkar');return;}
  var arr = JSON.parse(localStorage.getItem('distributors') || '[]');
  arr.push({name:n,mobile:m,password:p});
  localStorage.setItem('distributors',JSON.stringify(arr));
  document.getElementById('dname').value='';
  document.getElementById('dmob').value='';
  document.getElementById('dpass').value='';
  alert('Added');
  show();
}
function show(){
  var arr = JSON.parse(localStorage.getItem('distributors') || '[]');
  var txt = '';
  for(var i=0;i<arr.length;i++){
    txt = txt + arr[i].name + ' - ' + arr[i].mobile + '\n';
  }
  document.getElementById('list').innerText = txt || 'No data';
}
if(localStorage.getItem('isAdmin') === 'yes'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminBox').style.display='block';
  show();
}
</script>
</body></html>
