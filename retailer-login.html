<html lang="en">

<title>PayQuickPay - Retailer Panel</title>
<script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6 mt-5">
  <h1 class="text-2xl font-bold text-blue-600">PayQuickPay Retailer</h1>
  <p id="retailerInfo" class="text-gray-600 mt-1">Loading...</p>
  
  <div class="bg-green-100 p-4 rounded-lg mt-4">

  </div>

  <div class="mt-6">
    <h2 class="font-bold">Mobile Recharge</h2>
    <input id="number" type="tel" placeholder="Mobile Number" class="w-full border p-3 rounded-lg mt-2" maxlength="10">
    <input id="amount" type="number" placeholder="Amount" class="w-full border p-3 rounded-lg mt-2">
    <select id="operator" class="w-full border p-3 rounded-lg mt-2">
      <option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option>
    </select>
    <button onclick="doRecharge()" class="w-full bg-blue-600 text-white p-3 rounded-lg mt-3 font-bold">Recharge Now</button>
  </div>

  <div id="history" class="mt-6">
    <h2 class="font-bold">Recent Recharges</h2>
    <div id="historyList" class="text-sm text-gray-600 mt-2">Loading...</div>
  </div>

  <button onclick="logout()" class="w-full bg-red-100 text-red-600 p-2 rounded-lg mt-6">Logout</button>
</div>
