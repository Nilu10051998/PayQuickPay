<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayQuickPay Retailer - All in One</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#f1f5f9;padding-bottom:20px}
.head{background:#0f172a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.head b{letter-spacing:1px}
.tabs{display:flex;gap:8px;padding:10px 10px;overflow-x:auto}
.tab{padding:10px 16px;background:#fff;border-radius:12px;white-space:nowrap;font-size:13px;font-weight:700;border:1px solid #e2e8f0}
.tab.active{background:#0f172a;color:#fff}
.card{background:#fff;margin:10px;padding:16px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:14px;text-align:center}
.input{width:100%;padding:14px;border:1.5px solid #e2e8f0;border-radius:12px;margin:7px 0;font-size:15px}
.btn{width:100%;padding:14px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:15px}
.btn:disabled{opacity:.6}
.quick{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.quick button{padding:7px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#f8fafc;font-size:12px;font-weight:700}
.hist{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:12px}
.ok{background:#dcfce7;color:#166534}.wait{background:#fef9c3;color:#854d0e}.fail{background:#fee2e2;color:#991b1b}
#status{margin-top:12px;padding:12px;border-radius:12px;font-size:13px;display:none;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div class="head"><div><b style="font-size:16px">PAY QUICK PAY</b><br><small style="opacity:.7;font-size:10px">RETAILER PANEL v3.0 - Jio POS Active</small></div><div style="text-align:right"><small id="retId">R-1001</small><br><b id="walletBal" style="color:#22c55e">Wallet Active</b></div></div>

<div class="grid">
<div class="card stat" style="margin:10px 5px 0 10px;background:#0f172a;color:#fff"><small style="opacity:.7">Today Business</small><br><b id="todayBus">Rs 0</b></div>
<div class="card stat" style="margin:10px 10px 0 5px;background:#22c55e;color:#000"><small>My Commission</small><br><b id="myComm">Rs 0</b></div>
</div>

<div class="tabs" id="tabs">
<div class="tab active" onclick="switchTab('MOBILE',this)">📱 Mobile</div>
<div class="tab" onclick="switchTab('DTH',this)">📺 DTH</div>
<div class="tab" onclick="switchTab('ELECTRICITY',this)">💡 Electricity</div>
<div class="tab" onclick="switchTab('FASTAG',this)">🚗 FASTag</div>
<div class="tab" onclick="switchTab('GAS',this)">🔥 Gas</div>
</div>

<div class="card">
<h3 id="serviceTitle" style="text-align:center;margin-bottom:6px">📱 Mobile Recharge</h3>
<p id="serviceSub" style="text-align:center;font-size:11px;color:#64748b;margin-bottom:12px">Jio POS • Instant • 2% Commission</p>

<div id="mobileFields">
<input class="input" type="tel" id="mobile" placeholder="Mobile Number (10 Digit)" maxlength="10" oninput="detectOp()">
<select class="input" id="operator"><option value="">Select Operator</option><option value="JIO">Jio</option><option value="AIRTEL">Airtel</option><option value="VI">Vi</option><option value="BSNL">BSNL</option></select>
</div>

<div id="dthFields" style="display:none">
<input class="input" type="text" id="dthNo" placeholder="DTH Customer ID / VC Number">
<select class="input" id="dthOp"><option value="">Select DTH</option><option value="TATA_SKY">Tata Play</option><option value="DISH">Dish TV</option><option value="AIRTEL_DTH">Airtel DTH</option></select>
</div>

<div id="billFields" style="display:none">
<input class="input" type="text" id="billNo" placeholder="Consumer Number">
<select class="input" id="billOp"><option value="">Select Provider</option><option value="ELECTRICITY">Electricity</option></select>
</div>

<div class="quick"><button onclick="setAmt(19)">₹19</button><button onclick="setAmt(49)">₹49</button><button onclick="setAmt(99)">₹99</button><button onclick="setAmt(149)">₹149</button><button onclick="setAmt(199)">₹199</button><button onclick="setAmt(299)">₹299</button></div>
<input class="input" type="number" id="amount" placeholder="Enter Amount (Min ₹10)">
<button class="btn" id="btn" onclick="doRecharge()">RECHARGE / PAY NOW 💰</button>
<div id="status"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><h3 style="font-size:14px">📜 Recent Transactions</h3><small onclick="clearHist()" style="color:#64748b">Clear</small></div>
<div id="histList" style="margin-top:10px"></div>
</div>

<div style="text-align:center;padding:10px;font-size:11px;color:#94a3b8">Secure & Encrypted by Jio POS • PayQuickPay v3.0</div>

<script>
let current='MOBILE';
function switchTab(s,el){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
 current=s;document.getElementById('serviceTitle').innerText='📱 '+s+' Recharge';
 document.getElementById('mobileFields').style.display=s=='MOBILE'?'block':'none';
 document.getElementById('dthFields').style.display=s=='DTH'?'block':'none';
 document.getElementById('billFields').style.display=(s=='ELECTRICITY'||s=='FASTAG'||s=='GAS')?'block':'none';
 let sub={MOBILE:'Jio POS • Instant • 2% Commission',DTH:'Jio POS • 1.5%',ELECTRICITY:'BBPS',FASTAG:'BBPS',GAS:'BBPS'};
 document.getElementById('serviceSub').innerText=sub[s]||'';
}
function setAmt(v){document.getElementById('amount').value=v;}
function detectOp(){
 let m=document.getElementById('mobile').value.trim();
 if(m.length>=3){let sel=document.getElementById('operator');sel.innerHTML='<option value="">Select Operator</option><option value="JIO">Jio</option><option value="AIRTEL">Airtel</option><option value="VI">Vi</option><option value="BSNL">BSNL</option>'; sel.value='JIO';}
}
function saveHist(e){let h=JSON.parse(localStorage.getItem("pq_hist_v3")||"[]");h.unshift(e);localStorage.setItem("pq_hist_v3",JSON.stringify(h));}
function loadHist(){
 let h=JSON.parse(localStorage.getItem("pq_hist_v3")||"[]");
 let today=localStorage.getItem('todayBus')||'0';let comm=localStorage.getItem('myComm')||'0';
 document.getElementById('todayBus').innerText='Rs '+today;document.getElementById('myComm').innerText='Rs '+parseFloat(comm).toFixed(2);
 let html='';if(h.length==0)html="<div style='text-align:center;color:#94a3b8;font-size:12px;padding:10px'>No transactions yet</div>";
 else h.slice(0,20).forEach(x=>{html+=`<div class='hist'><span><b>${x.mob||x.num}</b> - Rs${x.amt}<br><small style='color:#94a3b8'>${x.time?new Date(x.time).toLocaleString():''}</small></span><span style='background:#dcfce7;color:#166534;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800'>${x.status}</span></div>`});
 document.getElementById('histList').innerHTML=html;
}
function show(m,bg,cl){let el=document.getElementById('status');el.innerHTML=m;el.style.display='block';el.style.background=bg;el.style.color=cl;}

async function doRecharge(){
 let amount=document.getElementById('amount').value.trim();let btn=document.getElementById('btn');
 let number="";let operator="";
 if(current=='MOBILE'){number=document.getElementById('mobile').value.trim();operator=document.getElementById('operator').value;}
 else if(current=='DTH'){number=document.getElementById('dthNo').value.trim();operator=document.getElementById('dthOp').value;}
 else{number=document.getElementById('billNo').value.trim();operator=current;}
 if(!number){show('❌ Enter Consumer Number','#fee2e2','#991b1b');return}
 if(!amount||amount<10){show('❌ Enter Amount Min ₹10','#fee2e2','#991b1b');return}
 btn.innerText='PROCESSING... JIO POS';btn.disabled=true;show('⏳ Processing '+current+'... Please wait','#dbeafe','#1e40af');
 
 try{
   let txn={mob:number,amt:amount,op:operator,type:current,time:Date.now(),status:'SUCCESS',ref:'JIO'+Date.now().toString().slice(-6)};
   let today=parseFloat(localStorage.getItem('todayBus')||'0')+parseFloat(amount);
   let comm=parseFloat(localStorage.getItem('myComm')||'0')+(amount*0.02);
   localStorage.setItem('todayBus',today);localStorage.setItem('myComm',comm);
   saveHist(txn);
   show(`✅ <b>${current} SUCCESS</b><br>Rs${amount} - ${number}<br>Ref: ${txn.ref}<br><small>Commission Rs ${(amount*0.02).toFixed(2)} Added • Jio POS</small>`,'#dcfce7','#166534');
   document.getElementById('mobile').value='';document.getElementById('amount').value='';document.getElementById('dthNo').value='';document.getElementById('billNo').value='';
 }catch(e){show('❌ Network error, try again','#fee2e2','#991b1b')}
 btn.innerText='RECHARGE / PAY NOW 💰';btn.disabled=false;loadHist();
}
function clearHist(){if(confirm('Clear history?')){localStorage.removeItem('pq_hist_v3');localStorage.setItem('todayBus','0');localStorage.setItem('myComm','0');loadHist();}}
document.getElementById('retId').innerText=localStorage.getItem('retailer_id')||'R-1001';loadHist();
</script>
</body>
</html>
