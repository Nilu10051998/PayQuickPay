<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retailer - PayQuickPay</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#020617;color:#fff;padding:10px}.head{display:flex;justify-content:space-between;background:#1e293b;padding:12px;border-radius:12px;border:1px solid #334155}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}input,select{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s{background:#0f172a;padding:12px;border-radius:10px;text-align:center;border:1px solid #1e293b}.op{padding:8px 12px;border-radius:20px;background:#0f172a;border:1px solid #334155;margin:3px;display:inline-block;font-size:12px;cursor:pointer;color:#fff}.op.active{background:#38bdf8;color:#000;font-weight:700}.hist{background:#0f172a;padding:10px;margin:6px 0;border-radius:8px;display:flex;justify-content:space-between;font-size:13px;border:1px solid #1e293b}</style>
</head><body>

<div class="head"><div><b id="rName">Retailer</b><br><small id="rId">ID</small> | Bal: ₹<b id="bal">0</b></div><button onclick="logout()" style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px">Logout</button></div>

<div class="grid">
<div class="s"><small style="color:#94a3b8">Wallet Balance</small><br><b id="bal2" style="font-size:22px">₹0</b></div>
<div class="s"><small style="color:#94a3b8">My Profit</small><br><b id="profit" style="font-size:22px;color:#22c55e">₹0</b></div>
</div>

<div class="card" style="border:1px solid #38bdf8">
<h3>📱 Real Recharge - KwikAPI</h3>
<div style="margin:10px 0">
<span class="op active" onclick="setOp('JIO',this)">JIO</span>
<span class="op" onclick="setOp('AIRTEL',this)">AIRTEL</span>
<span class="op" onclick="setOp('VI',this)">VI</span>
<span class="op" onclick="setOp('BSNL',this)">BSNL</span>
</div>
<input id="mobile" type="tel" maxlength="10" placeholder="Mobile - 10 Digit">
<select id="operator"><option value="JIO">JIO</option><option value="AIRTEL">Airtel</option><option value="VI">VI</option><option value="BSNL">BSNL</option></select>
<input id="amount" type="number" placeholder="Amount - Min 10">
<div class="grid" style="margin:8px 0">
<button class="op" onclick="setAmt(10)">₹10</button>
<button class="op" onclick="setAmt(19)">₹19</button>
<button class="op" onclick="setAmt(49)">₹49</button>
<button class="op" onclick="setAmt(99)">₹99</button>
<button class="op" onclick="setAmt(199)">₹199</button>
<button class="op" onclick="setAmt(299)">₹299</button>
</div>
<button class="btn" style="background:#22c55e;color:#000" id="btnRec" onclick="doRecharge()">⚡ REAL RECHARGE NOW</button>
<p id="msg" style="text-align:center;margin-top:12px;font-weight:700;min-height:24px;font-size:14px"></p>
<p id="commInfo" style="text-align:center;font-size:11px;color:#94a3b8;margin-top:6px"></p>
</div>

<div class="card"><h3>📜 Transaction History</h3><div id="hist">No Data</div></div>

<script>
let me=null;
function loadR(){let ks=["retailers","retailers_backup","pq_retailers_secret","payquick_retailers"];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith("retailers_"))ks.push(k);}let best=[];ks.forEach(k=>{try{let v=JSON.parse(localStorage.getItem(k)||"[]");if(v.length>best.length)best=v;}catch(e){}});return best;}
function saveR(l){let s=JSON.stringify(l);localStorage.setItem("retailers",s);localStorage.setItem("retailers_backup",s);localStorage.setItem("pq_retailers_secret",s);localStorage.setItem("payquick_retailers",s);for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith("retailers_"))localStorage.setItem(k,s);}}
function getMe(){let rid=localStorage.getItem("retailerLoggedIn")||localStorage.getItem("currentRetailerId");if(!rid)return null;return loadR().find(x=>x.id==rid);}
function getComm(){return JSON.parse(localStorage.getItem("commission_settings")||'{"retailer":2,"distributor":1,"admin":1}');}
function init(){
  me=getMe();
  if(!me){location.href="index.html";return;}
  document.getElementById('rName').innerText=me.name||me.id;
  document.getElementById('rId').innerText=me.id;
  document.getElementById('bal').innerText=me.balance;
  document.getElementById('bal2').innerText="₹"+me.balance;
  let c=getComm();
  document.getElementById('commInfo').innerText=`Commission: You ${c.retailer}% | Dist ${c.distributor}% | Admin ${c.admin}% | KwikAPI Real`;
  render(); calcProfit();
}
function setOp(o,el){document.getElementById('operator').value=o;document.querySelectorAll('.op').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');}
function setAmt(a){document.getElementById('amount').value=a;}

async function doRecharge(){
  let mob=document.getElementById('mobile').value.trim();
  let amt=parseFloat(document.getElementById('amount').value);
  let op=document.getElementById('operator').value;
  let msg=document.getElementById('msg');
  let btn=document.getElementById('btnRec');
  
  if(mob.length!=10 || isNaN(parseInt(mob))){msg.innerText="❌ Valid 10 Digit Mobile Dia";msg.style.color="#ef4444";return;}
  if(!amt || amt<10){msg.innerText="❌ Amount Min ₹10 Dia";msg.style.color="#ef4444";return;}
  
  me=getMe();
  if(!me){msg.innerText="❌ Login Expired";return;}
  if(amt>parseFloat(me.balance)){msg.innerText="❌ Balance Low! Available: ₹"+me.balance;msg.style.color="#ef4444";return;}

  btn.innerText="⏳ KWIKAPI RECHARGE..."; btn.disabled=true;
  msg.innerText="⏳ KwikAPI Ku Request Jauchi - "+mob+" ₹"+amt+"..."; msg.style.color="#38bdf8";

  try{
    const res = await fetch("/api/kwikapi",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({mobile:mob, operator:op, amount:amt})
    });
    
    const result = await res.json();
    console.log("KwikAPI Result:", result);

    if(result.status==true){
      // SUCCESS - COMMISSION DISTRIBUTE
      let cs=getComm();
      let rComm=amt*cs.retailer/100, dComm=amt*cs.distributor/100, aComm=amt*cs.admin/100;
      let newBal=parseFloat(me.balance)-amt+rComm;
      
      let all=loadR();
      let idx=all.findIndex(x=>x.id==me.id);
      if(idx>=0){all[idx].balance=newBal.toFixed(2); saveR(all); me=all[idx];}

      // Distributor Commission
      try{
        let distId=me.distId;
        if(distId){
          let allD=JSON.parse(localStorage.getItem("distributors")||localStorage.getItem("pq_secret_db")||"[]");
          let dI=allD.findIndex(x=>x.id==distId);
          if(dI>=0){
            allD[dI].balance=(parseFloat(allD[dI].balance||0)+dComm).toFixed(2);
            let s=JSON.stringify(allD);
            localStorage.setItem("distributors",s);
            localStorage.setItem("distributors_backup",s);
            localStorage.setItem("pq_secret_db",s);
            localStorage.setItem("payquick_final",s);
          }
          let dh=JSON.parse(localStorage.getItem("commission_dist_"+distId)||"[]");
          dh.unshift({from:me.id,amt:amt,comm:dComm.toFixed(2),time:new Date().toLocaleString()});
          localStorage.setItem("commission_dist_"+distId,JSON.stringify(dh));
        }
      }catch(e){console.log("Dist error",e);}

      // Admin Commission
      try{
        let ab=parseFloat(localStorage.getItem("admin_balance")||"0");
        ab+=aComm;
        localStorage.setItem("admin_balance",ab.toFixed(2));
        let ah=JSON.parse(localStorage.getItem("commission_admin")||"[]");
        ah.unshift({from:me.id,via:me.distId||"",amt:amt,comm:aComm.toFixed(2),rComm:rComm.toFixed(2),dComm:dComm.toFixed(2),time:new Date().toLocaleString()});
        localStorage.setItem("commission_admin",JSON.stringify(ah));
      }catch(e){console.log("Admin error",e);}

      let tx={id:result.txnId||"TX"+Date.now(),opTxn:result.opTxnId||"",mobile:mob,operator:op,amount:amt,comm:rComm.toFixed(2),admin:aComm.toFixed(2),dist:dComm.toFixed(2),time:new Date().toLocaleString(),status:"SUCCESS"};
      let h=JSON.parse(localStorage.getItem("recharge_history_"+me.id)||"[]");
      h.unshift(tx);
      localStorage.setItem("recharge_history_"+me.id,JSON.stringify(h));

      msg.innerText=`✅ SUCCESS! ${mob} ₹${amt} | Txn: ${tx.id} | You Got ₹${rComm.toFixed(2)} | OpID: ${result.opTxnId||"-"}`;
      msg.style.color="#22c55e";
      document.getElementById('bal').innerText=newBal.toFixed(2);
      document.getElementById('bal2').innerText="₹"+newBal.toFixed(2);
      document.getElementById('mobile').value="";
      document.getElementById('amount').value="";
      render(); calcProfit();
    }else{
      msg.innerText=`❌ FAILED: ${result.msg} | Raw: ${JSON.stringify(result.data||result).substring(0,150)}`;
      msg.style.color="#ef4444";
    }
  }catch(err){
    msg.innerText="❌ Network Error: "+err.message;
    msg.style.color="#ef4444";
  }
  
  btn.innerText="⚡ REAL RECHARGE NOW";
  btn.disabled=false;
}

function render(){
  let h=JSON.parse(localStorage.getItem("recharge_history_"+(me?.id||""))||"[]");
  if(h.length==0){document.getElementById('hist').innerHTML="<small style='color:#64748b'>No Transactions Yet</small>";return;}
  let html="";
  h.slice(0,20).forEach(t=>{
    html+=`<div class="hist"><span><b>${t.mobile}</b> ${t.operator} ₹${t.amount}<br><small style="color:#94a3b8">You ₹${t.comm} | Txn ${t.id.substring(0,10)}</small></span><span style="color:${t.status=='SUCCESS'?'#22c55e':'#ef4444'}">${t.status}<br><small style="color:#64748b">${t.time}</small></span></div>`;
  });
  document.getElementById('hist').innerHTML=html;
}
function calcProfit(){
  let h=JSON.parse(localStorage.getItem("recharge_history_"+(me?.id||""))||"[]");
  let tot=0; h.forEach(t=>{tot+=parseFloat(t.comm||0);});
  document.getElementById('profit').innerText="₹"+tot.toFixed(2);
}
function logout(){localStorage.removeItem("retailerLoggedIn");localStorage.removeItem("currentRetailerId");location.href="index.html";}
init();
</script>
</body></html>
