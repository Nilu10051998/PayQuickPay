<script>
const BACKEND_URL='/api/a1topup';

async function checkBalance(){
  document.getElementById('a1balance').innerText='Checking backend...';
  try{
    let res=await fetch(`${BACKEND_URL}?action=balance`);
    let text=await res.text();
    console.log(text);
    document.getElementById('a1balance').innerText=text.substring(0,80)+' - Connected via Backend';
  }catch(e){document.getElementById('a1balance').innerText=e.message;}
}

async function doRealRecharge(){
  let cust=document.getElementById('customerNo').value.trim();
  let amt=document.getElementById('amount').value;
  let op=document.getElementById('operatorCode').value;
  let circle=document.getElementById('circleCode').value;
  let orderId='PAY'+Date.now();
  
  document.getElementById('msg').innerText='Backend -> A1Topup - OrderID: '+orderId;
  
  try{
    let url=`${BACKEND_URL}?action=recharge&circlecode=${circle}&operatorcode=${op}&number=${cust}&amount=${amt}&orderid=${orderId}`;
    let res=await fetch(url);
    let text=await res.text();
    console.log(text);
    document.getElementById('msg').innerText=text.substring(0,200)+' - LIVE';
    
    if(text.toLowerCase().includes('success')){
      document.getElementById('msg').style.color='green';
    } else {
      document.getElementById('msg').style.color='red';
    }
  }catch(e){document.getElementById('msg').innerText=e.message;}
}
</script>
