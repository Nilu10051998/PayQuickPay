<script>
// Operator List - Permanent
const OPERATORS = [
 {code:"A", name:"AIRTEL"}, {code:"JIO", name:"JIO"}, {code:"V", name:"VI"},
 {code:"BSNL", name:"BSNL"}, {code:"AT", name:"AIRTEL DTH"}
];
window.onload = ()=>{
  let sel = document.getElementById('operator');
  sel.innerHTML = OPERATORS.map(o=>`<option value="${o.code}">${o.name}</option>`).join('');
  checkBalance();
}

async function checkBalance(){
 try{
  let res = await fetch('/api/balance');
  let data = await res.json();
  document.querySelector('.wallet').innerText = data.raw; // A1 Balance asiba
 }catch(e){ console.log(e); }
}

async function doRecharge(){
 const mob = document.getElementById('mobile').value.trim();
 const opr = document.getElementById('operator').value;
 const amt = document.getElementById('amount').value.trim();
 if(!mob || !opr || !amt){ alert("All fields"); return; }
 
 let btn = document.getElementById('reBtn');
 btn.disabled=true; btn.innerText="Processing...";
 try{
  let res = await fetch(`/api/recharge?mobile=${mob}&op=${opr}&amt=${amt}`);
  let data = await res.json();
  if(data.raw && data.raw.includes("SUCCESS") || data.raw.includes("Success")){
    alert("SUCCESS: "+data.raw);
  } else {
    alert("Response: "+data.raw);
  }
  btn.disabled=false; btn.innerText="RECHARGE NOW";
 }catch(e){
  alert("Error: "+e.message);
  btn.disabled=false; btn.innerText="RECHARGE NOW";
 }
}
</script>
