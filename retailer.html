<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Quick Pay - Retailer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f5f7fb;min-height:100vh}
.header{background:#0a1931;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.header h2{font-size:18px;letter-spacing:1px}
.card{max-width:420px;margin:25px auto;background:white;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.08);padding:25px}
.card h3{text-align:center;color:#0a1931;margin-bottom:20px}
.input-group{margin-bottom:15px}
.input-group label{font-size:13px;color:#555;display:block;margin-bottom:5px;font-weight:600}
.input-group input,.input-group select{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
.input-group input:focus,.input-group select:focus{border-color:#0a1931}
.btn{width:100%;padding:14px;background:#0a1931;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn:active{transform:scale(0.98)}
.status{margin-top:15px;padding:12px;border-radius:10px;text-align:center;font-size:14px;display:none}
.status.success{background:#e7f8ef;color:#0a7a3a;display:block}
.status.error{background:#fde8e8;color:#c0392b;display:block}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#888}
.badge{background:#eef2ff;color:#0a1931;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="header">
<h2>PAY QUICK PAY</h2>
<span class="badge">RETAILER PANEL</span>
</div>

<div class="card">
<h3>Mobile Recharge</h3>

<div class="input-group">
<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter 10 digit number" maxlength="10">
</div>

<div class="input-group">
<label>Operator</label>
<select id="operator">
<option value="">Select Operator</option>
<option value="JIO">Jio</option>
<option value="AIRTEL">Airtel</option>
<option value="VI">Vi (Vodafone Idea)</option>
<option value="BSNL">BSNL</option>
</select>
</div>

<div class="input-group">
<label>Amount</label>
<input type="number" id="amount" placeholder="Enter Amount">
</div>

<button class="btn" onclick="doRecharge()" id="btn">RECHARGE NOW</button>

<div id="status" class="status"></div>

<div class="footer">
Secure Transaction Powered by KwikAPI<br>
Support: Pay Quick Pay Helpdesk
</div>
</div>

<script>
async function doRecharge(){
  const mobile = document.getElementById('mobile').value.trim();
  const operator = document.getElementById('operator').value;
  const amount = document.getElementById('amount').value.trim();
  const status = document.getElementById('status');
  const btn = document.getElementById('btn');

  if(mobile.length!=10){ show('Please enter valid 10 digit number','error'); return; }
  if(!operator){ show('Please select operator','error'); return; }
  if(!amount || amount<10){ show('Enter valid amount min 10','error'); return; }

  btn.innerText="PROCESSING...";
  btn.disabled=true;
  show('Processing your recharge, please wait...','success');

  try{
    const res = await fetch('/api/kwikapi',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mobile,operator,amount})
    });
    const data = await res.json();
    
    if(data.status){
      show(`✅ RECHARGE SUCCESS<br>Txn ID: ${data.txnId}<br>Operator Ref: ${data.opTxnId || 'Pending'}`, 'success');
    }else{
      // If service not activated, show professional message
      if(data.msg && data.msg.includes('Not Activated')){
        show(`⚠️ Service Activation Pending<br>Please contact admin. Error: ${data.msg}`, 'error');
      }else{
        show(`❌ Failed: ${data.msg}`, 'error');
      }
    }
  }catch(e){
    show('Network error, try again','error');
  }
  btn.innerText="RECHARGE NOW";
  btn.disabled=false;
}

function show(msg,type){
  const el=document.getElementById('status');
  el.innerHTML=msg;
  el.className='status '+type;
}
</script>
</body>
</html>
