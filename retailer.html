<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retailer Dashboard - PayQuickPay</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#020617;color:#fff;min-height:100vh;padding:10px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:15px;margin:10px 0}.head{display:flex;justify-content:space-between;align-items:center;background:#1e293b;padding:12px;border-radius:12px}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#38bdf8;color:#000;font-weight:800;cursor:pointer}.login-box{max-width:380px;margin:50px auto;background:#1e293b;padding:20px;border-radius:16px;border:1px solid #334155}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s{background:#0f172a;padding:10px;border-radius:8px;text-align:center}</style>
</head><body>

<!-- LOGIN SECTION -->
<div id="loginSection" class="login-box">
<h2 style="text-align:center;color:#38bdf8">PayQuickPay.in</h2>
<p style="text-align:center;color:#94a3b8;font-size:13px;margin:5px 0 15px">Retailer Login - Dina ku ₹1000+ Income</p>
<input id="mob" placeholder="Mobile Number / ID - R1"><input id="pwd" type="password" placeholder="Password"><button class="btn" onclick="doRetailerLogin()">🚀 LOGIN NOW</button><p id="msg" style="text-align:center;margin-top:10px;min-height:20px"></p><p style="text-align:center;margin-top:10px"><a href="index.html" style="color:#38bdf8;text-decoration:none">← Back to Home</a></p><p style="text-align:center;color:#475569;font-size:11px;margin-top:10px">Support: 7908824917</p>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashSection" style="display:none">
<div class="head"><div><b id="rName">Retailer</b><br><small id="rIdShow"></small> | Balance: ₹<span id="rBal">0</span></div><button onclick="logout()" style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px">Logout</button></div>

<div class="grid">
<div class="s"><small>Balance</small><br><b id="balShow">₹0</b></div>
<div class="s"><small>Today Income</small><br><b style="color:#22c55e">₹0</b></div>
</div>

<div class="card"><h3>⚡ Quick Recharge</h3>
<input id="number" placeholder="Mobile Number"><input id="amount" placeholder="Amount"><button class="btn" style="background:#22c55e" onclick="doRecharge()">RECHARGE</button><p id="rMsg"></p>
</div>

<div class="card"><h3>📜 History</h3><div id="history">No Transactions</div></div>
</div>

<script>
function loadRetailers(){
  let keys=["retailers","retailers_backup","pq_retailers_secret","payquick_retailers"];
  for(let i=0;i<localStorage.length;i++){ let k=localStorage.key(i); if(k&&k.startsWith("retailers_")) keys.push(k); }
  let best=[]; keys.forEach(k=>{ try{ let v=JSON.parse(localStorage.getItem(k)||"[]"); if(v.length>best.length) best=v; }catch(e){} }); return best;
}
function getCurrentRetailer(){
  let rid = localStorage.getItem("retailerLoggedIn") || localStorage.getItem("currentRetailerId");
  if(!rid) return null;
  return loadRetailers().find(x=>x.id==rid);
}

function doRetailerLogin(){
  let id=document.getElementById('mob').value.trim(), pass=document.getElementById('pwd').value.trim(), msg=document.getElementById('msg');
  if(!id||!pass){ msg.innerText="ID Pass Dia"; msg.style.color="#ef4444"; return; }
  let list=loadRetailers(); console.log("Retailers:",list);
  let found=list.find(x=>(x.id==id||x.mobile==id)&&x.password==pass);
  if(found){
    localStorage.setItem("retailerLoggedIn", found.id);
    localStorage.setItem("currentRetailerId", found.id);
    localStorage.setItem("currentRole","retailer");
    msg.innerText="✅ Login Success"; msg.style.color="#22c55e";
    setTimeout(showDashboard,500);
  }else{
    msg.innerText="❌ Not Found! Total Retailers: "+list.length; msg.style.color="#ef4444";
  }
}

function showDashboard(){
  let me=getCurrentRetailer();
  if(!me){ document.getElementById('loginSection').style.display='block'; document.getElementById('dashSection').style.display='none'; return; }
  document.getElementById('loginSection').style.display='none';
  document.getElementById('dashSection').style.display='block';
  document.getElementById('rName').innerText=me.name||me.id;
  document.getElementById('rIdShow').innerText=me.id;
  document.getElementById('rBal').innerText=me.balance;
  document.getElementById('balShow').innerText="₹"+me.balance;
}

function doRecharge(){
  let num=document.getElementById('number').value.trim(), amt=document.getElementById('amount').value.trim();
  if(!num||!amt){ document.getElementById('rMsg').innerText="Number Amount Dia"; return; }
  document.getElementById('rMsg').innerText="✅ Recharge Success - "+num+" - ₹"+amt; document.getElementById('rMsg').style.color="#22c55e";
}

function logout(){ localStorage.removeItem("retailerLoggedIn"); localStorage.removeItem("currentRetailerId"); localStorage.removeItem("currentRole"); location.href="index.html"; }

// Auto Check
if(getCurrentRetailer()) showDashboard(); else document.getElementById('loginSection').style.display='block';
</script>
</body></html>
