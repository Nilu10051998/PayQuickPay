<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAYQUICKPAY 505942 LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f1f5f9;padding:10px}
.header{background:#0f172a;color:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;padding:15px;border-radius:10px;margin:10px 0;box-shadow:0 2px 8px #0002}
input,select{width:100%;padding:14px;margin:8px 0;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
button{width:100%;padding:15px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid div{background:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="header"><b>PAYQUICKPAY 505942 LIVE</b><button onclick="checkBal()" style="width:auto;padding:6px 12px;font-size:12px;background:#22c55e">Check Balance</button></div>

<div class="grid">
<div>Wallet: <span id="w1">Rs 0</span></div>
<div>A1 Bal: <span id="w2" style="color:blue">Check Kara</span></div>
</div>

<div class="card">
<h3 style="margin-bottom:10px">REAL RECHARGE - A1TOPUP LIVE 505942</h3>
<input id="mobile" placeholder="Mobile / Customer ID" type="number">
<select id="operator"></select>
<input id="amount" placeholder="Amount" type="number">
<button onclick="doRecharge()" id="reBtn">REAL RECHARGE KARA</button>
<div id="msg" style="margin-top:12px;padding:10px;background:#f8fafc;border-radius:8px;font-size:13px;white-space:pre-wrap">Ready. First Check Balance click kara.</div>
<div style="margin-top:15px"><b>History - Backend LIVE</b><div id="history">No history yet</div></div>
</div>

<script>
const OPERATORS = [
 {code:"JIO", name:"Jio Prepaid - All India"},
 {code:"JIO", name:"Jio RC - Odisha 23"},
 {code:"A", name:"Airtel Prepaid - A"},
 {code:"AP", name:"Airtel Postpaid"},
 {code:"V", name:"Vi / Vodafone Idea - V"},
 {code:"B", name:"BSNL Prepaid - B"},
 {code:"BP", name:"BSNL Postpaid"},
 {code:"AT", name:"Airtel DTH - ATV"},
 {code:"DT", name:"Dish TV - DTV"},
 {code:"TT", name:"Tata Play / Tata Sky"},
 {code:"SD", name:"Sun Direct TV"},
 {code:"VD", name:"Videocon D2H"},
 {code:"TPCODL", name:"TPCODL Electricity"},
 {code:"TPNODL", name:"TPNODL Electricity"},
 {code:"TPSODL", name:"TPSODL Electricity"},
 {code:"TPWODL", name:"TPWODL Electricity"},
 {code:"JIOF", name:"Jio Fiber"}
];

const sel = document.getElementById('operator');
sel.innerHTML = OPERATORS.map(o=>`<option value="${o.code}">${o.name}</option>`).join('');

async function checkBal(){
 const m=document.getElementById('msg');
 m.innerText="Balance checking...";
 try{
  const r=await fetch('/api/balance');
  const d=await r.json();
  document.getElementById('w2').innerText=d.raw;
  m.innerText="BALANCE RESPONSE:\n"+d.raw;
 }catch(e){m.innerText="Error: "+e.message;}
}

async function doRecharge(){
 const mob=document.getElementById('mobile').value.trim();
 const opr=document.getElementById('operator').value;
 const amt=document.getElementById('amount').value.trim();
 const msg=document.getElementById('msg');
 const btn=document.getElementById('reBtn');
 if(mob.length<4||!amt){alert("Mobile & Amount dia");return;}
 btn.disabled=true;btn.innerText="Processing...";
 msg.innerText="Processing LIVE 505942...";
 try{
  const r=await fetch(`/api/recharge?mobile=${mob}&op=${opr}&amt=${amt}`);
  const d=await r.json();
  msg.innerText="RECHARGE RESPONSE:\n"+d.raw;
  document.getElementById('history').innerHTML=`<div style="padding:5px;border-bottom:1px solid #eee"><b>${mob}</b> - ${opr} - Rs ${amt}<br><small>${d.raw}</small></div>`+document.getElementById('history').innerHTML;
  btn.disabled=false;btn.innerText="REAL RECHARGE KARA";
 }catch(e){msg.innerText="Error: "+e.message;btn.disabled=false;btn.innerText="REAL RECHARGE KARA";}
}
</script>
</body>
</html>
