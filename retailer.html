<body>
<nav><div><b>PAYQUICKPAY - RETAILER - 505942 LIVE</b><br><small id="rid"></small></div><div><button onclick="logout()" class="small" style="background:#fff;color:#000;width:auto">Logout</button> <button onclick="checkBal()" class="small" style="background:#fff;color:#000;width:auto">Check Balance</button></div></nav>
<div class="box">
<div class="stats">
<div class="stat"><b>Wallet</b><br><span id="wallet">Rs 0</span></div>
<div class="stat"><b>A1 Balance</b><br><span id="a1bal">Click Check</span></div>
<div class="stat"><b>Commission</b><br><span id="comm">Rs 0</span></div>
<div class="stat"><b>Count</b><br><span id="cnt">0</span></div>
</div>
<div class="card">
<h3>REAL RECHARGE - A1TOPUP LIVE 505942</h3>
<select id="svc"><option value="MOBILE">Mobile</option><option value="DTH">DTH</option><option value="ELECTRICITY">Electricity</option></select>
<select id="op"><option value="RC" selected>【entity-Jio¦canonical_name=Jio】 RC</option><option value="A">【entity-Airtel¦canonical_name=Airtel】 A</option><option value="V">【entity-Vodafone¦canonical_name=Vodafone】 V</option><option value="I">Idea I</option><option value="BT">BSNL BT</option><option value="ATV">【entity-Airtel¦canonical_name=Airtel】 DTH ATV</option><option value="DTV">Dish TV DTV</option><option value="TTV">Tata Sky TTV</option><option value="TPCODL">TPCODL TPCODL</option></select>
<select id="circle"><option value="23" selected>Odisha 23</option><option value="2">WB 2</option><option value="17">Bihar 17</option><option value="6">Kolkata 6</option></select>
<input id="num" placeholder="Mobile No 10 Digit">
<input id="amt" type="number" placeholder="Amount 10">
<button onclick="doRecharge()" style="background:green">REAL RECHARGE - LIVE A1TOPUP</button>
<p id="msg" style="text-align:center;font-size:12px;font-weight:bold;word-break:break-all"></p>
</div>
<div class="card">
<h3>History</h3>
<table><tr><th>Date</th><th>Service</th><th>Number</th><th>Amt</th><th>TxID</th><th>Status</th><th>Comm</th></tr><tbody id="hist"></tbody></table>
</div>
</div>
<script>
function logout(){localStorage.removeItem('retailer');location.href='index.html';}
async function load(){
  var id=localStorage.getItem('retailer');
  if(!id){location.href='index.html';return;}
  document.getElementById('rid').innerText=id;
  try{
    var s=await db.collection('retailers').where('user_id','==',id).get();
    var w=0; s.forEach(function(d){w=d.data().wallet||0;});
    document.getElementById('wallet').innerText='Rs '+w;
  }catch(e){}
  var h=JSON.parse(localStorage.getItem('recharge_history')||'[]').filter(function(r){return r.retailer_id==id;});
  var c=0; h.forEach(function(r){c+=Number(r.commission||0);});
  document.getElementById('comm').innerText='Rs '+c.toFixed(2);
  document.getElementById('cnt').innerText=h.length;
  var html=''; h.slice(-30).reverse().forEach(function(r){
    html+='<tr><td><small>'+r.date+'</small></td><td>'+r.service+'<br>'+(r.operator_code||'')+'</td><td>'+r.customer_no+'</td><td>Rs '+r.amount+'</td><td><small>'+(r.txid||'')+'</small></td><td><small>'+(r.status||'').substring(0,20)+'</small></td><td>Rs '+(r.commission||0)+'</td></tr>';
  });
  document.getElementById('hist').innerHTML=html||'<tr><td colspan=7>No history</td></tr>';
}
async function checkBal(){
  document.getElementById('a1bal').innerText='Checking 505942...';
  try{
    var apiUrl=A.base+'balance?username='+A.username+'&pwd='+A.pwd+'&format=json';
    var proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(apiUrl);
    var res=await fetch(proxy);
    var text=await res.text();
    document.getElementById('a1bal').innerText=text.substring(0,120)+' - LIVE';
  }catch(e){
    document.getElementById('a1bal').innerText='Error: '+e.message;
  }
}
async function doRecharge(){
  var id=localStorage.getItem('retailer');
  var num=document.getElementById('num').value.trim();
  var amt=Number(document.getElementById('amt').value||0);
  var op=document.getElementById('op').value;
  var circle=document.getElementById('circle').value;
  var svc=document.getElementById('svc').value;
  if(!num||!amt){document.getElementById('msg').innerText='Enter Number Amount';return;}
  var orderId='PAY'+Date.now();
  document.getElementById('msg').innerText='Processing LIVE OrderID: '+orderId;
  document.getElementById('msg').style.color='blue';
  try{
    var s=await db.collection('retailers').where('user_id','==',id).get();
    var docId=null,w=0; s.forEach(function(d){docId=d.id;w=d.data().wallet||0;});
    if(w<amt){document.getElementById('msg').innerText='Low Wallet Rs '+w;document.getElementById('msg').style.color='red';return;}
    var apiUrl=A.base+'api?username='+A.username+'&pwd='+A.pwd+'&circlecode='+circle+'&operatorcode='+op+'&number='+num+'&amount='+amt+'&orderid='+orderId+'&format=json';
    var proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(apiUrl);
    var res=await fetch(proxy);
    var text=await res.text();
    console.log(text);
    var status='Failed',txid='',opid='';
    try{
      var j=JSON.parse(text);
      status=j.status||'Failed';txid=j.txid||'';opid=j.opid||'';
    }catch(e){
      var p=text.split(',');
      if(p.length>=3){txid=p[0];status=p[1];opid=p[2];}
      else if(text.toLowerCase().indexOf('success')>-1)status='Success';
    }
    if(status.toLowerCase().indexOf('success')>-1){
      var comm=amt*0.02;
      await db.collection('retailers').doc(docId).update({wallet:w-amt+comm});
      var data={retailer_id:id,service:svc,operator_code:op,customer_no:num,amount:amt,commission:comm.toFixed(2),orderid:orderId,txid:txid,opid:opid,status:'Success LIVE Tx:'+txid,date:new Date().toLocaleString()};
      var hist=JSON.parse(localStorage.getItem('recharge_history')||'[]'); hist.push(data); localStorage.setItem('recharge_history',JSON.stringify(hist));
      document.getElementById('msg').innerText='SUCCESS Tx:'+txid+' Op:'+opid+' Order:'+orderId;
      document.getElementById('msg').style.color='green';
      load();
    } else {
      document.getElementById('msg').innerText='FAILED: '+text.substring(0,200);
      document.getElementById('msg').style.color='red';
    }
  }catch(e){document.getElementById('msg').innerText='Error: '+e.message;}
}
load();
</script>
</body>
